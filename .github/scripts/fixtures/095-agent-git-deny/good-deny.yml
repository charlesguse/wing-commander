# Passing shape: a covered agent denies .git/** in its disallowed tools.
on: workflow_dispatch
jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/wing-commander-tool-args
        with:
          default-allowed-tools: "Read,Write,Edit"
          default-disallowed-tools: "WebSearch,Edit(.git/**),Write(.git/**)"
          step-label: "fixture.fixer"
