# Failure branch: the publisher never reads the verdict.
on: workflow_dispatch
permissions: {}
jobs:
  agent:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.wc-pristine-repo/.github/actions/wing-commander-gate-bundle
        with:
          site: board-fix
  gate:
    needs: [agent]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.wc-pristine-repo/.github/actions/wing-commander-contained-gate-suite
        timeout-minutes: 60
        with:
          site: board-fix
  publish:
    needs: [agent, gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.wc-pristine-repo/.github/actions/wing-commander-context
      - uses: ./.wc-pristine-repo/.github/actions/wing-commander-hardened-push
        with:
          branch: b
          token: ${{ env.WC_BOT_TOKEN }}
          expected-head-sha: x
