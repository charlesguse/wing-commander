# Negative fixture for verify-transcript-retention-declared.py: a
# transcript-pattern upload-artifact step with no retention-days declared —
# the exact defect the gate exists to catch (FR-032/FR-033/SC-010).
name: fixture-missing-retention
on:
  workflow_call:
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Upload Claude execution log
        uses: actions/upload-artifact@v6
        with:
          name: claude-execution-output
          path: ${{ runner.temp }}/claude-execution-output.json
          if-no-files-found: ignore
