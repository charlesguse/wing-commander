# Negative fixture for verify-actions-layer-invariants.py: a composite
# action reading vars.* directly, which a published composite must never do
# (constitution VII — configuration reaches it only as a declared input).
name: fixture-vars-read
description: reads ambient vars.* state (this is the defect under test)
runs:
  using: composite
  steps:
    - shell: bash
      env:
        MODEL: ${{ vars.WING_COMMANDER_SPEC_MODEL }}
      run: echo "$MODEL"
