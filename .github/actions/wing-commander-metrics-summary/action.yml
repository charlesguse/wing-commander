name: wing-commander-metrics-summary
description: >
  Deterministically parse an agent run's execution transcript
  (claude-execution-output.json) and append a concise metrics summary
  (model, turns used against budget, duration, tokens, cost, with a
  turn-budget warning) to $GITHUB_STEP_SUMMARY. Reads an already-produced
  file only: no agent invocation, no token, no network, and never fails the
  step or the job (missing/unparseable transcripts degrade to "metrics
  unavailable").

  TURNS ARE COUNTED, NOT READ. The result record's `.num_turns` is NOT the
  counter `--max-turns` enforces, and the two diverge by 1.0x-2.3x in this
  repository's own history, always upward. Rendering `.num_turns` against
  the budget is what this action shipped with, and it made the ratio
  meaningless: the 2026-08-06 implement cycle rendered "198 / 100 turns
  (198%)" plus a budget warning for a run that used 87 of its 100 and was
  never at risk. Meanwhile every genuinely exhausted run stopped at exactly
  100 distinct main-loop assistant messages (13 of 13), which is what the
  cap actually counts. So this action counts that itself, via the shared
  `_shared/count-turns.sh` script every caller of `--max-turns` now reads
  from — see the `count-turns.sh` invocation below.

inputs:
  transcript-path:
    description: >
      Path to the execution transcript to read for this specific invocation
      only. Callers with more than one agent step per job must invoke this
      action once per agent step, immediately after it, before any later
      agent step in the same job overwrites the file at this path.
    required: false
    default: ${{ runner.temp }}/claude-execution-output.json
  model:
    description: >
      The literal model name the caller's own claude-code-action step used
      (e.g. claude-sonnet-5). Never read from the transcript.
    required: true
  max-turns:
    description: >
      The literal --max-turns value the caller's own step configured. When
      omitted, the rendered summary reports turns used and omits the
      used/budgeted ratio and the turn-budget warning entirely.
    required: false
  warn-fraction:
    description: >
      Fraction of max-turns at/above which the run is flagged. Only
      meaningful when max-turns is provided.
    required: false
    default: '0.8'
  run-label:
    description: >
      Free-text label distinguishing this invocation within a job that has
      more than one (e.g. cycle, retry, progress comment) — rendered in the
      summary block's heading. Empty is fine for single-invocation stages.
    required: false
    default: ''
  verdict:
    description: >
      ${{ steps.<verdict-id>.outputs.verdict }} from a wing-commander-agent-verdict
      step at this same call site (healthy/exhausted/failed/unclassifiable).
      Optional and display-only: when this AND verdict-reason are both
      non-empty, one additional line renders beneath the existing table
      stating the verdict and reason. When either is empty, rendering is
      byte-for-byte identical to a caller that never passes them.
    required: false
    default: ''
  verdict-reason:
    description: >
      ${{ steps.<verdict-id>.outputs.reason }} from the same
      wing-commander-agent-verdict step. See verdict above.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Render agent run metrics summary
      shell: bash
      env:
        TRANSCRIPT_PATH: ${{ inputs.transcript-path }}
        MODEL: ${{ inputs.model }}
        MAX_TURNS: ${{ inputs.max-turns }}
        WARN_FRACTION: ${{ inputs.warn-fraction }}
        RUN_LABEL: ${{ inputs.run-label }}
        VERDICT: ${{ inputs.verdict }}
        VERDICT_REASON: ${{ inputs.verdict-reason }}
      run: |
        set -uo pipefail

        TRANSCRIPT="${TRANSCRIPT_PATH:-}"
        MODEL_IN="${MODEL:-}"
        MAX_TURNS="${MAX_TURNS:-}"
        WARN_FRACTION="${WARN_FRACTION:-0.8}"
        RUN_LABEL="${RUN_LABEL:-}"
        VERDICT="${VERDICT:-}"
        VERDICT_REASON="${VERDICT_REASON:-}"
        SUMMARY="${GITHUB_STEP_SUMMARY:-/dev/stdout}"

        # Heading shared by both the normal and unavailable cases (T006/T007).
        heading="### 🤖 Agent run metrics"
        if [ -n "$RUN_LABEL" ]; then
          heading="$heading — $RUN_LABEL"
        fi

        # --- T002: availability + capture the LAST .type=="result" record ------
        availability=unavailable
        result_json=""
        main_turns=""
        sub_turns=""
        if [ -n "$TRANSCRIPT" ] && [ -f "$TRANSCRIPT" ] && [ -s "$TRANSCRIPT" ]; then
          if jq -e . "$TRANSCRIPT" >/dev/null 2>&1; then
            result_json="$(jq -c 'if type=="array" then . else [.] end
              | map(select(.type=="result")) | last // empty' "$TRANSCRIPT" 2>/dev/null || true)"
            if [ -n "$result_json" ] && [ "$result_json" != "null" ]; then
              availability=ok
            fi

            # Shared with wing-commander-agent-verdict — one canonical copy of
            # the counting rule instead of a second, driftable one
            # (research.md R5, specs/037-agent-turn-budget-guard/).
            eval "$(bash "$GITHUB_ACTION_PATH/../_shared/count-turns.sh" "$TRANSCRIPT")"
          fi
        fi

        # --- T007: unavailable case — heading + one italic line, exit 0 --------
        if [ "$availability" != "ok" ]; then
          {
            printf '%s\n\n' "$heading"
            printf '%s\n\n' "_Metrics unavailable for this run (execution transcript missing or unparseable)._"
          } >> "$SUMMARY"
          exit 0
        fi

        # --- T003: defensive per-field extraction (each field independent) -----
        jqget() { printf '%s' "$result_json" | jq -r "$1 // empty" 2>/dev/null || true; }
        reported_turns="$(jqget '.num_turns')"
        subtype="$(jqget '.subtype')"
        duration_ms="$(jqget '.duration_ms')"
        cost_usd="$(jqget '.total_cost_usd')"
        usage_json="$(printf '%s' "$result_json" | jq -c '.usage // empty' 2>/dev/null || true)"
        model_usage_json="$(printf '%s' "$result_json" | jq -c '.modelUsage // empty' 2>/dev/null || true)"

        # Which number is comparable to the budget. A counted main-loop total
        # is; .num_turns is not, so when counting fails (a transcript shape
        # with no assistant message ids) the ratio and the warning are
        # suppressed rather than computed from the wrong counter. Zero counts
        # as "counting failed": every real run has at least one turn.
        turns_counted=false
        turns_used=""
        if printf '%s' "$main_turns" | grep -Eq '^[0-9]+$' && [ "$main_turns" -gt 0 ]; then
          turns_counted=true
          turns_used="$main_turns"
        else
          turns_used="$reported_turns"
        fi

        # --- T004: turn-budget fields (only when max-turns AND turns_used known)
        turn_warning=false
        turns_pct=""
        warn_pct=""
        if [ "$turns_counted" = "true" ] && [ -n "$MAX_TURNS" ] \
           && printf '%s' "$MAX_TURNS" | grep -Eq '^[0-9]+([.][0-9]+)?$'; then
          # `|| true` is load-bearing: GitHub invokes composite `shell: bash`
          # steps with -e (the `set` above adds flags, it can't remove -e), and
          # `read` exits 1 at EOF because awk's printf emits no trailing
          # newline — the variables are populated regardless.
          read -r turns_pct turn_warning < <(awk -v u="$turns_used" -v b="$MAX_TURNS" -v w="$WARN_FRACTION" 'BEGIN{
            r=(b+0>0)?u/b:0
            printf "%d %s", (r*100)+0.5, (r>=w)?"true":"false"
          }') || true
          warn_pct="$(awk -v w="$WARN_FRACTION" 'BEGIN{ printf "%d", (w*100)+0.5 }')"
        fi

        # --- T005: formatting helpers, each degrading to "unavailable" ----------
        fmt_duration() {
          local ms="$1"
          printf '%s' "$ms" | grep -Eq '^[0-9]+$' || { printf 'unavailable'; return; }
          local t=$(( ms / 1000 )) h m s out=""
          h=$(( t / 3600 )); m=$(( (t % 3600) / 60 )); s=$(( t % 60 ))
          [ "$h" -gt 0 ] && out="${h}h "
          { [ "$h" -gt 0 ] || [ "$m" -gt 0 ]; } && out="${out}${m}m "
          printf '%s%ss' "$out" "$s"
        }
        fmt_cost() {
          local v="$1"
          printf '%s' "$v" | grep -Eq '^[0-9]+([.][0-9]+)?$' || { printf 'unavailable'; return; }
          awk -v v="$v" 'BEGIN{ if (v>=1) printf "$%.2f", v; else printf "$%.4f", v }'
        }
        fmt_tokens() {
          local uj="$1"
          { [ -z "$uj" ] || [ "$uj" = "null" ]; } && { printf 'unavailable'; return; }
          printf '%s' "$uj" | jq -r '
            (.input_tokens // 0) as $i | (.output_tokens // 0) as $o
            | (.cache_creation_input_tokens // 0) as $cc
            | (.cache_read_input_tokens // 0) as $cr
            | ($i+$o+$cc+$cr) as $tot
            | if $tot == 0 then "unavailable"
              else "\($tot) (in \($i), out \($o), cache \($cc+$cr))" end
          ' 2>/dev/null || printf 'unavailable'
        }
        fmt_per_model() {
          local mj="$1"
          { [ -z "$mj" ] || [ "$mj" = "null" ]; } && return
          printf '%s' "$mj" | jq -r '
            to_entries | map(
              .key as $m | .value as $v
              | (($v.inputTokens // $v.input_tokens // 0)
                 + ($v.outputTokens // $v.output_tokens // 0)
                 + ($v.cacheReadInputTokens // $v.cache_read_input_tokens // 0)
                 + ($v.cacheCreationInputTokens // $v.cache_creation_input_tokens // 0)) as $t
              | ($v.costUSD // $v.cost_usd // $v.costUsd // null) as $c
              | "\($m): \($t) tokens" + (if $c != null then " / $\($c|tostring)" else "" end)
            ) | join("; ")
          ' 2>/dev/null || true
        }

        # --- T006: normal-case Markdown block ----------------------------------
        turns_used_disp="$turns_used"
        [ -z "$turns_used_disp" ] && turns_used_disp="unavailable"
        # The budget only goes in the cell next to a number that is measured
        # against it. An uncounted fallback is labelled so nobody reads it as
        # a budget figure again.
        if [ "$turns_counted" = "true" ] && [ -n "$MAX_TURNS" ]; then
          turns_cell="$turns_used_disp / $MAX_TURNS"
        elif [ "$turns_counted" = "true" ]; then
          turns_cell="$turns_used_disp"
        elif [ "$turns_used_disp" = "unavailable" ]; then
          turns_cell="unavailable"
        else
          turns_cell="$turns_used_disp (reported, not comparable to budget)"
        fi
        duration_disp="$(fmt_duration "$duration_ms")"
        cost_disp="$(fmt_cost "$cost_usd")"
        tokens_disp="$(fmt_tokens "$usage_json")"
        per_model_line="$(fmt_per_model "$model_usage_json")"

        {
          printf '%s\n\n' "$heading"
          printf '| Model | Turns | Duration | Tokens | Cost |\n'
          printf '|---|---|---|---|---|\n'
          printf '| %s | %s | %s | %s | %s |\n\n' \
            "$MODEL_IN" "$turns_cell" "$duration_disp" "$tokens_disp" "$cost_disp"
          # Additive-only (research.md R6): renders only when BOTH verdict
          # and verdict-reason are non-empty, so a caller that hasn't wired
          # wing-commander-agent-verdict yet renders byte-for-byte the same
          # as before this input pair existed.
          if [ -n "$VERDICT" ] && [ -n "$VERDICT_REASON" ]; then
            printf '**Verdict**: %s — %s\n\n' "$VERDICT" "$VERDICT_REASON"
          fi
          # Ground truth, and it outranks the ratio: the runtime itself says
          # the budget ran out. Reported whether or not counting succeeded.
          if [ "$subtype" = "error_max_turns" ]; then
            printf '🛑 **Turn budget exhausted**: the runtime cut this run off at its %s-turn cap. Work after that point was never attempted — treat any "done" narration in the transcript as unfinished.\n\n' \
              "${MAX_TURNS:-configured}"
          elif [ "$turn_warning" = "true" ]; then
            printf '⚠️ **Turn budget warning**: this run used %s/%s turns (%s%%) — at or above the %s%% warning threshold.\n\n' \
              "$turns_used" "$MAX_TURNS" "$turns_pct" "$warn_pct"
          fi
          # Subagent turns are real spend but free against the budget, so
          # they belong in the summary and NOT in the ratio above.
          if printf '%s' "$sub_turns" | grep -Eq '^[0-9]+$' && [ "$sub_turns" -gt 0 ]; then
            printf '**Subagent turns**: %s (delegated work; these do not count against the --max-turns budget).\n\n' \
              "$sub_turns"
          fi
          if [ -n "$per_model_line" ]; then
            printf '**Per-model breakdown**: %s\n\n' "$per_model_line"
          fi
        } >> "$SUMMARY"

        exit 0
