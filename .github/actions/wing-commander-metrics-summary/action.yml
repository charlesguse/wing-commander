name: wing-commander-metrics-summary
description: >
  Deterministically parse an agent run's execution transcript
  (claude-execution-output.json) and append a concise metrics summary
  (model, turns used against budget, duration, tokens, cost, with a
  turn-budget warning) to $GITHUB_STEP_SUMMARY. Reads an already-produced
  file only: no agent invocation, no token, no network, and never fails the
  step or the job (missing/unparseable transcripts degrade to "metrics
  unavailable").

  TURNS ARE COUNTED, NOT READ. The result record's `.num_turns` is NOT the
  counter `--max-turns` enforces, and the two diverge by 1.0x-2.3x in this
  repository's own history, always upward. Rendering `.num_turns` against
  the budget is what this action shipped with, and it made the ratio
  meaningless: the 2026-08-06 implement cycle rendered "198 / 100 turns
  (198%)" plus a budget warning for a run that used 87 of its 100 and was
  never at risk. Meanwhile every genuinely exhausted run stopped at exactly
  100 distinct main-loop assistant messages (13 of 13), which is what the
  cap actually counts. So this action counts that itself, via the shared
  `_shared/count-turns.sh` script every caller of `--max-turns` now reads
  from — see the `count-turns.sh` invocation below.

inputs:
  transcript-path:
    description: >
      Path to the execution transcript to read for this specific invocation
      only. Callers with more than one agent step per job must invoke this
      action once per agent step, immediately after it, before any later
      agent step in the same job overwrites the file at this path.
    required: false
    default: ${{ runner.temp }}/claude-execution-output.json
  model:
    description: >
      The literal model name the caller's own claude-code-action step used
      (e.g. claude-sonnet-5). Never read from the transcript.
    required: true
  max-turns:
    description: >
      The caller's INTENDED turn budget — what a maintainer tunes for this
      stage, and the denominator the used/budgeted ratio is measured
      against. Since specs/037-agent-turn-budget-guard this is NOT the
      value the runtime enforces; see `ceiling`. When omitted, the rendered
      summary reports turns used and omits the ratio and the turn-budget
      warning entirely.
    required: false
  ceiling:
    description: >
      The literal --max-turns value the runtime actually enforced — i.e.
      `steps.<site>-ceiling.outputs.ceiling` from this site's
      wing-commander-turn-ceiling step, which is max-turns multiplied by the
      runaway margin (2.5x by default). Only the exhaustion banner uses it,
      and it has to: `error_max_turns` means the run hit THIS number, not
      the intended budget, so naming max-turns there tells a maintainer the
      run stopped at 15 when it actually stopped at 38. Optional; when
      omitted the banner falls back to naming max-turns, which is what this
      action did before a ceiling existed.
    required: false
  warn-fraction:
    description: >
      Fraction of max-turns at/above which the run is flagged. Only
      meaningful when max-turns is provided.
    required: false
    default: '0.8'
  run-label:
    description: >
      Free-text label distinguishing this invocation within a job that has
      more than one (e.g. cycle, retry, progress comment) — rendered in the
      summary block's heading. Empty is fine for single-invocation stages.
    required: false
    default: ''
  verdict:
    description: >
      `steps.<verdict-id>.outputs.verdict` from a wing-commander-agent-verdict
      step at this same call site (healthy/exhausted/failed/unclassifiable).
      Optional and display-only: when this AND verdict-reason are both
      non-empty, one additional line renders beneath the existing table
      stating the verdict and reason. When either is empty, rendering is
      byte-for-byte identical to a caller that never passes them.
    required: false
    default: ''
  verdict-reason:
    description: >
      `steps.<verdict-id>.outputs.reason` from the same
      wing-commander-agent-verdict step. See verdict above.
    required: false
    default: ''
  record-path:
    description: >
      Where the normalized JSON record (contracts/metrics-record-schema.md)
      is written. Always written, regardless of transcript health — a
      missing/unparseable transcript produces the degraded-record shape,
      never a missing file (specs/043-durable-metrics-record).
    required: false
    default: ${{ runner.temp }}/wing-commander-metrics-record.json
  stage:
    description: >
      Literal stage name for the record's `stage` field. Never inferred
      from the transcript or ambient state (constitution VII). Empty ->
      `stage_available: false`.
    required: false
    default: ''
  spec-dir:
    description: >
      Literal spec identity (specs/NNN-slug), when the caller already has
      it. Absent -> `spec.identity_available: false`.
    required: false
    default: ''
  spec-issue:
    description: >
      Literal lifecycle issue number, read alongside spec-dir. Absent ->
      `spec.identity_available: false`.
    required: false
    default: ''
  step-index:
    description: >
      Distinguishing component of the record key for this invocation
      within its job: an ordinal (0, 1, 2) for jobs with several agent
      steps (implement.yml's cycle/retry/progress sequence), or the
      matrix leg's own index (`strategy.job-index`) at matrix call
      sites, where every leg shares one `github.job` (PR #267 review,
      B4). A literal or expression per call site; 0 is correct for a
      single-agent-step, non-matrix job.
    required: false
    default: '0'

outputs:
  record-json:
    description: The same JSON as record-path's contents, as a string.
    value: ${{ steps.render.outputs.record-json }}
  record-key:
    description: >
      The record's run.record_key value, for callers wiring the per-run
      rollup line (contracts/persist-workflow.md).
    value: ${{ steps.render.outputs.record-key }}
  cost-line:
    description: >
      The preformatted per-run cost line (FR-031c) rendered from this
      invocation's record — "**Cost**: <cost> · <turns> · <model>", each
      part degrading to "... unavailable" independently. Formatted here,
      once, because this is the formatter's ONLY home: the stage
      workflows' "Compute cost line" steps used to each carry a pasted
      copy of the jq below, twelve of them, and a rounding fix would
      have had to land twelve times (PR #277 review). Callers append
      this verbatim and keep only a one-line "**Cost**: metrics
      unavailable" fallback for the case where this action never ran.
    value: ${{ steps.render.outputs.cost-line }}

runs:
  using: composite
  steps:
    - name: Render agent run metrics summary
      id: render
      shell: bash
      env:
        TRANSCRIPT_PATH: ${{ inputs.transcript-path }}
        MODEL: ${{ inputs.model }}
        MAX_TURNS: ${{ inputs.max-turns }}
        CEILING: ${{ inputs.ceiling }}
        WARN_FRACTION: ${{ inputs.warn-fraction }}
        RUN_LABEL: ${{ inputs.run-label }}
        VERDICT: ${{ inputs.verdict }}
        VERDICT_REASON: ${{ inputs.verdict-reason }}
        RECORD_PATH: ${{ inputs.record-path }}
        STAGE: ${{ inputs.stage }}
        SPEC_DIR: ${{ inputs.spec-dir }}
        SPEC_ISSUE: ${{ inputs.spec-issue }}
        STEP_INDEX: ${{ inputs.step-index }}
        RUN_ID: ${{ github.run_id }}
        JOB_KEY: ${{ github.job }}
      run: |
        set -uo pipefail

        TRANSCRIPT="${TRANSCRIPT_PATH:-}"
        MODEL_IN="${MODEL:-}"
        MAX_TURNS="${MAX_TURNS:-}"
        CEILING="${CEILING:-}"
        WARN_FRACTION="${WARN_FRACTION:-0.8}"
        RUN_LABEL="${RUN_LABEL:-}"
        VERDICT="${VERDICT:-}"
        VERDICT_REASON="${VERDICT_REASON:-}"
        SUMMARY="${GITHUB_STEP_SUMMARY:-/dev/stdout}"

        # --- record emission (specs/043-durable-metrics-record) ----------------
        RECORD_PATH="${RECORD_PATH:-${RUNNER_TEMP:-/tmp}/wing-commander-metrics-record.json}"
        STAGE="${STAGE:-}"
        SPEC_DIR="${SPEC_DIR:-}"
        SPEC_ISSUE="${SPEC_ISSUE:-}"
        STEP_INDEX="${STEP_INDEX:-0}"
        RUN_ID="${RUN_ID:-}"
        JOB_KEY="${JOB_KEY:-}"
        RECORD_KEY="${RUN_ID}:${JOB_KEY}:${STEP_INDEX}"
        EMITTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

        stage_available=false
        [ -n "$STAGE" ] && stage_available=true
        spec_identity_available=false
        [ -n "$SPEC_DIR" ] && [ -n "$SPEC_ISSUE" ] && spec_identity_available=true
        model_available=false
        [ -n "$MODEL_IN" ] && model_available=true

        is_number() {
          printf '%s' "$1" | grep -Eq '^-?[0-9]+([.][0-9]+)?$'
        }

        # Writes the schema-version-1 record to $RECORD_PATH and sets the
        # record-json/record-key outputs, from whatever extraction variables
        # are in scope when it is called (T002-T005: populated for the
        # normal case, left at their unavailable defaults for the degraded
        # case below). Never fails the step — mirrors the composite's own
        # never-fail contract.
        emit_record() {
          local record_available="$1" outcome_val="$2"
          jq -n \
            --argjson record_available "$record_available" \
            --arg run_id "$RUN_ID" \
            --arg job_key "$JOB_KEY" \
            --argjson step_index "${STEP_INDEX:-0}" \
            --arg record_key "$RECORD_KEY" \
            --arg stage "$STAGE" \
            --argjson stage_available "$stage_available" \
            --arg run_label "$RUN_LABEL" \
            --arg spec_dir "$SPEC_DIR" \
            --arg spec_issue "$SPEC_ISSUE" \
            --argjson spec_identity_available "$spec_identity_available" \
            --arg model "$MODEL_IN" \
            --argjson model_available "$model_available" \
            --arg turns_counted "${main_turns:-}" \
            --arg turns_reported "${reported_turns:-}" \
            --arg turns_intended_budget "$MAX_TURNS" \
            --arg turns_enforced_ceiling "$CEILING" \
            --argjson turns_available "${turns_counted:-false}" \
            --arg tok_input "${tok_input:-}" \
            --arg tok_output "${tok_output:-}" \
            --arg tok_cache_read "${tok_cache_read:-}" \
            --arg tok_cache_creation "${tok_cache_creation:-}" \
            --argjson tokens_available "${tokens_available:-false}" \
            --arg cost_usd "${cost_usd:-}" \
            --argjson cost_available "${cost_available:-false}" \
            --arg duration_ms "${duration_ms:-}" \
            --argjson duration_available "${duration_available:-false}" \
            --arg outcome "$outcome_val" \
            --argjson per_model "${per_model_json:-[]}" \
            --argjson per_model_available "${per_model_available:-false}" \
            --arg emitted_at "$EMITTED_AT" \
            '
            def numOrNull($s): if $s == "" then null else ($s | tonumber) end;
            def strOrNull($s): if $s == "" then null else $s end;
            {
              schema_version: 1,
              record_available: $record_available,
              run: {
                workflow_run_id: $run_id,
                job_key: $job_key,
                job_id: null,
                step_index: $step_index,
                record_key: $record_key
              },
              stage: strOrNull($stage),
              stage_available: $stage_available,
              run_label: strOrNull($run_label),
              spec: {
                spec_dir: strOrNull($spec_dir),
                issue: numOrNull($spec_issue),
                identity_available: $spec_identity_available
              },
              model: strOrNull($model),
              model_available: $model_available,
              turns: {
                counted: numOrNull($turns_counted),
                reported: numOrNull($turns_reported),
                intended_budget: numOrNull($turns_intended_budget),
                enforced_ceiling: numOrNull($turns_enforced_ceiling),
                available: $turns_available
              },
              tokens: {
                input: numOrNull($tok_input),
                output: numOrNull($tok_output),
                cache_read: numOrNull($tok_cache_read),
                cache_creation: numOrNull($tok_cache_creation),
                available: $tokens_available
              },
              cost_usd: numOrNull($cost_usd),
              cost_available: $cost_available,
              duration_ms: numOrNull($duration_ms),
              duration_available: $duration_available,
              outcome: $outcome,
              per_model: $per_model,
              per_model_available: $per_model_available,
              emitted_at: $emitted_at
            }' > "$RECORD_PATH" 2>/dev/null || printf '{}' > "$RECORD_PATH"

          # The cost-line output (see this action's outputs block for why it
          # is formatted here and nowhere else). Runs in BOTH the normal and
          # the degraded branch — each part degrades to "... unavailable"
          # independently, so a degraded record still yields a well-formed
          # line. Empty only if jq itself dies; callers' one-line fallback
          # covers that and the skipped-action case.
          cost_line="$(jq -r '
            def usd($m; $d):
              (. * $m | round | tostring) as $c | ($c | length) as $n
              | if $n > $d then "$" + $c[0:$n-$d] + "." + $c[$n-$d:]
                else "$0." + (("0" * ($d - $n)) // "") + $c end;
            def costpart: if .cost_available then (.cost_usd | if (. * 100 | round) >= 100 then usd(100; 2) else usd(10000; 4) end) else "cost unavailable" end;
            def turnspart:
              if .turns.available then
                (.turns.counted|tostring) + (if .turns.intended_budget != null then "/" + (.turns.intended_budget|tostring) else "" end) + " turns"
              else "turns unavailable" end;
            def modelpart: if .model_available then .model else "model unavailable" end;
            "**Cost**: " + costpart + " · " + turnspart + " · " + modelpart
          ' "$RECORD_PATH" 2>/dev/null || true)"

          {
            echo "record-key=$RECORD_KEY"
            echo "record-json=$(jq -c . "$RECORD_PATH" 2>/dev/null || printf '{}')"
            echo "cost-line=$cost_line"
          } >> "$GITHUB_OUTPUT"
        }

        # Heading shared by both the normal and unavailable cases (T006/T007).
        heading="### 🤖 Agent run metrics"
        if [ -n "$RUN_LABEL" ]; then
          heading="$heading — $RUN_LABEL"
        fi

        # --- T002: availability + capture the LAST .type=="result" record ------
        availability=unavailable
        result_json=""
        main_turns=""
        sub_turns=""
        if [ -n "$TRANSCRIPT" ] && [ -f "$TRANSCRIPT" ] && [ -s "$TRANSCRIPT" ]; then
          if jq -e . "$TRANSCRIPT" >/dev/null 2>&1; then
            result_json="$(jq -c 'if type=="array" then . else [.] end
              | map(select(.type=="result")) | last // empty' "$TRANSCRIPT" 2>/dev/null || true)"
            if [ -n "$result_json" ] && [ "$result_json" != "null" ]; then
              availability=ok
            fi

            # Shared with wing-commander-agent-verdict — one canonical copy of
            # the counting rule instead of a second, driftable one
            # (research.md R5, specs/037-agent-turn-budget-guard/).
            eval "$(bash "$GITHUB_ACTION_PATH/../_shared/count-turns.sh" "$TRANSCRIPT")"
          fi
        fi

        # --- T007: unavailable case — heading + one italic line, exit 0 --------
        # T003: the record is still written in this branch — every field the
        # job environment supplies (run.*, stage, spec.*, model, the turn
        # budget/ceiling) stays populated; only transcript-derived fields
        # degrade, per contracts/metrics-record-schema.md's degraded shape.
        if [ "$availability" != "ok" ]; then
          main_turns=""
          reported_turns=""
          turns_counted=false
          tok_input=""; tok_output=""; tok_cache_read=""; tok_cache_creation=""
          tokens_available=false
          cost_usd=""
          cost_available=false
          duration_ms=""
          duration_available=false
          per_model_json="[]"
          per_model_available=false
          emit_record false unavailable
          {
            printf '%s\n\n' "$heading"
            printf '%s\n\n' "_Metrics unavailable for this run (execution transcript missing or unparseable)._"
          } >> "$SUMMARY"
          exit 0
        fi

        # --- T003: defensive per-field extraction (each field independent) -----
        jqget() { printf '%s' "$result_json" | jq -r "$1 // empty" 2>/dev/null || true; }
        reported_turns="$(jqget '.num_turns')"
        subtype="$(jqget '.subtype')"
        is_error="$(jqget '.is_error')"
        duration_ms="$(jqget '.duration_ms')"
        cost_usd="$(jqget '.total_cost_usd')"
        usage_json="$(printf '%s' "$result_json" | jq -c '.usage // empty' 2>/dev/null || true)"
        model_usage_json="$(printf '%s' "$result_json" | jq -c '.modelUsage // empty' 2>/dev/null || true)"
        cost_available=false
        is_number "$cost_usd" && cost_available=true
        duration_available=false
        is_number "$duration_ms" && duration_available=true

        # Which number is comparable to the budget. A counted main-loop total
        # is; .num_turns is not, so when counting fails (a transcript shape
        # with no assistant message ids) the ratio and the warning are
        # suppressed rather than computed from the wrong counter. Zero counts
        # as "counting failed": every real run has at least one turn.
        turns_counted=false
        turns_used=""
        if printf '%s' "$main_turns" | grep -Eq '^[0-9]+$' && [ "$main_turns" -gt 0 ]; then
          turns_counted=true
          turns_used="$main_turns"
        else
          turns_used="$reported_turns"
        fi

        # --- T004: per-record token/per-model extraction, from the same
        # usage_json/model_usage_json extracted above (single source with the
        # rendered summary's own fmt_tokens/fmt_per_model, FR-004).
        tokens_available=false
        tok_input=""; tok_output=""; tok_cache_read=""; tok_cache_creation=""
        if [ -n "$usage_json" ] && [ "$usage_json" != "null" ]; then
          tok_input="$(printf '%s' "$usage_json" | jq -r '.input_tokens // empty' 2>/dev/null || true)"
          tok_output="$(printf '%s' "$usage_json" | jq -r '.output_tokens // empty' 2>/dev/null || true)"
          tok_cache_read="$(printf '%s' "$usage_json" | jq -r '.cache_read_input_tokens // empty' 2>/dev/null || true)"
          tok_cache_creation="$(printf '%s' "$usage_json" | jq -r '.cache_creation_input_tokens // empty' 2>/dev/null || true)"
          if [ -n "$tok_input" ] || [ -n "$tok_output" ] || [ -n "$tok_cache_read" ] || [ -n "$tok_cache_creation" ]; then
            tokens_available=true
          fi
        fi

        per_model_available=false
        per_model_json="[]"
        if [ -n "$model_usage_json" ] && [ "$model_usage_json" != "null" ]; then
          built="$(printf '%s' "$model_usage_json" | jq -c '
            to_entries | map(
              .key as $m | .value as $v
              | {
                  model: $m,
                  input_tokens: ($v.inputTokens // $v.input_tokens // 0),
                  output_tokens: ($v.outputTokens // $v.output_tokens // 0),
                  cache_read_tokens: ($v.cacheReadInputTokens // $v.cache_read_input_tokens // 0),
                  cache_creation_tokens: ($v.cacheCreationInputTokens // $v.cache_creation_input_tokens // 0),
                  cost_usd: ($v.costUSD // $v.cost_usd // $v.costUsd // 0)
                }
            )' 2>/dev/null || true)"
          if [ -n "$built" ] && [ "$built" != "[]" ]; then
            per_model_json="$built"
            per_model_available=true
          fi
        fi

        # --- record outcome: reuse the caller's own wing-commander-agent-verdict
        # output when wired (already healthy/exhausted/failed/unclassifiable);
        # otherwise fall back to the same classification that action performs
        # (order matters: error_max_turns before is_error, same as there).
        outcome_val="unclassifiable"
        case "$VERDICT" in
          healthy|exhausted|failed|unclassifiable) outcome_val="$VERDICT" ;;
        esac
        if [ -z "$VERDICT" ]; then
          if [ "$subtype" = "error_max_turns" ]; then
            outcome_val="exhausted"
          elif [ "$is_error" = "true" ]; then
            outcome_val="failed"
          elif [ "$subtype" != "success" ]; then
            outcome_val="failed"
          else
            outcome_val="healthy"
          fi
        fi
        emit_record true "$outcome_val"

        # --- T004: turn-budget fields (only when max-turns AND turns_used known)
        turn_warning=false
        over_intended=false
        turns_pct=""
        warn_pct=""
        if [ "$turns_counted" = "true" ] && [ -n "$MAX_TURNS" ] \
           && printf '%s' "$MAX_TURNS" | grep -Eq '^[0-9]+([.][0-9]+)?$'; then
          # `|| true` is load-bearing: GitHub invokes composite `shell: bash`
          # steps with -e (the `set` above adds flags, it can't remove -e), and
          # `read` exits 1 at EOF because awk's printf emits no trailing
          # newline — the variables are populated regardless.
          # over_intended is tracked separately from turn_warning because
          # the two mean different things now: at/above the warn fraction is
          # "getting close to the budget", while ABOVE the budget is a state
          # that used to be impossible (the runtime stopped you) and is now
          # an ordinary healthy outcome — the run simply continued up to the
          # ceiling. Rendering that as a threshold warning would reprint the
          # "198 / 100 turns (198%)" nonsense this action's description
          # already apologises for.
          #
          # The boundary is `>=`, not `>`, so it agrees with
          # wing-commander-agent-verdict's `over-budget`
          # (counted-turns >= intended-turns) at exactly 100% of the budget.
          # They are meant to be the same signal, and a caller reads both:
          # the verdict's output gates the "used its full intended turn
          # budget" callout on the lifecycle issue, while this flag picks
          # the line the run summary renders. At `>` the two disagreed on
          # the one run that lands exactly on the budget — the callout said
          # "full intended budget" while the summary printed the threshold
          # warning it is describing (PR #221 review).
          read -r turns_pct turn_warning over_intended < <(awk -v u="$turns_used" -v b="$MAX_TURNS" -v w="$WARN_FRACTION" 'BEGIN{
            r=(b+0>0)?u/b:0
            printf "%d %s %s", (r*100)+0.5, (r>=w)?"true":"false", (r>=1)?"true":"false"
          }') || true
          warn_pct="$(awk -v w="$WARN_FRACTION" 'BEGIN{ printf "%d", (w*100)+0.5 }')"
        fi

        # --- T005: formatting helpers, each degrading to "unavailable" ----------
        fmt_duration() {
          local ms="$1"
          printf '%s' "$ms" | grep -Eq '^[0-9]+$' || { printf 'unavailable'; return; }
          local t=$(( ms / 1000 )) h m s out=""
          h=$(( t / 3600 )); m=$(( (t % 3600) / 60 )); s=$(( t % 60 ))
          [ "$h" -gt 0 ] && out="${h}h "
          { [ "$h" -gt 0 ] || [ "$m" -gt 0 ]; } && out="${out}${m}m "
          printf '%s%ss' "$out" "$s"
        }
        fmt_cost() {
          local v="$1"
          printf '%s' "$v" | grep -Eq '^[0-9]+([.][0-9]+)?$' || { printf 'unavailable'; return; }
          awk -v v="$v" 'BEGIN{ if (v>=1) printf "$%.2f", v; else printf "$%.4f", v }'
        }
        fmt_tokens() {
          local uj="$1"
          { [ -z "$uj" ] || [ "$uj" = "null" ]; } && { printf 'unavailable'; return; }
          printf '%s' "$uj" | jq -r '
            (.input_tokens // 0) as $i | (.output_tokens // 0) as $o
            | (.cache_creation_input_tokens // 0) as $cc
            | (.cache_read_input_tokens // 0) as $cr
            | ($i+$o+$cc+$cr) as $tot
            | if $tot == 0 then "unavailable"
              else "\($tot) (in \($i), out \($o), cache \($cc+$cr))" end
          ' 2>/dev/null || printf 'unavailable'
        }
        fmt_per_model() {
          local mj="$1"
          { [ -z "$mj" ] || [ "$mj" = "null" ]; } && return
          printf '%s' "$mj" | jq -r '
            to_entries | map(
              .key as $m | .value as $v
              | (($v.inputTokens // $v.input_tokens // 0)
                 + ($v.outputTokens // $v.output_tokens // 0)
                 + ($v.cacheReadInputTokens // $v.cache_read_input_tokens // 0)
                 + ($v.cacheCreationInputTokens // $v.cache_creation_input_tokens // 0)) as $t
              | ($v.costUSD // $v.cost_usd // $v.costUsd // null) as $c
              | "\($m): \($t) tokens" + (if $c != null then " / $\($c|tostring)" else "" end)
            ) | join("; ")
          ' 2>/dev/null || true
        }

        # --- T006: normal-case Markdown block ----------------------------------
        turns_used_disp="$turns_used"
        [ -z "$turns_used_disp" ] && turns_used_disp="unavailable"
        # The budget only goes in the cell next to a number that is measured
        # against it. An uncounted fallback is labelled so nobody reads it as
        # a budget figure again.
        if [ "$turns_counted" = "true" ] && [ -n "$MAX_TURNS" ]; then
          turns_cell="$turns_used_disp / $MAX_TURNS"
        elif [ "$turns_counted" = "true" ]; then
          turns_cell="$turns_used_disp"
        elif [ "$turns_used_disp" = "unavailable" ]; then
          turns_cell="unavailable"
        else
          turns_cell="$turns_used_disp (reported, not comparable to budget)"
        fi
        duration_disp="$(fmt_duration "$duration_ms")"
        cost_disp="$(fmt_cost "$cost_usd")"
        tokens_disp="$(fmt_tokens "$usage_json")"
        per_model_line="$(fmt_per_model "$model_usage_json")"

        {
          printf '%s\n\n' "$heading"
          printf '| Model | Turns | Duration | Tokens | Cost |\n'
          printf '|---|---|---|---|---|\n'
          printf '| %s | %s | %s | %s | %s |\n\n' \
            "$MODEL_IN" "$turns_cell" "$duration_disp" "$tokens_disp" "$cost_disp"
          # Additive-only (research.md R6): renders only when BOTH verdict
          # and verdict-reason are non-empty, so a caller that hasn't wired
          # wing-commander-agent-verdict yet renders byte-for-byte the same
          # as before this input pair existed.
          if [ -n "$VERDICT" ] && [ -n "$VERDICT_REASON" ]; then
            printf '**Verdict**: %s — %s\n\n' "$VERDICT" "$VERDICT_REASON"
          fi
          # Ground truth, and it outranks the ratio: the runtime itself says
          # the budget ran out. Reported whether or not counting succeeded.
          if [ "$subtype" = "error_max_turns" ]; then
            # The cap the run hit is the ceiling, not the intended budget.
            # Name both when they are known and different — "cut off at 38"
            # alone leaves a maintainer hunting for where 38 came from.
            if [ -n "$CEILING" ] && [ -n "$MAX_TURNS" ] && [ "$CEILING" != "$MAX_TURNS" ]; then
              printf '🛑 **Turn budget exhausted**: the runtime cut this run off at its %s-turn runaway ceiling (%sx the %s-turn intended budget). Work after that point was never attempted — treat any "done" narration in the transcript as unfinished.\n\n' \
                "$CEILING" "$(awk -v c="$CEILING" -v b="$MAX_TURNS" 'BEGIN{ printf "%.1f", (b+0>0)?c/b:0 }')" "$MAX_TURNS"
            else
              printf '🛑 **Turn budget exhausted**: the runtime cut this run off at its %s-turn cap. Work after that point was never attempted — treat any "done" narration in the transcript as unfinished.\n\n' \
                "${CEILING:-${MAX_TURNS:-configured}}"
            fi
          elif [ "$over_intended" = "true" ]; then
            printf 'ℹ️ **Over intended budget**: this run used %s turns against an intended budget of %s (%s%%) and still finished%s. Not a failure — the intended budget is a tuning number, not a stop. Worth raising if this stage does it routinely.\n\n' \
              "$turns_used" "$MAX_TURNS" "$turns_pct" \
              "$([ -n "$CEILING" ] && printf ' well inside its %s-turn runaway ceiling' "$CEILING")"
          elif [ "$turn_warning" = "true" ]; then
            printf '⚠️ **Turn budget warning**: this run used %s/%s turns (%s%%) — at or above the %s%% warning threshold.\n\n' \
              "$turns_used" "$MAX_TURNS" "$turns_pct" "$warn_pct"
          fi
          # Subagent turns are real spend but free against the budget, so
          # they belong in the summary and NOT in the ratio above.
          if printf '%s' "$sub_turns" | grep -Eq '^[0-9]+$' && [ "$sub_turns" -gt 0 ]; then
            printf '**Subagent turns**: %s (delegated work; these do not count against the --max-turns budget).\n\n' \
              "$sub_turns"
          fi
          if [ -n "$per_model_line" ]; then
            printf '**Per-model breakdown**: %s\n\n' "$per_model_line"
          fi
        } >> "$SUMMARY"

        exit 0
