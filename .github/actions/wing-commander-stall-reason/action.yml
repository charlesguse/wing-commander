# Single home for the "Determine which dependency did not start" reason
# string (CLAUDE.md single-home rule; second maintainer review of PR #407).
# Resolved from the pipeline repository's own checkout -- see the header of
# .github/actions/wing-commander-context/action.yml.
name: wing-commander-stall-reason
description: >
  Diagnoses why a gated stage's survivor job is running: a named
  post-agent step failure (with the credential mentioned as context when
  it also failed to re-establish), a credential-only re-establishment
  failure when no step could be named, the generic agent-ran branch, or
  (when the agent never ran at all) the pre-052 image/entry-result
  diagnosis. A real, named failure always outranks the credential-only
  branch -- third maintainer review of PR #407 found the credential
  branch wrongly outranking a later, named failure (FR-004, FR-011,
  SC-003) -- see clarify.yml for the call-site convention every one of
  the six consuming stages follows.

inputs:
  stage-name:
    description: One-word stage name interpolated into the fallback sentences ("the <stage-name> stage never started").
    required: true
  image-result:
    description: needs.verify-image-prerequisites.result
    required: true
  entry-result:
    description: The entry job's own needs.<job>.result.
    required: true
  agent-ran:
    description: needs.<job>.outputs.agent-ran
    required: false
    default: ""
  agent-conclusion:
    description: needs.<job>.outputs.agent-conclusion
    required: false
    default: ""
  credential-refresh-ok:
    description: needs.<job>.outputs.credential-refresh-ok
    required: false
    default: ""
  push-credential-mint-failed:
    description: >
      needs.<job>.outputs.push-credential-mint-failed (specs/071-agent-push-
      credential, FR-006) -- 'true' when the agent step's own push-credential
      helper logged a mint failure at least once during the run.
    required: false
    default: ""
  failed-post-agent-step:
    description: needs.<job>.outputs.failed-post-agent-step
    required: false
    default: ""

outputs:
  reason:
    description: One sentence naming where the run stopped.
    value: ${{ steps.determine.outputs.reason }}

runs:
  using: composite
  steps:
    - name: Determine which dependency did not start
      id: determine
      shell: bash
      env:
        STAGE_NAME: ${{ inputs.stage-name }}
        IMAGE_RESULT: ${{ inputs.image-result }}
        ENTRY_RESULT: ${{ inputs.entry-result }}
        AGENT_RAN: ${{ inputs.agent-ran }}
        AGENT_CONCLUSION: ${{ inputs.agent-conclusion }}
        CREDENTIAL_REFRESH_OK: ${{ inputs.credential-refresh-ok }}
        PUSH_CRED_MINT_FAILED: ${{ inputs.push-credential-mint-failed }}
        FAILED_STEP: ${{ inputs.failed-post-agent-step }}
      run: |
        if [ "$AGENT_RAN" = "true" ] && [ -n "$FAILED_STEP" ] && [ "$CREDENTIAL_REFRESH_OK" = "false" ]; then
          reason="the agent step ran (concluded: $AGENT_CONCLUSION); the credential could not be re-established, and step '$FAILED_STEP' failed after it"
        elif [ "$AGENT_RAN" = "true" ] && [ -n "$FAILED_STEP" ]; then
          reason="the agent step ran (concluded: $AGENT_CONCLUSION) and the '$FAILED_STEP' step after it did not complete"
        elif [ "$AGENT_RAN" = "true" ] && [ "$CREDENTIAL_REFRESH_OK" = "false" ]; then
          reason="the agent step ran (concluded: $AGENT_CONCLUSION) and the post-agent wing-commander-bot credential re-establishment failed (see the 'Determine post-agent credential status' step) -- treat the credential, not the agent or a downstream step, as the cause"
        elif [ "$AGENT_RAN" = "true" ] && [ "$PUSH_CRED_MINT_FAILED" = "true" ]; then
          reason="the agent step ran (concluded: $AGENT_CONCLUSION) and its own push credential failed to mint at least once during the run (see the agent step's transcript for 'wing-commander-agent-push-credential: mint failed:') -- treat that credential, not the agent, as contributing cause"
        elif [ "$AGENT_RAN" = "true" ]; then
          reason="the agent step ran (concluded: $AGENT_CONCLUSION) and a step after it did not complete"
        elif [ "$IMAGE_RESULT" = "failure" ]; then
          reason="the verify-image-prerequisites job failed, so the $STAGE_NAME stage never started"
        elif [ "$ENTRY_RESULT" = "skipped" ]; then
          reason="the $STAGE_NAME stage was skipped because a dependency it needs did not run"
        else
          reason="the $STAGE_NAME stage failed before it could run its own steps"
        fi
        echo "reason=$reason" >> "$GITHUB_OUTPUT"
