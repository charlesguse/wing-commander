# The `gh api -X POST .../reviews -f event=COMMENT` idiom, in one home.
#
# Extracted from board-loop.yml's reviewer job's own "Post the review on
# the PR" step (specs/062-lifecycle-review-gate T012) so that
# lifecycle-review-gate.yml's `review` job (US1) can become a second
# caller without pasting the same `gh api` call a second time (CLAUDE.md's
# "Shared logic has exactly one home"). Both PRs this pipeline ever
# reviews share the same App identity as the review itself, so
# COMMENT is the only review event either caller can use — GitHub rejects
# APPROVE/REQUEST_CHANGES from a PR's own author identity.
#
# `attribution` absorbs board-loop.yml's directed-proof-run prepend
# (FR-011, contracts/directed-proof-run.md "Attribution"): the caller
# passes its one canonical attribution string (empty outside a directed
# run) and this step prepends it, so no caller re-implements the prepend.
name: wing-commander-post-review-comment
description: >
  Posts a COMMENT-event pull request review with the given body file — the
  one home of this repository's `gh api -X POST .../reviews -f event=COMMENT` call.

inputs:
  token:
    description: Token to post the review with
    required: true
  pr-number:
    description: The pull request to review
    required: true
  body-file:
    description: Path to a file containing the review body (Markdown)
    required: true
  attribution:
    description: Optional line prepended to the body, followed by a blank line. Empty (the default) posts the body unchanged.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Post the review on the PR
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        BODY_FILE: ${{ inputs.body-file }}
        ATTRIBUTION: ${{ inputs.attribution }}
      run: |
        set -uo pipefail
        post_file="$BODY_FILE"
        if [ -n "${ATTRIBUTION:-}" ]; then
          post_file="$(mktemp)"
          { printf '%s\n\n' "$ATTRIBUTION"; cat "$BODY_FILE"; } > "$post_file"
        fi
        gh api -X POST "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" \
          -f event=COMMENT -F body=@"$post_file" >/dev/null
