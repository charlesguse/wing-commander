# wing-commander-contained-gate-suite — run the local gate suite on an
# agent-authored workspace bundle in a credential-free job, and upload a
# head-SHA-bound verdict (spec 095 FR-001..FR-006).
#
# The caller job holds `permissions: contents: read`, no App token, and
# checks out github.sha with persist-credentials: false. This composite is
# taken from that trusted checkout; the bundle is hostile input and only its
# commits are read (contracts/workspace-bundle.md). The verdict is read
# fail-closed by wc_gate_verdict.py in the publishing job.
#
# Constitution VII: every input is optional with a default.
name: wing-commander-contained-gate-suite
description: >-
  Verifies a workspace bundle, checks out its head, runs the local gate
  suite and uploads a gate verdict artifact. An absent or unverifiable
  bundle yields a failing verdict, never a skip.
inputs:
  site:
    description: "Verdict site: board-fix, board-review-fixup, implement-cycle or implement-retry."
    required: false
    default: board-fix
  bundle-artifact:
    description: Name of the workspace bundle artifact to download.
    required: false
    default: wc-gate-bundle-board-fix
outputs:
  verdict-artifact:
    description: Name of the uploaded verdict artifact.
    value: wc-gate-verdict-${{ inputs.site }}
runs:
  using: composite
  steps:
    - name: Download workspace bundle
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.bundle-artifact }}
        path: ${{ runner.temp }}/wc-gate-bundle
    - name: Run the gate suite on the bundle
      shell: bash
      env:
        SITE: ${{ inputs.site }}
        TRUSTED_SHA: ${{ github.sha }}
        BUNDLE_DIR: ${{ runner.temp }}/wc-gate-bundle
        VERDICT_OUT: ${{ runner.temp }}/wc-gate-verdict.json
      run: |
        bash "$GITHUB_ACTION_PATH/../_shared/contained-gate-suite.sh" "$SITE" "$BUNDLE_DIR" "$TRUSTED_SHA" "$VERDICT_OUT"
    - name: Upload gate verdict
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: wc-gate-verdict-${{ inputs.site }}
        path: ${{ runner.temp }}/wc-gate-verdict.json
        if-no-files-found: error
