# The small-change size backstop as a composite (specs/057-autonomous-board-loop
# research.md D5): reports whether a drafted change is over the caller's
# file-count/changed-line-count threshold. board-loop.yml's route job calls
# it with its own, larger threshold.
#
# The formula itself has one home, .github/scripts/size-path-measure.sh
# (CLAUDE.md "Shared logic has exactly one home"): this composite and
# pr-conversation.yml's "Compute confirmation requirements" step, which
# measures each small-unrelated-change leg inside one step and so cannot
# call a composite per leg (#734/#850), both run it. Gate 60
# (verify-single-home-idioms.py) fails on a copy of the formula anywhere
# else, and Gate 83 (size-path-backstop-tests) runs both callers' shell.
name: wing-commander-size-path-backstop
description: >
  Given drafted-content.file-changes (the [{"path", "diff"}, ...] shape
  every drafting step already produces), measures the changed-file count
  and changed-line count and reports whether either exceeds the caller's
  own threshold. Pure measurement -- callers decide what "over threshold"
  means for their own routing.

inputs:
  file-changes:
    description: >
      JSON array shaped like drafted-content.file-changes:
      [{"path": "...", "diff": "<unified diff text>"}, ...].
    required: true
  max-files:
    description: >
      Files threshold. The default is pr-conversation.yml's own small-change
      threshold (3).
    required: false
    default: '3'
  max-lines:
    description: >
      Changed-lines threshold. The default is pr-conversation.yml's own
      small-change threshold (40).
    required: false
    default: '40'

outputs:
  over-threshold:
    description: "'true' when measured-files > max-files or measured-lines > max-lines."
    value: ${{ steps.measure.outputs.over-threshold }}
  measured-files:
    description: "length(file-changes)."
    value: ${{ steps.measure.outputs.measured-files }}
  measured-lines:
    description: >
      Count of unified-diff lines starting with '+' or '-', excluding the
      '+++'/'---' file-header lines, summed across every entry's diff.
    value: ${{ steps.measure.outputs.measured-lines }}

runs:
  using: composite
  steps:
    - name: Measure file/line counts against the threshold
      id: measure
      shell: bash
      env:
        FILE_CHANGES: ${{ inputs.file-changes }}
        MAX_FILES: ${{ inputs.max-files }}
        MAX_LINES: ${{ inputs.max-lines }}
      run: |
        set -uo pipefail

        read -r files lines < <(printf '%s' "$FILE_CHANGES" \
          | bash "$GITHUB_ACTION_PATH/../../scripts/size-path-measure.sh")

        over=false
        if [ "$files" -gt "$MAX_FILES" ] || [ "$lines" -gt "$MAX_LINES" ]; then
          over=true
        fi

        {
          echo "over-threshold=$over"
          echo "measured-files=$files"
          echo "measured-lines=$lines"
        } >> "$GITHUB_OUTPUT"
