# Single home for the fold mechanism's bump/dispatch sequence
# (specs/062-lifecycle-review-gate T034, data-model.md §7, research.md D9,
# contracts/fold-integration.md): given this run's own fold evidence,
# re-read the spec branch's current tip, read spec-meta.json.iteration
# off it and dispatch the configured implement workflow with
# iteration + 1, returning the fold list a caller's own reply needs. CLAUDE.md's "Shared logic has exactly one
# home" applied to pr-conversation.yml's `dispatch-once` job (one dispatch
# per whole review) and lifecycle-review-gate.yml's `disposition` job (one
# dispatch per not-clean round), its two callers.
#
# Resolution of a gap data-model.md §7 left open (T034's own note): §7
# lists only token/spec-dir/issue/base-sha and hardcodes "implement.yml" as
# the dispatch target. `pr-conversation.yml`'s existing `dispatch-once` job
# instead dispatches an adopter-configurable `implement-workflow` input
# that may be EMPTY (standalone mode -- fold, but do not auto-dispatch),
# and `implement.yml` itself is workflow_call-only (no workflow_dispatch),
# so no caller could ever literally dispatch it by that name. Threading
# `implement-workflow` through as this composite's own input (empty
# allowed) preserves that existing, published behavior unchanged rather
# than forcing a hardcoded target on a caller that never had one.
#
# The dispatch decision and the fold list come from the caller's
# `folded-json` input -- THIS run's own fold evidence -- never from "the
# tip moved" alone (specs/075-run-scoped-fold-evidence FR-014/FR-015,
# merged into this branch per the maintainer review's F7(a)): a sibling
# run's fold, or an unrelated push, can move the tip during this run's
# window, and dispatching off that would fire an implement cycle this run
# never earned. pr-conversation.yml's `dispatch-once` job passes
# wing-commander-fold-evidence's `folded-json` (run-id-trailer-scoped --
# see that composite's own header); lifecycle-review-gate.yml's
# `disposition` job passes wing-commander-fold-commit's own `folded-json`,
# since that step made the round's one fold commit itself.
#
# Outputs beyond data-model.md §7's two: `folded` (this run folded
# something of its own, whether or not a dispatch followed -- distinct
# from `dispatched`, which is false in standalone mode), `tip-moved` (the
# tip moved past base-sha -- with `folded` false, the caller posts
# FR-015's declined-dispatch notice), `folded-summary` (one line per
# folded-json entry, so a caller's reply lists exactly what the dispatch
# decision was made from), and `run-url` (the dispatched run's own URL,
# polled here immediately after this composite's own `gh workflow run`).
#
# Runs inside the caller's existing checkout, fetching the spec branch
# straight from `origin` -- this repository is public (CLAUDE.md), so
# reading it needs no token at all, only `dispatch-token` (actions:write)
# for the `gh workflow run`/`gh run list` calls a fold that moved the tip
# may need to make. The caller does not need to have already checked the
# spec branch out itself.
name: wing-commander-fold-dispatch
description: >
  Given THIS run's own fold evidence (folded-json), re-reads the spec
  branch's current tip, reads spec-meta.json.iteration off it and
  dispatches implement-workflow (when configured) with iteration + 1.
  Outputs folded: false (and never dispatches) when folded-json is empty,
  even if the tip moved, and dispatched: false when something folded but
  no implement-workflow is configured (standalone mode).

inputs:
  dispatch-token:
    description: Token with actions:write (e.g. github.token under the caller job's own permissions:) -- used to call gh workflow run/gh run list.
    required: true
  spec-dir:
    description: e.g. specs/062-lifecycle-review-gate
    required: true
  issue:
    description: Lifecycle issue number (recorded for the caller's own reply; not read by this composite).
    required: true
  base-sha:
    description: The spec branch's tip captured before folding began.
    required: true
  spec-branch:
    description: e.g. spec/062-lifecycle-review-gate
    required: true
  folded-json:
    description: >
      JSON array of {id, summary} -- THIS run's own fold evidence
      (wing-commander-fold-evidence's folded-json, or
      wing-commander-fold-commit's). Empty or [] means this run folded
      nothing of its own: nothing is dispatched.
    required: true
  implement-workflow:
    description: Workflow file to dispatch (gh workflow run target). Empty means standalone mode -- fold, but never auto-dispatch.
    required: false
    default: ""

outputs:
  folded:
    description: "'true' if folded-json names at least one of this run's own folds -- whether or not it was dispatched."
    value: ${{ steps.dispatch.outputs.folded }}
  tip-moved:
    description: "'true' if the spec branch's tip moved past base-sha. With folded 'false', the tip moved but not from this run's own fold (FR-015's declined-dispatch case)."
    value: ${{ steps.dispatch.outputs.tip-moved }}
  dispatched:
    description: "'true' only when an implement-workflow run was actually triggered."
    value: ${{ steps.dispatch.outputs.dispatched }}
  new-iteration:
    description: spec-meta.json's iteration + 1, whenever the tip moved (folded == 'true') -- not only when dispatched, since a standalone-mode caller's reply needs it too. Empty when folded is 'false'.
    value: ${{ steps.dispatch.outputs.new-iteration }}
  folded-summary:
    description: "One '- <id>: <summary>' line per folded-json entry. Empty when folded is 'false'."
    value: ${{ steps.dispatch.outputs.folded-summary }}
  run-url:
    description: The dispatched run's own URL, when found within this composite's own poll window. Empty when not dispatched, or when the run could not be located.
    value: ${{ steps.dispatch.outputs.run-url }}

runs:
  using: composite
  steps:
    - name: Re-read the tip and dispatch this run's own folds
      id: dispatch
      shell: bash
      env:
        DISPATCH_TOKEN: ${{ inputs.dispatch-token }}
        SPEC_DIR: ${{ inputs.spec-dir }}
        ISSUE: ${{ inputs.issue }}
        BASE_SHA: ${{ inputs.base-sha }}
        SPEC_BRANCH: ${{ inputs.spec-branch }}
        IMPLEMENT_WORKFLOW: ${{ inputs.implement-workflow }}
        FOLDED_JSON: ${{ inputs.folded-json }}
      run: |
        set -euo pipefail
        git fetch --quiet origin "refs/heads/${SPEC_BRANCH}" || true
        tip="$(git rev-parse FETCH_HEAD 2>/dev/null || true)"

        tip_moved=false
        if [ -n "$tip" ] && [ "$tip" != "$BASE_SHA" ]; then
          tip_moved=true
        fi
        echo "tip-moved=$tip_moved" >> "$GITHUB_OUTPUT"

        folded_json="${FOLDED_JSON:-[]}"
        [ -n "$folded_json" ] || folded_json="[]"

        # FR-014: this run folded nothing of its own -- whether or not the
        # tip moved, there is nothing of this run's to dispatch.
        if [ -z "$tip" ] || [ "$(printf '%s' "$folded_json" | jq 'length')" = "0" ]; then
          echo "folded=false" >> "$GITHUB_OUTPUT"
          echo "dispatched=false" >> "$GITHUB_OUTPUT"
          echo "new-iteration=" >> "$GITHUB_OUTPUT"
          echo "folded-summary=" >> "$GITHUB_OUTPUT"
          echo "run-url=" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        folded=$(printf '%s' "$folded_json" | jq -r '.[] | "- " + .id + ": " + .summary')
        {
          echo "folded-summary<<WC_FOLD_DISPATCH_EOF"
          printf '%s\n' "$folded"
          echo "WC_FOLD_DISPATCH_EOF"
        } >> "$GITHUB_OUTPUT"
        echo "folded=true" >> "$GITHUB_OUTPUT"

        # Computed whenever this run folded, not only when dispatched: a
        # standalone-mode caller (implement-workflow empty) still needs to
        # tell its reply which iteration a manual dispatch should use.
        recorded="$(git show "$tip:$SPEC_DIR/spec-meta.json" | jq -r '.iteration // 0')"
        next=$((recorded + 1))
        echo "new-iteration=$next" >> "$GITHUB_OUTPUT"

        if [ -z "$IMPLEMENT_WORKFLOW" ]; then
          echo "dispatched=false" >> "$GITHUB_OUTPUT"
          echo "run-url=" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        start_ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        GH_TOKEN="$DISPATCH_TOKEN" gh workflow run "$IMPLEMENT_WORKFLOW" -R "$GITHUB_REPOSITORY" \
          -f spec_dir="$SPEC_DIR" -f issue="$ISSUE" -f iteration="$next"
        echo "dispatched=true" >> "$GITHUB_OUTPUT"

        run_url=""
        for _ in 1 2 3 4 5 6; do
          sleep 5
          run_url=$(GH_TOKEN="$DISPATCH_TOKEN" gh run list -R "$GITHUB_REPOSITORY" --workflow "$IMPLEMENT_WORKFLOW" \
            --created ">=$start_ts" --limit 1 --json url --jq '.[0].url // empty' 2>/dev/null) || run_url=""
          [ -n "$run_url" ] && break
        done
        echo "run-url=$run_url" >> "$GITHUB_OUTPUT"
