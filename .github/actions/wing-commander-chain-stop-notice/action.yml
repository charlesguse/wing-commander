# Like every shared composite, this action is resolved from the pipeline
# repository's own checkout at github.job_workflow_sha (see the header of
# .github/actions/wing-commander-context/action.yml for the verified
# snippet). Every caller checks itself out via that snippet, so this
# composite needs no internal re-checkout of itself — only of the *spec*
# branch it marks (when spec-dir is non-empty).
#
# Encapsulates the three-effect "stage did not start" stall sequence — mark
# spec-meta.json stalled, flip the stage:* label, post the notice — as one
# shared shape, called from the abnormal-termination arm of every gated
# stage's survivor job (specs/041-implement-stall-notice/data-model.md).
# Deliberately does not handle the refusal note (that stays
# wing-commander-callout, called in-job) and deliberately does not touch
# implement.yml's existing exhausted-retry notice (left as its current
# inline steps — research.md D7).
name: wing-commander-chain-stop-notice
description: >
  Best-effort: mark spec-meta.json stalled, flip the stage:stalled label,
  and post a "stage did not start" notice on the lifecycle issue (or PR).
  Never fails the calling job — a checkout/push failure degrades the
  notice's wording to "record could not be updated" instead.

inputs:
  token:
    description: >
      Write token (issues: write, and contents: write when spec-dir is set)
      — the same App-installation token every composite already receives.
    required: true
  issue-number:
    description: >
      Where to post. May be a PR number for pr-conversation's degraded case
      — gh issue comment accepts either.
    required: true
  spec-dir:
    description: >
      specs/NNN-slug whose spec-meta.json to mark stalled. Empty means no
      record to mark (intake, or any stage whose independent identity
      re-derivation itself failed) — the record-mark step is skipped and
      the notice always renders the "record could not be updated" wording.
    required: false
    default: ""
  spec-branch:
    description: Branch to check out for the mark. Required together with spec-dir; ignored when spec-dir is empty.
    required: false
    default: ""
  stage-label:
    description: >
      stage:<name> label to remove when the mark succeeds. Empty is valid
      (nothing to remove, e.g. intake).
    required: false
    default: ""
  run-url:
    description: >
      Defaults to this run's own URL when not supplied — always available
      regardless of any job's outcome, since it is workflow-run context,
      not a job output.
    required: false
    default: ""
  reason:
    description: One sentence naming where the run stopped.
    required: true
  restart-command:
    description: >
      Fully caller-rendered restart instructions. Empty renders as a
      generic "re-dispatch this stage" line.
    required: false
    default: ""
  agent-ran:
    description: >
      'true' when the entry job's own agent step ran to some conclusion
      before this stall was detected (spec 052 FR-011/FR-015) -- drops the
      "the stage did not start" / "no work was lost" wording, which is
      false in that case. Any other value (including empty, the default for
      a caller that predates this input) keeps today's wording unchanged
      (FR-012).
    required: false
    default: "false"
  agent-conclusion:
    description: >
      One of success/failure/cancelled, from the entry job's agent-ran
      signal. Only rendered when agent-ran is 'true'.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Checkout spec branch
      id: checkout
      if: inputs.spec-dir != ''
      continue-on-error: true
      uses: actions/checkout@v5
      with:
        ref: ${{ inputs.spec-branch }}
        token: ${{ inputs.token }}
        fetch-depth: 0
        clean: false

    - name: Mark spec-meta.json stalled
      id: mark
      if: always() && inputs.spec-dir != '' && steps.checkout.outcome == 'success'
      shell: bash
      env:
        SPEC_DIR: ${{ inputs.spec-dir }}
        AGENT_RAN: ${{ inputs.agent-ran }}
      run: |
        set -uo pipefail

        commit_note="stage did not start"
        [ "$AGENT_RAN" = "true" ] && commit_note="post-agent step failed"

        status="marked"
        if jq '.stage = "stalled"' "$SPEC_DIR/spec-meta.json" > "$RUNNER_TEMP/wcsn-meta.json" 2>"$RUNNER_TEMP/wcsn-jq-err"; then
          mv "$RUNNER_TEMP/wcsn-meta.json" "$SPEC_DIR/spec-meta.json"
          git config user.name  "wing-commander-bot[bot]"
          git config user.email "wing-commander-bot[bot]@users.noreply.github.com"
          git add "$SPEC_DIR/spec-meta.json"
          # A record already reading stage=stalled (an earlier failed
          # iteration) produces no commit — treated as success, not failure
          # (idempotent on the mark).
          if ! git diff --cached --quiet; then
            if ! git commit -m "implement: mark $SPEC_DIR stalled ($commit_note)"; then
              status="unwritable"
            elif ! git push; then
              status="unwritable"
            fi
          fi
        else
          echo "::warning::wing-commander-chain-stop-notice: jq could not read $SPEC_DIR/spec-meta.json — $(cat "$RUNNER_TEMP/wcsn-jq-err" 2>/dev/null)"
          status="unwritable"
        fi
        echo "record-status=$status" >> "$GITHUB_OUTPUT"

    - name: Flip labels
      id: labels
      if: always()
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        ISSUE: ${{ inputs.issue-number }}
        STAGE_LABEL: ${{ inputs.stage-label }}
        RECORD_STATUS: ${{ steps.mark.outputs.record-status }}
      run: |
        set -uo pipefail
        gh label create "stage:stalled" --color E99695 --description "Stage did not complete; manual restart required" --force || true
        gh issue edit "$ISSUE" --add-label "stage:stalled" || true
        if [ -n "$STAGE_LABEL" ] && [ "$RECORD_STATUS" = "marked" ]; then
          gh issue edit "$ISSUE" --remove-label "$STAGE_LABEL" || true
        fi

    - name: Post the notice
      if: always()
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        ISSUE: ${{ inputs.issue-number }}
        REASON: ${{ inputs.reason }}
        RUN_URL_INPUT: ${{ inputs.run-url }}
        DEFAULT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        RESTART_COMMAND: ${{ inputs.restart-command }}
        RECORD_STATUS: ${{ steps.mark.outputs.record-status }}
        AGENT_RAN: ${{ inputs.agent-ran }}
        AGENT_CONCLUSION: ${{ inputs.agent-conclusion }}
      run: |
        set -uo pipefail

        run_url="$RUN_URL_INPUT"
        [ -n "$run_url" ] || run_url="$DEFAULT_RUN_URL"

        restart="$RESTART_COMMAND"
        [ -n "$restart" ] || restart="Re-dispatch this stage once the cause above is resolved."

        # spec 052 FR-011/FR-015 (maintainer review of PR #407): when the
        # agent step ran to some conclusion, "the stage did not start" and
        # "no work was lost" are both false -- drop them. Any other value of
        # agent-ran (including a caller that predates this input) keeps
        # today's wording byte-for-byte (FR-012).
        #
        # The agent clause itself is worded from agent-conclusion, not
        # asserted as "completed its own work" regardless of outcome
        # (second maintainer review of PR #407, FR-011): a
        # continue-on-error-wrapped agent step can conclude failure, and the
        # notice must say so rather than implying success either way.
        if [ "$AGENT_RAN" = "true" ]; then
          headline="⏸️ **Stage stalled — the agent ran but the stage did not complete**"
          case "$AGENT_CONCLUSION" in
            success) agent_clause="the agent completed its work" ;;
            failure) agent_clause="the agent step failed after running; its pushed commits are on the branch" ;;
            *) agent_clause="the agent step ran" ;;
          esac
          if [ "$RECORD_STATUS" = "marked" ]; then
            body="The agent step ran (concluded: $AGENT_CONCLUSION) -- $agent_clause; a step after it did not complete. This specification's lifecycle record has been marked stalled."
          else
            body="The agent step ran (concluded: $AGENT_CONCLUSION) -- $agent_clause; a step after it did not complete. **The lifecycle record could not be updated** — a maintainer should confirm the spec branch and the record's \`stage\` field by hand before restarting."
          fi
        else
          headline="⏸️ **Stage stalled — the stage did not start**"
          if [ "$RECORD_STATUS" = "marked" ]; then
            body="No implementation attempt was made — nothing was escalated, no model tier was used, and no work was lost. This specification's lifecycle record has been marked stalled."
          else
            body="No implementation attempt was made. **The lifecycle record could not be updated** — a maintainer should confirm the spec branch and the record's \`stage\` field by hand before restarting."
          fi
        fi

        {
          echo "$headline"
          echo ""
          echo "$REASON ($run_url)."
          echo ""
          echo "$body"
          echo ""
          echo "$restart"
        } > "$RUNNER_TEMP/wcsn-notice.md"

        gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/wcsn-notice.md"
