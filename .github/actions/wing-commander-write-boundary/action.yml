# wing-commander-write-boundary -- classify a tasks.md's unchecked items
# against the implement stage's write boundary (specs/090-stage-write-
# boundary). The front door to `_shared/classify-out-of-boundary-tasks.sh`,
# the one home of the per-task classification rule (FR-006), mirroring how
# wing-commander-tasks-checkbox-count is the front door to
# count-tasks-checkboxes.sh.
#
# Constitution VII: this composite is part of the published surface;
# adding it is a minor-version change at the next release (plan.md's
# Complexity Tracking table).
#
# Unlike wing-commander-tasks-checkbox-count, this composite's step never
# fails the job -- a task text it cannot confidently classify falls
# through to "ordinary", which is a valid, expected output (FR-015), not
# an error condition.
name: wing-commander-write-boundary
description: >-
  Classifies a tasks.md's unchecked items against the implement stage's
  write boundary (no-write-paths), reporting an out-of-boundary finding
  per matching line and whether every unchecked line is out of reach.
inputs:
  unchecked-items:
    description: >-
      The literal multi-line text wing-commander-tasks-checkbox-count's
      own unchecked-items output already produced for the ref being
      classified.
    required: true
  no-write-paths:
    description: Same value as implement.yml's own input, comma-separated, unsplit.
    required: true
  spec-dir:
    description: e.g. specs/090-stage-write-boundary
    required: true
  tasks-path:
    description: e.g. specs/090-stage-write-boundary/tasks.md
    required: true
outputs:
  findings-json:
    description: JSON array, one entry per out-of-boundary unchecked task; [] when none.
    value: ${{ steps.classify.outputs.findings-json }}
  all-unchecked-out-of-boundary:
    description: "true iff at least one unchecked line exists and every one classified out-of-boundary."
    value: ${{ steps.classify.outputs.all-unchecked-out-of-boundary }}
  out-of-boundary-count:
    description: Count of out-of-boundary entries in findings-json.
    value: ${{ steps.classify.outputs.out-of-boundary-count }}
runs:
  using: composite
  steps:
    - name: Classify unchecked tasks against the write boundary
      id: classify
      shell: bash
      # continue-on-error (PR #836 review, item 9): the classify script
      # itself never exits non-zero for a task it cannot confidently
      # classify (FR-015), but a genuine crash still must not stop the
      # job -- this header comment's "never fails the job" promise needs
      # this, not just the script's own forbearance. The caller reads the
      # all-unchecked-out-of-boundary/findings-json outputs as empty on a
      # crash, which safely falls through to "not routed" rather than
      # skipping the convergence read-back below it.
      continue-on-error: true
      env:
        UNCHECKED_ITEMS: ${{ inputs.unchecked-items }}
        NO_WRITE_PATHS: ${{ inputs.no-write-paths }}
        TASKS_PATH: ${{ inputs.tasks-path }}
        SPEC_DIR: ${{ inputs.spec-dir }}
      run: |
        # review-gate-round-4 item 6: continue-on-error alone makes a
        # genuine script crash indistinguishable from "nothing out of
        # boundary" -- surfaced with ::warning:: instead, mirroring the
        # sibling wing-commander-write-boundary-lookup composite's own
        # failure handling for the equivalent case.
        set +e
        output="$(bash "$GITHUB_ACTION_PATH/../_shared/classify-out-of-boundary-tasks.sh" \
          "$UNCHECKED_ITEMS" "$NO_WRITE_PATHS" "$TASKS_PATH" "$SPEC_DIR")"
        rc=$?
        set -e
        if [ "$rc" -ne 0 ]; then
          # Written to the step's own stdout, NOT redirected into
          # $GITHUB_OUTPUT below -- an earlier draft piped this whole
          # if/fi block into $GITHUB_OUTPUT, which silently swallowed the
          # warning text into the output file instead of the log.
          echo "::warning::wing-commander-write-boundary: classify-out-of-boundary-tasks.sh exited $rc -- treating this run as having nothing out-of-boundary rather than silently masking a real crash."
          output="$(printf '%s\n' \
            "findings-json<<WING_COMMANDER_WRITE_BOUNDARY_FINDINGS_EOF" \
            "[]" \
            "WING_COMMANDER_WRITE_BOUNDARY_FINDINGS_EOF" \
            "all-unchecked-out-of-boundary=false" \
            "out-of-boundary-count=0")"
        fi
        printf '%s\n' "$output" >> "$GITHUB_OUTPUT"
