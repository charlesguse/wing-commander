# Composes each agent step's effective --allowedTools/--disallowedTools
# from its hard-coded defaults and a stage's consumer-supplied append/
# override inputs (specs/026-configurable-tool-lists, research.md D1/D4).
# Pure shell — no agent, no network — runs before the agent step it feeds so
# a conflicting configuration (FR-010) fails without exercising credentials,
# mirroring wing-commander-preflight/action.yml's fail-fast position.
#
# Like every shared composite, this action is resolved from the pipeline
# repository's own checkout at github.job_workflow_sha (see the header of
# .github/actions/wing-commander-context/action.yml for the verified
# snippet), so it must never assume it lives in the workspace-root
# repository.
name: wing-commander-tool-args
description: >
  Compose a stage's effective allowed/disallowed tool lists from its
  hard-coded defaults plus consumer-supplied extra-allowed-tools/
  extra-disallowed-tools (append) or allowed-tools-override/
  disallowed-tools-override (replace) inputs, failing fast when append and
  replace are both supplied for the same direction.

inputs:
  default-allowed-tools:
    description: The step's existing hard-coded allowed list (literal, unchanged from today's inline value).
    required: true
  default-disallowed-tools:
    description: The step's existing hard-coded disallowed list.
    required: true
  extra-allowed-tools:
    description: Passthrough of the stage's extra-allowed-tools workflow_call input.
    required: false
    default: ""
  extra-disallowed-tools:
    description: Passthrough of the stage's extra-disallowed-tools workflow_call input.
    required: false
    default: ""
  allowed-tools-override:
    description: >
      Passthrough of the stage's allowed-tools-override workflow_call input.
      The literal string "__unset__" means "not provided" — distinct from
      an explicit empty string, which means "replace with nothing".
    required: false
    default: "__unset__"
  disallowed-tools-override:
    description: Same semantics as allowed-tools-override, for the disallowed list.
    required: false
    default: "__unset__"
  step-label:
    description: >
      Human-readable identifier for error messages, e.g. "implement.cycle",
      "watchdog.diagnose" — lets one stage with multiple internal steps
      name the specific step in a validation failure.
    required: true

outputs:
  allowed-tools:
    description: Composed, deduplicated, comma-joined effective allowed list.
    value: ${{ steps.compose.outputs.allowed-tools }}
  disallowed-tools:
    description: Composed, deduplicated, comma-joined effective disallowed list.
    value: ${{ steps.compose.outputs.disallowed-tools }}
  shell-commands:
    description: >
      A complete sentence stating exactly which shell commands this run
      permits, derived from the composed allowed list after subtracting
      anything the composed disallowed list fully covers
      (specs/037-rendered-tooling-list/contracts/tooling-statement-render.md):
      "This run permits no shell command.", "This run permits any shell
      command.", "This run permits any shell command except: `cmd`.", or
      "This run permits these shell commands: `cmd1`, `cmd2` (exact command
      only)." — never a denied command named, never a bare list or dangling
      fragment. A stage's prompt that names its tools by hand drifts from
      the list actually passed to --allowedTools the first time either is
      edited alone, which is how specs/036 reached a finalize PR with four
      validation tasks unrun: the grant said one thing and the prompt said
      another.
    value: ${{ steps.compose.outputs.shell-commands }}

runs:
  using: composite
  steps:
    - name: Compose tool args
      id: compose
      shell: bash
      env:
        STEP_LABEL: ${{ inputs.step-label }}
        DEFAULT_ALLOWED: ${{ inputs.default-allowed-tools }}
        DEFAULT_DISALLOWED: ${{ inputs.default-disallowed-tools }}
        EXTRA_ALLOWED: ${{ inputs.extra-allowed-tools }}
        EXTRA_DISALLOWED: ${{ inputs.extra-disallowed-tools }}
        ALLOWED_OVERRIDE: ${{ inputs.allowed-tools-override }}
        DISALLOWED_OVERRIDE: ${{ inputs.disallowed-tools-override }}
      run: |
        set -uo pipefail

        SENTINEL="__unset__"

        fail() {
          echo "::error::wing-commander-tool-args ($STEP_LABEL): $1"
          echo "❌ **wing-commander-tool-args ($STEP_LABEL) failed** — $1" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        }

        trim() {
          local s="$1"
          s="${s#"${s%%[![:space:]]*}"}"
          s="${s%"${s##*[![:space:]]}"}"
          printf '%s' "$s"
        }

        # 1. FR-010 validation: extra-* and a non-sentinel *-override for the
        #    same direction is a conflict, checked independently per direction.
        if [ -n "$EXTRA_ALLOWED" ] && [ "$ALLOWED_OVERRIDE" != "$SENTINEL" ]; then
          fail "allowed: both extra-allowed-tools ('$EXTRA_ALLOWED') and allowed-tools-override ('$ALLOWED_OVERRIDE') were supplied for step '$STEP_LABEL' — choose one."
        fi
        if [ -n "$EXTRA_DISALLOWED" ] && [ "$DISALLOWED_OVERRIDE" != "$SENTINEL" ]; then
          fail "disallowed: both extra-disallowed-tools ('$EXTRA_DISALLOWED') and disallowed-tools-override ('$DISALLOWED_OVERRIDE') were supplied for step '$STEP_LABEL' — choose one."
        fi

        # 2. Compose (research.md D4): override replaces wholesale; otherwise
        #    append is a union with the defaults. explicit_allow is what an
        #    explicit allow decision was made on (extra-allowed in append
        #    mode, the full override list in override mode) — never the
        #    unmodified default-allowed-tools — and is subtracted from the
        #    disallowed side so explicit deny still beats default allow.
        if [ "$ALLOWED_OVERRIDE" != "$SENTINEL" ]; then
          raw_allowed="$ALLOWED_OVERRIDE"
          explicit_allow="$ALLOWED_OVERRIDE"
        else
          if [ -n "$EXTRA_ALLOWED" ]; then
            raw_allowed="$DEFAULT_ALLOWED,$EXTRA_ALLOWED"
          else
            raw_allowed="$DEFAULT_ALLOWED"
          fi
          explicit_allow="$EXTRA_ALLOWED"
        fi

        if [ "$DISALLOWED_OVERRIDE" != "$SENTINEL" ]; then
          raw_disallowed="$DISALLOWED_OVERRIDE"
        else
          if [ -n "$EXTRA_DISALLOWED" ]; then
            raw_disallowed="$DEFAULT_DISALLOWED,$EXTRA_DISALLOWED"
          else
            raw_disallowed="$DEFAULT_DISALLOWED"
          fi
        fi

        declare -A explicit_allow_set=()
        if [ -n "$explicit_allow" ]; then
          IFS=',' read -ra allow_items <<< "$explicit_allow"
          for item in "${allow_items[@]}"; do
            item="$(trim "$item")"
            [ -z "$item" ] && continue
            explicit_allow_set["$item"]=1
          done
        fi

        # 3. Dedupe (trim, drop exact duplicates, preserve first-seen order);
        #    the disallowed pass additionally subtracts explicit_allow_set.
        compose_list() {
          local csv="$1" subtract="$2"
          local result=""
          declare -A seen=()
          IFS=',' read -ra items <<< "$csv"
          local item
          for item in "${items[@]}"; do
            item="$(trim "$item")"
            [ -z "$item" ] && continue
            if [ "$subtract" = "subtract" ] && [ -n "${explicit_allow_set[$item]+x}" ]; then
              continue
            fi
            if [ -z "${seen[$item]+x}" ]; then
              seen["$item"]=1
              if [ -z "$result" ]; then
                result="$item"
              else
                result="$result,$item"
              fi
            fi
          done
          printf '%s' "$result"
        }

        effective_allowed="$(compose_list "$raw_allowed" "")"
        effective_disallowed="$(compose_list "$raw_disallowed" "subtract")"

        # 4. Render "shell-commands" as a complete sentence stating exactly
        #    which shell commands this run permits
        #    (specs/037-rendered-tooling-list/contracts/tooling-statement-render.md):
        #    classify each effective_allowed/effective_disallowed entry as
        #    ANY (bare `Bash`), PREFIX(cmd) (`Bash(cmd:*)`/`Bash(cmd *)`,
        #    any arguments), EXACT(cmd) (`Bash(cmd)`, no trailing wildcard,
        #    that literal invocation only), or NOT_SHELL (any other tool
        #    entry — excluded from this render entirely). An allow grant is
        #    dropped only when some disallowed grant for the same command
        #    (or, for an ANY allow, any disallowed grant at all) has a scope
        #    that is a superset of the allow's scope; effective_allowed/
        #    effective_disallowed themselves are never rewritten — this is a
        #    read, not a recomputation. A surviving ANY allow under a
        #    partial (command-specific) deny is stated as unrestricted with
        #    the denied commands named as exceptions, not silently narrowed.
        #    A command with any surviving PREFIX grant is stated once, in
        #    the PREFIX form; a command with only EXACT grant(s) surviving
        #    is stated once with an "(exact command only)" qualifier.
        classify_shell_grant() {
          local item="$1" cmd
          case "$item" in
            'Bash')
              printf 'ANY|'
              ;;
            'Bash('*')')
              cmd="${item#Bash(}"
              cmd="${cmd%)}"
              case "$cmd" in
                *:\*)
                  printf 'PREFIX|%s' "$(trim "${cmd%:\*}")"
                  ;;
                *' *')
                  printf 'PREFIX|%s' "$(trim "${cmd% \*}")"
                  ;;
                *)
                  printf 'EXACT|%s' "$(trim "$cmd")"
                  ;;
              esac
              ;;
            *)
              printf 'NOT_SHELL|'
              ;;
          esac
        }

        allowed_forms=()
        allowed_cmds=()
        IFS=',' read -ra allowed_items <<< "$effective_allowed"
        for item in "${allowed_items[@]}"; do
          item="$(trim "$item")"
          [ -z "$item" ] && continue
          IFS='|' read -r form cmd <<< "$(classify_shell_grant "$item")"
          [ "$form" = "NOT_SHELL" ] && continue
          allowed_forms+=("$form")
          allowed_cmds+=("$cmd")
        done

        disallowed_forms=()
        disallowed_cmds=()
        IFS=',' read -ra disallowed_items <<< "$effective_disallowed"
        for item in "${disallowed_items[@]}"; do
          item="$(trim "$item")"
          [ -z "$item" ] && continue
          IFS='|' read -r form cmd <<< "$(classify_shell_grant "$item")"
          [ "$form" = "NOT_SHELL" ] && continue
          disallowed_forms+=("$form")
          disallowed_cmds+=("$cmd")
        done

        allowed_has_any=0
        for form in "${allowed_forms[@]}"; do
          [ "$form" = "ANY" ] && allowed_has_any=1
        done

        disallowed_has_any=0
        for form in "${disallowed_forms[@]}"; do
          [ "$form" = "ANY" ] && disallowed_has_any=1
        done

        if [ "$allowed_has_any" = "1" ] && [ "$disallowed_has_any" != "1" ]; then
          # UNRESTRICTED / UNRESTRICTED_EXCEPT (research.md D3).
          exceptions=""
          declare -A exception_seen=()
          idx=0
          for form in "${disallowed_forms[@]}"; do
            cmd="${disallowed_cmds[$idx]}"
            idx=$((idx + 1))
            [ "$form" = "PREFIX" ] || [ "$form" = "EXACT" ] || continue
            [ -n "${exception_seen[$cmd]+x}" ] && continue
            exception_seen["$cmd"]=1
            if [ -z "$exceptions" ]; then
              exceptions="\`$cmd\`"
            else
              exceptions="$exceptions, \`$cmd\`"
            fi
          done
          if [ -z "$exceptions" ]; then
            shell_commands="This run permits any shell command."
          else
            shell_commands="This run permits any shell command except: $exceptions."
          fi
        else
          # ENUMERATED / EMPTY (research.md D2/D4). A disallowed ANY grant
          # covers every PREFIX/EXACT allow regardless of command.
          declare -A broadest=()
          idx=0
          for form in "${allowed_forms[@]}"; do
            cmd="${allowed_cmds[$idx]}"
            idx=$((idx + 1))
            [ "$form" = "PREFIX" ] || [ "$form" = "EXACT" ] || continue

            covered=0
            if [ "$disallowed_has_any" = "1" ]; then
              covered=1
            else
              didx=0
              for dform in "${disallowed_forms[@]}"; do
                dcmd="${disallowed_cmds[$didx]}"
                didx=$((didx + 1))
                [ "$dcmd" = "$cmd" ] || continue
                if [ "$dform" = "PREFIX" ]; then
                  covered=1
                  break
                fi
                if [ "$dform" = "EXACT" ] && [ "$form" = "EXACT" ]; then
                  covered=1
                  break
                fi
              done
            fi
            [ "$covered" = "1" ] && continue

            if [ "$form" = "PREFIX" ]; then
              broadest["$cmd"]="PREFIX"
            elif [ -z "${broadest[$cmd]+x}" ]; then
              broadest["$cmd"]="EXACT"
            fi
          done

          entries=""
          declare -A entry_seen=()
          idx=0
          for form in "${allowed_forms[@]}"; do
            cmd="${allowed_cmds[$idx]}"
            idx=$((idx + 1))
            [ "$form" = "PREFIX" ] || [ "$form" = "EXACT" ] || continue
            [ -n "${broadest[$cmd]+x}" ] || continue
            [ -n "${entry_seen[$cmd]+x}" ] && continue
            entry_seen["$cmd"]=1
            if [ "${broadest[$cmd]}" = "PREFIX" ]; then
              rendered="\`$cmd\`"
            else
              rendered="\`$cmd\` (exact command only)"
            fi
            if [ -z "$entries" ]; then
              entries="$rendered"
            else
              entries="$entries, $rendered"
            fi
          done

          if [ -z "$entries" ]; then
            shell_commands="This run permits no shell command."
          else
            shell_commands="This run permits these shell commands: $entries."
          fi
        fi

        # 5. Emit (only reached once validation in step 1 passes).
        echo "allowed-tools=$effective_allowed" >> "$GITHUB_OUTPUT"
        echo "disallowed-tools=$effective_disallowed" >> "$GITHUB_OUTPUT"
        echo "shell-commands=$shell_commands" >> "$GITHUB_OUTPUT"
        echo "✅ wing-commander-tool-args ($STEP_LABEL): composed tool lists." >> "$GITHUB_STEP_SUMMARY"
        echo "**Tooling statement**: $shell_commands" >> "$GITHUB_STEP_SUMMARY"
