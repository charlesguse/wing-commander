# Like every shared composite, this action is resolved from the pipeline
# repository's own checkout at github.job_workflow_sha (see the header of
# .github/actions/wing-commander-context/action.yml for the verified
# snippet). It is the ONE home of "which spec did the inspected run
# advance, and which lifecycle issue does that spec route to" (#330):
# watchdog.yml's collect job asks so every collector and the diagnose
# verdict can be filed against the spec's lifecycle issue, and its
# report-unhandled-failure job asks again, independently, because collect
# may be the very job that failed before publishing its answer. Before this
# composite the derivation was pasted into both jobs, and #322's
# metrics-record fallback landed in one copy only — the divergent-fix
# shape CLAUDE.md's "Shared logic has exactly one home" rule names.
#
# Best-effort and read-only throughout — never a refusal gate, unlike every
# write-capable stage's identity check. A run that cannot be tied to a spec
# (a main-based cleanup sweep, a rebase run, the watchdog's own runs) is
# still inspected and reported against its own run URL; this composite just
# records that no lifecycle issue destination exists rather than failing
# the calling job. Every external read below is guarded for that reason.
#
# How the slug is found, in order:
#
#   1. The inspected run's head branch, by pipeline prefix (spec-draft/,
#      spec/, plan/, tasks/, impl/<slug>-iterN). The caller hands the head
#      in when it already has it (collect's run-meta step); when it does
#      not, the composite reads it itself with `gh run view`.
#   2. #322: a workflow_dispatch-triggered stage reports the DEFAULT branch
#      as its head, and the dispatch inputs that name the spec are not in
#      the run's metadata — so step 1 derives nothing for every tasks and
#      implement run (both are only ever dispatched). What such a run does
#      leave behind is its wing-commander-metrics-record artifact(s), whose
#      spec.spec_dir names the spec for every agent-bearing stage
#      (specs/043). The slug is read from there when the head gave none —
#      but only from a record that declares spec.identity_is_own: true
#      (#750/FR-008, specs/099-name-free-stage-identity/contracts/spec-
#      identity-declaration.md), i.e. the record's own spec.* IS the
#      emitting run's advance, never borrowed. Everywhere else the record
#      names a spec the run did not advance: the watchdog's own diagnose
#      record borrows the spec of the run THAT watchdog inspected, a
#      rebase run writes one record per matrix slug, and a cleanup sweep
#      can touch several specs — each of those call sites passes
#      spec-identity-is-own: 'false', so their records are never trusted
#      here. "First record wins" would otherwise tie those runs to an
#      arbitrary spec and route findings about them onto its lifecycle
#      issue; they stay reported against their own run URL. A missing/
#      expired artifact, a download failure, or a record with no spec
#      identity (or identity_is_own: false) all leave the slug empty
#      exactly as step 1 left it. This no longer keys on the run's display
#      name at all (replacing a six-name `case "$RUN_NAME"` allowlist) —
#      the FR-012 gate (verify-no-reference-name-stage-match.py) asserts
#      no reference display name gates behavior anywhere in this
#      composite except the id: name-fallback step below.
#
# With a slug in hand, spec-meta.json on the spec branch names the
# lifecycle issue and the recorded stage. A spec still in intake or clarify
# has no spec branch yet -- it lives on its spec-draft branch until the spec
# PR merges -- so when the spec branch yields no record the draft branch is
# read the same way (#376: before this, every intake and clarify run
# resolved a slug and then no issue, and the cost-report collector filed a
# finding over each one). Without a slug, or when neither branch has a
# record, the issue stays empty and the caller reports against the run URL.
#
# #266: it is also the one home of "which pipeline stage was the inspected
# run". The answer is the `stage` literal the run's own
# wing-commander-metrics-summary call wrote into its metrics record -- the
# stage identity the pipeline itself defines, never the wrapper's display
# name, which differs per adopter. Every record one run writes carries the
# same literal, so unlike the slug this needs no single-spec allowlist.
# The collect job keys denied-tool signals on it; empty when the run left
# no record (the caller substitutes a fixed `unknown`).
#
# Tokens (docs/setup.md): `gh run view` and `gh run download` need
# Actions:read, which the App token does not have, so both run under the
# caller's default token (`actions-token`). `gh issue view` for the
# stage:stalled coexistence check runs under the App token (`token`),
# which may be empty when the caller's context step failed — the read then
# fails closed to "false". Gate 12 (lint-workflows.yml) walks composite
# actions and resolves `inputs.token` / `inputs.actions-token` to what
# watchdog.yml passes, so a `gh run` read here that loses its
# GH_TOKEN="$ACTIONS_TOKEN" prefix fails CI (#339). The other direction —
# `gh issue view` moved under the default token — is not a permission
# failure (watchdog.yml grants it issues:write) and no gate asserts it;
# it would only lose the fail-closed behaviour described above.
name: wing-commander-inspected-run-identity
description: >
  Best-effort, read-only: resolve which spec an inspected workflow run
  advanced (from its head branch, else from its metrics-record artifact)
  and which lifecycle issue that spec routes to. Never fails the calling
  job; an unresolvable run yields empty outputs.

inputs:
  token:
    description: >
      App-installation token for `gh issue view` (the stage:stalled label
      read). May be empty — the stalled-label output then reads "false".
    required: false
    default: ""
  actions-token:
    description: >
      Token with Actions:read for `gh run view` / `gh run download` — the
      calling job's default token, since the App token has no Actions
      permission.
    required: true
  run-id:
    description: The inspected run's id.
    required: true
  run-name:
    description: >
      The inspected run's workflow name, e.g. "Wing Commander · 5
      implement". Decides whether the metrics-record fallback applies (the
      six single-spec stages only). Empty disables the fallback.
    required: false
    default: ""
  head-branch:
    description: >
      The inspected run's head branch when the caller already has it.
      Empty means "read it with `gh run view`".
    required: false
    default: ""
  spec-draft-prefix:
    description: Branch prefix of spec drafts. Empty means the pipeline default, `spec-draft/`.
    required: false
    default: ""
  spec-prefix:
    description: Branch prefix of spec branches. Empty means the pipeline default, `spec/`.
    required: false
    default: ""
  plan-prefix:
    description: Branch prefix of plan branches. Empty means the pipeline default, `plan/`.
    required: false
    default: ""
  tasks-prefix:
    description: Branch prefix of tasks branches. Empty means the pipeline default, `tasks/`.
    required: false
    default: ""
  impl-prefix:
    description: Branch prefix of implement branches (`impl/<slug>-iterN`). Empty means the pipeline default, `impl/`.
    required: false
    default: ""

outputs:
  slug:
    description: The spec slug (NNN-name), or empty when none resolved.
    value: ${{ steps.resolve.outputs.slug }}
  slug-source:
    description: Where the slug came from — `head-branch`, `metrics-record`, or empty when none resolved.
    value: ${{ steps.resolve.outputs.slug-source }}
  spec-dir:
    description: specs/<slug>, or empty.
    value: ${{ steps.resolve.outputs.spec-dir }}
  lifecycle-issue:
    description: The lifecycle issue number from spec-meta.json on the spec branch (else the spec-draft branch), or empty.
    value: ${{ steps.resolve.outputs.lifecycle-issue }}
  meta-stage:
    description: The `stage` recorded in spec-meta.json, or empty.
    value: ${{ steps.resolve.outputs.meta-stage }}
  stalled-label:
    description: "`true` when the lifecycle issue already carries stage:stalled; otherwise `false`."
    value: ${{ steps.resolve.outputs.stalled-label }}
  record-stage:
    description: >
      The `stage` literal from the inspected run's own metrics record
      (lowercased, restricted to [a-z0-9._-]), or empty when the run left
      no readable record (#266).
    value: ${{ steps.stage.outputs.record-stage }}
  resolved-stage:
    description: >
      `record-stage` if non-empty, else the FR-009 name-derived fallback
      (the nine stages FR-014a names, plus watchdog), else empty (#750). The one stage
      identity every FR-002 consumer site except the slug-fallback
      allowlist reads.
    value: ${{ steps.name-fallback.outputs.resolved-stage }}
  resolved-stage-source:
    description: >
      Which branch produced `resolved-stage`: `record`, `name`, or empty
      when neither resolved anything (#750).
    value: ${{ steps.name-fallback.outputs.resolved-stage-source }}

runs:
  using: composite
  steps:
    - name: Resolve inspected run's spec slug and lifecycle issue
      id: resolve
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        ACTIONS_TOKEN: ${{ inputs.actions-token }}
        RUN_ID: ${{ inputs.run-id }}
        HEAD_BRANCH: ${{ inputs.head-branch }}
        SPEC_DRAFT_PREFIX: ${{ inputs.spec-draft-prefix }}
        SPEC_PREFIX: ${{ inputs.spec-prefix }}
        PLAN_PREFIX: ${{ inputs.plan-prefix }}
        TASKS_PREFIX: ${{ inputs.tasks-prefix }}
        IMPL_PREFIX: ${{ inputs.impl-prefix }}
      run: |
        set -uo pipefail
        SPEC_DRAFT_PREFIX="${SPEC_DRAFT_PREFIX:-spec-draft/}"
        SPEC_PREFIX="${SPEC_PREFIX:-spec/}"
        PLAN_PREFIX="${PLAN_PREFIX:-plan/}"
        TASKS_PREFIX="${TASKS_PREFIX:-tasks/}"
        IMPL_PREFIX="${IMPL_PREFIX:-impl/}"

        # A caller without a run-meta step of its own (report-unhandled-
        # failure) hands in no head; read it here, under the default token
        # (Actions:read -- header), best-effort like everything below.
        if [ -z "$HEAD_BRANCH" ] && [ -n "$RUN_ID" ]; then
          HEAD_BRANCH="$(GH_TOKEN="$ACTIONS_TOKEN" gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json headBranch --jq '.headBranch // empty' 2>/dev/null || true)"
        fi

        slug=""
        case "$HEAD_BRANCH" in
          "${SPEC_DRAFT_PREFIX}"*) slug="${HEAD_BRANCH#"$SPEC_DRAFT_PREFIX"}" ;;
          "${SPEC_PREFIX}"*)       slug="${HEAD_BRANCH#"$SPEC_PREFIX"}" ;;
          "${PLAN_PREFIX}"*)       slug="${HEAD_BRANCH#"$PLAN_PREFIX"}" ;;
          "${TASKS_PREFIX}"*)      slug="${HEAD_BRANCH#"$TASKS_PREFIX"}" ;;
          "${IMPL_PREFIX}"*)       slug="${HEAD_BRANCH#"$IMPL_PREFIX"}"; slug="${slug%-iter*}" ;;
        esac
        slug_source=""
        [ -z "$slug" ] || slug_source="head-branch"

        # #322 metrics-record fallback -- the header explains both the
        # fallback and its FR-008/#750 identity_is_own guard. This step is
        # `shell: bash` (errexit on), so every read is guarded: a failed
        # download must not kill the calling job.
        if [ -z "$slug" ] && [ -n "$RUN_ID" ]; then
          mr_dir="$RUNNER_TEMP/spec-slug-metrics-record"
          mkdir -p "$mr_dir" 2>/dev/null || true
          if GH_TOKEN="$ACTIONS_TOKEN" gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -p 'metrics-record*' -D "$mr_dir" >"$RUNNER_TEMP/spec-slug-mr-dl.log" 2>&1; then
            # First record that declares identity_is_own: true AND carries
            # a spec_dir under specs/ (#750/FR-008) -- a record whose
            # spec.* merely borrows another run's identity (identity_is_own
            # false or absent) is never trusted to resolve THIS run's slug.
            # A run with several own-identity records (implement's cycle +
            # progress) names the same spec in each, so the first is as
            # good as any.
            record_dir=""
            while IFS= read -r rec; do
              is_own="$(jq -r '.spec.identity_is_own // false' "$rec" 2>/dev/null || true)"
              [ "$is_own" = "true" ] || continue
              d="$(jq -r '.spec.spec_dir // empty' "$rec" 2>/dev/null || true)"
              case "$d" in
                specs/?*) record_dir="$d"; break ;;
              esac
            done < <(find "$mr_dir" -type f -name '*.json' 2>/dev/null | sort)
            if [ -n "$record_dir" ]; then
              slug="${record_dir#specs/}"
              slug_source="metrics-record"
            fi
          fi
          if [ -z "$slug" ]; then
            echo "spec-slug: head branch '$HEAD_BRANCH' is not a pipeline branch and no metrics record of run $RUN_ID names a spec — no slug resolved." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "spec-slug: head branch '$HEAD_BRANCH' is not a pipeline branch (a dispatched run reports the default branch); slug '$slug' read from the run's metrics record." >> "$GITHUB_STEP_SUMMARY"
          fi
        fi

        issue=""
        spec_dir=""
        meta_stage=""
        if [ -n "$slug" ]; then
          spec_dir="specs/$slug"
          # One home for this read (#340, Gate 61): _shared/read-spec-meta.sh
          # fetches the branch, reads the file and applies the self-identity
          # check; its values are sanitised, so eval is safe.
          eval "$(bash "$GITHUB_ACTION_PATH/../_shared/read-spec-meta.sh" "$SPEC_PREFIX" "$slug" "$spec_dir")"
          # No record on the spec branch: the spec is still a draft (header).
          # A record that IS there but fails its identity check is not
          # papered over by the draft's.
          if [ "$meta_found" != "true" ]; then
            eval "$(bash "$GITHUB_ACTION_PATH/../_shared/read-spec-meta.sh" "$SPEC_DRAFT_PREFIX" "$slug" "$spec_dir")"
          fi
          if [ "$meta_identity_ok" = "true" ]; then
            issue="$meta_issue"
          else
            meta_stage=""
          fi
        fi

        if [ -z "$issue" ]; then
          echo "No lifecycle issue destination could be resolved for head branch '$HEAD_BRANCH' — this run will be reported against its own run URL only." >> "$GITHUB_STEP_SUMMARY"
        fi

        # Coexistence check (specs/024 research.md, FR-024): whether a
        # stage:stalled label is already on the lifecycle issue, read now --
        # always at or after the inspected run started, satisfying the "as
        # of a time at or before this watchdog run started" bound.
        stalled_label=false
        if [ -n "$issue" ]; then
          stalled_label="$(gh issue view "$issue" --json labels --jq '[.labels[].name] | index("stage:stalled") != null' 2>/dev/null || echo false)"
        fi

        {
          echo "slug=$slug"
          echo "slug-source=$slug_source"
          echo "spec-dir=$spec_dir"
          echo "lifecycle-issue=$issue"
          echo "meta-stage=$meta_stage"
          echo "stalled-label=$stalled_label"
        } >> "$GITHUB_OUTPUT"

    # #266 -- see the header. Reuses the record the slug fallback above
    # already downloaded when it ran; otherwise downloads it here, under the
    # default token (Actions:read -- header). Best-effort like the step
    # above: a missing/expired artifact or a failed download yields an empty
    # stage, never a failed job.
    - name: Resolve inspected run's stage
      id: stage
      shell: bash
      env:
        ACTIONS_TOKEN: ${{ inputs.actions-token }}
        RUN_ID: ${{ inputs.run-id }}
      run: |
        set -uo pipefail
        mr_dir="$RUNNER_TEMP/spec-slug-metrics-record"
        mkdir -p "$mr_dir" 2>/dev/null || true
        if [ -z "$(find "$mr_dir" -type f -name '*.json' 2>/dev/null)" ] && [ -n "$RUN_ID" ]; then
          # A genuine not-found (gh's own phrasings, as collect-execution-
          # output classifies them) is a run that left no record; any other
          # failure (permission, network, rate limit) is worth a warning,
          # because its denials then key on stage `unknown`. Never a step
          # failure either way.
          if ! GH_TOKEN="$ACTIONS_TOKEN" gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -p 'metrics-record*' -D "$mr_dir" >"$RUNNER_TEMP/stage-mr-dl.log" 2>&1; then
            grep -qiE "no artifact|no valid artifacts|no artifacts" "$RUNNER_TEMP/stage-mr-dl.log" 2>/dev/null \
              || echo "::warning::record-stage: metrics-record download for run $RUN_ID failed ($(tr -d '\n' < "$RUNNER_TEMP/stage-mr-dl.log" | head -c 200)) -- this run's denials key on stage 'unknown'."
          fi
        fi
        # First record, in sorted path order, that names a stage. Sanitised
        # before it reaches GITHUB_OUTPUT: the value becomes part of a
        # signal identity, so it must be one token and stable in case.
        record_stage=""
        while IFS= read -r rec; do
          s="$(jq -r '.stage // empty | strings' "$rec" 2>/dev/null || true)"
          s="$(printf '%s' "$s" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9._-')"
          if [ -n "$s" ]; then record_stage="$s"; break; fi
        done < <(find "$mr_dir" -type f -name '*.json' 2>/dev/null | sort)
        if [ -z "$record_stage" ]; then
          echo "stage: no metrics record of run ${RUN_ID:-?} names a stage -- the inspected run's stage is unresolved." >> "$GITHUB_STEP_SUMMARY"
        fi
        echo "record-stage=$record_stage" >> "$GITHUB_OUTPUT"

    # #750 (R1/R2) -- the one site the FR-012 gate permits a reference
    # display name to gate behavior. Runs only when the step above left
    # record-stage empty; maps inputs.run-name through the fixed
    # data-model.md table so every FR-002 consumer can read one
    # resolved-stage output instead of matching a display name itself.
    # Wing Commander · 8 watchdog IS included (maintainer review, fold
    # leg-3): the only watchdog record (metrics-record-diagnose) is written
    # when diagnose runs, so a clean or early-failed watchdog run leaves
    # record-stage empty and must still resolve here, or the self-dispatch
    # cap guard (Self-dispatch depth's if:) and four collectors skip
    # unresolved for every such run.
    - name: Resolve inspected run's stage from its display name, when the record left it unresolved
      id: name-fallback
      shell: bash
      env:
        RECORD_STAGE: ${{ steps.stage.outputs.record-stage }}
        RUN_NAME: ${{ inputs.run-name }}
      run: |
        set -uo pipefail
        name_stage=""
        if [ -z "$RECORD_STAGE" ]; then
          case "$RUN_NAME" in
            "Wing Commander · 1 intake")        name_stage="intake" ;;
            "Wing Commander · 2 clarify")       name_stage="clarify" ;;
            "Wing Commander · 3 plan")          name_stage="plan" ;;
            "Wing Commander · 4 tasks")         name_stage="tasks" ;;
            "Wing Commander · 5 implement")     name_stage="implement" ;;
            "Wing Commander · 6 finalize")      name_stage="finalize" ;;
            "Wing Commander · 7 cleanup")       name_stage="cleanup" ;;
            "Wing Commander · rebase")          name_stage="rebase" ;;
            "Wing Commander · 8 watchdog")      name_stage="watchdog" ;;
            "Wing Commander · 9 pr conversation") name_stage="pr-conversation" ;;
          esac
        fi
        resolved_stage="$RECORD_STAGE"
        resolved_stage_source=""
        if [ -n "$resolved_stage" ]; then
          resolved_stage_source="record"
        elif [ -n "$name_stage" ]; then
          resolved_stage="$name_stage"
          resolved_stage_source="name"
        fi
        {
          echo "resolved-stage=$resolved_stage"
          echo "resolved-stage-source=$resolved_stage_source"
        } >> "$GITHUB_OUTPUT"
