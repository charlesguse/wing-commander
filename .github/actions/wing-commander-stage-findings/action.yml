    # This spec's own in-flight defects, listed on its lifecycle issue as
    # one checklist comment (prepare's in_flight()). A finding whose marker
    # is already in a bot comment there is not posted again, so a re-run
    # stage (implement's converge cycles) does not repeat itself. It is a
    # header plus a list, not the one-line item
    # wing-commander-outstanding-task-item posts, so it composes its own body.
    - name: Post in-flight findings to the lifecycle issue
      id: post-in-flight
      if: steps.gate.outputs.do-run == 'true' && steps.prepare.outputs.lifecycle-count != '' && steps.prepare.outputs.lifecycle-count != '0' && inputs.lifecycle-issue-number != ''
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        ISSUE_NUMBER: ${{ inputs.lifecycle-issue-number }}
        ITEMS_FILE: ${{ steps.prepare.outputs.lifecycle-items-file }}
        HEADER: ${{ steps.prepare.outputs.lifecycle-header }}
        STATE_FILE: ${{ runner.temp }}/wc-stage-findings/state.json
      run: |
        set -uo pipefail
        count="$(jq 'length' "$ITEMS_FILE")"
        fail() {
          # FR-022: never fails the stage. The finding text is already in
          # the step summary through .notes; the count moves to dropped (API).
          echo "::warning::wing-commander-stage-findings: $1 -- $count in-flight finding(s) not posted to lifecycle issue #$ISSUE_NUMBER; see the step summary for the finding text."
          tmp="$(mktemp "${RUNNER_TEMP:-/tmp}/wc-sf-inflight.XXXXXX")"
          jq --argjson n "$count" '.routed_to_lifecycle -= $n | .dropped_api_failure += $n | .notes += ["the in-flight findings above could not be posted to the lifecycle issue"]' \
            "$STATE_FILE" > "$tmp" && mv "$tmp" "$STATE_FILE"
          exit 0
        }
        # The bodies go through a file: one --arg is capped at 128 KiB, and
        # a long lifecycle thread passes that. An item counts as posted
        # only when its marker is a whole line directly under an unchecked
        # box. A marker quoted inside some other line is not one, and a
        # line a maintainer checked off is fixed, so the same defect seen
        # again is posted again.
        existing_file="$(mktemp "${RUNNER_TEMP:-/tmp}/wc-sf-inflight-existing.XXXXXX")"
        if ! gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" --paginate \
            --jq '.[] | select(.user.type == "Bot") | .body' > "$existing_file"; then
          fail "reading the lifecycle issue's comments failed"
        fi
        fresh="$(jq -c --rawfile existing "$existing_file" '
          ($existing | split("\n") | map(rtrimstr("\r"))) as $lines
          | [.[] | select(.marker as $m
              | [range(1; $lines | length) | select($lines[.] == $m and ($lines[. - 1] | startswith("- [ ] ")))]
              | length == 0)]' "$ITEMS_FILE")" \
          || fail "filtering already-posted findings failed"
        already=$(( count - $(jq 'length' <<<"$fresh") ))
        if [ "$already" -gt 0 ]; then
          tmp="$(mktemp "${RUNNER_TEMP:-/tmp}/wc-sf-inflight.XXXXXX")"
          jq --argjson n "$already" '.routed_to_lifecycle -= $n | .appended += $n' "$STATE_FILE" > "$tmp" && mv "$tmp" "$STATE_FILE"
        fi
        count="$(jq 'length' <<<"$fresh")"
        [ "$count" -gt 0 ] || exit 0
        body_file="$(mktemp "${RUNNER_TEMP:-/tmp}/wc-sf-inflight-body.XXXXXX")"
        { printf '%s\n\n' "$HEADER"; jq -r '.[] | .line + "\n" + .marker' <<<"$fresh"; } > "$body_file"
