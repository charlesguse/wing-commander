# The stage-found defect filing idiom, in one home (specs/056-stage-found-
# defect-filing, research.md D10): each of the six published stage
# workflows calls this once, after its own deterministic read-back, to
# turn an agent's structured finding proposal into a filed (or
# cross-linked) GitHub issue -- never the agent itself (Constitution
# Principle IX). See contracts/wing-commander-stage-findings.md.
#
# Pipeline, in order: enable check -> extract raw findings per channel
# shape (fenced-block or structured-array) -> validate each against
# .github/schemas/stage-finding.schema.json -> drop spec-document errata
# and route this spec's own in-flight defects to one lifecycle-issue
# comment (board reset of 2026-10-01) -> cap survivors -> per
# survivor, fingerprint + compose body + report through
# wing-commander-durable-failure-issue (dedup by a marker embedded in the
# issue body) -> cross-link onto the lifecycle issue via
# wing-commander-outstanding-task-item -> emit a summary. Every step after
# "extract" that can fail (a bad gh call, a malformed proposal) is caught
# locally; this composite always exits 0 (FR-022) -- the calling stage's
# own `continue-on-error: true` on its "File findings from this run" step
# is a second, redundant safety net, never the only one.
#
# STATIC 3-SLOT UNROLLING: GitHub Actions composite actions cannot invoke
# a dynamically-sized list of nested `uses:` steps -- there is no loop
# construct for steps, only a fixed list evaluated at parse time. Calling
# wing-commander-durable-failure-issue (a nested composite, itself the
# single home for the dedup/create/comment idiom -- re-implementing that
# logic inline here would be exactly the second copy FR-016/FR-032 forbid)
# once per surviving finding therefore means a fixed number of repeated
# report/record/cross-link step groups, gated by `if:` on whether that
# slot has a survivor. Three slots are provided, matching the Assumptions
# section's default cap of 3; `cap` is clamped to 3 in the "prepare" step
# regardless of what a caller configures, and the clamp is recorded in the
# run summary rather than silently dropping the excess.
name: wing-commander-stage-findings
description: >
  Validates, dedups, caps, files, and cross-links the findings a stage's
  agent proposed during its own run -- deterministic code decides what
  gets filed, never the agent.

inputs:
  token:
    description: The pipeline's existing GitHub App identity token (FR-028)
    required: true
  stage:
    description: One of intake, clarify, plan, tasks, implement, finalize
    required: true
  enabled:
    description: Wired from the stage's own findings-filing-enabled input
    required: true
  channel-mode:
    description: fenced-block | structured-array
    required: true
  execution-output-path:
    description: Path to claude-execution-output.json; required when channel-mode is fenced-block
    required: false
    default: ""
  findings-json:
    description: The stage's own already-parsed findings array (or [] / absent), as a JSON string; required when channel-mode is structured-array
    required: false
    default: ""
  spec-dir:
    description: e.g. specs/056-stage-found-defect-filing, for the attribution line
    required: true
  run-url:
    description: This run's URL, for the attribution line and dedup comments
    required: true
  lifecycle-issue-number:
    description: Empty when the run has no lifecycle issue (FR-019)
    required: false
    default: ""
  label-prefix:
    description: Wired from findings-label-prefix
    required: false
    default: "found-by"
  cap:
    description: Wired from findings-cap (clamped to 3 -- see this file's own header comment)
    required: false
    default: "3"
  finding-kind:
    description: >-
      defect | routed-task (specs/090-stage-write-boundary §5). defect
      (default) reproduces this composite's pre-existing rendered text
      byte-for-byte. routed-task swaps the recap phrases and
      label-description to describe work outside the stage's write
      boundary rather than a defect -- no other input, output, the
      fingerprint formula, the cap, or the dedup call changes for either
      kind.
    required: false
    default: "defect"

outputs:
  filed:
    description: Count of findings that resulted in a new issue
    value: ${{ steps.summary.outputs.filed }}
  appended:
    description: Count routed to an already-open issue
    value: ${{ steps.summary.outputs.appended }}
  dropped-malformed:
    description: Count that failed schema validation
    value: ${{ steps.summary.outputs.dropped-malformed }}
  dropped-cap:
    description: Count dropped for exceeding the per-run cap
    value: ${{ steps.summary.outputs.dropped-cap }}
  dropped-api-failure:
    description: Count that could not be filed due to an API error
    value: ${{ steps.summary.outputs.dropped-api-failure }}
  summary:
    description: A markdown block for FR-020/FR-021, also folded into the step summary
    value: ${{ steps.summary.outputs.summary }}

runs:
  using: composite
  steps:
    - name: Check whether filing is enabled for this stage
      id: gate
      shell: bash
      env:
        ENABLED: ${{ inputs.enabled }}
        STATE_FILE: ${{ runner.temp }}/wc-stage-findings/state.json
      run: |
        set -uo pipefail
        mkdir -p "$(dirname "$STATE_FILE")"
        if [ "$ENABLED" = "true" ]; then
          echo "do-run=true" >> "$GITHUB_OUTPUT"
        else
          echo "do-run=false" >> "$GITHUB_OUTPUT"
          cat > "$STATE_FILE" <<'EOF'
        {"disabled": true, "proposed": 0, "dropped_malformed": [], "dropped_cap": 0, "dropped_spec_errata": 0, "routed_to_lifecycle": 0, "filed": 0, "appended": 0, "dropped_api_failure": 0, "outstanding_skipped": 0, "notes": []}
        EOF
        fi

    # Extraction (D2/D3) -> validation (verify-stage-finding-schema.py) ->
    # cap (D11) -> fingerprint (D6) -> body compose (data-model.md), all in
    # one deterministic pass so the report steps below only need to read
    # this step's own outputs. No `gh`/network calls happen here.
    - name: Extract, validate, cap, and prepare findings
      id: prepare
      if: steps.gate.outputs.do-run == 'true'
      continue-on-error: true
      shell: bash
      env:
        STAGE: ${{ inputs.stage }}
        SPEC_DIR: ${{ inputs.spec-dir }}
        RUN_URL: ${{ inputs.run-url }}
        LABEL_PREFIX: ${{ inputs.label-prefix }}
        CHANNEL_MODE: ${{ inputs.channel-mode }}
        CAP: ${{ inputs.cap }}
        FINDINGS_JSON: ${{ inputs.findings-json }}
        EXECUTION_OUTPUT_PATH: ${{ inputs.execution-output-path }}
        OUT_DIR: ${{ runner.temp }}/wc-stage-findings
        STATE_FILE: ${{ runner.temp }}/wc-stage-findings/state.json
        LIFECYCLE_ISSUE_NUMBER: ${{ inputs.lifecycle-issue-number }}
      run: |
        set -uo pipefail
        mkdir -p "$OUT_DIR"
        python3 - <<'PYEOF'
        import importlib.util
        import json
        import os
        import re
        import subprocess
        import secrets
        import subprocess

        _schema_validator = os.path.join(
            os.environ["GITHUB_ACTION_PATH"], "..", "..", "scripts",
            "verify-stage-finding-schema.py")
        _spec = importlib.util.spec_from_file_location(
            "verify_stage_finding_schema", _schema_validator)
        _vsfs = importlib.util.module_from_spec(_spec)
        _spec.loader.exec_module(_vsfs)
        validate_finding = _vsfs.validate_finding

        STAGE = os.environ["STAGE"]
        SPEC_DIR = os.environ["SPEC_DIR"]
        LIFECYCLE_ISSUE_NUMBER = os.environ.get("LIFECYCLE_ISSUE_NUMBER", "").strip()
        RUN_URL = os.environ["RUN_URL"]
        LABEL_PREFIX = os.environ["LABEL_PREFIX"]
        CHANNEL_MODE = os.environ["CHANNEL_MODE"]
        OUT_DIR = os.environ["OUT_DIR"]
        STATE_FILE = os.environ["STATE_FILE"]
        MAX_SLOTS = 3

        notes = []

        def load_raw_findings():
            if CHANNEL_MODE == "structured-array":
                raw = os.environ.get("FINDINGS_JSON", "")
                if not raw.strip():
                    return []
                try:
                    parsed = json.loads(raw)
                except ValueError:
                    notes.append("findings-json was not valid JSON; treated as zero findings.")
                    return []
                if not isinstance(parsed, list):
                    notes.append("findings-json was not a JSON array; treated as zero findings.")
                    return []
                return parsed
            path = os.environ.get("EXECUTION_OUTPUT_PATH", "")
            if not path or not os.path.isfile(path):
                notes.append("execution-output-path was missing or unreadable; treated as zero findings.")
                return []
            try:
                with open(path, encoding="utf-8") as fh:
                    transcript = json.load(fh)
            except ValueError:
                notes.append("execution-output-path did not contain valid JSON; treated as zero findings.")
                return []
            entries = transcript if isinstance(transcript, list) else [transcript]
            result_entries = [e for e in entries if isinstance(e, dict) and e.get("type") == "result"]
            if not result_entries:
                notes.append("no type==result entry in the transcript; treated as zero findings.")
                return []
            text = result_entries[-1].get("result") or ""
            m = re.search(r"```wing-commander-findings\s*\n(.*?)```", text, re.S)
            if not m:
                return []
            try:
                parsed = json.loads(m.group(1))
            except ValueError:
                notes.append("the wing-commander-findings fenced block was not valid JSON; treated as zero findings.")
                return []
            if not isinstance(parsed, list):
                notes.append("the wing-commander-findings fenced block was not a JSON array; treated as zero findings.")
                return []
            return parsed

        raw = load_raw_findings()
        proposed = len(raw)

        def is_spec_doc_path(path):
            # A path under the repository's specs/ tree, read the way
            # evidence.file_paths is (relative to the checkout), with a
            # leading "./" tolerated -- except specs/*/contracts/, which
            # gates read and which are fixed like code (CLAUDE.md).
            norm = str(path).strip().replace("\\", "/")
            while norm.startswith("./"):
                norm = norm[2:]
            parts = norm.split("/")
            if len(parts) >= 3 and parts[0] == "specs" and parts[2] == "contracts":
                return False
            return parts[0] == "specs" and len(parts) > 1

        def is_spec_errata(finding):
            # A finding whose every cited file -- evidence and fingerprint
            # anchor alike -- is a spec document (spec.md, plan.md,
            # tasks.md, research.md, quickstart.md, ...) is spec errata, not
            # a defect: the stage that wrote those documents corrects its
            # own in the same run, and a merged spec's documents are
            # historical records that are never fixed (CLAUDE.md). Filing
            # them was most of what this composite opened before the
            # 2026-10-01 board reset. A finding citing any file outside
            # specs/, or a live contract under specs/*/contracts/, still
            # files.
            paths = list(finding["evidence"]["file_paths"])
            paths.append(finding["fingerprint_basis"]["file_path"])
            return all(is_spec_doc_path(p) for p in paths)

        def _norm(path):
            norm = str(path).strip().replace("\\", "/")
            while norm.startswith("./"):
                norm = norm[2:]
            return norm

        def _branch_changed_paths():
            # The files this checkout changed against the default branch:
            # committed on the lifecycle's branch or still in the working
            # tree. The default branch is read from git (a composite takes
            # no event facts, constitution VII): origin/HEAD when the
            # checkout set it, else origin/main, else origin/master. Any
            # git failure (no history, none of those refs) returns None,
            # and nothing is treated as in flight.
            try:
                base_ref = None
                for ref in ("origin/HEAD", "origin/main", "origin/master"):
                    probe = subprocess.run(["git", "rev-parse", "--verify", "--quiet", ref + "^{commit}"],
                                           capture_output=True, text=True, timeout=60)
                    if probe.returncode == 0:
                        base_ref = ref
                        break
                if base_ref is None:
                    return None
                base = subprocess.run(["git", "merge-base", base_ref, "HEAD"],
                                      capture_output=True, text=True, timeout=60)
                if base.returncode != 0 or not base.stdout.strip():
                    return None
                diff = subprocess.run(["git", "diff", "--name-only", base.stdout.strip()],
                                      capture_output=True, text=True, timeout=60)
            except (OSError, subprocess.SubprocessError):
                return None
            if diff.returncode != 0:
                return None
            return {_norm(line) for line in diff.stdout.splitlines() if line.strip()}

        BRANCH_CHANGED = None

        def in_flight(finding):
            # A defect in this spec's own in-flight change belongs on its
            # lifecycle thread, where its final PR's review sees it, not on
            # the board as an issue of its own (the board reset of
            # 2026-10-01: #894-#897 were this shape). "Its own change" is
            # decided from git, never from prose: the finding cites this
            # spec's directory AND its anchor -- the file the defect is in
            # -- is a file this lifecycle's branch changed. A file the spec
            # only runs or reads (its tasks.md names run-local-gates.py in
            # most specs) is main's, so a bug there files on the board as
            # usual and is never lost when the lifecycle issue closes.
            # Without a lifecycle issue there is nowhere to put it.
            global BRANCH_CHANGED
            own = SPEC_DIR.rstrip("/")
            if not (LIFECYCLE_ISSUE_NUMBER and own):
                return False
            paths = [_norm(p) for p in finding["evidence"]["file_paths"]]
            paths.append(_norm(finding["fingerprint_basis"]["file_path"]))
            if not any(p == own or p.startswith(own + "/") for p in paths):
                return False
            if BRANCH_CHANGED is None:
                BRANCH_CHANGED = _branch_changed_paths() or set()
            return _norm(finding["fingerprint_basis"]["file_path"]) in BRANCH_CHANGED

        survivors = []
        in_flight_findings = []
        dropped_malformed = []
        dropped_spec_errata = 0
        for item in raw:
            ok, reason = validate_finding(item)
            if not ok:
                dropped_malformed.append(reason)
                notes.append("dropped (malformed): {0}".format(reason))
            elif is_spec_errata(item):
                dropped_spec_errata += 1
                notes.append("dropped (spec errata, fix in the spec's own PR): {0}".format(
                    item.get("title", "(untitled)")))
            elif in_flight(item):
                in_flight_findings.append(item)
            else:
                survivors.append(item)

        try:
            cap_val = int(os.environ.get("CAP", "3"))
        except ValueError:
            cap_val = 3
        effective_cap = min(cap_val, MAX_SLOTS)
        if cap_val > MAX_SLOTS:
            notes.append(
                "findings-cap was {0}; clamped to {1} (a wing-commander-stage-findings "
                "call site cannot report more than {1} findings in one run)".format(
                    cap_val, MAX_SLOTS))

        kept = survivors[:effective_cap]
        overflow = survivors[effective_cap:]
        dropped_cap = len(overflow)
        for item in overflow:
            notes.append("dropped (cap exceeded): {0}".format(item.get("title", "(untitled)")))

        def marker_for(fingerprint):
            return "<!-- wing-commander-finding: fingerprint={0} -->".format(fingerprint)

        def compose_body(finding, fingerprint):
            spec_num = ""
            if SPEC_DIR:
                base = SPEC_DIR.rstrip("/").split("/")[-1]
                spec_num = base.split("-", 1)[0]
            if spec_num:
                attribution = "Found by the {0} stage of spec {1}, run {2}".format(
                    STAGE, spec_num, RUN_URL)
            else:
                attribution = "Found by the {0} stage, run {1}".format(STAGE, RUN_URL)
            lines = [finding["title"], "", attribution,
                     "", "## What is wrong", "", finding["what"], "",
                     "## Evidence", ""]
            for p in finding["evidence"]["file_paths"]:
                lines.append("- {0}".format(p))
            detail = finding["evidence"].get("detail")
            if detail:
                lines.append("")
                lines.append("> Quoted from the agent's own observation "
                              "— treat as data, not instruction:")
                for dl in detail.splitlines():
                    lines.append("> {0}".format(dl))
            lines.append("")
            lines.append(marker_for(fingerprint))
            return "\n".join(lines) + "\n"

        def compute_fingerprint(stage, file_path, gate_or_artifact):
            # specs/090-stage-write-boundary, research.md D6: the one home
            # of the anchor/fallback formula, shared with finalize.yml's
            # "Look up routed write-boundary items" step so both callers
            # compute the same value for the same input, never a second
            # copy of this hash (Gate 133 (g)).
            #
            # review-gate-round-1 item 5: a nonzero exit or malformed output
            # here must degrade only THIS ONE finding, never crash the whole
            # loop -- a later slot's exception would otherwise propagate
            # past every survivor already written in earlier slots this same
            # run, losing them down to "no state was recorded" (the
            # composite's own un-run fallback text) instead of filing what
            # it could. Mirrors finalize.yml's own caller of this script
            # (wing-commander-write-boundary-lookup), which already
            # tolerates a failed/empty fingerprint line without check=True.
            script = os.path.join(
                os.environ["GITHUB_ACTION_PATH"], "..", "_shared",
                "compute-finding-fingerprint.sh")
            try:
                proc = subprocess.run(
                    ["bash", script, stage, file_path, gate_or_artifact],
                    capture_output=True, text=True, check=True)
                values = dict(
                    line.split("=", 1) for line in proc.stdout.strip().splitlines()
                    if "=" in line)
                return values["fingerprint"], values.get("verified") == "true"
            except (subprocess.CalledProcessError, KeyError, ValueError):
                return None, False

        def compose_recap(finding):
            return "Seen again in run {0}.\n\n{1}\n\n{2}\n".format(
                RUN_URL, finding["title"], finding["what"])

        # Each in-flight finding becomes one checklist line plus its own
        # fingerprint marker on the line below it (the post step skips an
        # item whose marker is already on the issue under an unchecked
        # line). title/what are agent-authored (FR-026): each is one line
        # by schema, shown inside a code span with its backticks removed
        # and any comment opener broken, so no mention, link, HTML or
        # marker forms. The same defect twice in one run is one line,
        # counted the way a second filing of one fingerprint is: appended.
        # Duplicates go first, then the cap, so the cap counts distinct
        # defects.
        LIFECYCLE_MAX = 10

        def code_span(text, limit):
            text = " ".join(str(text).replace("`", "'").replace("<!--", "<! --").split())
            if len(text) > limit:
                text = text[:limit - 3].rstrip() + "..."
            return "`{0}`".format(text) if text else "`(empty)`"

        distinct = []
        seen_markers = set()
        appended_in_run = 0
        for item in in_flight_findings:
            basis = item["fingerprint_basis"]
            fp, _verified = compute_fingerprint(
                STAGE, basis["file_path"], basis["gate_or_artifact"])
            if fp is None:
                # review-gate-round-3: a failed fingerprint must drop only
                # this finding, never collide with another failed finding's
                # equally-None fingerprint onto one shared "fingerprint=None"
                # marker (which would silently treat the second as a
                # duplicate of the first, mirroring the survivors loop's own
                # `if fp is None` guard below).
                reason = "fingerprint computation failed for \"{0}\"".format(
                    item.get("title", "(untitled)"))
                notes.append("dropped (malformed, in-flight): {0}".format(reason))
                continue
            marker = marker_for(fp)
            if marker in seen_markers:
                appended_in_run += 1
                notes.append("same defect as an earlier in-flight finding this run: {0}".format(
                    item.get("title", "(untitled)")))
                continue
            seen_markers.add(marker)
            distinct.append((item, marker))
        for item, _marker in distinct[LIFECYCLE_MAX:]:
            dropped_cap += 1
            notes.append("dropped (cap exceeded, in-flight): {0}".format(item.get("title", "(untitled)")))

        lifecycle_items_path = os.path.join(OUT_DIR, "lifecycle-items.json")
        items = []
        for item, marker in distinct[:LIFECYCLE_MAX]:
            items.append({
                "line": "- [ ] {0} — {1}".format(code_span(item["title"], 200), code_span(item["what"], 600)),
                "marker": marker,
            })
            notes.append("listed for the lifecycle issue (a defect in this spec's own change): {0}: {1}".format(
                item.get("title", "(untitled)"), item.get("what", "")))
        with open(lifecycle_items_path, "w", encoding="utf-8") as fh:
            json.dump(items, fh)
        lifecycle_header = ("The {0} stage found defect(s) in this spec's own change ([run]({1})). "
                            "They are listed here instead of filed as issues: fix them in this "
                            "spec's PR.".format(STAGE, RUN_URL))

        outputs = [("survivor-count", str(len(kept))),
                   ("lifecycle-count", str(len(items))),
                   ("lifecycle-items-file", lifecycle_items_path),
                   ("lifecycle-header", lifecycle_header)]
        for i in range(MAX_SLOTS):
            if i < len(kept):
                finding = kept[i]
                basis = finding["fingerprint_basis"]
                # #569: the fingerprint's gate_or_artifact segment is only
                # ever the agent's own normalized wording when that wording
                # is checked against the named file's content (anchor
                # verifies); otherwise the finding is keyed under the
                # fallback shape (data-model.md "Fingerprint", both shapes)
                # rather than trusting agent prose directly into the key.
                fp, verified = compute_fingerprint(
                    STAGE, basis["file_path"], basis["gate_or_artifact"])
                if fp is None:
                    # review-gate-round-1 item 5: compute-finding-
                    # fingerprint.sh itself failed for this finding --
                    # degrade only this slot, never the whole run.
                    reason = "fingerprint computation failed for \"{0}\"".format(
                        finding["title"])
                    dropped_malformed.append(reason)
                    notes.append("dropped (malformed): {0}".format(reason))
                    outputs.append(("survivor-{0}-present".format(i), "false"))
                    continue
                if not verified:
                    notes.append(
                        "anchor unverifiable for \"{0}\": \"{1}\" was not "
                        "found (verbatim, normalized) in {2}; keyed via the "
                        "fallback route rather than dropped.".format(
                            finding["title"], basis["gate_or_artifact"],
                            basis["file_path"]))
                marker = marker_for(fp)
                label = "{0}:{1}".format(LABEL_PREFIX, STAGE)
                body_path = os.path.join(OUT_DIR, "body-{0}.md".format(i))
                recap_path = os.path.join(OUT_DIR, "recap-{0}.md".format(i))
                with open(body_path, "w", encoding="utf-8") as fh:
                    fh.write(compose_body(finding, fp))
                with open(recap_path, "w", encoding="utf-8") as fh:
                    fh.write(compose_recap(finding))
                outputs += [
                    ("survivor-{0}-present".format(i), "true"),
                    ("survivor-{0}-title".format(i), finding["title"]),
                    ("survivor-{0}-what".format(i), finding["what"]),
                    ("survivor-{0}-marker".format(i), marker),
                    ("survivor-{0}-label".format(i), label),
                    ("survivor-{0}-body-file".format(i), body_path),
                    ("survivor-{0}-recap-file".format(i), recap_path),
                ]
            else:
                outputs.append(("survivor-{0}-present".format(i), "false"))

        state = {
            "disabled": False,
            "proposed": proposed,
            "dropped_malformed": dropped_malformed,
            "dropped_cap": dropped_cap,
            "dropped_spec_errata": dropped_spec_errata,
            "routed_to_lifecycle": len(items),
            "filed": 0,
            "appended": appended_in_run,
            "dropped_api_failure": 0,
            "outstanding_skipped": 0,
            "notes": notes,
        }
        with open(STATE_FILE, "w", encoding="utf-8") as fh:
            json.dump(state, fh)

        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
            for key, value in outputs:
                if "\n" in value:
                    # A delimiter derived from the key name is guessable by
                    # whatever produced `value` -- and title/what are
                    # agent-authored (FR-026: treat as data, not
                    # instruction). A value containing that guessed
                    # delimiter on a line of its own would terminate the
                    # heredoc early and let the following line(s) be parsed
                    # as forged key=value output pairs (e.g. overriding a
                    # later survivor's body-file). A fresh random delimiter
                    # per write cannot be predicted in advance, closing that
                    # off regardless of what any single finding's text says.
                    delim = "WC_SF_EOF_{0}".format(secrets.token_hex(16))
                    fh.write("{0}<<{1}\n{2}\n{1}\n".format(key, delim, value))
                else:
                    fh.write("{0}={1}\n".format(key, value))
        PYEOF

    - name: Report finding 0
      id: report-0
      if: steps.gate.outputs.do-run == 'true' && steps.prepare.outputs.survivor-0-present == 'true'
      continue-on-error: true
      uses: ./.wing-commander-pipeline/.github/actions/wing-commander-durable-failure-issue
      with:
        token: ${{ inputs.token }}
        operation: report
        label: ${{ steps.prepare.outputs.survivor-0-label }}
        label-color: "5319E7"
        # Under 100 characters for every stage name: GitHub caps a label
        # description at 100, and the sentence this shipped with ran 104-109,
        # so `gh label create` returned HTTP 422 on first use and no
        # found-by:* label could ever be created (#422). The harness
        # measures it for all six stage names. routed-task's text is
        # shorter than tasks.md's own suggested wording ("was assigned
        # work...") because that phrasing runs 102 for the longest stage
        # name ("implement"), over the cap.
