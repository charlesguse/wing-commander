          mkdir -p "$(dirname "$STATE_FILE")"
          cat > "$STATE_FILE" <<'EOF'
        {"disabled": false, "proposed": 0, "dropped_malformed": [], "dropped_cap": 0, "dropped_spec_errata": 0, "routed_to_lifecycle": 0, "filed": 0, "appended": 0, "dropped_api_failure": 0, "outstanding_skipped": 0, "notes": ["wing-commander-stage-findings: no state was recorded for this run (an earlier step in this composite did not complete) — reporting zero findings rather than failing the stage."]}
        EOF
        fi

        disabled="$(jq -r '.disabled' "$STATE_FILE")"
        proposed="$(jq -r '.proposed' "$STATE_FILE")"
        filed="$(jq -r '.filed' "$STATE_FILE")"
        appended="$(jq -r '.appended' "$STATE_FILE")"
        dropped_malformed_count="$(jq -r '.dropped_malformed | length' "$STATE_FILE")"
        dropped_cap="$(jq -r '.dropped_cap' "$STATE_FILE")"
        dropped_api_failure="$(jq -r '.dropped_api_failure' "$STATE_FILE")"
        dropped_spec_errata="$(jq -r '.dropped_spec_errata // 0' "$STATE_FILE")"
        routed_to_lifecycle="$(jq -r '.routed_to_lifecycle // 0' "$STATE_FILE")"

        echo "filed=$filed" >> "$GITHUB_OUTPUT"
        echo "appended=$appended" >> "$GITHUB_OUTPUT"
        echo "dropped-malformed=$dropped_malformed_count" >> "$GITHUB_OUTPUT"
        echo "dropped-cap=$dropped_cap" >> "$GITHUB_OUTPUT"
        echo "dropped-api-failure=$dropped_api_failure" >> "$GITHUB_OUTPUT"

        {
          echo "### wing-commander findings — $STAGE"
          echo ""
          if [ "$disabled" = "true" ]; then
            echo "Filing is disabled for this stage."
          elif [ "$proposed" = "0" ] && [ "$filed" = "0" ] && [ "$appended" = "0" ] && \
               [ "$dropped_malformed_count" = "0" ] && [ "$dropped_cap" = "0" ] && \
               [ "$dropped_api_failure" = "0" ] && [ "$dropped_spec_errata" = "0" ] && \
               [ "$routed_to_lifecycle" = "0" ]; then
            echo "No findings proposed this run."
          else
            echo "- proposed: $proposed"
            echo "- filed: $filed"
            echo "- appended (existing issue): $appended"
            echo "- dropped (malformed): $dropped_malformed_count"
            echo "- dropped (cap exceeded): $dropped_cap"
            echo "- dropped (API failure): $dropped_api_failure"
            echo "- dropped (spec errata): $dropped_spec_errata"
            echo "- routed to the lifecycle issue (in-flight change): $routed_to_lifecycle"
            notes="$(jq -r '.notes[]?' "$STATE_FILE")"
            if [ -n "$notes" ]; then
              echo ""
              echo "$notes" | sed 's/^/- /'
            fi
          fi
        } >> "$GITHUB_STEP_SUMMARY"

        summary_text="$(jq -r '"proposed=\(.proposed) filed=\(.filed) appended=\(.appended) dropped_malformed=\(.dropped_malformed|length) dropped_cap=\(.dropped_cap) dropped_api_failure=\(.dropped_api_failure) dropped_spec_errata=\(.dropped_spec_errata // 0) routed_to_lifecycle=\(.routed_to_lifecycle // 0)"' "$STATE_FILE")"
        {
          echo "summary<<WC_STAGE_FINDINGS_SUMMARY_EOF"
          echo "$summary_text"
          echo "WC_STAGE_FINDINGS_SUMMARY_EOF"
        } >> "$GITHUB_OUTPUT"
