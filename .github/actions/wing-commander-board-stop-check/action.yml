# The kill-switch/stop-request recheck idiom, in one home (issue #462):
# board-loop.yml's six jobs (triage, route, fix, review, readiness, prove)
# each re-check the kill switch AND a maintainer stop request immediately
# before their own next durable action -- triage's decide.outcome, route's
# decide, fix's push, review's next round/converge step, readiness's
# evaluation, prove's close-or-redrive -- not only at job start
# (FR-051/T052). board_stop_check.py's own docstring already calls
# find_stop_request() "the reusable check every job's own... step also
# performs"; this composite is the surrounding gh/bash orchestration
# CLAUDE.md's "Shared logic has exactly one home" section also asks for,
# which the decision function alone never unified.
#
# Two tokens, not one (issue #461) -- see auto-release.yml's
# `dispatch-release` job for the canonical statement of why the App token
# (`token`) cannot do the `gh run cancel` call below and `cancel-token`
# (github.token, needing the caller job's own `permissions.actions:
# write`) must. `initial-paused` and `check-issue-closed` are resolved by
# the caller because a composite `run:` step cannot read the caller's
# `vars` context directly.
name: wing-commander-board-stop-check
description: >
  Re-checks the kill switch and any maintainer stop request on a board-loop
  issue, immediately before a job's own next durable action, and cancels a
  still-running earlier run when one is found.

inputs:
  token:
    description: The wing-commander App token, used for the issue-comment/issue-state reads
    required: true
  cancel-token:
    description: >
      A token with `actions: write` on this repository -- used ONLY for the
      `gh run cancel` call; see this file's own header comment for why it
      must differ from `token`. Defaults to github.token (the caller job's
      own permissions.actions: write is what gives it effect), matching
      wing-commander-metrics-persist's own token input convention -- a
      caller only needs to override this if it has no such token.
    required: false
    default: ${{ github.token }}
  issue-number:
    description: The board item's issue number
    required: true
  bot-login:
    description: >
      The loop's own App login, `<slug>[bot]` -- the caller's
      wing-commander-context `bot-slug` output plus the `[bot]` suffix
      (the same source pr-conversation.yml's stop
      procedure filters its `**Run:**` scan by). Only a `**Run:**` line in a
      comment this Bot posted moves the stop baseline or names a run to
      cancel (issue #547, board_item_marker.is_loop_marker_author()).
    required: true
  initial-paused:
    description: >
      The kill switch's own already-resolved boolean -- the caller's own
      `vars.WING_COMMANDER_BOARD_LOOP_PAUSED == 'true'` comparison,
      evaluated by the caller before this composite is invoked (a
      composite step cannot read the caller's vars context directly).
    required: true
  check-issue-closed:
    description: >
      "true" only for the prove job's extra pre-check: the issue is also
      treated as paused when it is already CLOSED.
    required: false
    default: "false"
  marker-branch:
    description: >
      The item's currently-known branch name (from needs.select.outputs.
      branch), passed through to the stop-point record's marker when a stop
      is honoured (specs/097-recorded-stop-point). Empty for an item with no
      branch yet (triage/route). Inert unless stop-cause resolves to
      "stop-request".
    required: false
    default: ""
  marker-base-sha:
    description: >
      The item's currently-known base commit (from needs.select.outputs.
      base-sha), passed through the same way and under the same condition
      as marker-branch.
    required: false
    default: ""

outputs:
  paused:
    description: "true when this job's next durable action must stand down"
    value: ${{ steps.check.outputs.paused }}
  stop-cause:
    description: >
      One of "" (not standing down), "closed-issue", "kill-switch",
      "stop-request" -- specs/097-recorded-stop-point data-model.md "Stand-down
      cause". paused is unchanged and remains true iff stop-cause != "".
    value: ${{ steps.check.outputs.stop-cause }}

runs:
  using: composite
  steps:
    # Gate 25 (verify-lifecycle-gate-retry.py) hardens this exact "is the
    # issue open" read against the transient-failure case run 31597186484
    # hit with a single bare `gh issue view` attempt (specs/039-lifecycle-
    # gate-retry) -- reused here (issue #462 review) rather than a second,
    # weaker bare read. continue-on-error: the behaviour this replaces
    # already treated a failed read as "not closed, keep going" rather
    # than failing the job; this keeps that same fallback while gaining
    # the retry/timeout hardening lifecycle-gate already has.
    - name: Check whether the issue is already closed
      id: closed-check
      if: inputs.check-issue-closed == 'true'
      continue-on-error: true
      uses: ./.github/actions/wing-commander-lifecycle-gate
      with:
        issue-number: ${{ inputs.issue-number }}
        token: ${{ inputs.token }}

    - name: Re-check kill switch and stop requests before any durable action
      id: check
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        CANCEL_TOKEN: ${{ inputs.cancel-token }}
        ISSUE_NUMBER: ${{ inputs.issue-number }}
        BOT_LOGIN: ${{ inputs.bot-login }}
        INITIAL_PAUSED: ${{ inputs.initial-paused }}
        ISSUE_IS_OPEN: ${{ steps.closed-check.outputs.is-open }}
      run: |
        set -uo pipefail
        gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" --paginate \
          --jq '.[] | {body, author_association, created_at, user: {login: .user.login, type: .user.type}, html_url}' | jq -s '.' \
          > "$RUNNER_TEMP/board-stop-check-comments.json"
        stop_decision_json="$(jq -n --slurpfile comments "$RUNNER_TEMP/board-stop-check-comments.json" \
          --arg run_id "$GITHUB_RUN_ID" --arg bot_login "$BOT_LOGIN" \
          '{comments: $comments[0], current_run_id: $run_id, bot_login: $bot_login}' \
          | python3 -I "$RUNNER_TEMP/wc-pristine/scripts/board_stop_check.py")"
        jq -e '.stand_down | type == "boolean"' >/dev/null <<<"$stop_decision_json" || {
          echo "::error::wing-commander-board-stop-check: could not read a stop decision from board_stop_check.py: $stop_decision_json"
          exit 1
        }
        stand_down="$(jq -r '.stand_down' <<<"$stop_decision_json")"
        cancel_run_id="$(jq -r '.cancel_run_id // empty' <<<"$stop_decision_json")"

        # specs/097-recorded-stop-point, contracts/stop-check-composite.md
        # "Decision order": a single ordered check, evaluated once. A closed
        # issue suppresses recording even when a stop request is also
        # present; a stop request takes priority over the kill switch
        # (FR-012). paused is unchanged in meaning (true iff stop-cause !=
        # "") -- computed independently of the record-write step below, so
        # a later stop check in the same run still reports the right cause
        # even after the record was already written (FR-008).
        if [ "$ISSUE_IS_OPEN" = "false" ]; then
          stop_cause="closed-issue"
        elif [ "$stand_down" = "true" ]; then
          stop_cause="stop-request"
        elif [ "$INITIAL_PAUSED" = "true" ]; then
          stop_cause="kill-switch"
        else
          stop_cause=""
        fi
        if [ -n "$stop_cause" ]; then
          paused=true
        else
          paused=false
        fi

        if [ "$stand_down" = "true" ]; then
          # find_stop_request()'s own contract (Gate 87, mutation-proven)
          # already guarantees cancel_run_id is never this run's own id --
          # this comparison is deliberately redundant defence in depth,
          # kept because `gh run cancel` is not recoverable by retry
          # (issue #461 review).
          if [ -n "$cancel_run_id" ] && [ "$cancel_run_id" != "$GITHUB_RUN_ID" ]; then
            # board-loop.yml's single workflow-level concurrency group
            # (cancel-in-progress: false) serializes every trigger, so a
            # DIFFERENT run that already posted its own marker (this
            # branch) can only be found here after THIS run's own group
            # slot became available -- which requires that other run to
            # already be terminal. `gh run cancel` on a completed run
            # always 409s, so attempting it -- and warning on the
            # "failure" -- would fire on every ordinary stop request
            # rather than signalling anything wrong (issue #465 review).
            # Checked live rather than assumed permanently true: issue
            # #460 is weighing a redrive design that could give a
            # dispatched run its own concurrency group, which would make
            # a genuinely still-running "other run" possible again.
            # `status` is not `queued`/`in_progress` alone -- GitHub also
            # reports `waiting` (held on an environment approval),
            # `requested` and `pending`, none of which are terminal
            # either, and it is not a closed enum this composite should
            # allowlist against. `completed` is the one value that always
            # means "gh run cancel will 409" (peer review of #465, round
            # 2).
            #
            # Target check (issue #547, defence in depth behind
            # find_stop_request()'s bot-authored-marker rule): the run is
            # cancelled only when it is one of THIS workflow's own runs in
            # THIS repository -- its `path` equals this run's own workflow
            # file (GITHUB_WORKFLOW_REF, minus the repo prefix and @ref) --
            # so no marker, however it got there, can aim an `actions:
            # write` token at a release or an unrelated stage. A run that
            # cannot be read (a transient failure, a foreign id) is NOT
            # cancelled: without the path there is no evidence the target
            # is ours, and `paused=true` below still halts this run. The
            # read keeps the cancel-token it has always used (#465): the
            # App token carries no `actions` permission (#461).
            cancel_target_json="$(GH_TOKEN="$CANCEL_TOKEN" gh api "repos/$GITHUB_REPOSITORY/actions/runs/$cancel_run_id" 2>/dev/null || true)"
            cancel_target_status="$(printf '%s' "$cancel_target_json" | jq -r '.status // empty' 2>/dev/null || true)"
            cancel_target_path="$(printf '%s' "$cancel_target_json" | jq -r '.path // empty' 2>/dev/null || true)"
            cancel_target_repo="$(printf '%s' "$cancel_target_json" | jq -r '.repository.full_name // empty' 2>/dev/null || true)"
            own_workflow_path="${GITHUB_WORKFLOW_REF:-}"
            own_workflow_path="${own_workflow_path#"$GITHUB_REPOSITORY"/}"
            own_workflow_path="${own_workflow_path%%@*}"
            if [ -z "$cancel_target_path" ] || [ "${cancel_target_path%%@*}" != "$own_workflow_path" ] || [ "$cancel_target_repo" != "$GITHUB_REPOSITORY" ]; then
              echo "::warning::not cancelling run $cancel_run_id: it is not a readable $own_workflow_path run in $GITHUB_REPOSITORY (path='$cancel_target_path', repository='$cancel_target_repo')"
            elif [ "$cancel_target_status" != "completed" ]; then
              if ! cancel_error="$(GH_TOKEN="$CANCEL_TOKEN" gh run cancel "$cancel_run_id" -R "$GITHUB_REPOSITORY" 2>&1)"; then
                echo "::warning::gh run cancel $cancel_run_id failed: $cancel_error"
              fi
            fi
          fi
        fi
        echo "paused=$paused" >> "$GITHUB_OUTPUT"
        echo "stop-cause=$stop_cause" >> "$GITHUB_OUTPUT"

    # specs/097-recorded-stop-point: the durable consequence of an honoured
    # stop request -- the existing `stalled` marker shape plus board:stalled
    # plus a human-legible comment naming the cause, the specific stop
    # comment, and the release condition (contracts/stop-point-record.md).
    # A kill-switch-only or closed-issue stand-down never reaches this step
    # (FR-011/FR-013). A separate step, not folded into `check` above, so
    # Gate 87's composite-shell harness (which exercises only the `check`
    # step) stays unaffected by this new write path.
    - name: Record the stop point
      id: record-stop-point
      if: steps.check.outputs.stop-cause == 'stop-request'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        ISSUE_NUMBER: ${{ inputs.issue-number }}
        BOT_LOGIN: ${{ inputs.bot-login }}
        MARKER_BRANCH: ${{ inputs.marker-branch }}
        MARKER_BASE_SHA: ${{ inputs.marker-base-sha }}
      run: |
        set -uo pipefail
        # research.md D5/D6: at most one stop-point record per run
        # (FR-007) -- a fresh label read short-circuits a second write,
        # whatever caused board:stalled to already be present (this run's
        # own earlier write, or an unrelated existing stall). Not given
        # continue-on-error: an unreadable label state must not be guessed
        # (unlike the closed-check step's documented exception).
        existing_labels="$(gh issue view "$ISSUE_NUMBER" -R "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name]')" || {
          echo "::error::wing-commander-board-stop-check: could not read issue #$ISSUE_NUMBER's labels -- no stop-point record is posted, so a later run retries the check (FR-017)."
          exit 1
        }
        if jq -e 'index("board:stalled") != null' <<<"$existing_labels" >/dev/null; then
          exit 0
        fi

        # FR-018: identify the winning comment and its reason through the
        # one home board_stop_check.py provides, never a re-derivation of
        # the match/authorization rule in this shell. current_run_id is
        # passed the same way the `check` step above passes it (FR-006/
        # FR-008, maintainer review fold leg-1): without it,
        # find_stop_command_comment() cannot tell this run's own
        # not-yet-posted stop-point record apart from a genuinely earlier
        # run's marker.
        stop_comment_json="$(jq -n --slurpfile comments "$RUNNER_TEMP/board-stop-check-comments.json" \
          --arg run_id "$GITHUB_RUN_ID" --arg bot_login "$BOT_LOGIN" \
          '{comments: $comments[0], current_run_id: $run_id, bot_login: $bot_login}' \
          | python3 -I "$RUNNER_TEMP/wc-pristine/scripts/board_stop_check.py" --stop-comment)"
        html_url="$(jq -r '.html_url // empty' <<<"$stop_comment_json")"
        login="$(jq -r '.login // empty' <<<"$stop_comment_json")"
        created_at="$(jq -r '.created_at // empty' <<<"$stop_comment_json")"
        reason="$(jq -r '.reason // empty' <<<"$stop_comment_json")"

        # FR-018: the label-then-marker write goes through the existing
        # stall helper (add_stalled_label(), and the marker-render routine
        # beside it) verbatim, from the trusted snapshot (FR-018 last
        # sentence; spec 095 FR-011/FR-012) -- never a new implementation.
        marker="$(python3 -I "$RUNNER_TEMP/wc-pristine/scripts/board_item_marker.py" \
          --step stalled --issue "$ISSUE_NUMBER" --add-label "board:stalled" \
          ${MARKER_BRANCH:+--branch "$MARKER_BRANCH"} \
          ${MARKER_BASE_SHA:+--base-sha "$MARKER_BASE_SHA"})" || {
          echo "::error::wing-commander-board-stop-check: board:stalled could not be added to issue #$ISSUE_NUMBER -- no stop-point record is posted, so a later run retries the check (FR-017)."
          exit 1
        }

        reason_block=""
        if [ -n "$reason" ]; then
          reason_block="$(REASON="$reason" python3 -I -c 'import os, sys; sys.path.insert(0, os.path.join(os.environ["RUNNER_TEMP"], "wc-pristine", "scripts")); from board_spec_request_body import fenced_section; print(fenced_section("Reason given:", os.environ["REASON"], 2000))')"
        fi

        # contracts/stop-point-record.md: names the cause, links the
        # specific stop comment with no leading @ (never pings the
        # maintainer), fences the reason (FR-005), states the release
        # condition, and ends with the marker -- simultaneously
        # human-legible and machine-readable (FR-044).
        body="$(printf 'This item stopped because a maintainer posted a stop request.\n\nStop comment: %s (from %s, %s)' "$html_url" "$login" "$created_at")"
        if [ -n "$reason_block" ]; then
          body="$(printf '%s\n\n%s' "$body" "$reason_block")"
        fi
        body="$(printf '%s\n\nTo resume this item, remove the `board:stalled` label.\n\n%s' "$body" "$marker")"

        gh issue comment "$ISSUE_NUMBER" -R "$GITHUB_REPOSITORY" --body "$body" || {
          echo "::error::wing-commander-board-stop-check: could not post the stop-point record comment on issue #$ISSUE_NUMBER (FR-017)."
          exit 1
        }
