# Cross-repo resolution (research.md D3 of specs/010-reusable-pipeline):
# published stage workflows cannot reach this composite by a relative
# `uses:` path — inside a called workflow, `./...` resolves against the
# CALLER's workspace, where this action does not exist. Every stage instead
# checks out the pipeline repository itself, pinned to the exact commit of
# the running workflow file, and references the composite through that
# subdirectory. Verified self-checkout snippet:
#
#   - name: Checkout pipeline repository (shared composite actions)
#     uses: actions/checkout@v5
#     with:
#       repository: ${{ inputs.pipeline-repo }}   # default: the publishing repo
#       ref: ${{ github.job_workflow_sha }}
#       path: .wing-commander-pipeline
#       persist-credentials: false
#
#   - uses: ./.wing-commander-pipeline/.github/actions/wing-commander-context
#
# Consumer re-checkouts that follow the snippet must pass `clean: false` so
# git clean does not delete the untracked .wing-commander-pipeline directory.
# This action itself is relocation-safe: it touches no workspace paths
# (App-token mint + label parse only). wing-commander-metrics-summary reads only
# runner.temp. Audited 2026-07-11 (T003 of specs/010-reusable-pipeline).
#
# board-loop.yml is not a published stage and is not called through this
# composite's pipeline-repo/OIDC mechanism at all -- it resolves its own
# composites the same way, from its own repository at `github.sha`, into
# its own `.wc-pristine-repo` sidecar; see that file's own header for the
# trusted-copy rule it and every other job share
# (specs/086-trusted-composite-resolution).
name: wing-commander-context
description: >
  Shared context for Wing Commander pipeline stages: mints the wing-commander-bot GitHub App
  installation token (so pipeline actions trigger downstream workflows, which
  the default GITHUB_TOKEN cannot) and resolves the spec identity from issue
  labels when provided.

inputs:
  app-id:
    description: GitHub App ID of the wing-commander bot (secrets.WING_COMMANDER_APP_ID)
    required: true
  private-key:
    description: GitHub App private key (secrets.WING_COMMANDER_APP_PRIVATE_KEY)
    required: true
  issue-labels-json:
    description: >
      Optional JSON array of label objects (e.g. toJSON(github.event.issue.labels)).
      When provided, the spec:<NNN-slug> label is parsed into spec outputs.
    required: false
    default: '[]'

outputs:
  token:
    description: Installation token for the wing-commander bot App
    value: ${{ steps.app-token.outputs.token }}
  bot-slug:
    description: The App slug (actor filter form is <slug>[bot])
    value: ${{ steps.app-token.outputs.app-slug }}
  spec-slug:
    description: NNN-slug parsed from the spec:* label (empty if none)
    value: ${{ steps.resolve.outputs.spec_slug }}
  spec-dir:
    description: specs/NNN-slug parsed from the spec:* label (empty if none)
    value: ${{ steps.resolve.outputs.spec_dir }}
  runner-temp:
    description: >
      The runner temp directory as the job's own steps see it ($RUNNER_TEMP,
      read inside the job). Use it wherever a runner.temp path is embedded
      in free text a step consumes, such as an agent prompt.
    value: ${{ steps.paths.outputs.runner_temp }}
  workspace:
    description: >
      The workspace directory as the job's own steps see it
      ($GITHUB_WORKSPACE, read inside the job). The github.workspace
      counterpart of runner-temp.
    value: ${{ steps.paths.outputs.workspace }}

runs:
  using: composite
  steps:
    # Container-side paths -- the canonical comment. In a job with a
    # `container:` (specs/038-runner-container-passthrough), the expressions
    # `${{ runner.temp }}` and `${{ github.workspace }}` evaluate to the HOST
    # paths (/home/runner/work/...), while the container mounts them at
    # /__w/... . The runner rewrites a host path back only where it is the
    # leading part of a whole environment value (a step's `env:` value, or
    # a `with:` input a JavaScript action receives as INPUT_*). It never
    # rewrites a `run:` body or a path in the middle of a value, such as a
    # prompt. A `run:` body reads $RUNNER_TEMP / $GITHUB_WORKSPACE; free text
    # reads these outputs, which hold the in-job values in both container
    # and host jobs. Gate 43's
    # case_container_jobs_use_in_job_paths enforces the rule.
    - name: Resolve in-job runner paths
      id: paths
      shell: bash
      run: |
        echo "runner_temp=$RUNNER_TEMP" >> "$GITHUB_OUTPUT"
        echo "workspace=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"

    - name: Mint wing-commander-bot App token
      id: app-token
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}

    - name: Relay bot token to the job environment
      shell: bash
      env:
        TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        echo "WC_BOT_TOKEN=$TOKEN" >> "$GITHUB_ENV"

    - name: Resolve spec identity from labels
      id: resolve
      shell: bash
      env:
        LABELS_JSON: ${{ inputs.issue-labels-json }}
      run: |
        spec_slug="$(printf '%s' "$LABELS_JSON" | jq -r '[.[].name | select(startswith("spec:"))][0] // "" | sub("^spec:"; "")')"
        echo "spec_slug=$spec_slug" >> "$GITHUB_OUTPUT"
        if [ -n "$spec_slug" ]; then
          echo "spec_dir=specs/$spec_slug" >> "$GITHUB_OUTPUT"
        else
          echo "spec_dir=" >> "$GITHUB_OUTPUT"
        fi
