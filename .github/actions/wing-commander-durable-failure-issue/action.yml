# The durable failure issue idiom, in one home: dedup by label, create if
# absent / comment if present, and close on recovery.
#
# Extracted from auto-release.yml's `report` job (three report sites, one
# close site) and auto-update-spec-kit.yml's four report sites -- both
# workflows look up an open issue by a `<workflow>:failed`-shaped label,
# comment on it if found or create-and-label it if not, and (auto-release
# only) close it when a subsequent run succeeds. See
# specs/049-single-home-release-idioms/contracts/durable-failure-issue.md
# and research.md D4/D5/D6.
#
# `wing-commander-callout`'s comment-rendering stays separate (D6): this
# composite never templates a body itself -- callers that already build
# one via wing-commander-callout keep doing so and simply hand this
# composite the resulting `body-file`.
#
# Promoted out of the internal shared-composites directory and given the
# wing-commander- prefix every other non-underscore composite already
# carries (specs/056-stage-found-defect-filing, research.md D8): a
# published composite is now a second, deliberate caller
# (wing-commander-stage-findings), so this can no longer live under the
# internal path without tripping Gate 60's own promotion-prevention check.
#
# specs/056-stage-found-defect-filing (research.md D7) extends this with
# an opt-in marker/state-scope lookup, used by wing-commander-stage-findings
# to dedup a filed finding by a fingerprint embedded in the issue body
# rather than by label alone. Every existing caller (auto-release.yml,
# auto-update-spec-kit.yml) omits `marker` and sees byte-identical
# behavior -- the branch below only activates when a caller opts in.
#
# That byte-identical promise covers the FAILURE paths too, which is what
# `fail-on-api-error` (default true) is for: catching a `gh` failure
# locally so an opted-in caller can read the outcome must not also mean
# swallowing it for the callers that read nothing and relied on a red job
# as the notification (code review of #423).
name: wing-commander-durable-failure-issue
description: >
  Looks up an open issue by label (optionally narrowed by a body marker);
  on operation "report", comments on it if found or creates (and labels)
  it if not; on operation "close", closes it if found or no-ops if not.

inputs:
  token:
    description: Token to act with (usually GITHUB_TOKEN, scoped to this repository)
    required: true
  operation:
    description: report | close
    required: true
  label:
    description: "The dedup label, e.g. auto-release:failed"
    required: true
  label-color:
    description: Hex color, no leading '#' (matches `gh label create --color`)
    required: true
  label-description:
    description: Label description
    required: true
  title:
    description: Issue title (report only)
    required: false
    default: ""
  body-file:
    description: Path to a file the caller has already written with the issue/comment body (report only)
    required: false
    default: ""
  comment-body-file:
    description: >
      Optional path to a file the caller has already written with a SHORTER
      body to use instead of body-file specifically for the "commented on an
      existing OPEN issue" outcome (report only). Empty (the default) means
      "use body-file for the comment too", today's behavior for every
      caller that predates specs/056-stage-found-defect-filing. Exists
      because a caller cannot know in advance of this one call whether the
      lookup will find an existing open issue or not, so it cannot compose
      a recap-only comment body itself after the fact without this
      composite still being the one place that decides which file to use.
    required: false
    default: ""
  marker:
    description: >
      A literal string (e.g. an HTML-comment fingerprint marker) the lookup
      additionally requires inside a candidate issue's body. Empty (the
      default) means "match on label alone" -- today's behavior.
    required: false
    default: ""
  state-scope:
    description: >
      open | all. Only meaningful when `marker` is set; ignored (label-only
      lookups stay open-scoped) when `marker` is empty.
    required: false
    default: "open"
  close-comment:
    description: Comment to leave when closing (close only)
    required: false
    default: ""
  fail-on-api-error:
    description: >
      true (the default) | false. Decides what a DEGRADED report does --
      one where `gh issue comment` or `gh issue create` failed, the
      outputs below say so (`comment-failed` / `create-failed`), and the
      report the caller asked for never landed. true re-raises it as a
      step failure once the outputs are written; false leaves the step
      green and hands the caller the outcome to read.

      The default is true because the two callers that predate
      specs/056-stage-found-defect-filing -- auto-release.yml's "File or
      update the failure issue" and auto-update-spec-kit.yml's "File or
      update the auto-update:failed issue (rollback)" -- neither read
      `action-taken` nor carry `continue-on-error`. Before the failure
      paths here were caught locally, an API failure turned those jobs
      red, which IS the notification those sites exist to produce;
      swallowing it leaves a green run and no record of the failure the
      site was called to report (code review of #423). Catching a failure
      locally and telling nobody is not the same as tolerating it.

      wing-commander-stage-findings passes false: FR-022 requires it never
      fail its stage, and it does read `action-taken`.
    required: false
    default: "true"

outputs:
  issue-number:
    description: The found-or-created (report) / found-or-none (close) issue number, may be empty
    value: ${{ steps.act.outputs.issue-number }}
  action-taken:
    description: commented | created | created-linked-closed | create-failed | comment-failed | closed | none
    value: ${{ steps.act.outputs.action-taken }}
  matched-closed-issue:
    description: >
      Set only when `marker` matched a closed issue on a "report" operation
      (action-taken=created-linked-closed) -- the closed issue's number, so
      the caller can compose a body line linking it. Empty otherwise.
    value: ${{ steps.act.outputs.matched-closed-issue }}

runs:
  using: composite
  steps:
    - name: Look up, then report or close
      id: act
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        OPERATION: ${{ inputs.operation }}
        LABEL: ${{ inputs.label }}
        LABEL_COLOR: ${{ inputs.label-color }}
        LABEL_DESCRIPTION: ${{ inputs.label-description }}
        TITLE: ${{ inputs.title }}
        BODY_FILE: ${{ inputs.body-file }}
        COMMENT_BODY_FILE: ${{ inputs.comment-body-file }}
        MARKER: ${{ inputs.marker }}
        STATE_SCOPE: ${{ inputs.state-scope }}
        CLOSE_COMMENT: ${{ inputs.close-comment }}
        FAIL_ON_API_ERROR: ${{ inputs.fail-on-api-error }}
      run: |
        set -uo pipefail

        # Set by either report path that failed its API call, read by
        # the fail-on-api-error check at the bottom of this step.
        degraded=""

        if [ -n "$MARKER" ]; then
          scope="$STATE_SCOPE"
          [ "$scope" = "open" ] || [ "$scope" = "all" ] || scope="open"
          # review-gate-round-1 items 3/6: an explicit --limit, since this
          # label accumulates across the repo's whole lifetime (same as
          # wing-commander-write-boundary-lookup's own lookup) -- gh returns
          # 30 issues by default, newest first, so a label past 30 issues
          # lost its older fingerprints and a finding that should have
          # appended filed a duplicate instead (#705); the marker-match jq
          # filter is the one shared script both composites call, which
          # this composite used to paste in full. The `gh issue list` call
          # itself stays INLINE here, never in a _shared/ script -- Gate 12
          # can only resolve a `gh` call's token from the composite step's
          # own env (lint-workflows.yml ~line 1631).
          #
          # This 1000 is independent of watchdog.yml's own `--limit 200`
          # dedup-lookup bound (its "Record or suppress" step, ~line 3469) --
          # different call, different composite, deliberately not the same
          # number -- but if watchdog's own bound ever needs raising for the
          # same truncation-risk reason, check whether this one should move
          # too.
          MATCH_SCRIPT="$GITHUB_ACTION_PATH/../_shared/match-issue-by-marker.sh"
          issues_file="$(mktemp)"
          issues_err="$(mktemp)"
          # review-gate-round-4 item 3: surfaced with ::warning:: rather
          # than silently swallowed, matching wing-commander-write-boundary-
          # lookup's own identical gh issue list call -- a transient gh API
          # error here used to fall back to an empty list unannounced, which
          # risks a silent duplicate issue creation below rather than this
          # composite's own "report" operation finding the existing one.
          if gh issue list --repo "$GITHUB_REPOSITORY" --label "$LABEL" --state "$scope" --json number,url,state,body --limit 1000 > "$issues_file" 2>"$issues_err"; then
            :
          else
            issues_err_text="$(cat "$issues_err")"
            echo "::warning::wing-commander-durable-failure-issue: gh issue list failed for label $LABEL -- $issues_err_text -- treating as no existing issue found this run, which risks a duplicate issue."
            echo "[]" > "$issues_file"
          fi
          match_json="$(bash "$MATCH_SCRIPT" "$issues_file" "$MARKER" 2>/dev/null || true)"
          existing=""
          matched_closed=""
          # review-gate-round-4 item 9: match-issue-by-marker.sh now prints
          # the literal "null" (never an empty line) for "no match", so a
          # multi-marker caller never loses line alignment -- this
          # single-marker caller's own no-match check has to recognize it.
          if [ -n "$match_json" ] && [ "$match_json" != "null" ]; then
            match_state="$(printf '%s' "$match_json" | jq -r '.state')"
            match_number="$(printf '%s' "$match_json" | jq -r '.number')"
            if [ "$match_state" = "OPEN" ] || [ "$match_state" = "open" ]; then
              existing="$match_number"
            else
              matched_closed="$match_number"
            fi
          fi
        else
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$LABEL" --state open --json number --jq '.[0].number // empty' 2>/dev/null || true)"
          matched_closed=""
        fi

        if [ "$OPERATION" = "report" ]; then
          if [ -n "$existing" ]; then
            comment_file="$BODY_FILE"
            [ -n "$COMMENT_BODY_FILE" ] && comment_file="$COMMENT_BODY_FILE"
            # Guarded for the same reason `gh issue create` below is (#422):
            # under the runner's `-e` an unguarded failure here would exit
            # the whole step before action-taken is written, and the caller
            # would see a generic "filing failed" instead of this call.
            if gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file "$comment_file"; then
              echo "issue-number=$existing" >> "$GITHUB_OUTPUT"
              echo "action-taken=commented" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::wing-commander-durable-failure-issue: gh issue comment failed on #$existing for label $LABEL"
              # Nothing was being CREATED on this path: #$existing exists
              # and is open, and only the comment onto it failed. Say so,
              # and keep the number -- the lookup above already resolved
              # it, and a caller told "create-failed, issue-number empty"
              # reports a finding as lost while the issue holding it sits
              # open (code review of #423).
              echo "issue-number=$existing" >> "$GITHUB_OUTPUT"
              echo "action-taken=comment-failed" >> "$GITHUB_OUTPUT"
              degraded="gh issue comment on #$existing"
            fi
            echo "matched-closed-issue=" >> "$GITHUB_OUTPUT"
          else
            # GitHub caps a label description at 100 characters. The cap is
            # enforced HERE, at the one site that makes the call, and not
            # only in a caller's own fixture -- #422 was exactly that hole:
            # a description nothing measured, 422 on first use, no label,
            # the create below failing, the report silently dropped. A
            # description is cosmetic, so an over-long one is truncated and
            # announced rather than being allowed to cost a report, and
            # every caller present and future is covered (code review of
            # #423).
            label_description="$LABEL_DESCRIPTION"
            if [ "${#label_description}" -gt 100 ]; then
              echo "::warning::wing-commander-durable-failure-issue: label-description for $LABEL is ${#label_description} characters; GitHub caps a label description at 100 -- truncating"
              label_description="${label_description:0:100}"
            fi
            # Guarded (#422): the first live filing died on this call, and
            # under `-e` the step exited before action-taken was written. A
            # label that already exists still lets the create below succeed;
            # a label that does not exist makes it fail into create-failed,
            # where the finding text is preserved (FR-025) and the step
            # still exits 0 (FR-022) for a caller that asked for that.
            if ! gh label create "$LABEL" --color "$LABEL_COLOR" --description "$label_description" --force; then
              echo "::warning::wing-commander-durable-failure-issue: gh label create failed for label $LABEL -- the create below succeeds only if the label already exists"
            fi
            create_body_file="$BODY_FILE"
            if [ -n "$matched_closed" ]; then
              # FR-012: the caller's body cannot name a closed match it did
              # not yet know about at compose time -- the marker lookup
              # above is the first point that fact is known. Appending this
              # one mechanical fact (a number, not prose) to a copy of the
              # caller's own body is not "templating a body" in the sense
              # this composite's own contract forbids; the caller still
              # supplies 100% of the finding's own description.
              create_body_file="$(mktemp "${RUNNER_TEMP:-/tmp}/wc-durable-failure-issue.XXXXXX")"
              cat "$BODY_FILE" > "$create_body_file"
              printf '\n\nRelated: a previous occurrence of this was closed as #%s.\n' "$matched_closed" >> "$create_body_file"
            fi
            # A `gh issue create` failure (rate limit, permission, outage)
            # must not propagate out of this step: `shell: bash` steps run
            # under the runner's default `-e`, so an unguarded failing
            # command here would fail the WHOLE lookup step non-zero --
            # exactly what wing-commander-stage-findings relies on this
            # composite never doing (FR-022). Caught locally: empty
            # issue-number, action-taken=create-failed, the caller's own
            # "Record finding N outcome" step turns that into
            # dropped-api-failure.
            if url="$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --label "$LABEL" --body-file "$create_body_file")"; then
              echo "issue-number=${url##*/}" >> "$GITHUB_OUTPUT"
              if [ -n "$matched_closed" ]; then
                echo "action-taken=created-linked-closed" >> "$GITHUB_OUTPUT"
                echo "matched-closed-issue=$matched_closed" >> "$GITHUB_OUTPUT"
              else
                echo "action-taken=created" >> "$GITHUB_OUTPUT"
                echo "matched-closed-issue=" >> "$GITHUB_OUTPUT"
              fi
            else
              echo "::warning::wing-commander-durable-failure-issue: gh issue create failed for label $LABEL"
              echo "issue-number=" >> "$GITHUB_OUTPUT"
              echo "action-taken=create-failed" >> "$GITHUB_OUTPUT"
              echo "matched-closed-issue=" >> "$GITHUB_OUTPUT"
              degraded="gh issue create for label $LABEL"
            fi
          fi
        else
          if [ -n "$existing" ]; then
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" --comment "$CLOSE_COMMENT"
            echo "issue-number=$existing" >> "$GITHUB_OUTPUT"
            echo "action-taken=closed" >> "$GITHUB_OUTPUT"
          else
            echo "issue-number=" >> "$GITHUB_OUTPUT"
            echo "action-taken=none" >> "$GITHUB_OUTPUT"
          fi
          echo "matched-closed-issue=" >> "$GITHUB_OUTPUT"
        fi

        # Last, so the outputs above are written either way: a caller that
        # reads `action-taken` (wing-commander-stage-findings) passes
        # fail-on-api-error: false and handles the degraded outcome
        # itself; a caller that does not gets its API failure back as a
        # step failure rather than a green run reporting nothing. See the
        # fail-on-api-error input for why that is the default.
        if [ -n "$degraded" ] && [ "$FAIL_ON_API_ERROR" != "false" ]; then
          echo "::error::wing-commander-durable-failure-issue: $degraded failed and fail-on-api-error is not false -- failing the step so this run is not green for a report that never landed."
          exit 1
        fi
