name: wing-commander-agent-verdict
description: >
  Read one already-produced execution transcript and answer, deterministically
  and without a network call or a second agent invocation, "was this agent
  run healthy" — replacing the hand-copied is_error/subtype checks duplicated
  (and, at ~11 sites, entirely absent) across the fleet
  (specs/037-agent-turn-budget-guard/research.md R3/R4, subsuming issue #193's
  rescue wiring per that spec's FR-016).

  Never fails its own step (always exit 0) — mirrors
  wing-commander-metrics-summary's never-fail contract. Callers that need the
  job to fail on a non-healthy verdict add their own "Fail loud" step gated on
  `steps.<this-id>.outputs.verdict != 'healthy'`; this action's job is only to
  answer the question.

  Does NOT validate any call site's declared JSON Schema — that remains each
  site's own existing shape-check step, now gated on this action's verdict
  output (research.md R2).

inputs:
  transcript-path:
    description: >
      Path to the execution transcript to read. Same default as
      wing-commander-metrics-summary, so most call sites need not repeat it.
    required: false
    default: ${{ runner.temp }}/claude-execution-output.json
  intended-turns:
    description: >
      The same value passed to wing-commander-turn-ceiling at this site.
      Used only for the over-budget comparison — never to gate the verdict
      itself.
    required: true
  run-label:
    description: >
      Free-text label distinguishing this invocation within a job that has
      more than one agent step sharing a transcript path convention. Passed
      straight through into the reason text when non-empty.
    required: false
    default: ''

outputs:
  verdict:
    description: "healthy | exhausted | rate-limited | failed | unclassifiable"
    value: ${{ steps.classify.outputs.verdict }}
  reason:
    description: Free-text explanation of the verdict.
    value: ${{ steps.classify.outputs.reason }}
  rate-limit-reset:
    description: >
      The rate_limit_event record's resetsAt value verbatim when present
      and non-empty, else the literal string 'unknown'. Empty string for
      every verdict other than 'rate-limited' — never fabricated for a
      non-rate-limited run.
    value: ${{ steps.classify.outputs.rate-limit-reset }}
  counted-turns:
    description: Distinct main-loop assistant message count, or empty if uncountable.
    value: ${{ steps.classify.outputs.counted-turns }}
  reported-turns:
    description: The transcript's own .num_turns — display/diagnosis only, never a gate condition.
    value: ${{ steps.classify.outputs.reported-turns }}
  over-budget:
    description: "'true' only when verdict == 'healthy' && counted-turns >= intended-turns."
    value: ${{ steps.classify.outputs.over-budget }}
  subagent-turns:
    description: Distinct subagent (Task-tool) message count, or empty if uncountable.
    value: ${{ steps.classify.outputs.subagent-turns }}

runs:
  using: composite
  steps:
    - name: Classify agent run verdict
      id: classify
      shell: bash
      env:
        TRANSCRIPT_PATH: ${{ inputs.transcript-path }}
        INTENDED_TURNS: ${{ inputs.intended-turns }}
        RUN_LABEL: ${{ inputs.run-label }}
      run: |
        set -uo pipefail

        TRANSCRIPT="${TRANSCRIPT_PATH:-}"
        INTENDED_TURNS="${INTENDED_TURNS:-}"
        # Every value a $GITHUB_OUTPUT line carries is made single-line
        # where it is read (#551): run-label here, subtype below, the rate
        # limit reset and window in their jq, and the turn counts by the
        # digits-only filter on count-turns.sh's output. verdict and
        # over-budget are literals. CR/LF become spaces, so no input or
        # transcript value can add a line to $GITHUB_OUTPUT.
        RUN_LABEL="$(printf '%s' "${RUN_LABEL:-}" | tr '\r\n' '  ')"
        label_suffix=""
        [ -n "$RUN_LABEL" ] && label_suffix=" ($RUN_LABEL)"

        verdict="unclassifiable"
        reason="transcript missing or unparseable${label_suffix}"
        result_json=""

        # The transcript is read once into a single flat JSON array, and
        # every jq and count-turns.sh call below reads that copy (#551).
        # One array, one object, NDJSON and several concatenated documents
        # all normalise to the same shape: `jq -s` collects the documents
        # and any document that is itself an array is spliced in. Fed the
        # raw file, NDJSON made each per-document jq print one line per
        # document, and the `eval` of count-turns.sh's output then ran a
        # bare "0" as a command -- exit 127 under the runner's `bash -e`.
        # When the file does not parse, counting still gets the raw path,
        # where count-turns.sh's own parse check empties all three values.
        COUNT_SOURCE="$TRANSCRIPT"
        normalised=""
        if [ -n "$TRANSCRIPT" ] && [ -f "$TRANSCRIPT" ] && [ -s "$TRANSCRIPT" ] \
           && jq -e . "$TRANSCRIPT" >/dev/null 2>&1; then
          normalised="$(mktemp "${RUNNER_TEMP:-/tmp}/wc-agent-verdict.XXXXXX" 2>/dev/null || true)"
          if [ -n "$normalised" ] \
             && jq -cs 'map(if type=="array" then .[] else . end)' \
                  "$TRANSCRIPT" > "$normalised" 2>/dev/null; then
            TRANSCRIPT="$normalised"
            COUNT_SOURCE="$normalised"
          fi
          # Non-object elements (a bare number or string) are skipped with
          # `objects` before any `.type` read: `.type` on a number is a jq
          # error that `|| true` would swallow, hiding a real result record.
          result_json="$(jq -c 'if type=="array" then . else [.] end
            | map(objects | select(.type=="result")) | last // empty' "$TRANSCRIPT" 2>/dev/null || true)"

          if [ -z "$result_json" ] || [ "$result_json" = "null" ]; then
            verdict="failed"
            reason="no terminal result record${label_suffix}"
          else
            jqget() { printf '%s' "$result_json" | jq -r "$1 // empty" 2>/dev/null || true; }
            subtype="$(jqget '.subtype | if type=="string" then gsub("[\r\n]"; " ") else . end')"
            is_error="$(jqget '.is_error')"
            terminal_reason="$(jqget '.terminal_reason')"
            api_error_status="$(jqget '.api_error_status')"

            # Rate-limit evidence is read from the same already-open
            # transcript (FR-002: no second file read, no network call).
            # The last QUALIFYING rate_limit_event record is authoritative,
            # mirroring how result_json above already keys on the last
            # result record (specs/047-rate-limited-verdict/research.md R1).
            #
            # A rate_limit_event qualifies only when its status is
            # "rejected", compared case-insensitively (#544). The runtime
            # also emits informational events ("allowed",
            # "allowed_warning") during ordinary runs; counting those let a
            # run that failed for an unrelated reason read as rate-limited.
            # The status is read from .rate_limit_info.status (the runtime's
            # nested shape), falling back to a top-level .status (the shape
            # spec 047's fixtures use).
            #
            # An event carrying NO status in either place still qualifies.
            # Every informational event the runtime writes names its status,
            # so a statusless one is never a known-benign record, while a
            # genuine refused-run transcript carries a bare
            # {"type":"rate_limit_event"} (issue #231's pinned run, replayed
            # in verify-truncated-cycle-carry-forward.py) -- dropping it
            # would demote a real rejection to "failed". It also keeps
            # data-model.md's "status tolerated absent" rule.
            #
            # Reset time and window come from the last qualifying event.
            # When none qualifies, the RESET TIME alone falls back to the
            # last event of any status (FR-003: expose the reset whenever
            # the transcript carries one -- reachable as rate-limited only
            # via a terminal api_error 429). The window never falls back:
            # an informational event may name a different window than the
            # one that rejected the call. Neither fallback feeds
            # classification. Each field is read top-level first, then
            # under .rate_limit_info, with "" treated as absent. A numeric
            # resetsAt is epoch seconds and becomes ISO-8601 only when
            # plausible (> 0 and < 1e11); zero, negative, millisecond-scale
            # or unconvertible values become "unknown", never a fabricated
            # date (spec.md edge case). CR/LF become spaces so neither value
            # can inject a $GITHUB_OUTPUT line.
            rate_limit_json="$(jq -c '
              def status_of: (if (.rate_limit_info|type)=="object"
                                then .rate_limit_info.status else null end)
                             // .status // "rejected";
              def qualifies: (status_of | if type=="string" then ascii_downcase else . end) == "rejected";
              def field($k): [.[$k], (if (.rate_limit_info|type)=="object"
                                        then .rate_limit_info[$k] else null end)]
                             | map(select(. != null and . != "")) | first;
              def clean: (if type=="number"
                          then (if . > 0 and . < 1e11 then (try todate catch null) else null end)
                          else . end)
                         | if . == null then "" else tostring | gsub("[\r\n]"; " ") end;
              if type=="array" then . else [.] end
              | map(objects | select(.type=="rate_limit_event")) as $ev
              | ($ev | map(select(qualifies)) | last) as $q
              | (($q // ($ev | last)) // {}) as $src
              | {qualifying: ($q != null),
                 reset: ($src | field("resetsAt") | clean),
                 window: (($q // {}) | field("rateLimitType") | clean)}' \
              "$TRANSCRIPT" 2>/dev/null || true)"
            rlget() { printf '%s' "$rate_limit_json" | jq -r "$1" 2>/dev/null || true; }

            rate_limit_evidence="false"
            if [ "$terminal_reason" = "api_error" ] && [ "$api_error_status" = "429" ]; then
              rate_limit_evidence="true"
            elif [ "$(rlget '.qualifying')" = "true" ]; then
              rate_limit_evidence="true"
            fi

            rate_limit_reset="$(rlget '.reset // ""')"
            [ -n "$rate_limit_reset" ] || rate_limit_reset="unknown"
            rate_limit_window="$(rlget '.window // ""')"

            # Order matters: error_max_turns is checked BEFORE is_error, since
            # a genuine exhaustion is a real, distinguishable outcome
            # (research.md R3) even though the runtime also sets is_error=true
            # for it — collapsing the two into one generic "failed" would hide
            # exactly the outcome FR-009 asks to keep distinguishable.
            # rate-limited is checked next, before the generic is_error/
            # subtype fallthrough, per contracts/agent-verdict-extension.md's
            # ordering (specs/047-rate-limited-verdict) — a rejected
            # rate_limit_event earlier in the transcript followed by a successful terminal
            # result never reaches this branch at all (subtype=="success"
            # fails the failure test below), so a recovered 429 stays healthy.
            if [ "$subtype" = "error_max_turns" ]; then
              verdict="exhausted"
              reason="runtime cut off at its configured turn ceiling before finishing${label_suffix}"
            elif { [ "$is_error" = "true" ] || [ "$subtype" != "success" ]; } && [ "$rate_limit_evidence" = "true" ]; then
              verdict="rate-limited"
              if [ -n "$rate_limit_window" ]; then
                reason="usage window (${rate_limit_window}) exhausted, resets at ${rate_limit_reset}${label_suffix}"
              else
                reason="usage window exhausted, resets at ${rate_limit_reset}${label_suffix}"
              fi
            elif [ "$is_error" = "true" ]; then
              verdict="failed"
              reason="is_error=true (subtype=${subtype:-missing})${label_suffix}"
            elif [ "$subtype" != "success" ]; then
              verdict="failed"
              reason="unexpected terminal subtype=${subtype:-missing}${label_suffix}"
            else
              verdict="healthy"
              reason="terminal result subtype=success, is_error=false${label_suffix}"
            fi
          fi
        fi

        rate_limit_reset_output=""
        [ "$verdict" = "rate-limited" ] && rate_limit_reset_output="$rate_limit_reset"

        # Turn counting is independent of the verdict above — a counting
        # failure (unexpected transcript shape) never demotes a genuinely
        # healthy result to a lesser verdict (spec.md edge case).
        counted_turns=""
        subagent_turns=""
        reported_turns=""
        # The three names count-turns.sh's output defines, seeded because
        # `set -u` is in force above. That script always prints all three,
        # so the eval below normally binds them -- but if the script is ever
        # absent from the caller's self-checkout the eval contributes
        # nothing, and reading an unbound $main_turns would kill this step
        # outright: the one thing this action promises never to do.
        # wing-commander-metrics-summary seeds the names it reads the same
        # way, for the same reason.
        main_turns=""
        sub_turns=""
        reported=""
        # Only lines of the exact `name=<digits or empty>` shape reach the
        # eval. `reported` is the transcript's own .num_turns printed
        # verbatim, so a string value can carry a newline and a second
        # assignment (verdict=...) or a `$(...)` the eval would run (#551).
        if [ -n "$COUNT_SOURCE" ] && [ -f "$COUNT_SOURCE" ] && [ -s "$COUNT_SOURCE" ]; then
          eval "$(bash "$GITHUB_ACTION_PATH/../_shared/count-turns.sh" "$COUNT_SOURCE" \
                  | grep -E '^(main_turns|sub_turns|reported)=[0-9]*$' || true)"
          counted_turns="$main_turns"
          subagent_turns="$sub_turns"
          reported_turns="$reported"
        fi

        over_budget="false"
        if [ "$verdict" = "healthy" ] \
           && printf '%s' "$counted_turns" | grep -Eq '^[0-9]+$' \
           && printf '%s' "$INTENDED_TURNS" | grep -Eq '^[0-9]+$' \
           && [ "$counted_turns" -ge "$INTENDED_TURNS" ]; then
          over_budget="true"
        fi

        if [ -n "$normalised" ]; then rm -f "$normalised"; fi

        {
          echo "verdict=$verdict"
          echo "reason=$reason"
          echo "rate-limit-reset=$rate_limit_reset_output"
          echo "counted-turns=$counted_turns"
          echo "reported-turns=$reported_turns"
          echo "over-budget=$over_budget"
          echo "subagent-turns=$subagent_turns"
        } >> "$GITHUB_OUTPUT"

        exit 0
