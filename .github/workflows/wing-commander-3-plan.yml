# Stage 2 — Plan (thin wrapper).
# When a draft spec PR merges into main, planning starts on a dedicated
# spec/<NNN-slug> branch. The trigger and the head-prefix guard are
# trigger-side and live HERE; slug derivation, the duplicate guard, and the
# hand-submitted-spec path live in plan.yml (docs/adoption.md),
# called by local path.
# A plan PR closed WITHOUT merging marks the spec stalled — owned by the
# cleanup stage (wing-commander-7-cleanup.yml), not this workflow.
name: "Wing Commander · 3 plan"

on:
  pull_request:
    types: [closed]
    paths: ["specs/**"]
  workflow_dispatch:
    inputs:
      slug:
        description: "Spec slug (NNN-name, e.g. 002-plan-stage) to (re)start planning for"
        required: true
        type: string

permissions: {}

jobs:
  plan:
    # Gate: a draft spec PR merged into main, or a manual restart. The
    # head-prefix guard prevents unrelated PRs touching specs/** from
    # false-triggering.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'main' &&
       startsWith(github.event.pull_request.head.ref, vars.WING_COMMANDER_SPEC_DRAFT_PREFIX || 'spec-draft/'))
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      id-token: write
    uses: ./.github/workflows/plan.yml
    with:
      head-ref: ${{ github.event.pull_request.head.ref }}
      slug: ${{ inputs.slug }}
      merged: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.merged }}
      pr-number: ${{ github.event.pull_request.number }}
      plan-review: ${{ vars.WING_COMMANDER_PLAN_REVIEW || 'pr' }}
      model: ${{ vars.WING_COMMANDER_PLAN_MODEL || 'claude-sonnet-5' }}
      spec-draft-prefix: ${{ vars.WING_COMMANDER_SPEC_DRAFT_PREFIX || 'spec-draft/' }}
      spec-prefix: ${{ vars.WING_COMMANDER_SPEC_PREFIX || 'spec/' }}
      plan-prefix: ${{ vars.WING_COMMANDER_PLAN_PREFIX || 'plan/' }}
      tasks-prefix: ${{ vars.WING_COMMANDER_TASKS_PREFIX || 'tasks/' }}
      impl-prefix: ${{ vars.WING_COMMANDER_IMPL_PREFIX || 'impl/' }}
      next-workflow: wing-commander-4-tasks.yml
    secrets:
      claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      speckit-app-id: ${{ secrets.WING_COMMANDER_APP_ID }}
      speckit-app-private-key: ${{ secrets.WING_COMMANDER_APP_PRIVATE_KEY }}
