name: "wing-commander-merge-evidence"

# The merge evidence audit (specs/125-merge-evidence-audit): an hourly verdict
# for every open pull request into the default branch, and a daily audit of
# everything that reached it in the last 30 days. It only watches: read-only
# permissions, no agent, no App token, no dispatch, and no comment, label,
# review, merge, push, check run or commit status. The verdicts live in the
# `merge-evidence-ledger` artifact; board-status.yml's writer
# (wc_board_status.py) is the only thing that ever shows the daily
# `merge-evidence-section`. No merge job reads either (FR-019).
#
# Step gating: no always() or !cancelled() anywhere. A refused run stops every
# later step; the pause output gates checkout, build and upload under the
# default success(); a failed build stops the upload, so the ledger keeps its
# last good state (research D3).
on:
  schedule:
    - cron: "7 * * * *"
    - cron: "41 5 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        type: choice
        options:
          - both
          - verdicts
          - audit
        default: both

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
  checks: read
  statuses: read

jobs:
  verdicts:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '7 * * * *')
      || (github.event_name == 'workflow_dispatch' && inputs.job != 'audit')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: wing-commander-merge-evidence-ledger
      cancel-in-progress: false
    steps:
      - name: Refuse a run off the default branch
        shell: bash
        env:
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$DEFAULT_BRANCH" ] || [ "$REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::the merge evidence audit runs only on the default branch (ref '$REF', default '$DEFAULT_BRANCH')"
            exit 1
          fi

      - name: Check the pause switch
        id: pause
        shell: bash
        env:
          PAUSED: ${{ vars.WING_COMMANDER_MERGE_EVIDENCE_PAUSED }}
        run: |
          # Same test as wc_board_status._switch_on: trimmed, case-folded `true`.
          value=$(printf '%s' "$PAUSED" | tr '[:upper:]' '[:lower:]' | xargs)
          if [ "$value" = "true" ]; then
            echo "paused=true" >> "$GITHUB_OUTPUT"
            echo "WING_COMMANDER_MERGE_EVIDENCE_PAUSED is set; standing down."
          else
            echo "paused=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.pause.outputs.paused != 'true'
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Record the verdicts
        if: steps.pause.outputs.paused != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BOT_LOGIN: ${{ vars.WING_COMMANDER_BOT_LOGIN }}
          FINAL_PREFIX: ${{ vars.WING_COMMANDER_SPEC_PREFIX }}
          SPEC_PREFIX: ${{ vars.WING_COMMANDER_SPEC_DRAFT_PREFIX }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 .github/scripts/wc_merge_evidence.py verdicts --default-branch "$DEFAULT_BRANCH" --out ledger.json

      # `overwrite: true` -- see wing-commander-proof-list.yml: a re-run keeps
      # the run id, and upload-artifact refuses a name that already exists in it.
      - name: Upload the ledger
        if: steps.pause.outputs.paused != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: merge-evidence-ledger
          path: ledger.json
          retention-days: 90
          if-no-files-found: error
          overwrite: true

  audit:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '41 5 * * *')
      || (github.event_name == 'workflow_dispatch' && inputs.job != 'verdicts')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: wing-commander-merge-evidence-audit
      cancel-in-progress: false
    steps:
      - name: Refuse a run off the default branch
        shell: bash
        env:
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$DEFAULT_BRANCH" ] || [ "$REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::the merge evidence audit runs only on the default branch (ref '$REF', default '$DEFAULT_BRANCH')"
            exit 1
          fi

      - name: Check the pause switch
        id: pause
        shell: bash
        env:
          PAUSED: ${{ vars.WING_COMMANDER_MERGE_EVIDENCE_PAUSED }}
        run: |
          # Same test as wc_board_status._switch_on: trimmed, case-folded `true`.
          value=$(printf '%s' "$PAUSED" | tr '[:upper:]' '[:lower:]' | xargs)
          if [ "$value" = "true" ]; then
            echo "paused=true" >> "$GITHUB_OUTPUT"
            echo "WING_COMMANDER_MERGE_EVIDENCE_PAUSED is set; standing down."
          else
            echo "paused=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.pause.outputs.paused != 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build the audit
        if: steps.pause.outputs.paused != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BOT_LOGIN: ${{ vars.WING_COMMANDER_BOT_LOGIN }}
          FINAL_PREFIX: ${{ vars.WING_COMMANDER_SPEC_PREFIX }}
          SPEC_PREFIX: ${{ vars.WING_COMMANDER_SPEC_DRAFT_PREFIX }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 .github/scripts/wc_merge_evidence.py audit --default-branch "$DEFAULT_BRANCH" --out merge-evidence-section.json

      - name: Upload the section
        if: steps.pause.outputs.paused != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: merge-evidence-section
          path: merge-evidence-section.json
          retention-days: 7
          if-no-files-found: error
          overwrite: true
