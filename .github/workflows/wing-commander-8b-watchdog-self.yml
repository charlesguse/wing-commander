# Stage 8b — deterministic watchdog verifier.
# Listens to stage 8's completion (a workflow may not name itself under
# workflow_run.workflows, so this lives in its own file — see the header of
# wing-commander-8-watchdog.yml) and decides WITHOUT an LLM whether that
# watchdog run actually worked.
#
# History: 8b originally re-ran the agentic watchdog (watchdog.yml) against
# stage 8 itself. That was replaced 2026-07-24 after an audit of all prior
# runs found its findings unreliable: 5 of 10 audited 8b runs elevated
# collector self-matches (the sentinel scanner grepping its own echoed
# script source and env dumps out of raw job logs) into false findings —
# including a "budget exceeded" claim disproved by the target's own
# num_turns=3 of 20 — and 3 of those runs contained zero true findings. An
# agent inspecting an agent compounds error rates; verifying "did the
# watchdog run do its job" needs no judgment at all. Every check here is a
# script over the Actions API and run artifacts (verify-watchdog-run.sh):
#   - run conclusion is success;
#   - runtime sits inside a band derived from this workflow's own history
#     (catches both instant agent deaths and multi-minute stalls);
#   - the conditional reporter steps that encode agent-crash /
#     could-not-inspect / internal-failure truths are all 'skipped'
#     (continue-on-error makes the agent step itself always look green in
#     the API — those reporter steps are the only externally visible truth);
#   - the diagnose execution log is not an error and cites no fabricated
#     evidence.
# On failure this job turns RED and files (or appends to) a pipeline-defect
# issue — a broken watchdog must never be quiet.
#
# Recursion terminates by construction: stage 8 does not listen to this
# workflow, this workflow does not listen to itself, and this workflow runs
# no agent that could itself need inspecting.
name: "Wing Commander · 8b watchdog self"

on:
  workflow_run:
    workflows:
      - "Wing Commander · 8 watchdog"
    types: [completed]

permissions: {}

jobs:
  verify:
    # Paused means paused (constitution VII: wrapper-side gate). Required,
    # not cosmetic: with stage 8's jobs gated off, its run still completes —
    # with conclusion 'skipped'. verify-watchdog-run.sh check 1 fails on any
    # conclusion that is not 'success', so an ungated 8b would file a
    # pipeline-defect issue for every deliberately paused stage-8 run.
    if: vars.WING_COMMANDER_WATCHDOG_PAUSED != 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read      # run/jobs/artifact reads
      contents: read     # checkout (the verifier script)
      issues: write      # pipeline-defect issue on failure
    steps:
      # The workflow_run payload carries the inspected run's identity
      # directly; no resolve job needed.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Verify stage 8 run deterministically
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
          CREATE_ISSUE: "true"
        run: bash .github/scripts/verify-watchdog-run.sh
