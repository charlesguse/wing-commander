name: "wing-commander-proof-list"

# The proof list (specs/124-merge-proof-list): which merges to the default
# branch have a workflow run that could show them working and nothing on
# record. Read-only and agent-free: it builds one JSON section and uploads it.
# board-status.yml's writer (wc_board_status.py) is the only thing that ever
# shows it, in the "Board status" issue. No agent, no App token, no dispatch,
# no comment, label, close or issue edit.
#
# Step gating (research D17): no always() or !cancelled() anywhere. A refused
# run stops every later step; the pause output gates checkout, build and upload
# under the default success(); a failed build stops the upload.
on:
  schedule:
    - cron: "19 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: wing-commander-proof-list
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Refuse a dispatch off the default branch
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] \
            && { [ -z "$DEFAULT_BRANCH" ] || [ "$REF" != "refs/heads/$DEFAULT_BRANCH" ]; }; then
            echo "::error::the proof list builds only on the default branch (ref '$REF', default '$DEFAULT_BRANCH')"
            exit 1
          fi

      - name: Check the pause switch
        id: pause
        shell: bash
        env:
          PAUSED: ${{ vars.WING_COMMANDER_PROOF_LIST_PAUSED }}
        run: |
          # Same test as wc_board_status._switch_on: trimmed, case-folded `true`.
          value=$(printf '%s' "$PAUSED" | tr '[:upper:]' '[:lower:]' | xargs)
          if [ "$value" = "true" ]; then
            echo "paused=true" >> "$GITHUB_OUTPUT"
            echo "WING_COMMANDER_PROOF_LIST_PAUSED is set; standing down."
          else
            echo "paused=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.pause.outputs.paused != 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build the proof list
        if: steps.pause.outputs.paused != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/wc_proof_list.py build --out proof-list-section.json

      # `overwrite: true` -- see pr-conversation.yml: a "Re-run all jobs"
      # keeps the run id, and upload-artifact v4+ refuses a name that already
      # exists in it, so a re-run of a run that already uploaded would fail
      # here and Board status would show "failed" until the next build.
      - name: Upload the section
        if: steps.pause.outputs.paused != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: proof-list-section
          path: proof-list-section.json
          retention-days: 7
          if-no-files-found: error
          overwrite: true
