name: "wing-commander-proof-list"

# The proof list (specs/124-merge-proof-list): which merges to the default
# branch have a workflow run that could show them working and nothing on
# record. Read-only and agent-free: it builds one JSON section and uploads it.
# board-status.yml's writer (wc_board_status.py) is the only thing that ever
# shows it, in the "Board status" issue. No agent, no App token, no dispatch,
# no comment, label, close or issue edit.
#
# Step gating (research D17): no always() or !cancelled() anywhere. The job
# checks out the default branch first, because the refusal and the pause
# test live in the wing-commander-watch-guard composite (one home with the
# merge evidence audit); its refusal stays dispatch-only. A refused run stops
# every later step; the pause output gates build and upload under the default
# success(); a failed build stops the upload.
on:
  schedule:
    - cron: "19 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: wing-commander-proof-list
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 25, not plan.md's 15: that was sized for about 50 merges and a few
    # thousand runs in the window; on 2026-11-26 it held 109 merges (87
    # needing a run) and 15,601 runs of reaching workflows, and two builds
    # were cancelled at 15. The cron fires late (06:31-06:44 seen), and
    # 25 still ends before board-status.yml reads the section at 07:17.
    # wc_proof_list.BUILD_BUDGET_SECONDS stays two minutes under this, so a
    # slow build fails with its own line before the job is cancelled.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse a dispatch off the default branch, then check the pause switch
        id: pause
        uses: ./.github/actions/wing-commander-watch-guard
        with:
          what: the proof list builds
          default-branch: ${{ github.event.repository.default_branch }}
          refuse-on: dispatch
          event: ${{ github.event_name }}
          switch-name: WING_COMMANDER_PROOF_LIST_PAUSED
          switch-value: ${{ vars.WING_COMMANDER_PROOF_LIST_PAUSED }}

      - name: Build the proof list
        if: steps.pause.outputs.paused != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/wc_proof_list.py build --out proof-list-section.json

      # `overwrite: true` -- see pr-conversation.yml: a "Re-run all jobs"
      # keeps the run id, and upload-artifact v4+ refuses a name that already
      # exists in it, so a re-run of a run that already uploaded would fail
      # here and Board status would show "failed" until the next build.
      - name: Upload the section
        if: steps.pause.outputs.paused != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: proof-list-section
          path: proof-list-section.json
          retention-days: 7
          if-no-files-found: error
          overwrite: true
