# Stage 1 — Spec intake (thin wrapper).
# A maintainer applying the `spec-request` label to an issue is the human
# security gate that admits it into the pipeline. All stage logic lives in
# reusable-intake.yml — the identical workflow_call interface adopters pin
# (docs/adoption.md), called here by local path so every dogfooded run
# exercises unreleased head (constitution I; specs/010-reusable-pipeline).
# Serialization (the speckit-intake concurrency group) is declared inside the
# called stage — repeating the group name here would deadlock the run.
name: "speckit · 1 intake"

on:
  issues:
    types: [labeled]

permissions: {}

jobs:
  intake:
    # Gate: only the maintainer-applied approval label starts intake.
    if: github.event.label.name == 'spec-request'
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    uses: ./.github/workflows/reusable-intake.yml
    with:
      issue-number: ${{ github.event.issue.number }}
    secrets:
      claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      speckit-app-id: ${{ secrets.SPECKIT_APP_ID }}
      speckit-app-private-key: ${{ secrets.SPECKIT_APP_PRIVATE_KEY }}
