# Stage 8 — Watchdog (thin wrapper).
# Reacts to the completion of any of this pipeline's other stage wrappers and
# to manual workflow_dispatch re-inspection (FR-025). This wrapper only gates
# and forwards the inspected run's id; every detection/triage/act job lives
# in watchdog.yml (docs/architecture.md), called by local path.
#
# run-name on the workflow_run (completion) path is
# github.event.workflow.name (MF-05) -- free, already on the event payload,
# no `gh run view` call needed, and it survives a `collect` failure that
# happens before collect's own run-meta step would otherwise be the only
# source (watchdog.yml's report-unhandled-failure safety net reads
# inputs.run-name || needs.collect.outputs.run-name for exactly that
# reason). On workflow_dispatch there is no workflow_run payload to read it
# from (spec 058, FR-020) -- the stage's input stays '' and watchdog.yml's
# `collect` job resolves the name itself, from the same `gh run view --json
# workflowName` call this file's since-removed `resolve` job used to make.
# That job existed only to turn one event payload into two strings, and a
# wrapper job is a whole billed runner minute however short it runs -- the
# same argument that removed wing-commander-metrics-persist.yml's own
# resolve job (spec 043).
#
# The name the stage resolves is the inspected run's WORKFLOW name -- its
# declared `name:` -- never the run's own `name` field: once a workflow
# sets `run-name:` (as this one does, below), the Actions API reports that
# title in `name`, and watchdog.yml's `case "$RUN_NAME"` arms and its
# FR-018 self-dispatch cap (`collect`'s resolved run-name ==
# 'Wing Commander · 8 watchdog') would silently stop matching. Gate 70
# (verify-watchdog-self-skip-guard.py) holds this on watchdog.yml's
# resolution step and fails a mutation that reads the title instead.
#
# Self-inspection (FR-021/US4) is NOT wired here: GitHub rejects the entire
# file — "failed to parse workflow: Workflow '<name>' cannot listen to
# itself" — if a workflow names itself under workflow_run.workflows, and an
# unparseable file is never registered, so the stage silently never runs at
# all. Self-inspection therefore lives in its own wrapper,
# wing-commander-8b-watchdog-self.yml, which listens to THIS workflow and
# calls the same watchdog.yml.
#
# Every name below must match another workflow's `name:` EXACTLY —
# workflow_run resolves by display name, and a name that matches nothing is
# not an error, just a trigger that silently never fires. lint-workflows.yml
# gate 2 enforces both rules.
name: "Wing Commander · 8 watchdog"
# The run title ends with the inspected run's own conclusion in parentheses,
# because the 8b verifier needs that fact and has no other way to get it:
# 8b's workflow_run payload describes THIS run, and a run whose jobs were all
# gated off leaves no job output behind. 8b stands down on a skipped stage-8
# run only when this title says the source was skipped as well, so a gating
# regression below that skips a source run which DID execute still reaches
# 8b's check 1 instead of passing as a deliberate decline. Gate 70
# (verify-watchdog-self-skip-guard.py) evaluates this expression against
# 8b's `if:` -- change the suffix in both files or in neither.
run-name: >-
  ${{ github.event_name == 'workflow_run'
      && format('inspect {0} run {1} ({2})', github.event.workflow.name, github.event.workflow_run.id, github.event.workflow_run.conclusion)
      || format('re-inspect run {0}', inputs.run-id) }}

on:
  workflow_run:
    workflows:
      - "Wing Commander · 1 intake"
      - "Wing Commander · 2 clarify"
      - "Wing Commander · 3 plan"
      - "Wing Commander · 4 tasks"
      - "Wing Commander · 5 implement"
      - "Wing Commander · 6 finalize"
      - "Wing Commander · 7 cleanup"
      - "Wing Commander · rebase"
    types: [completed]
  workflow_dispatch:
    inputs:
      run-id:
        description: "The run ID to (re-)inspect"
        required: true

permissions: {}

jobs:
  # spec 110 (FR-012/FR-013, research.md D10): the diagnose shadow's
  # switch and bound. WING_COMMANDER_DIAGNOSE_SHADOW_SINCE is the single
  # switch; while it is unset this job is skipped, so a repository that
  # never runs the trial pays no runner minute for it. When it is set,
  # wing-commander-trial-bound reads the metrics branch and says whether
  # the trial is still inside 60 days and 300 compared runs; the watchdog
  # job below passes that on as diagnose-shadow-enabled, and reads false
  # whenever this job was skipped or failed. Records reach the metrics
  # branch through metrics-persist's daily sweep (the watchdog is
  # sweep-only), so the count lags by up to a day of runs.
  #
  # Every step is continue-on-error: wing-commander-8b verifies this run
  # and fails on any job whose conclusion is not success, so a trial-bound
  # hiccup must leave the shadow off (an empty output reads as false
  # below) rather than turn the inspection red.
  trial-bound:
    if: >-
      vars.WING_COMMANDER_DIAGNOSE_SHADOW_SINCE != '' &&
      vars.WING_COMMANDER_WATCHDOG_PAUSED != 'true' &&
      github.event.workflow_run.conclusion != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.bound.outputs.enabled }}
    steps:
      - name: Checkout the trial-bound composite
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: .github/actions

      # A failed checkout (no metrics branch yet, or a fetch error) leaves
      # records-path empty below, and the composite then fails closed: the
      # 300-run cap cannot be checked, so the shadow stays off.
      # Only the one records file is read, so only it is checked out.
      - name: Checkout the metrics branch
        id: metrics
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          ref: ${{ vars.WING_COMMANDER_METRICS_BRANCH || 'metrics' }}
          path: .wing-commander-metrics
          persist-credentials: false
          sparse-checkout: ${{ vars.WING_COMMANDER_METRICS_PATH || 'records.jsonl' }}
          sparse-checkout-cone-mode: false

      - name: Decide whether the diagnose shadow is inside its bound
        id: bound
        continue-on-error: true
        uses: ./.github/actions/wing-commander-trial-bound
        with:
          since: ${{ vars.WING_COMMANDER_DIAGNOSE_SHADOW_SINCE }}
          records-path: ${{ steps.metrics.outcome == 'success' && format('.wing-commander-metrics/{0}', vars.WING_COMMANDER_METRICS_PATH || 'records.jsonl') || '' }}


  # No resolve job in front of it. The run-id is a one-line expression
  # (the dispatch input, else the workflow_run payload) and the run-name is
  # resolved stage-side, so a wrapper job would exist only to gate and
  # forward — and every job a wrapper declares is a runner allocation
  # GitHub counts as a whole minute however short it runs. Same fold as
  # wing-commander-metrics-persist.yml's (spec 043). The one other job,
  # trial-bound above, allocates a runner only while the diagnose shadow
  # trial is switched on (Gate 75).
  watchdog:
    # Kill switch, wrapper-side (constitution VII: the wrapper owns triggers,
    # gates, and every vars.* read). watchdog.yml used to honour the same
    # variable, but only in its `act` job — that suppressed WRITES while
    # collect, diagnose, and triage still ran, so a "paused" watchdog billed for
    # the diagnose agent (claude-opus-5, principle II carve-out) and
    # the since-removed propose-fix step (claude-sonnet-5) on every run, and
    # threw the verdict away. Gating here means no job starts at all, and this
    # is the ONLY place the pause is meaningfully enforced. watchdog.yml still
    # carries the stage-side write-suppression read, but only as a DEPRECATED
    # compatibility shim for an adopter whose own wrapper has no such gate
    # (#152): it stops writes without stopping work, which is exactly what
    # made a "paused" watchdog keep spending. It is scheduled for removal
    # alongside the stage's other vars.* reads (#149).
    #
    # Second clause, the skipped-source guard: a completed run whose
    # conclusion is 'skipped' executed nothing, and FR-026
    # (specs/015-pipeline-watchdog/spec.md) binds every collector to emit no
    # signal about such a run -- so inspecting one is job-minutes (collect,
    # diagnose, report-unhandled-failure) plus a diagnose agent call for a
    # verdict fixed before the first job starts, and it was the common case:
    # every pipeline comment on a spec issue wakes the clarify wrapper, which
    # skips. The rationale for gating at the wrapper -- see
    # wing-commander-metrics-persist.yml. Dispatch carries no workflow_run
    # payload; '' != 'skipped' keeps that path open.
    #
    # Third, spec 110: the job waits on trial-bound and runs whatever that
    # job's result -- skipped (the trial is off), failed or successful --
    # so !cancelled() replaces the implicit success() a skipped need would
    # otherwise turn into a skipped watchdog.
    needs: trial-bound
    if: >-
      !cancelled() &&
      vars.WING_COMMANDER_WATCHDOG_PAUSED != 'true' &&
      github.event.workflow_run.conclusion != 'skipped'
    # Must be a superset of watchdog.yml's workflow-level `permissions:` —
    # GitHub validates the grant against every job in the called workflow at
    # startup (including if-skipped ones) and fails the run with zero jobs if
    # the called workflow asks for more. `actions: read` is what the collect
    # job's run/job/artifact reads need; `checks: read` is what its
    # check-run annotations read needs (Gate 12 / T064). lint-workflows.yml
    # gate 3 enforces this superset relationship.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
      checks: read
    uses: ./.github/workflows/watchdog.yml
    with:
      # The dispatch input when present, else the completed run this event
      # announces. `inputs` is empty, not an error, under workflow_run --
      # the resolve job read it the same way on every event-driven run.
      # format() because workflow_run.id is a number and the input is typed
      # string; the resolve job's output was always a string.
      run-id: ${{ format('{0}', inputs.run-id || github.event.workflow_run.id) }}
      # MF-05: the completion path's event payload already names the
      # inspected workflow -- free to pass, and a fallback for
      # report-unhandled-failure if collect fails before resolving its own
      # copy. Empty on workflow_dispatch (no workflow_run payload); the
      # stage resolves it there instead (see the file header, FR-020).
      run-name: ${{ github.event_name == 'workflow_run' && github.event.workflow.name || '' }}
      runner: ${{ vars.WING_COMMANDER_RUNNER || 'ubuntu-latest' }}
      container-image: ${{ vars.WING_COMMANDER_CONTAINER_IMAGE || '' }}
      # spec 110: false unless trial-bound ran and said true.
      diagnose-shadow-enabled: ${{ needs.trial-bound.outputs.enabled == 'true' }}
    secrets:
      claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      speckit-app-id: ${{ secrets.WING_COMMANDER_APP_ID }}
      speckit-app-private-key: ${{ secrets.WING_COMMANDER_APP_PRIVATE_KEY }}
      container-registry-username: ${{ secrets.WING_COMMANDER_CONTAINER_REGISTRY_USERNAME }}
      container-registry-password: ${{ secrets.WING_COMMANDER_CONTAINER_REGISTRY_PASSWORD }}
