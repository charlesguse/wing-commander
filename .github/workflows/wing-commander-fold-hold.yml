# Fold-hold release (thin wrapper). The owner answers a held fold with a
# `/fold-hold proceed|drop|amend|retry` comment on the lifecycle issue
# (specs/116-review-convergence-analyze contracts/fold-analyze.md "Hold
# protocol"). This wrapper owns that issue_comment trigger and the bot
# exclusion (constitution V); who may answer, and what each answer does,
# is decided in fold-hold.yml (docs/adoption.md), called by local path.
# Gate 166 holds this file to delegating only.
name: "Wing Commander · fold hold release"

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  fold-hold:
    if: >-
      !github.event.issue.pull_request &&
      github.event.comment.user.type != 'Bot' &&
      contains(github.event.comment.body, '/fold-hold')
    permissions:
      contents: write
      issues: write
      actions: write
      id-token: write
    uses: ./.github/workflows/fold-hold.yml
    with:
      issue: ${{ github.event.issue.number }}
      body: ${{ github.event.comment.body }}
      actor-association: ${{ github.event.comment.author_association }}
      runner: ${{ vars.WING_COMMANDER_RUNNER || 'ubuntu-latest' }}
      container-image: ${{ vars.WING_COMMANDER_CONTAINER_IMAGE || '' }}
    secrets:
      claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      speckit-app-id: ${{ secrets.WING_COMMANDER_APP_ID }}
      speckit-app-private-key: ${{ secrets.WING_COMMANDER_APP_PRIVATE_KEY }}
      container-registry-username: ${{ secrets.WING_COMMANDER_CONTAINER_REGISTRY_USERNAME }}
      container-registry-password: ${{ secrets.WING_COMMANDER_CONTAINER_REGISTRY_PASSWORD }}
