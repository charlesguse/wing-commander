# Maintenance — Auto-rebase spec branches (thin wrapper).
# On pushes to main (and nightly), keep every in-flight spec/<NNN-slug>
# working branch current with the main line. Discovery, the per-branch
# matrix fan-out, lease pushes, agent conflict resolution, and escalation all
# live in rebase.yml (docs/adoption.md), called by local path. The
# bot-actor loop guard is trigger-side and lives HERE.
name: "Wing Commander · rebase"

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"

permissions: {}

jobs:
  rebase:
    # Loop guard: a push made by the pipeline's own App identity
    # (`<slug>[bot]`) is skipped; a scheduled run (never a bot actor) always
    # proceeds.
    if: ${{ !endsWith(github.actor, '[bot]') }}
    permissions:
      contents: write
      issues: write
      id-token: write
    uses: ./.github/workflows/rebase.yml
    with:
      model: ${{ vars.WING_COMMANDER_PLAN_MODEL || 'claude-sonnet-5' }}
      spec-prefix: ${{ vars.WING_COMMANDER_SPEC_PREFIX || 'spec/' }}
    secrets:
      claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      speckit-app-id: ${{ secrets.WING_COMMANDER_APP_ID }}
      speckit-app-private-key: ${{ secrets.WING_COMMANDER_APP_PRIVATE_KEY }}
