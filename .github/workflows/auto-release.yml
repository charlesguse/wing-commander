# Scheduled auto-release: detects unreleased work on main, verifies it
# end-to-end against a maintainer-onboarded test repository running the
# published stages, computes the next non-breaking version, and dispatches
# release.yml to cut it. Never requests a breaking/major release -- that
# stays a deliberate human act through release.yml's own manual dispatch.
# See specs/045-auto-release-verified-head/contracts/auto-release-workflow.md,
# e2e-repository-wiring.md, and release-dispatch.md for the full contract.
#
# on: workflow_dispatch only in addition to schedule -- no workflow_call.
# This file is not a published stage (research.md D1 of specs/045): it
# releases THIS repository, not an adopter's, and carries no ambient event
# payload that needs translating into typed inputs.
name: "auto-release"

on:
  schedule:
    - cron: "9 9 * * *"   # one-line, PR-reviewed knob (FR-002) -- not repository-variable-configurable
  workflow_dispatch: {}    # FR-005: on-demand, no inputs needed

permissions: {}

concurrency:
  # This group is also what guarantees the container/default-runner leg
  # alternation's isolation (specs/054-e2e-container-coverage FR-008,
  # research.md D2): a second run -- scheduled or manually dispatched --
  # queues behind an in-flight one rather than running concurrently, so
  # two resets of the same test repository can never race across legs.
  # Never loosen this without re-establishing that guarantee some other
  # way.
  group: wing-commander-auto-release
  cancel-in-progress: false

jobs:
  # Detecting unreleased work costs nothing extra (research.md D4): "is
  # there new work" and "has this head already been auto-released" are
  # answered by the same read -- the highest exact vX.Y.Z release tag
  # compared against HEAD. No separate ledger of "already attempted this
  # head" is needed; the tag itself is that record.
  detect:
    if: vars.WING_COMMANDER_AUTO_RELEASE_PAUSED != 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      head-sha: ${{ steps.resolve.outputs.head-sha }}
      tag-exists: ${{ steps.resolve.outputs.tag-exists }}
      latest-tag: ${{ steps.resolve.outputs.latest-tag }}
      has-new-work: ${{ steps.resolve.outputs.has-new-work }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve latest release tag and unreleased head
        id: resolve
        shell: bash
        run: |
          set -uo pipefail
          head_sha="$(git rev-parse HEAD)"

          # Strict vX.Y.Z only -- excludes the floating vX major tags and any
          # pre-release/build suffix (data-model.md "Latest release tag").
          latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -1 || true)"

          if [ -z "$latest_tag" ]; then
            {
              echo "head-sha=$head_sha"
              echo "tag-exists=false"
              echo "latest-tag="
              echo "has-new-work=false"
            } >> "$GITHUB_OUTPUT"
            echo "detect: no release tag exists yet -- nothing to compare against." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # The commit the tag's annotated object points at, never the tag
          # object's own SHA (data-model.md).
          tag_sha="$(git rev-parse "${latest_tag}^{commit}")"
          if [ "$head_sha" != "$tag_sha" ]; then
            has_new_work=true
          else
            has_new_work=false
          fi

          {
            echo "head-sha=$head_sha"
            echo "tag-exists=true"
            echo "latest-tag=$latest_tag"
            echo "has-new-work=$has_new_work"
          } >> "$GITHUB_OUTPUT"
          echo "detect: latest release $latest_tag ($tag_sha); head $head_sha; has-new-work=$has_new_work." >> "$GITHUB_STEP_SUMMARY"

  # Resolve/validate the test repository, reset its default branch,
  # scaffold the published stages at the verified head, kick off the fixed
  # trivial feature, poll to a verdict, assert per-stage outputs. Every step
  # here degrades to a fail-infra/fail-timeout/fail-incomplete/
  # fail-wrong-output verdict rather than crashing the job (research.md
  # D10/D11, data-model.md "End-to-end verdict") -- decide-version below
  # reads this job's `verdict` output unconditionally, so it must always be
  # valid JSON regardless of which step here stopped the run.
  verify-e2e:
    needs: detect
    if: needs.detect.outputs.has-new-work == 'true' && vars.WING_COMMANDER_AUTO_RELEASE_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    outputs:
      verdict: ${{ steps.config.outputs.verdict || steps.reachable.outputs.verdict || steps.maintainer-credential.outputs.verdict || steps.reset.outputs.verdict || steps.speckit-version.outputs.verdict || steps.scaffold.outputs.verdict || steps.kickoff.outputs.verdict || steps.poll.outputs.verdict }}
      # Carried separately from the verdict's `mode` field (data-model.md
      # "Execution mode") -- true only when the container leg was due by
      # date parity but the pause control (research.md D3) forced this run
      # to default-runner instead.
      paused: ${{ steps.mode.outputs.paused }}
      # Gate evidence for a `pass` verdict (research.md D12, FR-017, FR-019)
      # -- empty on every non-pass path, since the poll step exits before
      # writing them.
      spec-draft-pr: ${{ steps.poll.outputs.spec-draft-pr }}
      plan-pr: ${{ steps.poll.outputs.plan-pr }}
      finalize-pr: ${{ steps.poll.outputs.finalize-pr }}
      clarification-rounds-answered: ${{ steps.poll.outputs.clarification-rounds-answered }}
      clarification-comment-ids: ${{ steps.poll.outputs.clarification-comment-ids }}
    steps:
      # Every step below reads a local composite (`uses: ./...`) or shell
      # helper (`.github/actions/_shared/*.sh`), which needs this
      # repository on disk -- this job had no checkout at all, so its
      # first scheduled run (this job is schedule/dispatch-only; PR CI
      # never exercises it) would fail with "can't find action.yml".
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # A stateless derivation, recomputed fresh every run from the UTC
      # calendar date -- nothing is persisted, so a cancelled, skipped, or
      # manually dispatched run can never leave the rotation stuck on one
      # mode (research.md D1, Edge Case: "the alternation loses its
      # place"). Runs first and unconditionally: every later verdict-
      # emitting step threads its output through exactly as verified_head
      # already is today (research.md D9).
      - name: Derive this run's execution mode (container vs default-runner)
        id: mode
        shell: bash
        env:
          CONTAINER_PAUSED: ${{ vars.WING_COMMANDER_AUTO_RELEASE_E2E_CONTAINER_PAUSED }}
        run: |
          set -uo pipefail
          # Days since the Unix epoch, NOT day-of-year parity (SC-009): the
          # day-of-year resets to 1 every January 1st, and in a non-leap
          # year day 365 (Dec 31) and day 1 (Jan 1) are both odd, so parity
          # of day-of-year repeats the same mode across every year boundary
          # instead of alternating -- a monotonic count has no such seam,
          # since consecutive calendar days always increment it by exactly
          # one regardless of which year they fall in.
          days_since_epoch="$(( $(date -u +%s) / 86400 ))"
          if [ $(( days_since_epoch % 2 )) -eq 0 ]; then
            mode=default-runner
          else
            mode=container
          fi
          # Independent of WING_COMMANDER_AUTO_RELEASE_PAUSED (research.md
          # D3): pausing the container leg does not pause auto-release as a
          # whole, and vice versa. Never overrides an already-even-day
          # (default-runner) result, since that leg was never paused.
          paused=false
          if [ "$CONTAINER_PAUSED" = "true" ] && [ "$mode" = "container" ]; then
            mode=default-runner
            paused=true
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "paused=$paused" >> "$GITHUB_OUTPUT"

      - name: Resolve and validate the end-to-end test repository configuration
        id: config
        shell: bash
        env:
          E2E_REPO: ${{ vars.WING_COMMANDER_AUTO_RELEASE_E2E_REPO }}
          HEAD_SHA: ${{ needs.detect.outputs.head-sha }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -uo pipefail
          if [ -z "$E2E_REPO" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo 'verdict<<AUTO_RELEASE_VERDICT_EOF'
              bash .github/actions/_shared/auto-release-verdict.sh "fail-infra" "$HEAD_SHA" "WING_COMMANDER_AUTO_RELEASE_E2E_REPO is unset" "a repository variable set to OWNER/NAME of a pre-onboarded test repository" "unset" "WING_COMMANDER_AUTO_RELEASE_E2E_REPO" "$MODE"
              echo 'AUTO_RELEASE_VERDICT_EOF'
            } >> "$GITHUB_OUTPUT"
            echo "::error::wing-commander auto-release verify-e2e: WING_COMMANDER_AUTO_RELEASE_E2E_REPO is unset -- see docs/setup.md."
            exit 0
          fi
          case "$E2E_REPO" in
            */*/*|/*|*/|*[[:space:]]*) shape=bad ;;
            */*)                       shape=ok ;;
            *)                         shape=bad ;;
          esac
          if [ "$shape" = "bad" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo 'verdict<<AUTO_RELEASE_VERDICT_EOF'
              bash .github/actions/_shared/auto-release-verdict.sh "fail-infra" "$HEAD_SHA" "WING_COMMANDER_AUTO_RELEASE_E2E_REPO shape" "OWNER/NAME" "$E2E_REPO" "WING_COMMANDER_AUTO_RELEASE_E2E_REPO" "$MODE"
              echo 'AUTO_RELEASE_VERDICT_EOF'
            } >> "$GITHUB_OUTPUT"
            echo "::error::wing-commander auto-release verify-e2e: WING_COMMANDER_AUTO_RELEASE_E2E_REPO is '$E2E_REPO', which is not an OWNER/NAME pair."
            exit 0
          fi
          # The reset step below orphan-recreates and force-pushes the test
          # repository's default branch. Pointed at THIS repository (the App
          # is installed here, so every check after this one would pass) it
          # would do that to main. Refuse the value outright; no verification
          # is worth that, and the variable's doc says "a dedicated test
          # repository" for exactly this reason.
          e2e_lc="$(printf '%s' "$E2E_REPO" | tr '[:upper:]' '[:lower:]')"
          self_lc="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          if [ "$e2e_lc" = "$self_lc" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo 'verdict<<AUTO_RELEASE_VERDICT_EOF'
              bash .github/actions/_shared/auto-release-verdict.sh "fail-infra" "$HEAD_SHA" "WING_COMMANDER_AUTO_RELEASE_E2E_REPO names this repository" "a separate, dedicated, pre-onboarded test repository" "$E2E_REPO" "WING_COMMANDER_AUTO_RELEASE_E2E_REPO" "$MODE"
              echo 'AUTO_RELEASE_VERDICT_EOF'
            } >> "$GITHUB_OUTPUT"
            echo "::error::wing-commander auto-release verify-e2e: WING_COMMANDER_AUTO_RELEASE_E2E_REPO is '$E2E_REPO', which is this repository itself. The end-to-end run resets the test repository's default branch; refusing."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "e2e-repo=$E2E_REPO" >> "$GITHUB_OUTPUT"
          echo "owner=${E2E_REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${E2E_REPO#*/}" >> "$GITHUB_OUTPUT"

      # specs/049-single-home-release-idioms: the mint-then-verify idiom
      # this step used to re-type is now the shared
      # _shared/scoped-app-token composite -- see
      # specs/049-single-home-release-idioms/contracts/scoped-app-token.md.
      # `id: token` is kept (not renamed) so
      # steps.token.outputs.token below still resolves the same way it
      # always has.
      - name: Mint a scoped App token for the test repository
        id: token
        if: steps.config.outputs.ready == 'true'
        uses: ./.github/actions/_shared/scoped-app-token
        with:
          app-id: ${{ secrets.WING_COMMANDER_APP_ID }}
          private-key: ${{ secrets.WING_COMMANDER_APP_PRIVATE_KEY }}
          owner: ${{ steps.config.outputs.owner }}
          repo-name: ${{ steps.config.outputs.name }}
          check-default-branch: "true"

      - name: Confirm the test repository is reachable
        id: reachable
        if: steps.config.outputs.ready == 'true'
        shell: bash
        env:
          OK: ${{ steps.token.outputs.ok }}
          FAILURE_REASON: ${{ steps.token.outputs.failure-reason }}
          DEFAULT_BRANCH: ${{ steps.token.outputs.default-branch }}
          E2E_REPO: ${{ steps.config.outputs.e2e-repo }}
          HEAD_SHA: ${{ needs.detect.outputs.head-sha }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -uo pipefail
          if [ "$OK" != "true" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            if [ "$FAILURE_REASON" = "token-mint-failed" ]; then
              {
                echo 'verdict<<AUTO_RELEASE_VERDICT_EOF'
                bash .github/actions/_shared/auto-release-verdict.sh "fail-infra" "$HEAD_SHA" "wing-commander App installation on the test repository" "installed on the test repository with Contents/Issues/Pull requests read-write" "token mint failed" "$E2E_REPO" "$MODE"
                echo 'AUTO_RELEASE_VERDICT_EOF'
              } >> "$GITHUB_OUTPUT"
              echo "::error::wing-commander auto-release verify-e2e: the wing-commander App could not mint a token for $E2E_REPO -- install it there (docs/setup.md)."
            else
              {
                echo 'verdict<<AUTO_RELEASE_VERDICT_EOF'
                bash .github/actions/_shared/auto-release-verdict.sh "fail-infra" "$HEAD_SHA" "test repository reachability" "gh repo view succeeds and reports a default branch" "unreachable, or has no default branch" "$E2E_REPO" "$MODE"
                echo 'AUTO_RELEASE_VERDICT_EOF'
              } >> "$GITHUB_OUTPUT"
              echo "::error::wing-commander auto-release verify-e2e: could not read $E2E_REPO's default branch -- is it reachable, and does the App installation cover it?"
            fi
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
          echo "default-branch=$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"

      # specs/055-unattended-e2e-gates D1/D2: the fixture maintainer
      # identity is a dedicated GitHub user account (never a bot), invited
      # as a Write collaborator on the test repository alone, whose
      # fine-grained PAT drives the four human gates later in this job.
      # Checked here, before any of those gates are reached, so a
      # misconfigured credential ends fail-infra before any attempt spend
      # rather than surfacing as a mysterious gate stall.
      - name: Confirm the fixture maintainer identity's credential
        id: maintainer-credential
        if: steps.reachable.outputs.ok == 'true'
        shell: bash
        env:
          MAINTAINER_TOKEN: ${{ secrets.WING_COMMANDER_AUTO_RELEASE_E2E_MAINTAINER_TOKEN }}
          E2E_REPO: ${{ steps.config.outputs.e2e-repo }}
          HEAD_SHA: ${{ needs.detect.outputs.head-sha }}
        run: |
          set -uo pipefail
          if [ -z "$MAINTAINER_TOKEN" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            {
              echo 'verdict<<AUTO_RELEASE_VERDICT_EOF'
              bash .github/actions/_shared/auto-release-verdict.sh "fail-infra" "$HEAD_SHA" "fixture maintainer identity credential" "WING_COMMANDER_AUTO_RELEASE_E2E_MAINTAINER_TOKEN set to a fine-grained PAT for a Write collaborator on the test repository" "unset" "WING_COMMANDER_AUTO_RELEASE_E2E_MAINTAINER_TOKEN"
              echo 'AUTO_RELEASE_VERDICT_EOF'
            } >> "$GITHUB_OUTPUT"
            echo "::error::wing-commander auto-release verify-e2e: WING_COMMANDER_AUTO_RELEASE_E2E_MAINTAINER_TOKEN is unset -- see docs/setup.md."
            exit 0
          fi
          permission="$(GH_TOKEN="$MAINTAINER_TOKEN" gh repo view "$E2E_REPO" --json viewerPermission --jq .viewerPermission 2>/dev/null || true)"
          case "$permission" in
            WRITE|MAINTAIN|ADMIN) : ;;
            *)
              echo "ok=false" >> "$GITHUB_OUTPUT"
              {
                echo 'verdict<<AUTO_RELEASE_VERDICT_EOF'
                bash .github/actions/_shared/auto-release-verdict.sh "fail-infra" "$HEAD_SHA" "fixture maintainer identity credential" "WING_COMMANDER_AUTO_RELEASE_E2E_MAINTAINER_TOKEN authenticates as a Write (or higher) collaborator on the test repository" "gh rejected the token, or viewerPermission was '${permission:-none}'" "WING_COMMANDER_AUTO_RELEASE_E2E_MAINTAINER_TOKEN"
                echo 'AUTO_RELEASE_VERDICT_EOF'
              } >> "$GITHUB_OUTPUT"
              echo "::error::wing-commander auto-release verify-e2e: WING_COMMANDER_AUTO_RELEASE_E2E_MAINTAINER_TOKEN did not authenticate with Write access to $E2E_REPO -- see docs/setup.md."
              exit 0
              ;;
          esac
          login="$(GH_TOKEN="$MAINTAINER_TOKEN" gh api user --jq .login 2>/dev/null || true)"
          if [ -z "$login" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            {
              echo 'verdict<<AUTO_RELEASE_VERDICT_EOF'
              bash .github/actions/_shared/auto-release-verdict.sh "fail-infra" "$HEAD_SHA" "fixture maintainer identity credential" "WING_COMMANDER_AUTO_RELEASE_E2E_MAINTAINER_TOKEN authenticates as a Write (or higher) collaborator on the test repository" "gh rejected the token" "WING_COMMANDER_AUTO_RELEASE_E2E_MAINTAINER_TOKEN"
              echo 'AUTO_RELEASE_VERDICT_EOF'
            } >> "$GITHUB_OUTPUT"
            echo "::error::wing-commander auto-release verify-e2e: WING_COMMANDER_AUTO_RELEASE_E2E_MAINTAINER_TOKEN could not resolve a login via gh api user -- see docs/setup.md."
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
          echo "login=$login" >> "$GITHUB_OUTPUT"

      # Any open issue/PR left by a previous attempt is closed (best-effort)
      # before the reset -- an orphan-reset default branch otherwise leaves
      # a stale open PR pointing at history that no longer exists
      # (research.md D6's consequence). Then the default branch itself is
      # the "per-run branch" (research.md D6): GitHub only evaluates
      # non-ref-scoped triggers like `issues` from the default branch, so
      # scaffolding anywhere else would produce wrapper workflows that never
      # fire.
      - name: Close prior leftovers
        id: cleanup
        if: steps.maintainer-credential.outputs.ok == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          E2E_REPO: ${{ steps.config.outputs.e2e-repo }}
        run: |
          set -uo pipefail

          mapfile -t open_issues < <(gh issue list --repo "$E2E_REPO" --state open --json number --jq '.[].number' 2>/dev/null || true)
          for n in "${open_issues[@]}"; do
            [ -n "$n" ] || continue
            gh issue close "$n" --repo "$E2E_REPO" --comment "Closed by wing-commander's auto-release.yml before a fresh verification attempt." >/dev/null 2>&1 || true
          done
          mapfile -t open_prs < <(gh pr list --repo "$E2E_REPO" --state open --json number --jq '.[].number' 2>/dev/null || true)
          for n in "${open_prs[@]}"; do
            [ -n "$n" ] || continue
            gh pr close "$n" --repo "$E2E_REPO" --comment "Closed by wing-commander's auto-release.yml before a fresh verification attempt." >/dev/null 2>&1 || true
          done

      # specs/049-single-home-release-idioms: the detach-through-push
      # portion of the reset is now the shared _shared/orphan-branch-reset
      # composite -- see
      # specs/049-single-home-release-idioms/contracts/orphan-branch-reset.md.
      # `id: reset` is
      # kept on the follow-up verdict-reporting step (not the composite
      # step itself) so steps.reset.outputs.ok and the job's own `verdict`
      # output wiring below are unchanged.
      - name: Reset the default branch to an empty tree
        id: reset-branch
        if: steps.maintainer-credential.outputs.ok == 'true'
        uses: ./.github/actions/_shared/orphan-branch-reset
        with:
          token: ${{ steps.token.outputs.token }}
          repo: ${{ steps.config.outputs.e2e-repo }}
          branch: ${{ steps.reachable.outputs.default-branch }}
          bot-name: wing-commander-auto-release[bot]
          bot-email: wing-commander-auto-release[bot]@users.noreply.github.com
          workdir: e2e-test-repo
          commit-message: "chore: reset for a fresh end-to-end verification attempt"

      - name: Report the reset outcome
        id: reset
        if: steps.maintainer-credential.outputs.ok == 'true'
        shell: bash
        env:
          OK: ${{ steps.reset-branch.outputs.ok }}
          FAILURE_STAGE: ${{ steps.reset-branch.outputs.failure-stage }}
          E2E_REPO: ${{ steps.config.outputs.e2e-repo }}
          HEAD_SHA: ${{ needs.detect.outputs.head-sha }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -uo pipefail
          if [ "$OK" != "true" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            if [ "$FAILURE_STAGE" = "clone" ]; then
              {
                echo 'verdict<<AUTO_RELEASE_VERDICT_EOF'
                bash .github/actions/_shared/auto-release-verdict.sh "fail-infra" "$HEAD_SHA" "cloning the test repository" "a clone over the scoped App token succeeds" "$(tail -c 500 "$RUNNER_TEMP/orphan-branch-reset-clone-err.txt" 2>/dev/null)" "$E2E_REPO" "$MODE"
                echo 'AUTO_RELEASE_VERDICT_EOF'
              } >> "$GITHUB_OUTPUT"
            else
              {
                echo 'verdict<<AUTO_RELEASE_VERDICT_EOF'
                bash .github/actions/_shared/auto-release-verdict.sh "fail-infra" "$HEAD_SHA" "resetting the test repository default branch" "a force-push of the reset branch succeeds" "$(tail -c 500 "$RUNNER_TEMP/orphan-branch-reset-push-err.txt" 2>/dev/null)" "$E2E_REPO" "$MODE"
                echo 'AUTO_RELEASE_VERDICT_EOF'
              } >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Checkout this repository at the verified head (wrapper fixture + supported Spec Kit version)
        if: steps.reset.outputs.ok == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.detect.outputs.head-sha }}
          persist-credentials: false
          path: e2e-source

      - name: Resolve this repository's supported Spec Kit version
        id: speckit-version
        if: steps.reset.outputs.ok == 'true'
        shell: bash
        env:
          HEAD_SHA: ${{ needs.detect.outputs.head-sha }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -uo pipefail
          v="$(sed -n 's/.*SPECKIT_SUPPORTED_VERSION: "\([^"]*\)".*/\1/p' e2e-source/.github/actions/wing-commander-preflight/action.yml | head -1)"
          if [ -z "$v" ]; then
            # A verdict, not `exit 1`: this job's contract (see the comment
            # above verify-e2e) is that every step degrades to a verdict the
            # report job can name. A hard exit here left `verdict` empty and
            # the failure issue blank.
            echo "ok=false" >> "$GITHUB_OUTPUT"
            {
              echo 'verdict<<AUTO_RELEASE_VERDICT_EOF'
              bash .github/actions/_shared/auto-release-verdict.sh "fail-infra" "$HEAD_SHA" "resolving SPECKIT_SUPPORTED_VERSION" "a SPECKIT_SUPPORTED_VERSION line in .github/actions/wing-commander-preflight/action.yml at the verified head" "no such line matched" "$HEAD_SHA" "$MODE"
              echo 'AUTO_RELEASE_VERDICT_EOF'
            } >> "$GITHUB_OUTPUT"
            echo "::error::wing-commander auto-release verify-e2e: could not resolve SPECKIT_SUPPORTED_VERSION from wing-commander-preflight/action.yml."
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # continue-on-error: the scaffold step's own `command -v uvx` check
      # turns a failed install into a fail-infra verdict the report job can
      # name, where a hard failure here would leave `verdict` empty.
      - name: Install uv (provides uvx for the Spec Kit CLI)
        if: steps.speckit-version.outputs.ok == 'true'
        continue-on-error: true
        uses: astral-sh/setup-uv@v10.0.0

      # Scaffolds `specify init` output at this repository's own pinned
      # version, plus the minimal wrapper set docs/adoption.md documents --
      # copied from THIS repository's own dogfooded wrappers (its local
      # `uses: ./.github/workflows/<stage>.yml` calls rewritten to the
      # published cross-repository form, pinned at the exact unreleased
      # commit under verification, never a tag or `@main` (research.md D7)).
      # Copying this repository's own wrapper files is the single home for
      # that content -- there is no second copy to drift from docs/adoption.md.
      - name: Scaffold the fixture and push it to the test repository
        id: scaffold
        if: steps.speckit-version.outputs.ok == 'true'
        shell: bash
        working-directory: e2e-test-repo
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          E2E_REPO: ${{ steps.config.outputs.e2e-repo }}
          DEFAULT_BRANCH: ${{ steps.reachable.outputs.default-branch }}
          HEAD_SHA: ${{ needs.detect.outputs.head-sha }}
          SPECKIT_VERSION: ${{ steps.speckit-version.outputs.version }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -uo pipefail

          if ! command -v uvx >/dev/null 2>&1; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            {
              echo 'verdict<<AUTO_RELEASE_VERDICT_EOF'
              bash .github/actions/_shared/auto-release-verdict.sh "fail-infra" "$HEAD_SHA" "scaffolding the test repository" "uvx available on the runner" "uvx not found" "$E2E_REPO" "$MODE"
              echo 'AUTO_RELEASE_VERDICT_EOF'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! uvx --from "git+https://github.com/github/spec-kit.git@v${SPECKIT_VERSION}" \
              specify init . --integration claude --script sh --force --ignore-agent-tools \
              > "$RUNNER_TEMP/auto-release-scaffold-install.log" 2>&1; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            {
              echo 'verdict<<AUTO_RELEASE_VERDICT_EOF'
              bash .github/actions/_shared/auto-release-verdict.sh "fail-infra" "$HEAD_SHA" "specify init in the test repository" "specify init exits 0" "$(tail -c 500 "$RUNNER_TEMP/auto-release-scaffold-install.log")" "$E2E_REPO" "$MODE"
              echo 'AUTO_RELEASE_VERDICT_EOF'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          declare -A stage_file=(
            [wing-commander-1-intake.yml]=intake.yml
            [wing-commander-2-clarify.yml]=clarify.yml
            [wing-commander-3-plan.yml]=plan.yml
            [wing-commander-4-tasks.yml]=tasks.yml
            [wing-commander-5-implement.yml]=implement.yml
            [wing-commander-6-finalize.yml]=finalize.yml
            [wing-commander-7-cleanup.yml]=cleanup.yml
            [wing-commander-rebase.yml]=rebase.yml
          )
          mkdir -p .github/workflows
          for f in "${!stage_file[@]}"; do
            stage="${stage_file[$f]}"
            cp "../e2e-source/.github/workflows/$f" ".github/workflows/$f"
            sed -i "s#uses: \./\.github/workflows/${stage}#uses: charlesguse/wing-commander/.github/workflows/${stage}@${HEAD_SHA}#" ".github/workflows/$f"
            # A permanently-configured test-repository WING_COMMANDER_CONTAINER_IMAGE
            # must not leak container mode into a default-runner-turn run
            # (research.md D2). No rewrite on a container-mode turn -- the
            # copied wrapper's existing read of the variable already does
            # the work.
            if [ "$MODE" = "default-runner" ]; then
              # SF2: assert the pattern is actually present before blanking
              # it, so a future reformat of the wrapper's passthrough line
              # (e.g. different quoting or whitespace) can't make this sed
              # silently no-op and leak container mode into a default-
              # runner turn with nothing here noticing.
              if ! grep -q "vars\.WING_COMMANDER_CONTAINER_IMAGE || ''" ".github/workflows/$f"; then
                echo "ok=false" >> "$GITHUB_OUTPUT"
                {
                  echo 'verdict<<AUTO_RELEASE_VERDICT_EOF'
                  bash .github/actions/_shared/auto-release-verdict.sh "fail-infra" "$HEAD_SHA" "blanking the container-image passthrough in $f for this default-runner turn" "the copied wrapper contains vars.WING_COMMANDER_CONTAINER_IMAGE || ''" "pattern not found -- the off-turn suppression sed would have silently done nothing" "$E2E_REPO" "$MODE"
                  echo 'AUTO_RELEASE_VERDICT_EOF'
                } >> "$GITHUB_OUTPUT"
                exit 0
              fi
              sed -i "s/vars\.WING_COMMANDER_CONTAINER_IMAGE || ''/''/" ".github/workflows/$f"
            fi
          done
          # docs/adoption.md's own instruction: replace the literal `main`
          # in the two wrappers whose gate/trigger names it, since the test
          # repository's default branch name is whatever the maintainer chose.
          sed -i "s/== 'main'/== '${DEFAULT_BRANCH}'/" .github/workflows/wing-commander-3-plan.yml
          sed -i "s/branches: \[main\]/branches: [${DEFAULT_BRANCH}]/" .github/workflows/wing-commander-rebase.yml

          git add -A
          git commit --quiet -m "chore: scaffold end-to-end verification fixture at ${HEAD_SHA:0:7}"
          auth_url="https://x-access-token:${GH_TOKEN}@github.com/${E2E_REPO}.git"
          if ! git push --force --quiet "$auth_url" "HEAD:refs/heads/${DEFAULT_BRANCH}" 2>"$RUNNER_TEMP/auto-release-scaffold-push-err.txt"; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            {
              echo 'verdict<<AUTO_RELEASE_VERDICT_EOF'
              bash .github/actions/_shared/auto-release-verdict.sh "fail-infra" "$HEAD_SHA" "pushing the scaffolded fixture" "a force-push of the scaffold succeeds" "$(tail -c 500 "$RUNNER_TEMP/auto-release-scaffold-push-err.txt")" "$E2E_REPO" "$MODE"
              echo 'AUTO_RELEASE_VERDICT_EOF'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ok=true" >> "$GITHUB_OUTPUT"

      # Create, then label, never both at once (research.md D8): creating an
      # issue with a label attached is reported as an `opened` event, not a
      # `labeled` one, so the intake wrapper's `issues: {types: [labeled]}`
      # trigger would never fire.
      - name: Kick off the trivial end-to-end feature
        id: kickoff
        if: steps.scaffold.outputs.ok == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          E2E_REPO: ${{ steps.config.outputs.e2e-repo }}
          HEAD_SHA: ${{ needs.detect.outputs.head-sha }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -uo pipefail
          short_sha="${HEAD_SHA:0:7}"
          {
            echo "Add a single new markdown file under \`docs/\` stating the verified commit and timestamp."
            echo ""
            echo "Opened by wing-commander's own \`auto-release.yml\` scheduled verification run to confirm the published pipeline stages still carry a trivial change through intake, clarify, plan, tasks, implement, review, and cleanup, at commit ${HEAD_SHA}."
          } > "$RUNNER_TEMP/auto-release-e2e-issue-body.md"

          url="$(gh issue create --repo "$E2E_REPO" --title "wing-commander auto-release verification at ${short_sha}" --body-file "$RUNNER_TEMP/auto-release-e2e-issue-body.md" 2>"$RUNNER_TEMP/auto-release-kickoff-err.txt")"
          if [ -z "$url" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            {
              echo 'verdict<<AUTO_RELEASE_VERDICT_EOF'
              bash .github/actions/_shared/auto-release-verdict.sh "fail-infra" "$HEAD_SHA" "creating the kickoff issue" "gh issue create succeeds" "$(tail -c 500 "$RUNNER_TEMP/auto-release-kickoff-err.txt")" "$E2E_REPO" "$MODE"
              echo 'AUTO_RELEASE_VERDICT_EOF'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          issue_number="${url##*/}"

          if ! gh issue edit "$issue_number" --repo "$E2E_REPO" --add-label spec-request >"$RUNNER_TEMP/auto-release-label-err.txt" 2>&1; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            {
              echo 'verdict<<AUTO_RELEASE_VERDICT_EOF'
              bash .github/actions/_shared/auto-release-verdict.sh "fail-infra" "$HEAD_SHA" "labelling the kickoff issue spec-request" "the spec-request label exists and gh issue edit succeeds" "$(tail -c 500 "$RUNNER_TEMP/auto-release-label-err.txt")" "$E2E_REPO" "$MODE"
              echo 'AUTO_RELEASE_VERDICT_EOF'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ok=true" >> "$GITHUB_OUTPUT"
          echo "issue-number=$issue_number" >> "$GITHUB_OUTPUT"
          echo "issue-url=$url" >> "$GITHUB_OUTPUT"

      # Poll over the issue's own state/labels/timeline, plus artifact
      # presence -- never agent narration (research.md D10). Bounded by
      # POLL_BUDGET_SECONDS rather than the step's own `timeout-minutes`, so
      # a timeout still produces a `fail-timeout` verdict instead of the
      # runner killing the step before it can write one. specs/055-
      # unattended-e2e-gates: this loop now also DRIVES all four human gates
      # -- the clarification exchange and the spec-draft/plan/finalize PR
      # merges -- under the fixture maintainer identity's own token, so a
      # decision is attributed to the harness rather than the App (research.md
      # D4, D9). POLL_BUDGET_SECONDS is raised to match the job's own
      # `timeout-minutes: 150` (research.md D13) so gate-driving has room to
      # actually resolve all four gates before the budget itself binds.
      - name: Poll the test repository to a verdict
        id: poll
        if: steps.kickoff.outputs.ok == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          HARNESS_TOKEN: ${{ secrets.WING_COMMANDER_AUTO_RELEASE_E2E_MAINTAINER_TOKEN }}
          HARNESS_LOGIN: ${{ steps.maintainer-credential.outputs.login }}
          E2E_REPO: ${{ steps.config.outputs.e2e-repo }}
          ISSUE: ${{ steps.kickoff.outputs.issue-number }}
          ISSUE_URL: ${{ steps.kickoff.outputs.issue-url }}
          HEAD_SHA: ${{ needs.detect.outputs.head-sha }}
          POLL_BUDGET_SECONDS: "9000"
          MAX_CLARIFICATION_ROUNDS: "3"
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -uo pipefail

          # $5 (evidence_url) defaults to the kickoff issue; a caller that
          # has better evidence (e.g. the test repository run a stall
          # notice names) overrides it. $6 (container_image_configured) is
          # passed through to auto-release-verdict.sh verbatim -- empty
          # defaults to false whenever MODE is "container" (see that
          # script's own comment for why "unknown" must never read as
          # "true", specs/054 MF1); only the `pass` site below has earned
          # an explicit "true".
          write_verdict() {
            local evidence="${5:-$ISSUE_URL}"
            local cic="${6:-}"
            bash .github/actions/_shared/auto-release-verdict.sh "$1" "$HEAD_SHA" "$2" "$3" "$4" "$evidence" "$MODE" "$cic" > "$RUNNER_TEMP/auto-release-verdict.json"
          }
          emit_verdict() {
            {
              echo 'verdict<<AUTO_RELEASE_VERDICT_EOF'
              cat "$RUNNER_TEMP/auto-release-verdict.json"
              echo 'AUTO_RELEASE_VERDICT_EOF'
            } >> "$GITHUB_OUTPUT"
          }

          # The three PR-merge gates share one shape (research.md D6/D9);
          # gate_name is the failing_check string contracts/verdict-
          # extension.md specifies for a fail-gate-stall at that gate.
          declare -A gate_merged=([spec-draft/]=false [plan/]=false [spec/]=false)
          declare -A gate_name=([spec-draft/]="spec-draft PR merge" [plan/]="plan PR merge" [spec/]="finalize PR merge")
          slug=""
          clarification_rounds=0

          state=""
          labels=""
          terminal=false
          rate_limited=""
          while [ "$SECONDS" -lt "$POLL_BUDGET_SECONDS" ]; do
            # --- Clarification gate (research.md D4, D6, D7, D8) ---
            comments_json="$(GH_TOKEN="$HARNESS_TOKEN" gh issue view "$ISSUE" --repo "$E2E_REPO" --json comments --jq '.comments' 2>/dev/null || true)"
            if [ -n "$comments_json" ]; then
              clarify_decision="$(bash .github/actions/_shared/auto-release-e2e-clarify-decision.sh "$comments_json" "$HARNESS_LOGIN" "$clarification_rounds" 2>/dev/null || true)"
              clarify_head="$(printf '%s\n' "$clarify_decision" | head -1)"
              case "$clarify_head" in
                reply)
                  reply_body="$(printf '%s\n' "$clarify_decision" | tail -n +2)"
                  if GH_TOKEN="$HARNESS_TOKEN" gh issue comment "$ISSUE" --repo "$E2E_REPO" --body "$reply_body" >/dev/null 2>&1; then
                    clarification_rounds=$((clarification_rounds + 1))
                  fi
                  ;;
                exhausted)
                  write_verdict "fail-gate-stall" "clarification" \
                    "a reply from the harness resolves the open clarification question within 3 rounds" \
                    "still asking after 3 rounds"
                  emit_verdict
                  exit 0
                  ;;
              esac
            fi

            # --- PR-merge gates (research.md D4, D9, D10) ---
            if [ -z "$slug" ]; then
              spec_draft_head="$(GH_TOKEN="$HARNESS_TOKEN" gh pr list --repo "$E2E_REPO" --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("spec-draft/"))][0].headRefName // empty' 2>/dev/null || true)"
              if [ -n "$spec_draft_head" ]; then
                slug="${spec_draft_head#spec-draft/}"
              fi
            fi
            if [ -n "$slug" ]; then
              for prefix in "spec-draft/" "plan/" "spec/"; do
                [ "${gate_merged[$prefix]}" = "true" ] && continue
                pr_json="$(GH_TOKEN="$HARNESS_TOKEN" gh pr list --repo "$E2E_REPO" --head "${prefix}${slug}" --json number,headRefName,mergeable,mergeStateStatus,isDraft,state 2>/dev/null || echo '[]')"
                merge_decision="$(bash .github/actions/_shared/auto-release-e2e-merge-decision.sh "$pr_json" "$prefix" "$slug" 2>/dev/null || true)"
                merge_head="$(printf '%s\n' "$merge_decision" | head -1)"
                pr_number="$(printf '%s' "$pr_json" | jq -r '.[0].number // "?"' 2>/dev/null || echo '?')"
                case "$merge_head" in
                  merge)
                    merge_number="$(printf '%s\n' "$merge_decision" | tail -n +2)"
                    if GH_TOKEN="$HARNESS_TOKEN" gh pr merge "$merge_number" --merge --repo "$E2E_REPO" >/dev/null 2>&1; then
                      gate_merged[$prefix]="true"
                    fi
                    ;;
                  conflicting)
                    write_verdict "fail-gate-stall" "${gate_name[$prefix]}" "gh pr merge succeeds" "PR #${pr_number}: CONFLICTING"
                    emit_verdict
                    exit 0
                    ;;
                  blocked)
                    write_verdict "fail-gate-stall" "${gate_name[$prefix]}" "gh pr merge succeeds" "PR #${pr_number}: required check blocked"
                    emit_verdict
                    exit 0
                    ;;
                  wrong-attempt)
                    write_verdict "fail-gate-stall" "${gate_name[$prefix]}" "the PR at this branch belongs to the current attempt" "PR #${pr_number} belongs to a previous attempt"
                    emit_verdict
                    exit 0
                    ;;
                esac
              done
            fi

            info="$(gh issue view "$ISSUE" --repo "$E2E_REPO" --json state,labels 2>"$RUNNER_TEMP/auto-release-poll-err.txt")" || info=""
            if [ -n "$info" ]; then
              state="$(printf '%s' "$info" | jq -r '.state')"
              labels="$(printf '%s' "$info" | jq -r '[.labels[].name] | join(",")')"
              if [ "$state" = "CLOSED" ] || printf ',%s,' "$labels" | grep -q ',stage:stalled,'; then
                terminal=true
                break
              fi
            # A rate limit is an infrastructure condition, not the pipeline
            # under test taking too long -- reported distinctly rather than
            # left to exhaust the poll budget and read as fail-timeout
            # (specs/054 MF1: `report` classifies fail-infra as
            # infrastructure, never a pipeline defect).
            elif grep -qi 'rate limit' "$RUNNER_TEMP/auto-release-poll-err.txt" 2>/dev/null; then
              rate_limited="$(tail -c 500 "$RUNNER_TEMP/auto-release-poll-err.txt")"
              break
            fi
            sleep 30
          done

          if [ -n "$rate_limited" ]; then
            write_verdict "fail-infra" "polling the test repository for a terminal state" \
              "gh issue view succeeds within the poll budget" \
              "GitHub API rate limit encountered while polling: $rate_limited"
            emit_verdict
            exit 0
          fi

          if [ "$terminal" != "true" ]; then
            write_verdict "fail-timeout" "end-to-end run reaching a terminal state" \
              "closed with stage:done, or stage:stalled, within the poll budget" \
              "still open with labels [$labels] after ${POLL_BUDGET_SECONDS}s"
            emit_verdict
            exit 0
          fi

          if [ "$state" != "CLOSED" ] || ! printf ',%s,' "$labels" | grep -q ',stage:done,'; then
            # A container-mode turn that never actually resolved/pulled/
            # authorized the reference image fails a stage's own
            # verify-image-prerequisites job, which wing-commander-chain-
            # stop-notice reports as an issue comment naming the job and
            # linking that stage's own run -- readable with the same
            # Issues-read permission this poll already holds, so this
            # needs no new grant (FR-017; contrast research.md D7/T009,
            # which is why the harder case -- the variable left unset
            # entirely, so verify-image-prerequisites never even attempts
            # a pull -- is not distinguishable from this comment scan
            # alone; see the T009 status note in tasks.md).
            image_failure_comment="$(gh api "repos/${E2E_REPO}/issues/${ISSUE}/comments" --paginate --jq '.[].body' 2>/dev/null | grep -m1 'verify-image-prerequisites job failed' || true)"
            if [ "$MODE" = "container" ] && [ -n "$image_failure_comment" ]; then
              run_url="$(printf '%s' "$image_failure_comment" | grep -oE 'https://[^ )]+/actions/runs/[0-9]+' | head -1)"
              [ -n "$run_url" ] || run_url="$ISSUE_URL"
              write_verdict "fail-infra" "container image pulled/authorized for the stage that ran it" \
                "the reference image resolves and its registry credentials (if any) are accepted" \
                "verify-image-prerequisites failed: $(printf '%s' "$image_failure_comment" | head -c 300)" \
                "$run_url" "false"
              emit_verdict
              exit 0
            fi
            write_verdict "fail-incomplete" "end-to-end run reaching stage:done" \
              "issue closed with the stage:done label" \
              "state=$state labels=[$labels]"
            emit_verdict
            exit 0
          fi

          # gh api --jq prints raw (unquoted) strings, one per line -- `jq -s
          # '.'` expects each chunk to already be valid JSON and errors on a
          # bareword like `spec-request`, so it must slurp as raw input
          # instead (#358: the mismatch silently produced timeline=[] on a
          # real, fully-successful run, via the `|| timeline='[]'` fallback).
          timeline="$(gh api "repos/${E2E_REPO}/issues/${ISSUE}/timeline" --paginate --jq '.[] | select(.event=="labeled") | .label.name' 2>/dev/null | jq -R -s -c 'split("\n") | map(select(length > 0))' 2>/dev/null)" || timeline='[]'
          missing_stage=""
          # stage:clarify is never applied as an issue label by any stage
          # workflow (clarify.yml's only reference is stall-notice prose,
          # and wing-commander-chain-stop-notice always adds stage:stalled
          # instead) -- requiring it here made a genuine pass impossible.
          for s in stage:spec stage:plan stage:tasks stage:implement stage:review; do
            if ! printf '%s' "$timeline" | jq -e --arg s "$s" 'index($s) != null' >/dev/null 2>&1; then
              missing_stage="$s"
              break
            fi
          done
          if [ -n "$missing_stage" ]; then
            write_verdict "fail-wrong-output" "every intermediate stage label present in the issue timeline" \
              "$missing_stage present at some point in the timeline" "timeline=$timeline"
            emit_verdict
            exit 0
          fi

          # slug is normally already known from the merge-gate driving above
          # (research.md D10); this is the fallback for the case where the
          # loop never resolved it (e.g. the pass path was reached on the
          # very first check after the finalize PR had already merged
          # between iterations) -- one home, not a second derivation.
          if [ -z "$slug" ]; then
            slug="$(gh api "repos/${E2E_REPO}/contents/specs" --jq '[.[] | select(.type=="dir")][0].name // empty' 2>/dev/null || true)"
          fi
          missing_file=""
          if [ -z "$slug" ]; then
            missing_file="specs/<slug>/"
          else
            for name in spec.md plan.md tasks.md; do
              if ! gh api "repos/${E2E_REPO}/contents/specs/${slug}/${name}" >/dev/null 2>&1; then
                missing_file="specs/${slug}/${name}"
                break
              fi
            done
          fi
          if [ -n "$missing_file" ]; then
            write_verdict "fail-wrong-output" "specs/<slug>/{spec,plan,tasks}.md present after stage:done" \
              "$missing_file present in the default branch" "not found"
            emit_verdict
            exit 0
          fi

          # --- Clarification-gate pass assertion (research.md D12) ---
          # Reaching stage:done is not on its own evidence the gate was
          # satisfied (FR-016) -- assert a harness reply followed every
          # question the issue's comment history ever carried.
          comments_json="$(GH_TOKEN="$HARNESS_TOKEN" gh issue view "$ISSUE" --repo "$E2E_REPO" --json comments --jq '.comments' 2>/dev/null || echo '[]')"
          markers_json="$(printf '%s' "$comments_json" | jq -c '[ .[] | select((.body // "") | contains("[!IMPORTANT]")) | select((((.body // "") | contains("Answer the open clarification questions"))) or (((.body // "") | contains("Answer the remaining clarification questions")))) ]' 2>/dev/null || echo '[]')"
          marker_count="$(printf '%s' "$markers_json" | jq 'length' 2>/dev/null || echo 0)"
          clarification_gate_ok=true
          if [ "$marker_count" -gt 0 ]; then
            clarification_gate_ok="$(printf '%s' "$comments_json" | jq -r --argjson markers "$markers_json" --arg login "$HARNESS_LOGIN" '
              [ $markers[] as $m
                | ( [ .[] | select((.author.login // "") == $login and (.createdAt // "") > $m.createdAt) ] | length > 0 )
              ] | all
            ' 2>/dev/null || echo false)"
          fi
          if [ "$clarification_gate_ok" != "true" ]; then
            write_verdict "fail-wrong-output" "clarification gate answered before stage:done" \
              "a harness reply after every open question" "question opened, never answered"
            emit_verdict
            exit 0
          fi

          # --- Gate evidence for the report job (research.md D12, FR-017,
          # FR-019) -- presentation-layer only, no verdict schema change. ---
          spec_draft_pr="$(GH_TOKEN="$HARNESS_TOKEN" gh pr list --repo "$E2E_REPO" --state merged --head "spec-draft/${slug}" --json number,mergedAt 2>/dev/null | jq -c '.[0] // null' 2>/dev/null || echo null)"
          plan_pr="$(GH_TOKEN="$HARNESS_TOKEN" gh pr list --repo "$E2E_REPO" --state merged --head "plan/${slug}" --json number,mergedAt 2>/dev/null | jq -c '.[0] // null' 2>/dev/null || echo null)"
          finalize_pr="$(GH_TOKEN="$HARNESS_TOKEN" gh pr list --repo "$E2E_REPO" --state merged --head "spec/${slug}" --json number,mergedAt 2>/dev/null | jq -c '.[0] // null' 2>/dev/null || echo null)"
          clarification_comment_ids="$(printf '%s' "$comments_json" | jq -c --argjson markers "$markers_json" --arg login "$HARNESS_LOGIN" '{questions: [ $markers[].id ], replies: [ .[] | select((.author.login // "") == $login) | .id ]}' 2>/dev/null || echo '{"questions":[],"replies":[]}')"
          {
            echo "spec-draft-pr=$spec_draft_pr"
            echo "plan-pr=$plan_pr"
            echo "finalize-pr=$finalize_pr"
            echo "clarification-rounds-answered=$clarification_rounds"
            echo "clarification-comment-ids=$clarification_comment_ids"
          } >> "$GITHUB_OUTPUT"

          # The one call site that has earned container_image_configured:
          # true -- reached only once the full scaffolded chain closed
          # stage:done, every intermediate stage label was observed, and
          # the expected spec artifacts exist (specs/054 MF1).
          write_verdict "pass" "" "" "" "$ISSUE_URL" "true"
          emit_verdict

  # Patch-vs-minor signal collection (research.md D5) plus tag-collision
  # detection (data-model.md "Version decision"). Never produces `major` --
  # there is no code path here that can (User Story 4, T019/T020).
  decide-version:
    needs: [detect, verify-e2e]
    if: fromJSON(needs.verify-e2e.outputs.verdict || '{}').outcome == 'pass' && vars.WING_COMMANDER_AUTO_RELEASE_PAUSED != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      next-version: ${{ steps.decide.outputs.next-version }}
      collision: ${{ steps.decide.outputs.collision }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Compute the next version
        id: decide
        shell: bash
        env:
          LATEST_TAG: ${{ needs.detect.outputs.latest-tag }}
          HEAD_SHA: ${{ needs.detect.outputs.head-sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bump="patch"
          # Every commit in range, NOT `--merges`: this repository squash-
          # merges, so a PR lands as one single-parent commit whose subject
          # ends in "(#N)", and `--merges` saw none of them -- 15 PRs since
          # v2.7.2, zero iterations, the minor arm below unreachable. A true
          # merge commit's "Merge pull request #N" is still recognised.
          while IFS= read -r commit_sha; do
            [ -n "$commit_sha" ] || continue
            subject="$(git log -1 --format=%s "$commit_sha")"
            pr_number=""
            case "$subject" in
              *"Merge pull request #"*)
                pr_number="${subject#*Merge pull request #}"
                pr_number="${pr_number%% *}"
                ;;
              *"(#"*")"*)
                pr_number="${subject##*(#}"
                pr_number="${pr_number%%)*}"
                ;;
            esac
            [ -n "$pr_number" ] || continue
            labels="$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | join(",")' 2>/dev/null || true)"
            case ",$labels," in
              *,release:minor,*) bump="minor" ;;
            esac
          done < <(git log "${LATEST_TAG}..${HEAD_SHA}" --format=%H)

          version="${LATEST_TAG#v}"
          IFS='.' read -r major minor patch <<< "$version"
          if [ "$bump" = "minor" ]; then
            next="v${major}.$((minor + 1)).0"
          else
            next="v${major}.${minor}.$((patch + 1))"
          fi

          collision=false
          if git rev-parse -q --verify "refs/tags/$next" >/dev/null; then
            collision=true
          fi

          {
            echo "bump=$bump"
            echo "next-version=$next"
            echo "collision=$collision"
          } >> "$GITHUB_OUTPUT"
          echo "decide-version: bump=$bump next-version=$next collision=$collision." >> "$GITHUB_STEP_SUMMARY"

  # `release.yml` is workflow_dispatch-only and cannot be `uses:`-invoked, so
  # `gh workflow run` is the only mechanism (research.md D12) -- run with
  # `github.token`, never the wing-commander App token (that token has no
  # `actions` permission; a documented 403, issue/spec 005). This job
  # neither waits for nor trusts release.yml's own run conclusion (FR-007,
  # FR-007a) -- it identifies its own run by evidence (title token + time
  # bound) and decides whether a release happened from tag state alone. The
  # full contract for both is
  # specs/048-correlated-release-dispatch/contracts/release-handover-contract.md
  # (FR-019).
  dispatch-release:
    needs: [detect, decide-version]
    # `!cancelled() && result == 'success'` rather than the bare implicit
    # success(): an `if` that compares a need's output against 'false' with
    # no status-check function is the shape Gate 15 rejects, because GitHub
    # never evaluates it when the need was skipped -- the arm reads like a
    # guard and gates nothing. Spelled out, it runs exactly when
    # decide-version succeeded AND reported no collision, and skips (never
    # dispatches) when verify-e2e did not pass, decide-version failed, or
    # the run was cancelled.
    if: ${{ !cancelled() && needs.decide-version.result == 'success' && needs.decide-version.outputs.collision == 'false' && vars.WING_COMMANDER_AUTO_RELEASE_PAUSED != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    outputs:
      # `found` | `ambiguous` | `not-observed` -- diagnostic only, never
      # itself the release verdict (see `tag-matches` below, FR-007a).
      correlation: ${{ steps.watch.outputs.correlation }}
      correlated-run-id: ${{ steps.watch.outputs.correlated-run-id }}
      correlated-run-url: ${{ steps.watch.outputs.correlated-run-url }}
      # The sole authority for "did this attempt's release happen"
      # (FR-007): the exact version tag exists and points at the verified
      # head, independent of `correlation` and of release.yml's own run
      # conclusion.
      tag-matches: ${{ steps.watch.outputs.tag-matches }}
      # The report's diagnostic wording (FR-006/SC-004) is written once in
      # specs/048-correlated-release-dispatch/contracts/release-handover-contract.md;
      # request-time and dispatch-rejected feed it, not restated here.
      request-time: ${{ steps.watch.outputs.request-time }}
      dispatch-rejected: ${{ steps.watch.outputs.dispatch-rejected }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Dispatch release.yml and correlate its run
        id: watch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.decide-version.outputs.next-version }}
          VERIFIED_HEAD: ${{ needs.detect.outputs.head-sha }}
        run: |
          set -uo pipefail

          # The dispatching run's own id+attempt is unique across this
          # repository's entire run history (GitHub's own guarantee), so
          # two attempts can never mint the same token by construction
          # (FR-002a) -- no counter or random value is needed. Minted once,
          # reused for the dispatch call, the correlation search, and the
          # report.
          token="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          request_time="$(date -u +%s)"
          request_time_iso="$(date -u -d "@$request_time" +"%Y-%m-%dT%H:%M:%SZ")"

          correlation="not-observed"
          correlated_run_id=""
          correlated_run_url=""
          dispatch_rejected=false

          if ! gh workflow run release.yml -f "version=${VERSION}" -f breaking=false -f breaking-notes= -f "attempt-token=${token}" -f "commit=${VERIFIED_HEAD}"; then
            dispatch_rejected=true
            echo "::error::wing-commander auto-release dispatch-release: gh workflow run release.yml was rejected."
          else
            # Correlate by evidence, never by recency (FR-001): a
            # release.yml run whose title carries this attempt's own
            # token, started after this attempt's own request (FR-002,
            # FR-002a, FR-003). Zero, one, or more than one match are three
            # distinct outcomes (FR-004, FR-005), never collapsed by
            # picking "the newest" among them.
            attempt=0
            while [ "$attempt" -lt 12 ]; do
              rows="$(gh run list --workflow=release.yml --json databaseId,displayTitle,createdAt,url -L 20 2>/dev/null || true)"
              count=0
              match_id=""
              match_url=""
              while IFS=$'\t' read -r row_id row_title row_created row_url; do
                [ -n "$row_id" ] || continue
                case "$row_title" in
                  *"[attempt:${token}]"*) ;;
                  *) continue ;;
                esac
                created_epoch="$(date -u -d "$row_created" +%s 2>/dev/null || echo 0)"
                if [ "$created_epoch" -ge "$request_time" ]; then
                  count=$((count + 1))
                  match_id="$row_id"
                  match_url="$row_url"
                fi
              done < <(printf '%s' "$rows" | jq -r '.[] | [.databaseId, .displayTitle, .createdAt, .url] | @tsv')

              if [ "$count" -eq 1 ]; then
                correlation="found"
                correlated_run_id="$match_id"
                correlated_run_url="$match_url"
                break
              elif [ "$count" -ge 2 ]; then
                correlation="ambiguous"
                break
              fi

              attempt=$((attempt + 1))
              [ "$attempt" -lt 12 ] && sleep 5
            done
          fi

          # A correlated run may still be mid-flight (checkout, lint, tag
          # creation) the instant the loop above exits; reading tag state
          # before it reaches a terminal status would file a false
          # "release dispatch failed" report while the release succeeds
          # moments later. Wait for that run's status alone -- never its
          # conclusion, which plays no part in the verdict below -- to go
          # terminal before ever reading tag state. When no single run was
          # found to wait on, wait a fixed bounded interval instead.
          if [ "$correlation" = "found" ]; then
            wait_attempt=0
            while [ "$wait_attempt" -lt 60 ]; do
              run_status="$(gh run view "$correlated_run_id" --json status --jq .status 2>/dev/null || echo "")"
              [ "$run_status" = "completed" ] && break
              wait_attempt=$((wait_attempt + 1))
              sleep 10
            done
          else
            sleep 90
          fi

          # "Released" is decided from tag state alone (FR-007, FR-007a,
          # research.md D5) -- after the correlation search concludes and
          # the wait above, regardless of either's outcome, and
          # independent of whether the dispatch itself was rejected. A
          # fresh, post-dispatch fetch, never a value read before the
          # dispatch.
          git fetch origin "refs/tags/${VERSION}:refs/tags/${VERSION}" --quiet 2>/dev/null || true
          tag_matches=false
          if git rev-parse -q --verify "refs/tags/${VERSION}^{commit}" >/dev/null 2>&1; then
            if [ "$(git rev-parse "${VERSION}^{commit}")" = "$VERIFIED_HEAD" ]; then
              tag_matches=true
            fi
          fi

          {
            echo "correlation=$correlation"
            echo "correlated-run-id=$correlated_run_id"
            echo "correlated-run-url=$correlated_run_url"
            echo "tag-matches=$tag_matches"
            echo "request-time=$request_time_iso"
            echo "dispatch-rejected=$dispatch_rejected"
          } >> "$GITHUB_OUTPUT"

  # The only place this feature writes anything maintainer-facing
  # (contracts/release-dispatch.md Reporting). Reads whichever prior jobs
  # actually ran -- `always()` so a paused/no-op/failed run still reports.
  report:
    if: always() && vars.WING_COMMANDER_AUTO_RELEASE_PAUSED != 'true'
    needs: [detect, verify-e2e, decide-version, dispatch-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      # Same reason as verify-e2e's checkout above: this job calls a local
      # shell helper and a local composite (`_shared/auto-release-
      # verdict.sh`, `uses: ./_shared/durable-failure-issue`) and had no
      # checkout at all.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Determine this run's outcome
        id: outcome
        shell: bash
        env:
          # Still needed after specs/049 moved the issue mechanics into the
          # durable-failure-issue composite: the branch-advanced/
          # release-failed classifier below reads this repository's default
          # branch with `gh repo view` (specs/048 FR-013).
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.detect.outputs.head-sha }}
          HAS_NEW_WORK: ${{ needs.detect.outputs.has-new-work }}
          TAG_EXISTS: ${{ needs.detect.outputs.tag-exists }}
          LATEST_TAG: ${{ needs.detect.outputs.latest-tag }}
          VERDICT_JSON: ${{ needs.verify-e2e.outputs.verdict }}
          PAUSED: ${{ needs.verify-e2e.outputs.paused }}
          # specs/055-unattended-e2e-gates FR-019/FR-025: gate evidence for
          # a pass verdict's summary, read only on the pass path below.
          SPEC_DRAFT_PR: ${{ needs.verify-e2e.outputs.spec-draft-pr }}
          PLAN_PR: ${{ needs.verify-e2e.outputs.plan-pr }}
          FINALIZE_PR: ${{ needs.verify-e2e.outputs.finalize-pr }}
          CLARIFICATION_ROUNDS_ANSWERED: ${{ needs.verify-e2e.outputs.clarification-rounds-answered }}
          CLARIFICATION_COMMENT_IDS: ${{ needs.verify-e2e.outputs.clarification-comment-ids }}
          NEXT_VERSION: ${{ needs.decide-version.outputs.next-version }}
          COLLISION: ${{ needs.decide-version.outputs.collision }}
          # The sole authority for "released" (FR-007, FR-007a) -- see
          # specs/048-correlated-release-dispatch/contracts/release-handover-contract.md.
          TAG_MATCHES: ${{ needs.dispatch-release.outputs.tag-matches }}
          CORRELATION: ${{ needs.dispatch-release.outputs.correlation }}
          CORRELATED_RUN_ID: ${{ needs.dispatch-release.outputs.correlated-run-id }}
          CORRELATED_RUN_URL: ${{ needs.dispatch-release.outputs.correlated-run-url }}
          # The ambiguous/not-observed/rejected diagnostic wording (FR-006,
          # SC-004) is written once -- see
          # specs/048-correlated-release-dispatch/contracts/release-handover-contract.md.
          REQUEST_TIME: ${{ needs.dispatch-release.outputs.request-time }}
          DISPATCH_REJECTED: ${{ needs.dispatch-release.outputs.dispatch-rejected }}
          # #325: each need's RESULT alongside its outputs. A job that
          # crashed before writing its outputs hands this job empty strings,
          # and every branch below was written for a different situation --
          # a detect crash read as "no release tag exists yet", a
          # decide-version crash as "release dispatch failed", both filing
          # nothing useful or pointing at a run that never existed.
          DETECT_RESULT: ${{ needs.detect.result }}
          VERIFY_RESULT: ${{ needs.verify-e2e.result }}
          DECIDE_RESULT: ${{ needs.decide-version.result }}
          DISPATCH_RESULT: ${{ needs.dispatch-release.result }}
        run: |
          set -uo pipefail

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          # detect may have crashed before reporting a head (#325); the
          # title must still name something. Every report site shares this
          # one title (specs/049: the durable-failure-issue composite,
          # below, owns the dedup-by-label lookup/create/comment/close
          # mechanics -- this step only decides WHETHER to call it and with
          # what title/body).
          head_short="${HEAD_SHA:0:7}"
          [ -n "$head_short" ] || head_short="an unresolved head"
          echo "title=Auto-release verification failed at ${head_short}" >> "$GITHUB_OUTPUT"

          # The close decision carries its own closing note, which the
          # composite step below posts verbatim. Two paths close a standing
          # report -- the quiet day whose latest tag already points at HEAD,
          # and this attempt's own release -- and they name different
          # versions (NEXT_VERSION is empty on the quiet-day path, where
          # decide-version never ran), so the note is decided here rather
          # than templated into the `with:` block.
          close_failure_on_success() {
            local resolved_note="${1:-${NEXT_VERSION} released.}"
            {
              echo "action=close"
              echo "close-comment=Resolved: ${resolved_note}"
            } >> "$GITHUB_OUTPUT"
          }

          # #325: a need whose job ended `failure` wrote no outputs, so
          # nothing below can be read off them. File it as infrastructure,
          # naming the job and this run, under the same label -- the
          # maintainer sees one issue for "auto-release is not working"
          # whatever the layer. `cancelled` is the run being stopped, not
          # a failure: summarised, never filed. `skipped` and `success`
          # fall through to the outputs, which then mean what they say.
          # The one home of the failure body's shape (data-model.md "Failure
          # report": classification, verified head, failing check, expected,
          # observed, evidence). Every filing path below calls this; none
          # spells the fields out itself.
          write_failure_body() {
            local classification="$1" failing_check="$2" expected="$3" observed="$4" evidence="$5" mode="$6"
            {
              echo "**Classification**: ${classification}"
              echo ""
              echo "**Verified head**: ${HEAD_SHA:-unknown (detect did not report one)}"
              echo ""
              echo "**Mode**: ${mode}"
              echo ""
              echo "**Failing check**: ${failing_check}"
              echo ""
              echo "**Expected**: ${expected}"
              echo ""
              echo "**Observed**: ${observed}"
              echo ""
              echo "**Evidence**: ${evidence}"
            } > "$RUNNER_TEMP/auto-release-failure-body.md"
          }

          file_job_failure() {
            local job="$1" role="$2" mode="${3:-unknown (this run did not reach verify-e2e, or its mode could not be read)}"
            echo "infrastructure failure: the ${job} job did not succeed" >> "$GITHUB_STEP_SUMMARY"
            write_failure_body "infrastructure (job failure)" \
              "the \`${job}\` job (${role}) ended with result \`failure\` before writing its outputs" \
              "the job to succeed, or to degrade to a verdict this report could name" \
              "no outputs from \`${job}\`; nothing downstream of it ran, and nothing was cut" \
              "${RUN_URL}" "$mode"
            echo "action=report" >> "$GITHUB_OUTPUT"
          }

          case "$DETECT_RESULT" in
            failure)
              file_job_failure detect "resolving the latest release tag and the unreleased head"
              exit 0
              ;;
            cancelled)
              echo "run cancelled during detect -- nothing verified, nothing cut" >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
          esac

          # No new work: verify-e2e never ran, so VERDICT_JSON is empty --
          # that must never be misread as a verification failure. Two
          # distinctly worded no-op lines (FR-003 vs FR-004): a baseline tag
          # exists and HEAD already matches it, or no baseline tag exists at
          # all yet to compare against.
          if [ "$HAS_NEW_WORK" != "true" ]; then
            if [ "$TAG_EXISTS" = "true" ]; then
              echo "no new work since ${LATEST_TAG}" >> "$GITHUB_STEP_SUMMARY"
              # The latest tag already points at HEAD, so a standing
              # failure issue from an earlier attempt is stale -- close it
              # here too, not only on the TAG_MATCHES branch below, or a
              # run that tagged successfully once never has another chance
              # to self-heal (every later run takes this same early exit).
              close_failure_on_success "${LATEST_TAG} already released."
            else
              echo "no release tag exists yet -- nothing to compare against, nothing cut" >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi

          # A cancelled verify-e2e wrote no verdict either, and is the run
          # being stopped (a hung poll cancelled by hand), not a failure:
          # summarised, never filed -- the same rule as the other three
          # jobs (#325).
          case "$VERIFY_RESULT" in
            cancelled)
              echo "run cancelled during verify-e2e -- nothing verified, nothing cut" >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
          esac

          # verify-e2e's contract is a verdict on every path, but a job that
          # dies before any step writes one (a runner failure, an action
          # that cannot download) hands this job an empty string; jq on
          # empty input prints nothing and exits 0, so every field below
          # would render blank rather than "unknown". Substitute a verdict
          # that says exactly that and points at this run. The observed
          # text follows the job's own result: a job that succeeded and
          # still handed over no JSON object did not "stop", it broke its
          # contract, and the body must not claim otherwise.
          if ! printf '%s' "$VERDICT_JSON" | jq -e 'type == "object"' >/dev/null 2>&1; then
            if [ "$VERIFY_RESULT" = "success" ]; then
              no_verdict_observed="the job succeeded but its verdict output is not a JSON object (contract broken; the verdict chain in verify-e2e's outputs: block dropped it)"
            else
              no_verdict_observed="the job stopped before any step wrote one (job result: ${VERIFY_RESULT:-unknown})"
            fi
            VERDICT_JSON="$(bash .github/actions/_shared/auto-release-verdict.sh "fail-infra" "$HEAD_SHA" "verify-e2e produced no verdict" "a JSON verdict from verify-e2e on every path" "$no_verdict_observed" "$RUN_URL")"
          fi
          outcome="$(printf '%s' "$VERDICT_JSON" | jq -r '.outcome // empty' 2>/dev/null || true)"
          mode="$(printf '%s' "$VERDICT_JSON" | jq -r '.mode // "unknown"' 2>/dev/null || echo unknown)"
          # FR-009 Acceptance Scenario: a paused run must read as "container
          # mode not exercised: paused", never a plain default-runner pass
          # that looks the same as an unpaused rotation turn.
          if [ "$PAUSED" = "true" ]; then
            mode="${mode} (container mode not exercised: paused)"
          fi

          if [ "$outcome" != "pass" ]; then
            failing_check="$(printf '%s' "$VERDICT_JSON" | jq -r '.failing_check // "unknown"' 2>/dev/null || echo unknown)"
            expected="$(printf '%s' "$VERDICT_JSON" | jq -r '.expected // "unknown"' 2>/dev/null || echo unknown)"
            observed="$(printf '%s' "$VERDICT_JSON" | jq -r '.observed // "unknown"' 2>/dev/null || echo unknown)"
            evidence_url="$(printf '%s' "$VERDICT_JSON" | jq -r '.evidence_url // "unknown"' 2>/dev/null || echo unknown)"
            # specs/055-unattended-e2e-gates FR-021: a stalled gate is
            # classified distinctly from both an infrastructure problem and
            # a generic pipeline defect (contracts/verdict-extension.md).
            case "$outcome" in
              fail-infra) classification="infrastructure" ;;
              fail-gate-stall) classification="gate stall" ;;
              *) classification="pipeline defect" ;;
            esac
            echo "verification failed: ${failing_check} (mode: ${mode})" >> "$GITHUB_STEP_SUMMARY"
            if [ "$classification" = "gate stall" ]; then
              write_failure_body "${classification} (${outcome:-unknown}) -- the harness attempted to drive this gate and could not; distinct from an infrastructure failure (misconfiguration) or a pipeline defect (a stage bug)" \
                "$failing_check" "$expected" "$observed" "$evidence_url" "$mode"
            else
              write_failure_body "${classification} (${outcome:-unknown})" "$failing_check" "$expected" "$observed" "$evidence_url" "$mode"
            fi
            echo "action=report" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # specs/055-unattended-e2e-gates FR-019/FR-025: name all four
          # gates and their evidence on a pass outcome, reading the poll
          # step's own evidence-gathering outputs (research.md D12,
          # data-model.md's Gate evidence table). Presentation only -- the
          # verdict JSON schema is unchanged.
          if [ -n "$CLARIFICATION_ROUNDS_ANSWERED" ] && [ "$CLARIFICATION_ROUNDS_ANSWERED" != "0" ]; then
            clarification_line="clarification: answered (${CLARIFICATION_ROUNDS_ANSWERED} round(s); comments ${CLARIFICATION_COMMENT_IDS:-unknown})"
          else
            clarification_line="clarification: not opened"
          fi
          {
            echo "gates driven:"
            echo "- ${clarification_line}"
            echo "- spec-draft PR merge: ${SPEC_DRAFT_PR:-null}"
            echo "- plan PR merge: ${PLAN_PR:-null}"
            echo "- finalize PR merge: ${FINALIZE_PR:-null}"
          } >> "$GITHUB_STEP_SUMMARY"

          # Verification passed, so decide-version ran (#325): a crash there
          # left COLLISION and TAG_MATCHES empty, which used to fall
          # through to "release dispatch failed" for a release that was
          # never dispatched.
          case "$DECIDE_RESULT" in
            failure)
              file_job_failure decide-version "computing the next version from the merged pull requests' labels" "$mode"
              exit 0
              ;;
            cancelled)
              echo "run cancelled during decide-version -- verification passed, nothing cut" >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
          esac

          if [ "$COLLISION" = "true" ]; then
            echo "version collision: ${NEXT_VERSION} already tagged" >> "$GITHUB_STEP_SUMMARY"
            {
              echo "**Classification**: version collision"
              echo ""
              echo "**Verified head**: ${HEAD_SHA}"
              echo ""
              echo "**Computed next version**: ${NEXT_VERSION} already exists as a tag -- no dispatch was attempted."
            } > "$RUNNER_TEMP/auto-release-failure-body.md"
            echo "action=report" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # #325: no outcome at all means dispatch-release never wrote one --
          # the job crashed (infrastructure) or never ran.
          if [ "$DISPATCH_RESULT" = "failure" ]; then
            file_job_failure dispatch-release "dispatching release.yml and correlating its run" "$mode"
            exit 0
          fi
          if [ -z "$TAG_MATCHES" ]; then
            echo "dispatch-release did not run (result: ${DISPATCH_RESULT:-unknown}) -- nothing cut" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # `correlation` is diagnostic-only context (FR-006), folded onto
          # whichever primary outcome below applies -- never a competing
          # verdict, and never appended on its own when TAG_MATCHES is true
          # (data-model.md "Release outcome").
          correlation_note=""
          if [ "$DISPATCH_REJECTED" = "true" ]; then
            correlation_note=" (the dispatch of ${NEXT_VERSION} requested at ${REQUEST_TIME} was rejected outright)"
          elif [ "$CORRELATION" = "ambiguous" ]; then
            correlation_note=" (own run could not be uniquely identified among the candidate runs matched for ${NEXT_VERSION} requested at ${REQUEST_TIME})"
          elif [ "$CORRELATION" = "not-observed" ]; then
            correlation_note=" (own run was not observed within the correlation window for ${NEXT_VERSION} requested at ${REQUEST_TIME})"
          fi

          # "Released" is decided from tag state alone (FR-007, FR-007a),
          # independent of `CORRELATION` and of release.yml's own run
          # conclusion (research.md D5) -- a release that happened but was
          # never correlated is still reported as a release.
          if [ "$TAG_MATCHES" = "true" ]; then
            if [ "$CORRELATION" = "found" ]; then
              echo "released ${NEXT_VERSION} (mode: ${mode}) -- [correlated run](${CORRELATED_RUN_URL})" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "released ${NEXT_VERSION} (mode: ${mode}) -- own run not correlated" >> "$GITHUB_STEP_SUMMARY"
            fi
            close_failure_on_success
            exit 0
          fi

          correlated_line="not correlated (see tag state below)"
          [ "$CORRELATION" = "found" ] && correlated_line="${CORRELATED_RUN_URL}"

          # tag_matches is false: one more independent read classifies why
          # (FR-013, research.md D5) -- a live read at report time, not
          # detect's stale head-sha, and needing no signal out of
          # release.yml's own run beyond what git itself already records.
          # This job can run off a `schedule` trigger, whose event payload
          # carries no `repository` (unlike release.yml's own
          # workflow_dispatch-only Checkout, which reads
          # github.event.repository.default_branch directly) -- so the
          # default branch is read live here, the same way detect already
          # reads a target repository's default branch above.
          default_branch="$(gh repo view "$GITHUB_REPOSITORY" --json defaultBranchRef --jq '.defaultBranchRef.name // empty' 2>/dev/null || true)"
          [ -n "$default_branch" ] || default_branch="main"
          current_tip="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/heads/${default_branch}" | cut -f1)"
          if [ "$current_tip" != "$HEAD_SHA" ]; then
            # Expected behavior (the next scheduled check verifies the new
            # head), not a defect -- does not file/update the
            # auto-release:failed issue (same class as specs/045's
            # stale-head skip).
            echo "no release: the branch advanced past the verified head (${HEAD_SHA}) before the tag was created -- observed tip is now ${current_tip}${correlation_note}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # The branch never moved and no tag landed -- a real defect,
          # distinct from a verification failure or a collision (FR-029).
          echo "release dispatch failed for ${NEXT_VERSION}${correlation_note}" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "**Classification**: pipeline defect (release failure)"
            echo ""
            echo "**Verified head**: ${HEAD_SHA}"
            echo ""
            echo "**Computed next version**: ${NEXT_VERSION}"
            echo ""
            echo "release.yml was dispatched, but no ${NEXT_VERSION} tag landed on the verified head${correlation_note}."
            echo ""
            echo "**Correlated run**: ${correlated_line}"
          } > "$RUNNER_TEMP/auto-release-failure-body.md"
          echo "action=report" >> "$GITHUB_OUTPUT"

      - name: File or update the failure issue
        if: steps.outcome.outputs.action == 'report'
        uses: ./.github/actions/_shared/durable-failure-issue
        with:
          token: ${{ github.token }}
          operation: report
          label: auto-release:failed
          label-color: B60205
          label-description: "wing-commander auto-release: a scheduled verification/release attempt failed"
          title: ${{ steps.outcome.outputs.title }}
          body-file: ${{ runner.temp }}/auto-release-failure-body.md

      - name: Close the failure issue on success
        if: steps.outcome.outputs.action == 'close'
        uses: ./.github/actions/_shared/durable-failure-issue
        with:
          token: ${{ github.token }}
          operation: close
          label: auto-release:failed
          label-color: B60205
          label-description: "wing-commander auto-release: a scheduled verification/release attempt failed"
          # Decided by the step above, not templated here: the quiet-day
          # close names the latest tag (decide-version never ran, so
          # next-version is empty there), this attempt's own release names
          # the version it cut.
          close-comment: ${{ steps.outcome.outputs.close-comment }}
