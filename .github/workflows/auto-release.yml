# Scheduled auto-release: detects unreleased work on main, verifies it
# end-to-end against a maintainer-onboarded test repository running the
# published stages, computes the next non-breaking version, and dispatches
# release.yml to cut it. Never requests a breaking/major release -- that
# stays a deliberate human act through release.yml's own manual dispatch.
# See specs/045-auto-release-verified-head/contracts/auto-release-workflow.md,
# e2e-repository-wiring.md, and release-dispatch.md for the full contract.
#
# on: workflow_dispatch only in addition to schedule -- no workflow_call.
# This file is not a published stage (research.md D1 of specs/045): it
# releases THIS repository, not an adopter's, and carries no ambient event
# payload that needs translating into typed inputs.
name: "auto-release"

on:
  schedule:
    - cron: "9 9 * * *"   # one-line, PR-reviewed knob (FR-002) -- not repository-variable-configurable
  workflow_dispatch: {}    # FR-005: on-demand, no inputs needed

permissions: {}

concurrency:
  group: wing-commander-auto-release
  cancel-in-progress: false

jobs:
  # Detecting unreleased work costs nothing extra (research.md D4): "is
  # there new work" and "has this head already been auto-released" are
  # answered by the same read -- the highest exact vX.Y.Z release tag
  # compared against HEAD. No separate ledger of "already attempted this
  # head" is needed; the tag itself is that record.
  detect:
    if: vars.WING_COMMANDER_AUTO_RELEASE_PAUSED != 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      head-sha: ${{ steps.resolve.outputs.head-sha }}
      tag-exists: ${{ steps.resolve.outputs.tag-exists }}
      latest-tag: ${{ steps.resolve.outputs.latest-tag }}
      has-new-work: ${{ steps.resolve.outputs.has-new-work }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve latest release tag and unreleased head
        id: resolve
        shell: bash
        run: |
          set -uo pipefail
          head_sha="$(git rev-parse HEAD)"

          # Strict vX.Y.Z only -- excludes the floating vX major tags and any
          # pre-release/build suffix (data-model.md "Latest release tag").
          latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -1 || true)"

          if [ -z "$latest_tag" ]; then
            {
              echo "head-sha=$head_sha"
              echo "tag-exists=false"
              echo "latest-tag="
              echo "has-new-work=false"
            } >> "$GITHUB_OUTPUT"
            echo "detect: no release tag exists yet -- nothing to compare against." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # The commit the tag's annotated object points at, never the tag
          # object's own SHA (data-model.md).
          tag_sha="$(git rev-parse "${latest_tag}^{commit}")"
          if [ "$head_sha" != "$tag_sha" ]; then
            has_new_work=true
          else
            has_new_work=false
          fi

          {
            echo "head-sha=$head_sha"
            echo "tag-exists=true"
            echo "latest-tag=$latest_tag"
            echo "has-new-work=$has_new_work"
          } >> "$GITHUB_OUTPUT"
          echo "detect: latest release $latest_tag ($tag_sha); head $head_sha; has-new-work=$has_new_work." >> "$GITHUB_STEP_SUMMARY"

  # Resolve/validate the test repository, reset its default branch,
  # scaffold the published stages at the verified head, kick off the fixed
  # trivial feature, poll to a verdict, assert per-stage outputs. Every step
  # here degrades to a fail-infra/fail-timeout/fail-incomplete/
  # fail-wrong-output verdict rather than crashing the job (research.md
  # D10/D11, data-model.md "End-to-end verdict") -- decide-version below
  # reads this job's `verdict` output unconditionally, so it must always be
  # valid JSON regardless of which step here stopped the run.
  verify-e2e:
    needs: detect
    if: needs.detect.outputs.has-new-work == 'true' && vars.WING_COMMANDER_AUTO_RELEASE_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions: {}
    outputs:
      verdict: ${{ steps.config.outputs.verdict || steps.reachable.outputs.verdict || steps.reset.outputs.verdict || steps.speckit-version.outputs.verdict || steps.scaffold.outputs.verdict || steps.kickoff.outputs.verdict || steps.poll.outputs.verdict }}
    steps:
      - name: Resolve and validate the end-to-end test repository configuration
        id: config
        shell: bash
        env:
          E2E_REPO: ${{ vars.WING_COMMANDER_AUTO_RELEASE_E2E_REPO }}
          HEAD_SHA: ${{ needs.detect.outputs.head-sha }}
        run: |
          set -uo pipefail
          if [ -z "$E2E_REPO" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo 'verdict<<AUTO_RELEASE_VERDICT_EOF'
              jq -n --arg head "$HEAD_SHA" \
                '{outcome:"fail-infra", verified_head:$head, failing_check:"WING_COMMANDER_AUTO_RELEASE_E2E_REPO is unset", expected:"a repository variable set to OWNER/NAME of a pre-onboarded test repository", observed:"unset", evidence_url:"WING_COMMANDER_AUTO_RELEASE_E2E_REPO"}'
              echo 'AUTO_RELEASE_VERDICT_EOF'
            } >> "$GITHUB_OUTPUT"
            echo "::error::wing-commander auto-release verify-e2e: WING_COMMANDER_AUTO_RELEASE_E2E_REPO is unset -- see docs/setup.md."
            exit 0
          fi
          case "$E2E_REPO" in
            */*/*|/*|*/|*[[:space:]]*) shape=bad ;;
            */*)                       shape=ok ;;
            *)                         shape=bad ;;
          esac
          if [ "$shape" = "bad" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo 'verdict<<AUTO_RELEASE_VERDICT_EOF'
              jq -n --arg head "$HEAD_SHA" --arg repo "$E2E_REPO" \
                '{outcome:"fail-infra", verified_head:$head, failing_check:"WING_COMMANDER_AUTO_RELEASE_E2E_REPO shape", expected:"OWNER/NAME", observed:$repo, evidence_url:"WING_COMMANDER_AUTO_RELEASE_E2E_REPO"}'
              echo 'AUTO_RELEASE_VERDICT_EOF'
            } >> "$GITHUB_OUTPUT"
            echo "::error::wing-commander auto-release verify-e2e: WING_COMMANDER_AUTO_RELEASE_E2E_REPO is '$E2E_REPO', which is not an OWNER/NAME pair."
            exit 0
          fi
          # The reset step below orphan-recreates and force-pushes the test
          # repository's default branch. Pointed at THIS repository (the App
          # is installed here, so every check after this one would pass) it
          # would do that to main. Refuse the value outright; no verification
          # is worth that, and the variable's doc says "a dedicated test
          # repository" for exactly this reason.
          e2e_lc="$(printf '%s' "$E2E_REPO" | tr '[:upper:]' '[:lower:]')"
          self_lc="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          if [ "$e2e_lc" = "$self_lc" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo 'verdict<<AUTO_RELEASE_VERDICT_EOF'
              jq -n --arg head "$HEAD_SHA" --arg repo "$E2E_REPO" \
                '{outcome:"fail-infra", verified_head:$head, failing_check:"WING_COMMANDER_AUTO_RELEASE_E2E_REPO names this repository", expected:"a separate, dedicated, pre-onboarded test repository", observed:$repo, evidence_url:"WING_COMMANDER_AUTO_RELEASE_E2E_REPO"}'
              echo 'AUTO_RELEASE_VERDICT_EOF'
            } >> "$GITHUB_OUTPUT"
            echo "::error::wing-commander auto-release verify-e2e: WING_COMMANDER_AUTO_RELEASE_E2E_REPO is '$E2E_REPO', which is this repository itself. The end-to-end run resets the test repository's default branch; refusing."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "e2e-repo=$E2E_REPO" >> "$GITHUB_OUTPUT"
          echo "owner=${E2E_REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${E2E_REPO#*/}" >> "$GITHUB_OUTPUT"

      # continue-on-error, re-checked in the next step -- mirrors
      # auto-update-spec-kit.yml's scratch-token step. With neither `owner`
      # nor `repositories` set this action scopes to the CURRENT repository
      # only (research.md D11), so a second, narrowly-scoped token is always
      # minted here rather than reusing any other token in this workflow.
      - name: Mint a scoped App token for the test repository
        id: token
        if: steps.config.outputs.ready == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.WING_COMMANDER_APP_ID }}
          private-key: ${{ secrets.WING_COMMANDER_APP_PRIVATE_KEY }}
          owner: ${{ steps.config.outputs.owner }}
          repositories: ${{ steps.config.outputs.name }}

      - name: Confirm the test repository is reachable
        id: reachable
        if: steps.config.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TOKEN_OUTCOME: ${{ steps.token.outcome }}
          E2E_REPO: ${{ steps.config.outputs.e2e-repo }}
          HEAD_SHA: ${{ needs.detect.outputs.head-sha }}
        run: |
          set -uo pipefail
          if [ "$TOKEN_OUTCOME" != "success" ] || [ -z "$GH_TOKEN" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            {
              echo 'verdict<<AUTO_RELEASE_VERDICT_EOF'
              jq -n --arg head "$HEAD_SHA" --arg repo "$E2E_REPO" \
                '{outcome:"fail-infra", verified_head:$head, failing_check:"wing-commander App installation on the test repository", expected:"installed on the test repository with Contents/Issues/Pull requests read-write", observed:"token mint failed", evidence_url:$repo}'
              echo 'AUTO_RELEASE_VERDICT_EOF'
            } >> "$GITHUB_OUTPUT"
            echo "::error::wing-commander auto-release verify-e2e: the wing-commander App could not mint a token for $E2E_REPO -- install it there (docs/setup.md)."
            exit 0
          fi
          default_branch="$(gh repo view "$E2E_REPO" --json defaultBranchRef --jq '.defaultBranchRef.name // empty' 2>/dev/null || true)"
          if [ -z "$default_branch" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            {
              echo 'verdict<<AUTO_RELEASE_VERDICT_EOF'
              jq -n --arg head "$HEAD_SHA" --arg repo "$E2E_REPO" \
                '{outcome:"fail-infra", verified_head:$head, failing_check:"test repository reachability", expected:"gh repo view succeeds and reports a default branch", observed:"unreachable, or has no default branch", evidence_url:$repo}'
              echo 'AUTO_RELEASE_VERDICT_EOF'
            } >> "$GITHUB_OUTPUT"
            echo "::error::wing-commander auto-release verify-e2e: could not read $E2E_REPO's default branch -- is it reachable, and does the App installation cover it?"
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
          echo "default-branch=$default_branch" >> "$GITHUB_OUTPUT"

      # Any open issue/PR left by a previous attempt is closed (best-effort)
      # before the reset -- an orphan-reset default branch otherwise leaves
      # a stale open PR pointing at history that no longer exists
      # (research.md D6's consequence). Then the default branch itself is
      # the "per-run branch" (research.md D6): GitHub only evaluates
      # non-ref-scoped triggers like `issues` from the default branch, so
      # scaffolding anywhere else would produce wrapper workflows that never
      # fire.
      - name: Close prior leftovers and reset the default branch
        id: reset
        if: steps.reachable.outputs.ok == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          E2E_REPO: ${{ steps.config.outputs.e2e-repo }}
          DEFAULT_BRANCH: ${{ steps.reachable.outputs.default-branch }}
          HEAD_SHA: ${{ needs.detect.outputs.head-sha }}
        run: |
          set -uo pipefail

          mapfile -t open_issues < <(gh issue list --repo "$E2E_REPO" --state open --json number --jq '.[].number' 2>/dev/null || true)
          for n in "${open_issues[@]}"; do
            [ -n "$n" ] || continue
            gh issue close "$n" --repo "$E2E_REPO" --comment "Closed by wing-commander's auto-release.yml before a fresh verification attempt." >/dev/null 2>&1 || true
          done
          mapfile -t open_prs < <(gh pr list --repo "$E2E_REPO" --state open --json number --jq '.[].number' 2>/dev/null || true)
          for n in "${open_prs[@]}"; do
            [ -n "$n" ] || continue
            gh pr close "$n" --repo "$E2E_REPO" --comment "Closed by wing-commander's auto-release.yml before a fresh verification attempt." >/dev/null 2>&1 || true
          done

          rm -rf e2e-test-repo
          auth_url="https://x-access-token:${GH_TOKEN}@github.com/${E2E_REPO}.git"
          if ! git clone --quiet "$auth_url" e2e-test-repo 2>"$RUNNER_TEMP/auto-release-clone-err.txt"; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            {
              echo 'verdict<<AUTO_RELEASE_VERDICT_EOF'
              jq -n --arg head "$HEAD_SHA" --arg repo "$E2E_REPO" --arg detail "$(tail -c 500 "$RUNNER_TEMP/auto-release-clone-err.txt")" \
                '{outcome:"fail-infra", verified_head:$head, failing_check:"cloning the test repository", expected:"a clone over the scoped App token succeeds", observed:$detail, evidence_url:$repo}'
              echo 'AUTO_RELEASE_VERDICT_EOF'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          (
            cd e2e-test-repo
            git remote set-url origin "https://github.com/${E2E_REPO}.git"
            git config user.name "wing-commander-auto-release[bot]"
            git config user.email "wing-commander-auto-release[bot]@users.noreply.github.com"
            # Detach-and-delete, same technique as auto-update-spec-kit.yml's
            # scratch-repository reset, applied to the DEFAULT branch itself
            # (research.md D6/D7) rather than a side branch.
            if git rev-parse --verify HEAD >/dev/null 2>&1; then
              git checkout --quiet --detach
              git branch -D "$DEFAULT_BRANCH" >/dev/null 2>&1 || true
              git checkout --quiet --orphan "$DEFAULT_BRANCH"
              git rm -rq --cached . >/dev/null 2>&1 || true
              find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            else
              git checkout --quiet -b "$DEFAULT_BRANCH"
            fi
            git commit --quiet --allow-empty -m "chore: reset for a fresh end-to-end verification attempt"
          )

          if ! git -C e2e-test-repo push --force --quiet "$auth_url" "HEAD:refs/heads/${DEFAULT_BRANCH}" 2>"$RUNNER_TEMP/auto-release-push-err.txt"; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            {
              echo 'verdict<<AUTO_RELEASE_VERDICT_EOF'
              jq -n --arg head "$HEAD_SHA" --arg repo "$E2E_REPO" --arg detail "$(tail -c 500 "$RUNNER_TEMP/auto-release-push-err.txt")" \
                '{outcome:"fail-infra", verified_head:$head, failing_check:"resetting the test repository default branch", expected:"a force-push of the reset branch succeeds", observed:$detail, evidence_url:$repo}'
              echo 'AUTO_RELEASE_VERDICT_EOF'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Checkout this repository at the verified head (wrapper fixture + supported Spec Kit version)
        if: steps.reset.outputs.ok == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.detect.outputs.head-sha }}
          persist-credentials: false
          path: e2e-source

      - name: Resolve this repository's supported Spec Kit version
        id: speckit-version
        if: steps.reset.outputs.ok == 'true'
        shell: bash
        env:
          HEAD_SHA: ${{ needs.detect.outputs.head-sha }}
        run: |
          set -uo pipefail
          v="$(sed -n 's/.*SPECKIT_SUPPORTED_VERSION: "\([^"]*\)".*/\1/p' e2e-source/.github/actions/wing-commander-preflight/action.yml | head -1)"
          if [ -z "$v" ]; then
            # A verdict, not `exit 1`: this job's contract (see the comment
            # above verify-e2e) is that every step degrades to a verdict the
            # report job can name. A hard exit here left `verdict` empty and
            # the failure issue blank.
            echo "ok=false" >> "$GITHUB_OUTPUT"
            {
              echo 'verdict<<AUTO_RELEASE_VERDICT_EOF'
              jq -n --arg head "$HEAD_SHA" \
                '{outcome:"fail-infra", verified_head:$head, failing_check:"resolving SPECKIT_SUPPORTED_VERSION", expected:"a SPECKIT_SUPPORTED_VERSION line in .github/actions/wing-commander-preflight/action.yml at the verified head", observed:"no such line matched", evidence_url:$head}'
              echo 'AUTO_RELEASE_VERDICT_EOF'
            } >> "$GITHUB_OUTPUT"
            echo "::error::wing-commander auto-release verify-e2e: could not resolve SPECKIT_SUPPORTED_VERSION from wing-commander-preflight/action.yml."
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # continue-on-error: the scaffold step's own `command -v uvx` check
      # turns a failed install into a fail-infra verdict the report job can
      # name, where a hard failure here would leave `verdict` empty.
      - name: Install uv (provides uvx for the Spec Kit CLI)
        if: steps.speckit-version.outputs.ok == 'true'
        continue-on-error: true
        uses: astral-sh/setup-uv@v10.0.0

      # Scaffolds `specify init` output at this repository's own pinned
      # version, plus the minimal wrapper set docs/adoption.md documents --
      # copied from THIS repository's own dogfooded wrappers (its local
      # `uses: ./.github/workflows/<stage>.yml` calls rewritten to the
      # published cross-repository form, pinned at the exact unreleased
      # commit under verification, never a tag or `@main` (research.md D7)).
      # Copying this repository's own wrapper files is the single home for
      # that content -- there is no second copy to drift from docs/adoption.md.
      - name: Scaffold the fixture and push it to the test repository
        id: scaffold
        if: steps.speckit-version.outputs.ok == 'true'
        shell: bash
        working-directory: e2e-test-repo
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          E2E_REPO: ${{ steps.config.outputs.e2e-repo }}
          DEFAULT_BRANCH: ${{ steps.reachable.outputs.default-branch }}
          HEAD_SHA: ${{ needs.detect.outputs.head-sha }}
          SPECKIT_VERSION: ${{ steps.speckit-version.outputs.version }}
        run: |
          set -uo pipefail

          if ! command -v uvx >/dev/null 2>&1; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            {
              echo 'verdict<<AUTO_RELEASE_VERDICT_EOF'
              jq -n --arg head "$HEAD_SHA" --arg repo "$E2E_REPO" \
                '{outcome:"fail-infra", verified_head:$head, failing_check:"scaffolding the test repository", expected:"uvx available on the runner", observed:"uvx not found", evidence_url:$repo}'
              echo 'AUTO_RELEASE_VERDICT_EOF'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! uvx --from "git+https://github.com/github/spec-kit.git@v${SPECKIT_VERSION}" \
              specify init . --integration claude --script sh --force --ignore-agent-tools \
              > "$RUNNER_TEMP/auto-release-scaffold-install.log" 2>&1; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            {
              echo 'verdict<<AUTO_RELEASE_VERDICT_EOF'
              jq -n --arg head "$HEAD_SHA" --arg repo "$E2E_REPO" --arg detail "$(tail -c 500 "$RUNNER_TEMP/auto-release-scaffold-install.log")" \
                '{outcome:"fail-infra", verified_head:$head, failing_check:"specify init in the test repository", expected:"specify init exits 0", observed:$detail, evidence_url:$repo}'
              echo 'AUTO_RELEASE_VERDICT_EOF'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          declare -A stage_file=(
            [wing-commander-1-intake.yml]=intake.yml
            [wing-commander-2-clarify.yml]=clarify.yml
            [wing-commander-3-plan.yml]=plan.yml
            [wing-commander-4-tasks.yml]=tasks.yml
            [wing-commander-5-implement.yml]=implement.yml
            [wing-commander-6-finalize.yml]=finalize.yml
            [wing-commander-7-cleanup.yml]=cleanup.yml
            [wing-commander-rebase.yml]=rebase.yml
          )
          mkdir -p .github/workflows
          for f in "${!stage_file[@]}"; do
            stage="${stage_file[$f]}"
            cp "../e2e-source/.github/workflows/$f" ".github/workflows/$f"
            sed -i "s#uses: \./\.github/workflows/${stage}#uses: charlesguse/wing-commander/.github/workflows/${stage}@${HEAD_SHA}#" ".github/workflows/$f"
          done
          # docs/adoption.md's own instruction: replace the literal `main`
          # in the two wrappers whose gate/trigger names it, since the test
          # repository's default branch name is whatever the maintainer chose.
          sed -i "s/== 'main'/== '${DEFAULT_BRANCH}'/" .github/workflows/wing-commander-3-plan.yml
          sed -i "s/branches: \[main\]/branches: [${DEFAULT_BRANCH}]/" .github/workflows/wing-commander-rebase.yml

          git add -A
          git commit --quiet -m "chore: scaffold end-to-end verification fixture at ${HEAD_SHA:0:7}"
          auth_url="https://x-access-token:${GH_TOKEN}@github.com/${E2E_REPO}.git"
          if ! git push --force --quiet "$auth_url" "HEAD:refs/heads/${DEFAULT_BRANCH}" 2>"$RUNNER_TEMP/auto-release-scaffold-push-err.txt"; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            {
              echo 'verdict<<AUTO_RELEASE_VERDICT_EOF'
              jq -n --arg head "$HEAD_SHA" --arg repo "$E2E_REPO" --arg detail "$(tail -c 500 "$RUNNER_TEMP/auto-release-scaffold-push-err.txt")" \
                '{outcome:"fail-infra", verified_head:$head, failing_check:"pushing the scaffolded fixture", expected:"a force-push of the scaffold succeeds", observed:$detail, evidence_url:$repo}'
              echo 'AUTO_RELEASE_VERDICT_EOF'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ok=true" >> "$GITHUB_OUTPUT"

      # Create, then label, never both at once (research.md D8): creating an
      # issue with a label attached is reported as an `opened` event, not a
      # `labeled` one, so the intake wrapper's `issues: {types: [labeled]}`
      # trigger would never fire.
      - name: Kick off the trivial end-to-end feature
        id: kickoff
        if: steps.scaffold.outputs.ok == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          E2E_REPO: ${{ steps.config.outputs.e2e-repo }}
          HEAD_SHA: ${{ needs.detect.outputs.head-sha }}
        run: |
          set -uo pipefail
          short_sha="${HEAD_SHA:0:7}"
          {
            echo "Add a single new markdown file under \`docs/\` stating the verified commit and timestamp."
            echo ""
            echo "Opened by wing-commander's own \`auto-release.yml\` scheduled verification run to confirm the published pipeline stages still carry a trivial change through intake, clarify, plan, tasks, implement, review, and cleanup, at commit ${HEAD_SHA}."
          } > "$RUNNER_TEMP/auto-release-e2e-issue-body.md"

          url="$(gh issue create --repo "$E2E_REPO" --title "wing-commander auto-release verification at ${short_sha}" --body-file "$RUNNER_TEMP/auto-release-e2e-issue-body.md" 2>"$RUNNER_TEMP/auto-release-kickoff-err.txt")"
          if [ -z "$url" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            {
              echo 'verdict<<AUTO_RELEASE_VERDICT_EOF'
              jq -n --arg head "$HEAD_SHA" --arg repo "$E2E_REPO" --arg detail "$(tail -c 500 "$RUNNER_TEMP/auto-release-kickoff-err.txt")" \
                '{outcome:"fail-infra", verified_head:$head, failing_check:"creating the kickoff issue", expected:"gh issue create succeeds", observed:$detail, evidence_url:$repo}'
              echo 'AUTO_RELEASE_VERDICT_EOF'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          issue_number="${url##*/}"

          if ! gh issue edit "$issue_number" --repo "$E2E_REPO" --add-label spec-request >"$RUNNER_TEMP/auto-release-label-err.txt" 2>&1; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            {
              echo 'verdict<<AUTO_RELEASE_VERDICT_EOF'
              jq -n --arg head "$HEAD_SHA" --arg repo "$E2E_REPO" --arg detail "$(tail -c 500 "$RUNNER_TEMP/auto-release-label-err.txt")" \
                '{outcome:"fail-infra", verified_head:$head, failing_check:"labelling the kickoff issue spec-request", expected:"the spec-request label exists and gh issue edit succeeds", observed:$detail, evidence_url:$repo}'
              echo 'AUTO_RELEASE_VERDICT_EOF'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ok=true" >> "$GITHUB_OUTPUT"
          echo "issue-number=$issue_number" >> "$GITHUB_OUTPUT"
          echo "issue-url=$url" >> "$GITHUB_OUTPUT"

      # Poll over the issue's own state/labels/timeline, plus artifact
      # presence -- never agent narration (research.md D10). Bounded by
      # POLL_BUDGET_SECONDS rather than the step's own `timeout-minutes`, so
      # a timeout still produces a `fail-timeout` verdict instead of the
      # runner killing the step before it can write one.
      - name: Poll the test repository to a verdict
        id: poll
        if: steps.kickoff.outputs.ok == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          E2E_REPO: ${{ steps.config.outputs.e2e-repo }}
          ISSUE: ${{ steps.kickoff.outputs.issue-number }}
          ISSUE_URL: ${{ steps.kickoff.outputs.issue-url }}
          HEAD_SHA: ${{ needs.detect.outputs.head-sha }}
          POLL_BUDGET_SECONDS: "6900"
        run: |
          set -uo pipefail

          write_verdict() {
            jq -n --arg outcome "$1" --arg head "$HEAD_SHA" --arg failing_check "$2" \
                  --arg expected "$3" --arg observed "$4" --arg url "$ISSUE_URL" \
              '{outcome:$outcome, verified_head:$head,
                failing_check: (if $failing_check == "" then null else $failing_check end),
                expected: (if $expected == "" then null else $expected end),
                observed: (if $observed == "" then null else $observed end),
                evidence_url:$url}' > "$RUNNER_TEMP/auto-release-verdict.json"
          }
          emit_verdict() {
            {
              echo 'verdict<<AUTO_RELEASE_VERDICT_EOF'
              cat "$RUNNER_TEMP/auto-release-verdict.json"
              echo 'AUTO_RELEASE_VERDICT_EOF'
            } >> "$GITHUB_OUTPUT"
          }

          state=""
          labels=""
          terminal=false
          while [ "$SECONDS" -lt "$POLL_BUDGET_SECONDS" ]; do
            info="$(gh issue view "$ISSUE" --repo "$E2E_REPO" --json state,labels 2>/dev/null || true)"
            if [ -n "$info" ]; then
              state="$(printf '%s' "$info" | jq -r '.state')"
              labels="$(printf '%s' "$info" | jq -r '[.labels[].name] | join(",")')"
              if [ "$state" = "CLOSED" ] || printf ',%s,' "$labels" | grep -q ',stage:stalled,'; then
                terminal=true
                break
              fi
            fi
            sleep 30
          done

          if [ "$terminal" != "true" ]; then
            write_verdict "fail-timeout" "end-to-end run reaching a terminal state" \
              "closed with stage:done, or stage:stalled, within the poll budget" \
              "still open with labels [$labels] after ${POLL_BUDGET_SECONDS}s"
            emit_verdict
            exit 0
          fi

          if [ "$state" != "CLOSED" ] || ! printf ',%s,' "$labels" | grep -q ',stage:done,'; then
            write_verdict "fail-incomplete" "end-to-end run reaching stage:done" \
              "issue closed with the stage:done label" \
              "state=$state labels=[$labels]"
            emit_verdict
            exit 0
          fi

          timeline="$(gh api "repos/${E2E_REPO}/issues/${ISSUE}/timeline" --paginate --jq '.[] | select(.event=="labeled") | .label.name' 2>/dev/null | jq -s '.' 2>/dev/null)" || timeline='[]'
          missing_stage=""
          for s in stage:spec stage:clarify stage:plan stage:tasks stage:implement stage:review; do
            if ! printf '%s' "$timeline" | jq -e --arg s "$s" 'index($s) != null' >/dev/null 2>&1; then
              missing_stage="$s"
              break
            fi
          done
          if [ -n "$missing_stage" ]; then
            write_verdict "fail-wrong-output" "every intermediate stage label present in the issue timeline" \
              "$missing_stage present at some point in the timeline" "timeline=$timeline"
            emit_verdict
            exit 0
          fi

          slug="$(gh api "repos/${E2E_REPO}/contents/specs" --jq '[.[] | select(.type=="dir")][0].name // empty' 2>/dev/null || true)"
          missing_file=""
          if [ -z "$slug" ]; then
            missing_file="specs/<slug>/"
          else
            for name in spec.md plan.md tasks.md; do
              if ! gh api "repos/${E2E_REPO}/contents/specs/${slug}/${name}" >/dev/null 2>&1; then
                missing_file="specs/${slug}/${name}"
                break
              fi
            done
          fi
          if [ -n "$missing_file" ]; then
            write_verdict "fail-wrong-output" "specs/<slug>/{spec,plan,tasks}.md present after stage:done" \
              "$missing_file present in the default branch" "not found"
            emit_verdict
            exit 0
          fi

          write_verdict "pass" "" "" ""
          emit_verdict

  # Patch-vs-minor signal collection (research.md D5) plus tag-collision
  # detection (data-model.md "Version decision"). Never produces `major` --
  # there is no code path here that can (User Story 4, T019/T020).
  decide-version:
    needs: [detect, verify-e2e]
    if: fromJSON(needs.verify-e2e.outputs.verdict || '{}').outcome == 'pass' && vars.WING_COMMANDER_AUTO_RELEASE_PAUSED != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      next-version: ${{ steps.decide.outputs.next-version }}
      collision: ${{ steps.decide.outputs.collision }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Compute the next version
        id: decide
        shell: bash
        env:
          LATEST_TAG: ${{ needs.detect.outputs.latest-tag }}
          HEAD_SHA: ${{ needs.detect.outputs.head-sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bump="patch"
          # Every commit in range, NOT `--merges`: this repository squash-
          # merges, so a PR lands as one single-parent commit whose subject
          # ends in "(#N)", and `--merges` saw none of them -- 15 PRs since
          # v2.7.2, zero iterations, the minor arm below unreachable. A true
          # merge commit's "Merge pull request #N" is still recognised.
          while IFS= read -r commit_sha; do
            [ -n "$commit_sha" ] || continue
            subject="$(git log -1 --format=%s "$commit_sha")"
            pr_number=""
            case "$subject" in
              *"Merge pull request #"*)
                pr_number="${subject#*Merge pull request #}"
                pr_number="${pr_number%% *}"
                ;;
              *"(#"*")"*)
                pr_number="${subject##*(#}"
                pr_number="${pr_number%%)*}"
                ;;
            esac
            [ -n "$pr_number" ] || continue
            labels="$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | join(",")' 2>/dev/null || true)"
            case ",$labels," in
              *,release:minor,*) bump="minor" ;;
            esac
          done < <(git log "${LATEST_TAG}..${HEAD_SHA}" --format=%H)

          version="${LATEST_TAG#v}"
          IFS='.' read -r major minor patch <<< "$version"
          if [ "$bump" = "minor" ]; then
            next="v${major}.$((minor + 1)).0"
          else
            next="v${major}.${minor}.$((patch + 1))"
          fi

          collision=false
          if git rev-parse -q --verify "refs/tags/$next" >/dev/null; then
            collision=true
          fi

          {
            echo "bump=$bump"
            echo "next-version=$next"
            echo "collision=$collision"
          } >> "$GITHUB_OUTPUT"
          echo "decide-version: bump=$bump next-version=$next collision=$collision." >> "$GITHUB_STEP_SUMMARY"

  # `release.yml` is workflow_dispatch-only and cannot be `uses:`-invoked, so
  # `gh workflow run` is the only mechanism (research.md D12) -- run with
  # `github.token`, never the wing-commander App token (that token has no
  # `actions` permission; a documented 403, issue/spec 005). This job
  # neither waits for nor trusts release.yml's own run conclusion (FR-007,
  # FR-007a) -- it identifies its own run by evidence (title token + time
  # bound) and decides whether a release happened from tag state alone. The
  # full contract for both is
  # specs/048-correlated-release-dispatch/contracts/release-handover-contract.md
  # (FR-019).
  dispatch-release:
    needs: [detect, decide-version]
    # `!cancelled() && result == 'success'` rather than the bare implicit
    # success(): an `if` that compares a need's output against 'false' with
    # no status-check function is the shape Gate 15 rejects, because GitHub
    # never evaluates it when the need was skipped -- the arm reads like a
    # guard and gates nothing. Spelled out, it runs exactly when
    # decide-version succeeded AND reported no collision, and skips (never
    # dispatches) when verify-e2e did not pass, decide-version failed, or
    # the run was cancelled.
    if: ${{ !cancelled() && needs.decide-version.result == 'success' && needs.decide-version.outputs.collision == 'false' && vars.WING_COMMANDER_AUTO_RELEASE_PAUSED != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    outputs:
      # `found` | `ambiguous` | `not-observed` -- diagnostic only, never
      # itself the release verdict (see `tag-matches` below, FR-007a).
      correlation: ${{ steps.watch.outputs.correlation }}
      correlated-run-id: ${{ steps.watch.outputs.correlated-run-id }}
      correlated-run-url: ${{ steps.watch.outputs.correlated-run-url }}
      # The sole authority for "did this attempt's release happen"
      # (FR-007): the exact version tag exists and points at the verified
      # head, independent of `correlation` and of release.yml's own run
      # conclusion.
      tag-matches: ${{ steps.watch.outputs.tag-matches }}
      # The report's diagnostic wording (FR-006/SC-004) is written once in
      # specs/048-correlated-release-dispatch/contracts/release-handover-contract.md;
      # request-time and dispatch-rejected feed it, not restated here.
      request-time: ${{ steps.watch.outputs.request-time }}
      dispatch-rejected: ${{ steps.watch.outputs.dispatch-rejected }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Dispatch release.yml and correlate its run
        id: watch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.decide-version.outputs.next-version }}
          VERIFIED_HEAD: ${{ needs.detect.outputs.head-sha }}
        run: |
          set -uo pipefail

          # The dispatching run's own id+attempt is unique across this
          # repository's entire run history (GitHub's own guarantee), so
          # two attempts can never mint the same token by construction
          # (FR-002a) -- no counter or random value is needed. Minted once,
          # reused for the dispatch call, the correlation search, and the
          # report.
          token="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          request_time="$(date -u +%s)"
          request_time_iso="$(date -u -d "@$request_time" +"%Y-%m-%dT%H:%M:%SZ")"

          correlation="not-observed"
          correlated_run_id=""
          correlated_run_url=""
          dispatch_rejected=false

          if ! gh workflow run release.yml -f "version=${VERSION}" -f breaking=false -f breaking-notes= -f "attempt-token=${token}" -f "commit=${VERIFIED_HEAD}"; then
            dispatch_rejected=true
            echo "::error::wing-commander auto-release dispatch-release: gh workflow run release.yml was rejected."
          else
            # Correlate by evidence, never by recency (FR-001): a
            # release.yml run whose title carries this attempt's own
            # token, started after this attempt's own request (FR-002,
            # FR-002a, FR-003). Zero, one, or more than one match are three
            # distinct outcomes (FR-004, FR-005), never collapsed by
            # picking "the newest" among them.
            attempt=0
            while [ "$attempt" -lt 12 ]; do
              rows="$(gh run list --workflow=release.yml --json databaseId,displayTitle,createdAt,url -L 20 2>/dev/null || true)"
              count=0
              match_id=""
              match_url=""
              while IFS=$'\t' read -r row_id row_title row_created row_url; do
                [ -n "$row_id" ] || continue
                case "$row_title" in
                  *"[attempt:${token}]"*) ;;
                  *) continue ;;
                esac
                created_epoch="$(date -u -d "$row_created" +%s 2>/dev/null || echo 0)"
                if [ "$created_epoch" -ge "$request_time" ]; then
                  count=$((count + 1))
                  match_id="$row_id"
                  match_url="$row_url"
                fi
              done < <(printf '%s' "$rows" | jq -r '.[] | [.databaseId, .displayTitle, .createdAt, .url] | @tsv')

              if [ "$count" -eq 1 ]; then
                correlation="found"
                correlated_run_id="$match_id"
                correlated_run_url="$match_url"
                break
              elif [ "$count" -ge 2 ]; then
                correlation="ambiguous"
                break
              fi

              attempt=$((attempt + 1))
              [ "$attempt" -lt 12 ] && sleep 5
            done
          fi

          # A correlated run may still be mid-flight (checkout, lint, tag
          # creation) the instant the loop above exits; reading tag state
          # before it reaches a terminal status would file a false
          # "release dispatch failed" report while the release succeeds
          # moments later. Wait for that run's status alone -- never its
          # conclusion, which plays no part in the verdict below -- to go
          # terminal before ever reading tag state. When no single run was
          # found to wait on, wait a fixed bounded interval instead.
          if [ "$correlation" = "found" ]; then
            wait_attempt=0
            while [ "$wait_attempt" -lt 60 ]; do
              run_status="$(gh run view "$correlated_run_id" --json status --jq .status 2>/dev/null || echo "")"
              [ "$run_status" = "completed" ] && break
              wait_attempt=$((wait_attempt + 1))
              sleep 10
            done
          else
            sleep 90
          fi

          # "Released" is decided from tag state alone (FR-007, FR-007a,
          # research.md D5) -- after the correlation search concludes and
          # the wait above, regardless of either's outcome, and
          # independent of whether the dispatch itself was rejected. A
          # fresh, post-dispatch fetch, never a value read before the
          # dispatch.
          git fetch origin "refs/tags/${VERSION}:refs/tags/${VERSION}" --quiet 2>/dev/null || true
          tag_matches=false
          if git rev-parse -q --verify "refs/tags/${VERSION}^{commit}" >/dev/null 2>&1; then
            if [ "$(git rev-parse "${VERSION}^{commit}")" = "$VERIFIED_HEAD" ]; then
              tag_matches=true
            fi
          fi

          {
            echo "correlation=$correlation"
            echo "correlated-run-id=$correlated_run_id"
            echo "correlated-run-url=$correlated_run_url"
            echo "tag-matches=$tag_matches"
            echo "request-time=$request_time_iso"
            echo "dispatch-rejected=$dispatch_rejected"
          } >> "$GITHUB_OUTPUT"

  # The only place this feature writes anything maintainer-facing
  # (contracts/release-dispatch.md Reporting). Reads whichever prior jobs
  # actually ran -- `always()` so a paused/no-op/failed run still reports.
  report:
    if: always() && vars.WING_COMMANDER_AUTO_RELEASE_PAUSED != 'true'
    needs: [detect, verify-e2e, decide-version, dispatch-release]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Report this run's outcome
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.detect.outputs.head-sha }}
          HAS_NEW_WORK: ${{ needs.detect.outputs.has-new-work }}
          TAG_EXISTS: ${{ needs.detect.outputs.tag-exists }}
          LATEST_TAG: ${{ needs.detect.outputs.latest-tag }}
          VERDICT_JSON: ${{ needs.verify-e2e.outputs.verdict }}
          NEXT_VERSION: ${{ needs.decide-version.outputs.next-version }}
          COLLISION: ${{ needs.decide-version.outputs.collision }}
          # The sole authority for "released" (FR-007, FR-007a) -- see
          # specs/048-correlated-release-dispatch/contracts/release-handover-contract.md.
          TAG_MATCHES: ${{ needs.dispatch-release.outputs.tag-matches }}
          CORRELATION: ${{ needs.dispatch-release.outputs.correlation }}
          CORRELATED_RUN_ID: ${{ needs.dispatch-release.outputs.correlated-run-id }}
          CORRELATED_RUN_URL: ${{ needs.dispatch-release.outputs.correlated-run-url }}
          # The ambiguous/not-observed/rejected diagnostic wording (FR-006,
          # SC-004) is written once -- see
          # specs/048-correlated-release-dispatch/contracts/release-handover-contract.md.
          REQUEST_TIME: ${{ needs.dispatch-release.outputs.request-time }}
          DISPATCH_REJECTED: ${{ needs.dispatch-release.outputs.dispatch-rejected }}
          # #325: each need's RESULT alongside its outputs. A job that
          # crashed before writing its outputs hands this job empty strings,
          # and every branch below was written for a different situation --
          # a detect crash read as "no release tag exists yet", a
          # decide-version crash as "release dispatch failed", both filing
          # nothing useful or pointing at a run that never existed.
          DETECT_RESULT: ${{ needs.detect.result }}
          VERIFY_RESULT: ${{ needs.verify-e2e.result }}
          DECIDE_RESULT: ${{ needs.decide-version.result }}
          DISPATCH_RESULT: ${{ needs.dispatch-release.result }}
        run: |
          set -uo pipefail

          FAILED_LABEL="auto-release:failed"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          # Dedup by label (research.md D13): update the one open report
          # rather than filing a second, and rebuild its body from the
          # LATEST attempt's detail on every recurrence (data-model.md
          # "Failure report" -- only the newest attempt is actionable).
          file_or_update_failure() {
            local body_file="$1"
            local existing head_short
            existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label "$FAILED_LABEL" --json number --jq '.[0].number // empty' 2>/dev/null || true)"
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file "$body_file"
            else
              # detect may have crashed before reporting a head (#325); the
              # title must still name something.
              head_short="${HEAD_SHA:0:7}"
              [ -n "$head_short" ] || head_short="an unresolved head"
              gh label create "$FAILED_LABEL" --color B60205 --description "wing-commander auto-release: a scheduled verification/release attempt failed" --force
              gh issue create --repo "$GITHUB_REPOSITORY" --title "Auto-release verification failed at ${head_short}" --label "$FAILED_LABEL" --body-file "$body_file"
            fi
          }

          close_failure_on_success() {
            local resolved_note="${1:-${NEXT_VERSION} released.}" existing
            existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label "$FAILED_LABEL" --json number --jq '.[0].number // empty' 2>/dev/null || true)"
            if [ -n "$existing" ]; then
              gh issue close "$existing" --repo "$GITHUB_REPOSITORY" --comment "Resolved: ${resolved_note}"
            fi
          }

          # #325: a need whose job ended `failure` wrote no outputs, so
          # nothing below can be read off them. File it as infrastructure,
          # naming the job and this run, under the same label -- the
          # maintainer sees one issue for "auto-release is not working"
          # whatever the layer. `cancelled` is the run being stopped, not
          # a failure: summarised, never filed. `skipped` and `success`
          # fall through to the outputs, which then mean what they say.
          # The one home of the failure body's shape (data-model.md "Failure
          # report": classification, verified head, failing check, expected,
          # observed, evidence). Every filing path below calls this; none
          # spells the fields out itself.
          write_failure_body() {
            local classification="$1" failing_check="$2" expected="$3" observed="$4" evidence="$5"
            {
              echo "**Classification**: ${classification}"
              echo ""
              echo "**Verified head**: ${HEAD_SHA:-unknown (detect did not report one)}"
              echo ""
              echo "**Failing check**: ${failing_check}"
              echo ""
              echo "**Expected**: ${expected}"
              echo ""
              echo "**Observed**: ${observed}"
              echo ""
              echo "**Evidence**: ${evidence}"
            } > "$RUNNER_TEMP/auto-release-failure-body.md"
          }

          file_job_failure() {
            local job="$1" role="$2"
            echo "infrastructure failure: the ${job} job did not succeed" >> "$GITHUB_STEP_SUMMARY"
            write_failure_body "infrastructure (job failure)" \
              "the \`${job}\` job (${role}) ended with result \`failure\` before writing its outputs" \
              "the job to succeed, or to degrade to a verdict this report could name" \
              "no outputs from \`${job}\`; nothing downstream of it ran, and nothing was cut" \
              "${RUN_URL}"
            file_or_update_failure "$RUNNER_TEMP/auto-release-failure-body.md"
          }

          case "$DETECT_RESULT" in
            failure)
              file_job_failure detect "resolving the latest release tag and the unreleased head"
              exit 0
              ;;
            cancelled)
              echo "run cancelled during detect -- nothing verified, nothing cut" >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
          esac

          # No new work: verify-e2e never ran, so VERDICT_JSON is empty --
          # that must never be misread as a verification failure. Two
          # distinctly worded no-op lines (FR-003 vs FR-004): a baseline tag
          # exists and HEAD already matches it, or no baseline tag exists at
          # all yet to compare against.
          if [ "$HAS_NEW_WORK" != "true" ]; then
            if [ "$TAG_EXISTS" = "true" ]; then
              echo "no new work since ${LATEST_TAG}" >> "$GITHUB_STEP_SUMMARY"
              # The latest tag already points at HEAD, so a standing
              # failure issue from an earlier attempt is stale -- close it
              # here too, not only on the TAG_MATCHES branch below, or a
              # run that tagged successfully once never has another chance
              # to self-heal (every later run takes this same early exit).
              close_failure_on_success "${LATEST_TAG} already released."
            else
              echo "no release tag exists yet -- nothing to compare against, nothing cut" >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi

          # A cancelled verify-e2e wrote no verdict either, and is the run
          # being stopped (a hung poll cancelled by hand), not a failure:
          # summarised, never filed -- the same rule as the other three
          # jobs (#325).
          case "$VERIFY_RESULT" in
            cancelled)
              echo "run cancelled during verify-e2e -- nothing verified, nothing cut" >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
          esac

          # verify-e2e's contract is a verdict on every path, but a job that
          # dies before any step writes one (a runner failure, an action
          # that cannot download) hands this job an empty string; jq on
          # empty input prints nothing and exits 0, so every field below
          # would render blank rather than "unknown". Substitute a verdict
          # that says exactly that and points at this run. The observed
          # text follows the job's own result: a job that succeeded and
          # still handed over no JSON object did not "stop", it broke its
          # contract, and the body must not claim otherwise.
          if ! printf '%s' "$VERDICT_JSON" | jq -e 'type == "object"' >/dev/null 2>&1; then
            if [ "$VERIFY_RESULT" = "success" ]; then
              no_verdict_observed="the job succeeded but its verdict output is not a JSON object (contract broken; the verdict chain in verify-e2e's outputs: block dropped it)"
            else
              no_verdict_observed="the job stopped before any step wrote one (job result: ${VERIFY_RESULT:-unknown})"
            fi
            VERDICT_JSON="$(jq -n --arg head "$HEAD_SHA" --arg url "$RUN_URL" --arg observed "$no_verdict_observed" \
              '{outcome:"fail-infra", verified_head:$head, failing_check:"verify-e2e produced no verdict", expected:"a JSON verdict from verify-e2e on every path", observed:$observed, evidence_url:$url}')"
          fi
          outcome="$(printf '%s' "$VERDICT_JSON" | jq -r '.outcome // empty' 2>/dev/null || true)"

          if [ "$outcome" != "pass" ]; then
            failing_check="$(printf '%s' "$VERDICT_JSON" | jq -r '.failing_check // "unknown"' 2>/dev/null || echo unknown)"
            expected="$(printf '%s' "$VERDICT_JSON" | jq -r '.expected // "unknown"' 2>/dev/null || echo unknown)"
            observed="$(printf '%s' "$VERDICT_JSON" | jq -r '.observed // "unknown"' 2>/dev/null || echo unknown)"
            evidence_url="$(printf '%s' "$VERDICT_JSON" | jq -r '.evidence_url // "unknown"' 2>/dev/null || echo unknown)"
            classification="pipeline defect"
            [ "$outcome" = "fail-infra" ] && classification="infrastructure"
            echo "verification failed: ${failing_check}" >> "$GITHUB_STEP_SUMMARY"
            write_failure_body "${classification} (${outcome:-unknown})" "$failing_check" "$expected" "$observed" "$evidence_url"
            file_or_update_failure "$RUNNER_TEMP/auto-release-failure-body.md"
            exit 0
          fi

          # Verification passed, so decide-version ran (#325): a crash there
          # left COLLISION and TAG_MATCHES empty, which used to fall
          # through to "release dispatch failed" for a release that was
          # never dispatched.
          case "$DECIDE_RESULT" in
            failure)
              file_job_failure decide-version "computing the next version from the merged pull requests' labels"
              exit 0
              ;;
            cancelled)
              echo "run cancelled during decide-version -- verification passed, nothing cut" >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
          esac

          if [ "$COLLISION" = "true" ]; then
            echo "version collision: ${NEXT_VERSION} already tagged" >> "$GITHUB_STEP_SUMMARY"
            {
              echo "**Classification**: version collision"
              echo ""
              echo "**Verified head**: ${HEAD_SHA}"
              echo ""
              echo "**Computed next version**: ${NEXT_VERSION} already exists as a tag -- no dispatch was attempted."
            } > "$RUNNER_TEMP/auto-release-failure-body.md"
            file_or_update_failure "$RUNNER_TEMP/auto-release-failure-body.md"
            exit 0
          fi

          # #325: no outcome at all means dispatch-release never wrote one --
          # the job crashed (infrastructure) or never ran.
          if [ "$DISPATCH_RESULT" = "failure" ]; then
            file_job_failure dispatch-release "dispatching release.yml and correlating its run"
            exit 0
          fi
          if [ -z "$TAG_MATCHES" ]; then
            echo "dispatch-release did not run (result: ${DISPATCH_RESULT:-unknown}) -- nothing cut" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # `correlation` is diagnostic-only context (FR-006), folded onto
          # whichever primary outcome below applies -- never a competing
          # verdict, and never appended on its own when TAG_MATCHES is true
          # (data-model.md "Release outcome").
          correlation_note=""
          if [ "$DISPATCH_REJECTED" = "true" ]; then
            correlation_note=" (the dispatch of ${NEXT_VERSION} requested at ${REQUEST_TIME} was rejected outright)"
          elif [ "$CORRELATION" = "ambiguous" ]; then
            correlation_note=" (own run could not be uniquely identified among the candidate runs matched for ${NEXT_VERSION} requested at ${REQUEST_TIME})"
          elif [ "$CORRELATION" = "not-observed" ]; then
            correlation_note=" (own run was not observed within the correlation window for ${NEXT_VERSION} requested at ${REQUEST_TIME})"
          fi

          # "Released" is decided from tag state alone (FR-007, FR-007a),
          # independent of `CORRELATION` and of release.yml's own run
          # conclusion (research.md D5) -- a release that happened but was
          # never correlated is still reported as a release.
          if [ "$TAG_MATCHES" = "true" ]; then
            if [ "$CORRELATION" = "found" ]; then
              echo "released ${NEXT_VERSION} -- [correlated run](${CORRELATED_RUN_URL})" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "released ${NEXT_VERSION} -- own run not correlated" >> "$GITHUB_STEP_SUMMARY"
            fi
            close_failure_on_success
            exit 0
          fi

          correlated_line="not correlated (see tag state below)"
          [ "$CORRELATION" = "found" ] && correlated_line="${CORRELATED_RUN_URL}"

          # tag_matches is false: one more independent read classifies why
          # (FR-013, research.md D5) -- a live read at report time, not
          # detect's stale head-sha, and needing no signal out of
          # release.yml's own run beyond what git itself already records.
          # This job can run off a `schedule` trigger, whose event payload
          # carries no `repository` (unlike release.yml's own
          # workflow_dispatch-only Checkout, which reads
          # github.event.repository.default_branch directly) -- so the
          # default branch is read live here, the same way detect already
          # reads a target repository's default branch above.
          default_branch="$(gh repo view "$GITHUB_REPOSITORY" --json defaultBranchRef --jq '.defaultBranchRef.name // empty' 2>/dev/null || true)"
          [ -n "$default_branch" ] || default_branch="main"
          current_tip="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/heads/${default_branch}" | cut -f1)"
          if [ "$current_tip" != "$HEAD_SHA" ]; then
            # Expected behavior (the next scheduled check verifies the new
            # head), not a defect -- does not file/update the
            # auto-release:failed issue (same class as specs/045's
            # stale-head skip).
            echo "no release: the branch advanced past the verified head (${HEAD_SHA}) before the tag was created -- observed tip is now ${current_tip}${correlation_note}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # The branch never moved and no tag landed -- a real defect,
          # distinct from a verification failure or a collision (FR-029).
          echo "release dispatch failed for ${NEXT_VERSION}${correlation_note}" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "**Classification**: pipeline defect (release failure)"
            echo ""
            echo "**Verified head**: ${HEAD_SHA}"
            echo ""
            echo "**Computed next version**: ${NEXT_VERSION}"
            echo ""
            echo "release.yml was dispatched, but no ${NEXT_VERSION} tag landed on the verified head${correlation_note}."
            echo ""
            echo "**Correlated run**: ${correlated_line}"
          } > "$RUNNER_TEMP/auto-release-failure-body.md"
          file_or_update_failure "$RUNNER_TEMP/auto-release-failure-body.md"
