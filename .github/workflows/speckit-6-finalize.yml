# Stage 5 — Finalize. (STUB — see docs/architecture.md §Stage 5)
# Dispatched after convergence (or hitting the iteration cap). Summarizes the
# spec branch's diff against main (Haiku), extracts remaining manual tasks from
# tasks.md, opens the final PR spec/<NNN-slug> → main, and reports both to the
# lifecycle issue.
name: "speckit · 6 finalize"

on:
  workflow_dispatch:
    inputs:
      spec_dir:
        description: "Spec directory (e.g. specs/001-spec-intake)"
        required: true
        type: string
      issue:
        description: "Lifecycle issue number"
        required: true
        type: string
      converged:
        description: "Whether the converge loop finished cleanly"
        required: false
        default: "true"
        type: string

permissions: {}

jobs:
  finalize:
    runs-on: ubuntu-latest
    concurrency:
      group: speckit-${{ inputs.spec_dir }}
      cancel-in-progress: false
    permissions:
      issues: write
    steps:
      - name: Not yet implemented
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
          SPEC_DIR: ${{ inputs.spec_dir }}
          CONVERGED: ${{ inputs.converged }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## speckit · finalize stage"
            echo ""
            echo "Dispatched for $SPEC_DIR (issue #$ISSUE,"
            echo "converged=$CONVERGED), but the finalize stage is not"
            echo "implemented yet. See docs/architecture.md (Stage 5)."
          } >> "$GITHUB_STEP_SUMMARY"
          # Even as a stub, tie the run to the lifecycle issue so the hand-off
          # from the implement stage is visible instead of silently vanishing.
          if printf '%s' "$ISSUE" | grep -Eq '^[0-9]+$'; then
            gh issue comment "$ISSUE" -R "$GITHUB_REPOSITORY" --body "🎁 **speckit · finalize** — dispatched for \`$SPEC_DIR\` (converged=\`$CONVERGED\`) ([run]($RUN_URL)), but the finalize stage is **not implemented yet** (stub — see \`docs/architecture.md\` §Stage 5). The final PR to \`main\` must be opened manually for now."
          fi
