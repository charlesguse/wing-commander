# Stage 1b — Clarification loop (thin wrapper).
# While a spec is in stage:spec / stage:clarify, replies on the lifecycle
# issue from the original requester or trusted members are folded into the
# draft spec. This is the one deliberately narrow path that lets a requester
# WITHOUT write access steer the pipeline — hence the tight actor gate, which
# is trigger-side and therefore lives HERE (constitution V). All stage logic
# lives in clarify.yml (docs/adoption.md), called by local path.
name: "Wing Commander · 2 clarify"

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  clarify:
    # Gates, all must hold:
    #  - a real issue (not a PR comment thread)
    #  - issue is in the spec drafting stage and owned by the pipeline (spec:* label)
    #  - commenter is human, and is a maintainer OR the original requester
    if: >-
      !github.event.issue.pull_request &&
      contains(join(github.event.issue.labels.*.name, ','), 'spec:') &&
      (contains(github.event.issue.labels.*.name, 'stage:spec') || contains(github.event.issue.labels.*.name, 'stage:clarify')) &&
      github.event.comment.user.type != 'Bot' &&
      (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) || github.event.comment.user.id == github.event.issue.user.id)
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    uses: ./.github/workflows/clarify.yml
    with:
      issue-number: ${{ github.event.issue.number }}
      comment-id: ${{ github.event.comment.id }}
    secrets:
      claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      speckit-app-id: ${{ secrets.WING_COMMANDER_APP_ID }}
      speckit-app-private-key: ${{ secrets.WING_COMMANDER_APP_PRIVATE_KEY }}
