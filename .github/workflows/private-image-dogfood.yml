# Published stage — private-image-dogfood (FR-027, SC-010,
# specs/044-private-registry-credentials/research.md D10). on: workflow_call
# only, no trigger of its own — the wrapper
# (wing-commander-private-image-dogfood.yml) owns the schedule/
# workflow_dispatch trigger. Unnumbered, like rebase.yml and
# auto-update-spec-kit.yml — event-driven, outside the intake->cleanup
# numbered chain, and not a lifecycle stage itself (this repository's own
# lifecycle stages stay on the no-image default, per FR-027).
#
# Demonstrates this repository's own private-registry-credentials
# mechanism (contracts/private-registry-credentials.md) on this
# repository's own infrastructure: pulls a private GHCR package
# authenticated with the exact same container.credentials binding every
# adopter's stage carries, using no cloud account or cloud-registry
# identity (FR-027's own prohibition).
#
# Consumers: uses: <owner>/wing-commander/.github/workflows/private-image-dogfood.yml@<ref>
name: "reusable · private-image-dogfood"

on:
  workflow_call:
    inputs:
      environment:
        description: >
          Name of a GitHub deployment environment (in the consuming
          repository) to bind every job in this stage to, applying its
          protection rules before any step in the job runs. Empty (default)
          is a verified true no-op (specs/038-runner-container-passthrough
          FR-001/FR-003, applied uniformly to every published stage).
        type: string
        required: false
        default: ""
      environment-deployment:
        description: >
          Whether binding to `environment` creates a GitHub deployment
          record. true (default) mirrors GitHub's own default; false keeps
          the gate but suppresses the deployment record.
        type: boolean
        required: false
        default: true
      runner:
        description: >
          Runner label(s) for every job in this stage. A single label
          (e.g. ubuntu-latest) or a JSON array of labels applied as a
          conjunction — a value starting with "[" is parsed as JSON,
          anything else is used verbatim
          (specs/038-runner-container-passthrough).
        type: string
        required: false
        default: ubuntu-latest
      container-image:
        description: >
          Container image every job in this stage runs inside. Empty
          (default) means no container. The wrapper sets this to a private
          GHCR package scoped to this repository, to exercise this
          repository's own dogfood check
          (specs/044-private-registry-credentials FR-027).
        type: string
        required: false
        default: ""
      startup-check:
        description: >
          Also run the agent action's setup in container-image with no model
          credential and classify the outcome (specs/112-agent-startup-image-check).
          Needs the caller to grant actions: read. Inert when container-image
          is empty.
        type: boolean
        required: false
        default: false
    secrets:
      container-registry-username:
        description: "Username for container-image's registry, if private. Inert when container-image is empty."
        required: false
      container-registry-password:
        description: "Password or token for container-image's registry, if private. Inert when container-image is empty."
        required: false

permissions: {}

# Pins bash for every run: step without its own shell:, a caller-supplied
# container included -- see pr-conversation.yml.
defaults:
  run:
    shell: bash -e {0}

jobs:
  # specs/038-runner-container-passthrough: every published stage carries
  # this exact job, deliberately, even though this stage's whole purpose is
  # exercising it against a private image — an adopter's stage-binding
  # tooling iterates over every published stage uniformly (Gate 7/22/23).
  verify-image-prerequisites:
    # This job now carries `if: inputs.container-image != ''` and reports
    # `skipped` (billing nothing) when no image is configured -- #224's old
    # "must never skip" invariant no longer holds, because every direct
    # dependent's `if:` now tolerates that skip explicitly -- see
    # specs/058-per-job-minute-floor/contracts/image-check-shape-delta.md.
    if: inputs.container-image != ''
    permissions: {}
    runs-on: ${{ startsWith(inputs.runner, '[') && fromJSON(inputs.runner) || inputs.runner }}
    steps:
      - name: Pull image and verify prerequisites
        if: inputs.container-image != ''
        env:
          IMAGE: ${{ inputs.container-image }}
          REGISTRY_USERNAME: ${{ secrets.container-registry-username }}
          REGISTRY_PASSWORD: ${{ secrets.container-registry-password }}
        run: |
          REQUIRED_TOOLS="git gh jq curl python3 bash node timeout unzip"

          if [ -n "$REGISTRY_USERNAME" ] && [ -n "$REGISTRY_PASSWORD" ]; then
            candidate=""
            case "$IMAGE" in
              */*) candidate="${IMAGE%%/*}" ;;
            esac
            case "$candidate" in
              *.*|*:*|localhost) login_args=("$candidate") ;;
              *) login_args=() ;;
            esac
            if ! echo "$REGISTRY_PASSWORD" | docker login "${login_args[@]}" --username "$REGISTRY_USERNAME" --password-stdin 2>docker-login-error.log; then
              echo "::error::wing-commander verify-image-prerequisites: the registry rejected the supplied credentials for $IMAGE -- $(cat docker-login-error.log)"
              exit 1
            fi
          fi

          if ! docker pull "$IMAGE" 2>docker-pull-error.log; then
            if [ -z "$REGISTRY_USERNAME" ] && [ -z "$REGISTRY_PASSWORD" ]; then
              echo "::error::wing-commander verify-image-prerequisites: failed to pull $IMAGE -- no credentials were supplied for this image. $(cat docker-pull-error.log)"
            elif [ -z "$REGISTRY_USERNAME" ]; then
              echo "::error::wing-commander verify-image-prerequisites: failed to pull $IMAGE -- container-registry-username was not supplied (container-registry-password was), so no login was attempted. $(cat docker-pull-error.log)"
            elif [ -z "$REGISTRY_PASSWORD" ]; then
              echo "::error::wing-commander verify-image-prerequisites: failed to pull $IMAGE -- container-registry-password was not supplied (container-registry-username was), so no login was attempted. $(cat docker-pull-error.log)"
            else
              echo "::error::wing-commander verify-image-prerequisites: failed to pull $IMAGE -- the registry rejected the supplied credentials or image reference. $(cat docker-pull-error.log)"
            fi
            exit 1
          fi

          if ! missing=$(docker run --rm -e REQUIRED_TOOLS="$REQUIRED_TOOLS" \
            --entrypoint sh "$IMAGE" -c \
            'for t in $REQUIRED_TOOLS; do command -v "$t" >/dev/null 2>&1 || printf " %s" "$t"; done; if command -v git >/dev/null 2>&1; then v=$(git --version 2>/dev/null); n=${v#git version }; maj=${n%%.*}; r=${n#*.}; min=${r%%.*}; case "$maj.$min" in .|*[!0-9.]*|.*|*.) echo "could not parse git version from \"$v\"" >&2; exit 1;; esac; if [ "$maj" -lt 2 ] || { [ "$maj" -eq 2 ] && [ "$min" -lt 38 ]; }; then echo "git ${n%% *} is older than the 2.38 minimum" >&2; exit 1; fi; fi' \
            2>docker-inspect-error.log); then
            echo "::error::wing-commander verify-image-prerequisites: could not run a POSIX shell inside $IMAGE to check its prerequisites -- $(cat docker-inspect-error.log)"
            exit 1
          fi

          if [ -n "$missing" ]; then
            echo "::error::wing-commander verify-image-prerequisites: $IMAGE is missing required tool(s):$missing"
            exit 1
          fi

  dogfood:
    needs: verify-image-prerequisites
    # if: tolerates a skipped image check without widening to run merely
    # because the workflow was not cancelled (#224) -- see clarify.yml.
    if: "!cancelled() && needs.verify-image-prerequisites.result != 'failure'"
    runs-on: ${{ startsWith(inputs.runner, '[') && fromJSON(inputs.runner) || inputs.runner }}
    container:
      image: ${{ inputs.container-image }}
      credentials: >-
        ${{
          (secrets.container-registry-username != '' && secrets.container-registry-password != '')
            && fromJSON(format('{{"username":{0},"password":{1}}}', toJSON(secrets.container-registry-username), toJSON(secrets.container-registry-password)))
            || fromJSON('{}')
        }}
      # Git safe.directory for the caller's container image -- see clarify.yml.
      env:
        GIT_CONFIG_COUNT: "1"
        GIT_CONFIG_KEY_0: safe.directory
        GIT_CONFIG_VALUE_0: "*"
    environment:
      name: ${{ inputs.environment }}
      deployment: ${{ inputs.environment-deployment }}
    permissions: {}
    steps:
      # Just enough to prove the container actually started, per T044.
      - name: Prove the container actually started
        run: cat /etc/os-release

  # specs/112-agent-startup-image-check: runs the real agent action's setup in
  # the image with NO model credential. The action stops at authentication,
  # so no model call is reachable; classify-startup reads this job's log.
  startup-agent:
    needs: verify-image-prerequisites
    if: "!cancelled() && needs.verify-image-prerequisites.result != 'failure' && inputs.startup-check && inputs.container-image != ''"
    runs-on: ${{ startsWith(inputs.runner, '[') && fromJSON(inputs.runner) || inputs.runner }}
    container:
      image: ${{ inputs.container-image }}
      credentials: >-
        ${{
          (secrets.container-registry-username != '' && secrets.container-registry-password != '')
            && fromJSON(format('{{"username":{0},"password":{1}}}', toJSON(secrets.container-registry-username), toJSON(secrets.container-registry-password)))
            || fromJSON('{}')
        }}
      # Git safe.directory for the caller's container image -- see clarify.yml.
      env:
        GIT_CONFIG_COUNT: "1"
        GIT_CONFIG_KEY_0: safe.directory
        GIT_CONFIG_VALUE_0: "*"
    environment:
      name: ${{ inputs.environment }}
      deployment: ${{ inputs.environment-deployment }}
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Run the agent action's setup without a model credential
        id: agent
        uses: anthropics/claude-code-action@v1
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
      - name: Upload Claude execution log
        if: always() && steps.agent.outcome != 'skipped'
        uses: actions/upload-artifact@v6
        with:
          name: claude-execution-output
          path: ${{ runner.temp }}/claude-execution-output.json
          if-no-files-found: ignore
          retention-days: 90

  classify-startup:
    needs: [verify-image-prerequisites, startup-agent]
    if: "!cancelled() && needs.verify-image-prerequisites.result != 'failure' && inputs.startup-check && inputs.container-image != ''"
    runs-on: ${{ startsWith(inputs.runner, '[') && fromJSON(inputs.runner) || inputs.runner }}
    container:
      image: ${{ inputs.container-image }}
      credentials: >-
        ${{
          (secrets.container-registry-username != '' && secrets.container-registry-password != '')
            && fromJSON(format('{{"username":{0},"password":{1}}}', toJSON(secrets.container-registry-username), toJSON(secrets.container-registry-password)))
            || fromJSON('{}')
        }}
      # Git safe.directory for the caller's container image -- see clarify.yml.
      env:
        GIT_CONFIG_COUNT: "1"
        GIT_CONFIG_KEY_0: safe.directory
        GIT_CONFIG_VALUE_0: "*"
    environment:
      name: ${{ inputs.environment }}
      deployment: ${{ inputs.environment-deployment }}
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
      - name: Classify the agent start-up log
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          AGENT_RESULT: ${{ needs.startup-agent.result }}
        run: |
          : > startup-agent.log
          if [ "$AGENT_RESULT" != "skipped" ]; then
            job_id=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --paginate \
              --jq '.jobs[] | select(.name | endswith("startup-agent")) | .id' | head -n 1) || job_id=""
            if [ -n "$job_id" ]; then
              gh api "repos/$REPO/actions/jobs/$job_id/logs" > startup-agent.log || : > startup-agent.log
            fi
          fi
          rc=0
          python3 .github/scripts/classify-agent-startup.py --log startup-agent.log --json > verdict.json || rc=$?
          {
            echo "### Agent start-up check"
            echo
            echo '```json'
            cat verdict.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            echo "::error::wing-commander classify-startup: $(jq -r .reason verdict.json)"
            exit 1
          fi
