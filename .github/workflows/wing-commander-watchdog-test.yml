# Manual end-to-end test of the watchdog chain (stage 8 + the 8b verifier).
# Exists so nobody has to wait for an organic pipeline run to know the
# watchdog still fires: dispatch this, watch the result within minutes.
#
# Two modes, chosen by the inject-failure input:
#   - false (default): dispatches stage 8 at a real completed run, asserts
#     stage 8 goes green, and runs the same deterministic verifier 8b uses
#     against it — asserting it agrees.
#   - true: dispatches stage 8 at run-id 1, which can never resolve, so
#     stage 8 fails HONESTLY (and the test asserts the failure landed in
#     the resolve job — an earlier fault-injection era was silently
#     preempted by an unrelated bug and never exercised its scenario).
#     The verifier must then REFUSE to bless that run, and this test run
#     itself exits non-zero once the chain behaved — so red is visible in
#     the run list, because a watchdog that stays green when it should be
#     red is exactly the defect class this repository keeps re-learning.
#
# Why the verifier runs INSIDE this job instead of waiting for an 8b run:
# this workflow dispatches stage 8 with the default GITHUB_TOKEN
# (workflow_dispatch is exempt from GitHub's no-recursive-trigger rule, so
# the dispatch works) — but the taint carries through to the dispatched
# run's COMPLETION event, which therefore never fires 8b's workflow_run
# trigger. Proven live 2026-07-25: three GITHUB_TOKEN-dispatched stage-8
# completions produced zero 8b runs while three event-triggered ones
# produced three. The pipeline's organic chains are App-bot-actored, so
# real stage-8 completions DO fire 8b; the "8b wiring is alive" check
# below verifies exactly that against the most recent organic chain.
name: "Wing Commander · watchdog test"

on:
  workflow_dispatch:
    inputs:
      inject-failure:
        description: "Inject a failure: stage 8 gets an unresolvable run-id and the chain must turn RED"
        type: boolean
        required: false
        default: false

permissions: {}

jobs:
  trigger-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write   # dispatch stage 8, then read the resulting runs
      contents: read   # checkout (the verifier script)
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      INJECT: ${{ inputs.inject-failure }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Dispatch stage 8
        id: dispatch
        run: |
          set -euo pipefail
          if [ "$INJECT" = "true" ]; then
            target=1   # no run 1 exists; stage 8's resolve job must fail
            echo "Injecting failure: dispatching stage 8 at unresolvable run-id $target"
          else
            # Prefer re-inspecting the latest SUCCESSFUL stage-8 run (the
            # designed manual re-inspection path); fall back to any
            # completed run on an empty history. Successful only: a prior
            # inject-failure test leaves a deliberately failed stage-8 run
            # behind, and pointing the watchdog at it makes it (correctly)
            # file a step-failure issue about our own test wreckage.
            target="$(gh run list -R "$REPO" --workflow wing-commander-8-watchdog.yml \
              --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            if [ -z "$target" ]; then
              target="$(gh run list -R "$REPO" --status completed --limit 1 \
                --json databaseId --jq '.[0].databaseId')"
            fi
            echo "Dispatching stage 8 at run $target"
          fi
          mark="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run wing-commander-8-watchdog.yml -R "$REPO" -f run-id="$target"
          echo "mark=$mark" >> "$GITHUB_OUTPUT"

      # ISO-8601 UTC timestamps compare lexicographically — string > is
      # time >.
      - name: Wait for stage 8 to appear and complete
        id: stage8
        env:
          MARK: ${{ steps.dispatch.outputs.mark }}
        run: |
          set -euo pipefail
          run_id=""
          for i in $(seq 1 24); do   # up to 2 min for the run to register
            # NB: gh's --jq takes only the expression (no --arg passthrough);
            # MARK is our own %Y-%m-%dT%H:%M:%SZ stamp, safe to inline.
            run_id="$(gh run list -R "$REPO" --workflow wing-commander-8-watchdog.yml \
              --event workflow_dispatch --limit 1 --json databaseId,createdAt \
              --jq ".[] | select(.createdAt >= \"$MARK\") | .databaseId" | head -1)"
            [ -n "$run_id" ] && break
            sleep 5
          done
          if [ -z "$run_id" ]; then
            echo "::error::stage 8 never started after dispatch — its workflow_dispatch trigger is broken"
            exit 1
          fi
          echo "Stage 8 run: $run_id — waiting for completion"
          conclusion=""
          for i in $(seq 1 80); do   # up to 20 min
            conclusion="$(gh api "repos/$REPO/actions/runs/$run_id" --jq '.conclusion // empty')"
            [ -n "$conclusion" ] && break
            sleep 15
          done
          [ -z "$conclusion" ] && { echo "::error::stage 8 run $run_id did not complete in 20 min"; exit 1; }
          echo "Stage 8 concluded: $conclusion"
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"

      # The same deterministic checks 8b runs, against the run we just
      # produced. CREATE_ISSUE stays false — a test must not page anyone.
      - name: Run the 8b verifier against the dispatched run
        id: verify
        continue-on-error: true
        env:
          RUN_ID: ${{ steps.stage8.outputs.run-id }}
          CREATE_ISSUE: "false"
        run: bash .github/scripts/verify-watchdog-run.sh

      - name: 8b wiring is alive (organic chains still trigger it)
        run: |
          set -euo pipefail
          # Latest stage-8 completion that came from a real workflow_run
          # event (App-bot-actored, untainted — the shape 8b listens to).
          last_organic="$(gh run list -R "$REPO" --workflow wing-commander-8-watchdog.yml \
            --event workflow_run --status completed --limit 1 \
            --json databaseId,updatedAt --jq '.[0] // empty')"
          if [ -z "$last_organic" ]; then
            echo "::warning::no organic stage-8 completion exists yet — cannot check 8b liveness"
            exit 0
          fi
          done_at="$(printf '%s' "$last_organic" | jq -r '.updatedAt')"
          follow="$(gh run list -R "$REPO" --workflow wing-commander-8b-watchdog-self.yml \
            --limit 10 --json databaseId,createdAt \
            --jq "[.[] | select(.createdAt >= \"$done_at\")] | length")"
          if [ "$follow" -eq 0 ]; then
            echo "::error::the most recent organic stage-8 completion ($done_at) was never followed by an 8b run — 8b's workflow_run trigger is broken (renamed workflow? unregistered file?)"
            exit 1
          fi
          echo "8b followed the most recent organic stage-8 completion ($follow run(s) since $done_at)."

      - name: Assert the chain behaved
        env:
          S8: ${{ steps.stage8.outputs.conclusion }}
          S8_ID: ${{ steps.stage8.outputs.run-id }}
          VERIFY: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          url="${GITHUB_SERVER_URL}/${REPO}/actions/runs"
          {
            echo "### Watchdog chain test (inject-failure: $INJECT)"
            echo "- stage 8: [$S8_ID]($url/$S8_ID) → **$S8**"
            echo "- deterministic verifier verdict on it: **$VERIFY**"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$INJECT" = "true" ]; then
            if [ "$S8" != "failure" ]; then
              echo "::error::injected an unresolvable run-id but stage 8 concluded '$S8' — it should have failed"
              exit 1
            fi
            # The failure must be OUR failure: an earlier fault-injection
            # era was silently preempted by an unrelated bug that fired
            # first, giving false confidence the scenario was exercised.
            # Injecting run-id 1 must kill exactly the resolve job.
            failed_jobs="$(gh api "repos/$REPO/actions/runs/$S8_ID/jobs?per_page=100" \
              --jq '[.jobs[] | select(.conclusion == "failure") | .name] | join(", ")')"
            case "$failed_jobs" in
              *resolve*) echo "Injected failure landed where expected (failed jobs: $failed_jobs)" ;;
              *) echo "::error::stage 8 failed, but not in the injected way (failed jobs: $failed_jobs) — a different defect preempted the injection"; exit 1 ;;
            esac
            if [ "$VERIFY" = "success" ]; then
              echo "::error::stage 8 failed but the verifier blessed it — the exact defect this test exists to catch"
              exit 1
            fi
            echo "Chain correctly turned red (verifier: $VERIFY). Failing this run too so the red is visible here." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$S8" != "success" ] || [ "$VERIFY" != "success" ]; then
            echo "::error::expected green, got stage8=$S8, verifier=$VERIFY"
            exit 1
          fi
          echo "Chain green end to end." | tee -a "$GITHUB_STEP_SUMMARY"
