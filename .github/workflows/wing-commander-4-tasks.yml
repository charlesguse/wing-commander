# Stage 3 — Tasks (thin wrapper).
# Two triggers, one stage: a merged plan PR (or manual restart) calls
# tasks.yml with mode: generate; a merged tasks/<NNN-slug> review PR
# calls it with mode: approved (the agent-free hand-off — a workflow_call
# workflow cannot own the pull_request trigger itself). Review mode and the
# implement hand-off are wired from this repo's variables here, as declared
# stage inputs (docs/adoption.md).
# A tasks PR closed WITHOUT merging marks the spec stalled — owned by the
# cleanup stage (wing-commander-7-cleanup.yml), not this workflow.
name: "Wing Commander · 4 tasks"

on:
  pull_request:
    types: [closed]
    branches: ["spec/**"]
    paths: ["specs/**"]
  workflow_dispatch:
    inputs:
      slug:
        description: "Spec slug (NNN-name, e.g. 003-tasks-stage) to (re)start task generation for"
        required: true
        type: string

permissions: {}

jobs:
  tasks:
    # Gate: a plan PR merged into the spec's persistent branch, or a manual
    # restart. The head-prefix guard prevents unrelated PRs into spec/** from
    # false-triggering.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, vars.WING_COMMANDER_PLAN_PREFIX || 'plan/'))
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      id-token: write
    uses: ./.github/workflows/tasks.yml
    with:
      mode: generate
      head-ref: ${{ github.event.pull_request.head.ref }}
      slug: ${{ inputs.slug }}
      restart: ${{ github.event_name == 'workflow_dispatch' }}
      tasks-review: ${{ vars.WING_COMMANDER_TASKS_REVIEW || 'auto' }}
      model: ${{ vars.WING_COMMANDER_PLAN_MODEL || 'claude-sonnet-5' }}
      spec-draft-prefix: ${{ vars.WING_COMMANDER_SPEC_DRAFT_PREFIX || 'spec-draft/' }}
      spec-prefix: ${{ vars.WING_COMMANDER_SPEC_PREFIX || 'spec/' }}
      plan-prefix: ${{ vars.WING_COMMANDER_PLAN_PREFIX || 'plan/' }}
      tasks-prefix: ${{ vars.WING_COMMANDER_TASKS_PREFIX || 'tasks/' }}
      impl-prefix: ${{ vars.WING_COMMANDER_IMPL_PREFIX || 'impl/' }}
      next-workflow: wing-commander-5-implement.yml
    secrets:
      claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      speckit-app-id: ${{ secrets.WING_COMMANDER_APP_ID }}
      speckit-app-private-key: ${{ secrets.WING_COMMANDER_APP_PRIVATE_KEY }}

  # A tasks PR merged by a maintainer is the review-mode acceptance signal.
  tasks-approved:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, vars.WING_COMMANDER_TASKS_PREFIX || 'tasks/')
    # The grant must cover EVERY job in the called workflow file — GitHub
    # validates them all at startup, including jobs whose `if` will skip
    # them, so this must match the generate-mode job's needs even though
    # this path only dispatches. The called job's own `contents: read`
    # declaration still scopes the actual token down.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      id-token: write
    uses: ./.github/workflows/tasks.yml
    with:
      mode: approved
      head-ref: ${{ github.event.pull_request.head.ref }}
      spec-draft-prefix: ${{ vars.WING_COMMANDER_SPEC_DRAFT_PREFIX || 'spec-draft/' }}
      spec-prefix: ${{ vars.WING_COMMANDER_SPEC_PREFIX || 'spec/' }}
      plan-prefix: ${{ vars.WING_COMMANDER_PLAN_PREFIX || 'plan/' }}
      tasks-prefix: ${{ vars.WING_COMMANDER_TASKS_PREFIX || 'tasks/' }}
      impl-prefix: ${{ vars.WING_COMMANDER_IMPL_PREFIX || 'impl/' }}
      next-workflow: wing-commander-5-implement.yml
    secrets:
      claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      speckit-app-id: ${{ secrets.WING_COMMANDER_APP_ID }}
      speckit-app-private-key: ${{ secrets.WING_COMMANDER_APP_PRIVATE_KEY }}
