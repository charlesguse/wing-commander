# Maintenance — Auto-Update Spec Kit (thin wrapper).
# Four triggers multiplexed into one typed `trigger` input: the daily
# schedule / on-demand workflow_dispatch (detect+adopt), pull_request(closed)
# (post-merge summary), and issue_comment(created) (resume an
# ambiguous-options question). Every job lives in auto-update-spec-kit.yml
# (docs/architecture.md), called by local path — this wrapper only resolves
# triggers, gates, and vars.* (constitution VII).
name: "Wing Commander · spec-kit updater"

on:
  schedule:
    - cron: "13 7 * * *"
  workflow_dispatch: {}
  pull_request:
    types: [closed]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  auto-update-spec-kit:
    # Pause kill-switch, wrapper-side (constitution VII; the lesson
    # wing-commander-8-watchdog.yml already learned — a stage-side pause
    # check still bills for steps before discovering it's paused).
    #
    # Comment pre-filter, wrapper-side for the same reason. Every
    # issue_comment in the repository -- the pipeline's own status comments
    # included -- used to start this stage, whose verify-image-prerequisites
    # job then ran for a billed minute before comment-reply's own `if:` (or
    # its marker check) found nothing to do. The resume path only ever
    # concerns a human reply on the settle-tracking issue, which the stage
    # creates and re-labels with `auto-update:tracking` (TRACKING_LABEL in
    # auto-update-spec-kit.yml is that literal's one home; this clause
    # follows it). Schedule, dispatch, and pull_request pass untouched.
    if: >-
      vars.WING_COMMANDER_AUTO_UPDATE_SPEC_KIT_PAUSED != 'true' &&
      (github.event_name != 'issue_comment' ||
        (!github.event.issue.pull_request &&
         github.event.comment.user.type != 'Bot' &&
         contains(github.event.issue.labels.*.name, 'auto-update:tracking')))
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/auto-update-spec-kit.yml
    with:
      trigger: >-
        ${{ github.event_name == 'schedule' && 'scheduled'
            || github.event_name == 'workflow_dispatch' && 'dispatch'
            || github.event_name == 'pull_request' && 'pr-merged'
            || 'comment-reply' }}
      pr-number: ${{ github.event.pull_request.number || '' }}
      pr-merged: ${{ github.event.pull_request.merged || false }}
      issue-number: ${{ github.event.issue.number || '' }}
      comment-id: ${{ github.event.comment.id || '' }}
      commenter-association: ${{ github.event.comment.author_association || '' }}
      commenter-id: ${{ github.event.comment.user.id || '' }}
      issue-author-id: ${{ github.event.issue.user.id || '' }}
      stabilization-checks: ${{ vars.WING_COMMANDER_AUTO_UPDATE_SPEC_KIT_STABILIZATION_CHECKS || '1' }}
      model: ${{ vars.WING_COMMANDER_AUTO_UPDATE_SPEC_KIT_MODEL || 'claude-sonnet-5' }}
      e2e-stage-model: ${{ vars.WING_COMMANDER_AUTO_UPDATE_SPEC_KIT_E2E_STAGE_MODEL || 'claude-sonnet-5' }}
      e2e-stage-max-turns: ${{ vars.WING_COMMANDER_AUTO_UPDATE_SPEC_KIT_E2E_STAGE_MAX_TURNS || '20' }}
      e2e-scratch-repo: ${{ vars.WING_COMMANDER_AUTO_UPDATE_SPEC_KIT_E2E_SCRATCH_REPO || '' }}
      runner: ${{ vars.WING_COMMANDER_RUNNER || 'ubuntu-latest' }}
      container-image: ${{ vars.WING_COMMANDER_CONTAINER_IMAGE || '' }}
    secrets:
      claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      speckit-app-id: ${{ secrets.WING_COMMANDER_APP_ID }}
      speckit-app-private-key: ${{ secrets.WING_COMMANDER_APP_PRIVATE_KEY }}
      container-registry-username: ${{ secrets.WING_COMMANDER_CONTAINER_REGISTRY_USERNAME }}
      container-registry-password: ${{ secrets.WING_COMMANDER_CONTAINER_REGISTRY_PASSWORD }}
