name: "reusable · fold-cycle-guard"

# specs/074-serialized-fold-dispatch contracts/fold-cycle-guard.md (US3,
# research.md D7). Deliberately agent-free: a small, fully deterministic
# classification of a cancelled implement.yml run -- never started at all
# vs. ran some steps then was cancelled -- and, only for the
# never-started-and-correlated case, a lifecycle-issue notice plus an
# at-most-once automatic re-dispatch (FR-012-FR-016a). Constitution VII: a
# stage never reads github.event.* itself -- run-id/conclusion are passed
# in explicitly by the wrapper (wing-commander-9b-fold-cycle-guard.yml).

on:
  workflow_call:
    inputs:
      run-id:
        description: "The completed implement.yml-calling run to inspect."
        type: string
        required: true
      conclusion:
        description: "That run's conclusion."
        type: string
        required: true
      spec-dir:
        description: >
          specs/NNN-slug. Empty (default) resolves it itself via the same
          wing-commander-inspected-run-identity composite watchdog.yml
          already uses, since a dispatched run's head-ref is uninformative
          and the wrapper cannot know the spec ahead of time.
        type: string
        required: false
        default: ""
      implement-workflow:
        description: >
          Filename of the CONSUMER wrapper workflow to re-dispatch,
          matching dispatch-once's existing implement-workflow input.
        type: string
        required: true
      dry-run:
        description: >
          Quickstart/fixture use -- skips the real `gh workflow run`
          re-dispatch, still exercises detection and notice composition.
        type: boolean
        required: false
        default: false
      pipeline-repo:
        description: "Repository to check out for the pipeline's shared composite actions."
        type: string
        required: false
        default: charlesguse/wing-commander
      pipeline-ref:
        description: "Ref of the pipeline repository to check out."
        type: string
        required: false
        default: ""
      runner:
        description: "Runner label(s) for this stage's one job."
        type: string
        required: false
        default: ubuntu-latest
      container-image:
        description: >
          Container image every job in this stage runs inside. Empty
          (default) means no container — every job runs directly on the
          runner, unchanged from today (specs/038-runner-container-passthrough).
        type: string
        required: false
        default: ""
      environment:
        description: "GitHub Environment name every job in this stage binds to. Empty (default) means no environment gate (specs/031-stage-environment-binding)."
        type: string
        required: false
        default: ""
      environment-deployment:
        description: "Whether binding to environment: creates a deployment record (specs/031-stage-environment-binding)."
        type: boolean
        required: false
        default: true
    secrets:
      pipeline-repo-token:
        description: "Token with read access to the pipeline repository, if private."
        required: false
      speckit-app-id:
        description: "GitHub App ID used for pushes/issue comments"
        required: true
      speckit-app-private-key:
        description: "GitHub App private key"
        required: true
      container-registry-username:
        description: "Username for container-image's registry, if private. Inert when container-image is empty (specs/038-runner-container-passthrough)."
        required: false
      container-registry-password:
        description: "Password or token for container-image's registry, if private. May be a short-lived token minted by the calling wrapper before its uses: call. Inert when container-image is empty (specs/038-runner-container-passthrough)."
        required: false
    outputs:
      action-taken:
        description: "none | notice-only | notice-and-redispatch"
        value: ${{ jobs.guard.outputs.action-taken }}

permissions: {}

# Pins bash for every run: step without its own shell:, a caller-supplied
# container included -- see pr-conversation.yml.
defaults:
  run:
    shell: bash -e {0}

jobs:
  # specs/038-runner-container-passthrough -- deliberately left unbound
  # (no environment: block), asserted by Gate 7; every OTHER job of this
  # stage runs inside the adopter's container, bound by Gate 22.
  verify-image-prerequisites:
    if: inputs.container-image != ''
    permissions: {}
    runs-on: ${{ startsWith(inputs.runner, '[') && fromJSON(inputs.runner) || inputs.runner }}
    steps:
      - name: Pull image and verify prerequisites
        if: inputs.container-image != ''
        env:
          IMAGE: ${{ inputs.container-image }}
          REGISTRY_USERNAME: ${{ secrets.container-registry-username }}
          REGISTRY_PASSWORD: ${{ secrets.container-registry-password }}
        run: |
          # Canonical required-tool list: .github/scripts/required-tools.txt
          # (kept in agreement by Gate 23, specs/038 FR-011a).
          REQUIRED_TOOLS="git gh jq curl python3 bash node timeout unzip"

          if [ -n "$REGISTRY_USERNAME" ] && [ -n "$REGISTRY_PASSWORD" ]; then
            candidate=""
            case "$IMAGE" in
              */*) candidate="${IMAGE%%/*}" ;;
            esac
            case "$candidate" in
              *.*|*:*|localhost) login_args=("$candidate") ;;
              *) login_args=() ;;
            esac
            if ! echo "$REGISTRY_PASSWORD" | docker login "${login_args[@]}" --username "$REGISTRY_USERNAME" --password-stdin 2>docker-login-error.log; then
              echo "::error::wing-commander verify-image-prerequisites: the registry rejected the supplied credentials for $IMAGE -- $(cat docker-login-error.log)"
              exit 1
            fi
          fi

          if ! docker pull "$IMAGE" 2>docker-pull-error.log; then
            if [ -z "$REGISTRY_USERNAME" ] && [ -z "$REGISTRY_PASSWORD" ]; then
              echo "::error::wing-commander verify-image-prerequisites: failed to pull $IMAGE -- no credentials were supplied for this image. $(cat docker-pull-error.log)"
            elif [ -z "$REGISTRY_USERNAME" ]; then
              echo "::error::wing-commander verify-image-prerequisites: failed to pull $IMAGE -- container-registry-username was not supplied (container-registry-password was), so no login was attempted. $(cat docker-pull-error.log)"
            elif [ -z "$REGISTRY_PASSWORD" ]; then
              echo "::error::wing-commander verify-image-prerequisites: failed to pull $IMAGE -- container-registry-password was not supplied (container-registry-username was), so no login was attempted. $(cat docker-pull-error.log)"
            else
              echo "::error::wing-commander verify-image-prerequisites: failed to pull $IMAGE -- the registry rejected the supplied credentials or image reference. $(cat docker-pull-error.log)"
            fi
            exit 1
          fi

          if ! missing=$(docker run --rm -e REQUIRED_TOOLS="$REQUIRED_TOOLS" \
            --entrypoint sh "$IMAGE" -c \
            'for t in $REQUIRED_TOOLS; do command -v "$t" >/dev/null 2>&1 || printf " %s" "$t"; done' \
            2>docker-inspect-error.log); then
            echo "::error::wing-commander verify-image-prerequisites: could not run a POSIX shell inside $IMAGE to check its prerequisites -- $(cat docker-inspect-error.log)"
            exit 1
          fi

          if [ -n "$missing" ]; then
            echo "::error::wing-commander verify-image-prerequisites: $IMAGE is missing required tool(s):$missing"
            exit 1
          fi

  guard:
    needs: verify-image-prerequisites
    if: "!cancelled() && needs.verify-image-prerequisites.result != 'failure'"
    runs-on: ${{ startsWith(inputs.runner, '[') && fromJSON(inputs.runner) || inputs.runner }}
    container:
      image: ${{ inputs.container-image }}
      credentials: >-
        ${{
          (secrets.container-registry-username != '' && secrets.container-registry-password != '')
            && fromJSON(format('{{"username":{0},"password":{1}}}', toJSON(secrets.container-registry-username), toJSON(secrets.container-registry-password)))
            || fromJSON('{}')
        }}
      # Git safe.directory for the caller's container image -- see clarify.yml.
      env:
        GIT_CONFIG_COUNT: "1"
        GIT_CONFIG_KEY_0: safe.directory
        GIT_CONFIG_VALUE_0: "*"
    environment:
      name: ${{ inputs.environment }}
      deployment: ${{ inputs.environment-deployment }}
    permissions:
      contents: write
      issues: write
      actions: write
      id-token: write
    outputs:
      action-taken: ${{ steps.decide.outputs.action-taken || steps.react.outputs.action-taken }}
    steps:
      - name: Checkout consumer repository (bootstrap, default token)
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Resolve pipeline ref
        id: pipeline-ref
        shell: bash
        env:
          JOB_WORKFLOW_SHA: ${{ github.job_workflow_sha }}
          PIPELINE_REF_INPUT: ${{ inputs.pipeline-ref }}
        run: |
          set -euo pipefail
          ref="${PIPELINE_REF_INPUT:-$JOB_WORKFLOW_SHA}"
          if [ -z "$ref" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            payload=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=wing-commander-pipeline-ref" \
              | jq -r '.value' | cut -d. -f2 | tr '_-' '/+')
            while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="$payload="; done
            ref=$(printf '%s' "$payload" | base64 -d 2>/dev/null | jq -r '.job_workflow_sha // empty' || true)
          fi
          if [ -z "$ref" ]; then
            echo "::error::wing-commander fold-cycle-guard stage: cannot determine the pipeline commit to check out — github.job_workflow_sha is empty and no OIDC token is available. Grant the calling job id-token: write, or set the pipeline-ref input to the same ref as your uses: pin."
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout pipeline repository (shared composite actions)
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.pipeline-repo }}
          ref: ${{ steps.pipeline-ref.outputs.ref }}
          token: ${{ secrets.pipeline-repo-token || github.token }}
          path: .wing-commander-pipeline
          persist-credentials: false

      - name: Wing Commander context
        id: ctx
        uses: ./.wing-commander-pipeline/.github/actions/wing-commander-context
        with:
          app-id: ${{ secrets.speckit-app-id }}
          private-key: ${{ secrets.speckit-app-private-key }}

      # Always resolved (even when inputs.spec-dir was already supplied)
      # because this is also the only source of the lifecycle issue number
      # the FR-012 notice posts to.
      - name: Resolve inspected run's spec and lifecycle issue
        id: identity
        uses: ./.wing-commander-pipeline/.github/actions/wing-commander-inspected-run-identity
        with:
          token: ${{ steps.ctx.outputs.token }}
          actions-token: ${{ github.token }}
          run-id: ${{ inputs.run-id }}
          run-name: "Wing Commander · 5 implement"

      # Both reads below run unconditionally whenever conclusion is
      # 'cancelled' -- cheap and harmless even on the branches (ran-then-
      # cancelled, uncorrelated) that end up not using them; splitting
      # them out here, rather than calling fold-queue-ledger.sh inline
      # from the decide step below, is what keeps this published stage
      # from resolving an internal _shared/ helper directly (Gate 60
      # FR-025) -- see wing-commander-fold-queue-ledger.
      - name: Peek the fold queue head
        id: peek
        if: inputs.conclusion == 'cancelled'
        uses: ./.wing-commander-pipeline/.github/actions/wing-commander-fold-queue-ledger
        with:
          transform: peek
          spec-dir: ${{ inputs.spec-dir || steps.identity.outputs.spec-dir }}
          peek-token: "__fold-cycle-guard-probe__"

      - name: Peek this run's ledger round
        id: peek-implement-run
        if: inputs.conclusion == 'cancelled'
        uses: ./.wing-commander-pipeline/.github/actions/wing-commander-fold-queue-ledger
        with:
          transform: peek-implement-run
          spec-dir: ${{ inputs.spec-dir || steps.identity.outputs.spec-dir }}
          implement-run-id: ${{ inputs.run-id }}

      # Detection algorithm (contracts/fold-cycle-guard.md; research.md D7):
      # a fully deterministic classification, never an agent's inference
      # (Principle IX) -- 1) never-started vs ran-then-cancelled, 2) a
      # positive, deterministic correlation with another entrant (here:
      # this feature's OWN ledger showing another ticket for the same
      # spec-dir granted within a short window of this run's cancellation
      # -- the one residual collision research.md D6 describes, a non-
      # ticketed dispatch colliding with a ticketed run), 3) the
      # redispatch_count bound. The actual claim-redispatch write (FR-016's
      # at-most-once CAS) is a separate step below, gated on this step's
      # own should-attempt-redispatch output, since a write must stay
      # conditional on actually reaching that branch.
      - name: Detect a lost cycle and react
        id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TOKEN: ${{ steps.ctx.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ inputs.run-id }}
          CONCLUSION: ${{ inputs.conclusion }}
          SPEC_DIR: ${{ inputs.spec-dir || steps.identity.outputs.spec-dir }}
          ISSUE: ${{ steps.identity.outputs.lifecycle-issue }}
          IMPLEMENT_WORKFLOW: ${{ inputs.implement-workflow }}
          DRY_RUN: ${{ inputs.dry-run }}
          PEEK_OUT: ${{ steps.peek.outputs.output }}
          ROUND_OUT: ${{ steps.peek-implement-run.outputs.output }}
        run: |
          set -euo pipefail

          if [ "$CONCLUSION" != "cancelled" ]; then
            echo "action-taken=none" >> "$GITHUB_OUTPUT"
            echo "fold-cycle-guard: conclusion is '$CONCLUSION', not 'cancelled' -- nothing to do." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if ! jobs_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100")"; then
            echo "::error::fold-cycle-guard: could not read run $RUN_ID's jobs -- cannot tell a never-started cancellation from a manual one."
            exit 1
          fi
          never_started=true
          if printf '%s' "$jobs_json" | jq -e '[.jobs[] | select(.started_at != null)] | length > 0' >/dev/null 2>&1; then
            never_started=false
          fi

          if [ "$never_started" != "true" ]; then
            # FR-013: ran at least one step, then was cancelled -- today's
            # existing manual-cancel silence, unchanged.
            echo "action-taken=none" >> "$GITHUB_OUTPUT"
            echo "fold-cycle-guard: run $RUN_ID started at least one job step before being cancelled -- today's silent manual-cancel case, unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ -z "$SPEC_DIR" ]; then
            echo "action-taken=none" >> "$GITHUB_OUTPUT"
            echo "fold-cycle-guard: no spec-dir could be resolved for run $RUN_ID -- cannot correlate or report." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if ! run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")"; then
            echo "::error::fold-cycle-guard: could not read run $RUN_ID -- cannot place its cancellation time against the fold queue."
            exit 1
          fi
          cancelled_at="$(printf '%s' "$run_json" | jq -r '.updated_at')"
          cancelled_epoch=$(date -u -d "$cancelled_at" +%s 2>/dev/null) || cancelled_epoch=0

          # research.md D6's residual collision: a correlated entrant is
          # another ticket for this SAME spec-dir granted within a short
          # window of this run's cancellation -- since every ticketed
          # participant now serializes through this ledger (D1), the only
          # way a job still gets evicted from the GitHub concurrency group
          # is a non-ticketed dispatch (this cancelled run) colliding with
          # a ticketed one that won admission around the same moment. Reads
          # the LIVE current head, a best-effort approximation (the ledger
          # keeps no historical head-transition log) -- adequate here
          # because the queue is typically near-empty again within
          # poll-interval-seconds of a real collision, so "current head"
          # and "head at cancellation" coincide for the common case this
          # guard exists to catch.
          head_granted_at="$(printf '%s\n' "$PEEK_OUT" | grep '^head-granted-at=' | cut -d= -f2-)"

          correlated=false
          if [ -n "$head_granted_at" ] && [ "$cancelled_epoch" -gt 0 ]; then
            granted_epoch=$(date -u -d "$head_granted_at" +%s 2>/dev/null) || granted_epoch=0
            if [ "$granted_epoch" -gt 0 ]; then
              diff=$(( cancelled_epoch - granted_epoch ))
              [ "$diff" -lt 0 ] && diff=$(( -diff ))
              # Five-minute correlation window: generous relative to the
              # composites' own default 10s poll interval, tight relative
              # to a typical implement cycle's runtime.
              if [ "$diff" -le 300 ]; then
                correlated=true
              fi
            fi
          fi

          if [ "$correlated" != "true" ]; then
            # research.md D7's tie-break: an unexplained pending-cancel
            # with no positive replacement evidence stays silent, exactly
            # like today's default, rather than guessing a cause.
            echo "action-taken=none" >> "$GITHUB_OUTPUT"
            echo "fold-cycle-guard: run $RUN_ID never started and was cancelled, but no correlated entrant was found for $SPEC_DIR -- staying silent (research.md D7)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ -z "$ISSUE" ]; then
            echo "action-taken=none" >> "$GITHUB_OUTPUT"
            echo "fold-cycle-guard: no lifecycle issue could be resolved for $SPEC_DIR -- cannot post the notice." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          round="$(printf '%s\n' "$ROUND_OUT" | grep '^round=' | cut -d= -f2-)"
          redispatch_count="$(printf '%s\n' "$ROUND_OUT" | grep '^redispatch-count=' | cut -d= -f2-)"
          iteration="$(printf '%s\n' "$ROUND_OUT" | grep '^iteration=' | cut -d= -f2-)"

          # T065 (maintainer review of #821, B3, round 3): peek-implement-run
          # found no round matching this cancelled run's id -- either it was
          # never correlated in the first place (a poll miss on the ORIGINAL
          # dispatch) or this is itself a second loss of an already-lost
          # cycle whose correlation also never landed. Either way,
          # claim-redispatch requires ROUND and dies on `${ROUND:?}`
          # (ledger.sh) if given an empty one -- stay notice-only rather
          # than letting that surface as a job failure with no notice
          # posted at all.
          if [ -z "$round" ]; then
            echo "action-taken=notice-only" >> "$GITHUB_OUTPUT"
            {
              echo "⏸️ **Lost implementation cycle — replaced by a concurrency group**"
              echo ""
              echo "Spec: \`$SPEC_DIR\`"
              echo "Run: ${GITHUB_SERVER_URL:-https://github.com}/$GITHUB_REPOSITORY/actions/runs/$RUN_ID was cancelled while pending — another admitted run entered the same concurrency group before it could start."
              echo ""
              echo "This cycle's round could not be determined (it was never correlated in the fold queue, possibly because an earlier dispatch or redispatch poll missed it) — no automatic re-dispatch was attempted. A maintainer's re-drive is the remaining step."
            } > "$RUNNER_TEMP/fold-cycle-guard-notice.md"
            GH_TOKEN="$ISSUE_TOKEN" gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/fold-cycle-guard-notice.md"
            echo "fold-cycle-guard: no round could be correlated for $SPEC_DIR run $RUN_ID -- reported without attempting a redispatch (FR-016a)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          run_url="${GITHUB_SERVER_URL:-https://github.com}/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
          notice_file="$RUNNER_TEMP/fold-cycle-guard-notice.md"
          {
            echo "⏸️ **Lost implementation cycle — replaced by a concurrency group**"
            echo ""
            echo "Spec: \`$SPEC_DIR\`${round:+ (round $round)}"
            echo "Run: $run_url was cancelled while pending — another admitted run entered the same concurrency group before it could start."
          } > "$notice_file"

          if [ "$redispatch_count" = "1" ]; then
            {
              echo ""
              echo "This cycle has already been automatically re-dispatched once (FR-016a) — a maintainer's re-drive is the remaining step."
            } >> "$notice_file"
            GH_TOKEN="$ISSUE_TOKEN" gh issue comment "$ISSUE" --body-file "$notice_file"
            echo "action-taken=notice-only" >> "$GITHUB_OUTPUT"
            echo "fold-cycle-guard: reported a second loss for $SPEC_DIR round $round -- no further automatic dispatch (FR-016a)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$DRY_RUN" = "true" ]; then
            {
              echo ""
              echo "(dry-run: no re-dispatch attempted)"
            } >> "$notice_file"
            GH_TOKEN="$ISSUE_TOKEN" gh issue comment "$ISSUE" --body-file "$notice_file"
            echo "action-taken=notice-only" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # FR-016/FR-016a's at-most-once bound is an atomic CAS claim
          # (never this stage's own judgment about how many times it
          # "already tried", Principle IX) -- performed by the composite
          # step below, since it is a write and must stay conditional on
          # actually reaching this branch. That same write also enqueues
          # this run's implement-kind ticket (fold-queue-ledger.sh
          # claim-redispatch), so the react step below has a token to
          # thread onto its re-dispatch. notice_file (already holding the
          # header written above) and the rest of the reaction logic
          # continue in the react step, same $RUNNER_TEMP, same job.
          echo "should-attempt-redispatch=true" >> "$GITHUB_OUTPUT"
          echo "round=$round" >> "$GITHUB_OUTPUT"
          echo "iteration=$iteration" >> "$GITHUB_OUTPUT"

      - name: Claim this cycle's at-most-once redispatch slot
        id: claim
        if: steps.decide.outputs.should-attempt-redispatch == 'true'
        uses: ./.wing-commander-pipeline/.github/actions/wing-commander-fold-queue-ledger
        with:
          transform: claim-redispatch
          spec-dir: ${{ inputs.spec-dir || steps.identity.outputs.spec-dir }}
          round: ${{ steps.decide.outputs.round }}

      - name: React to the redispatch claim
        id: react
        if: steps.decide.outputs.should-attempt-redispatch == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TOKEN: ${{ steps.ctx.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SPEC_DIR: ${{ inputs.spec-dir || steps.identity.outputs.spec-dir }}
          ISSUE: ${{ steps.identity.outputs.lifecycle-issue }}
          IMPLEMENT_WORKFLOW: ${{ inputs.implement-workflow }}
          ROUND: ${{ steps.decide.outputs.round }}
          ITERATION: ${{ steps.decide.outputs.iteration }}
          CLAIM_OUT: ${{ steps.claim.outputs.output }}
        run: |
          set -euo pipefail
          notice_file="$RUNNER_TEMP/fold-cycle-guard-notice.md"
          should_redispatch="$(printf '%s\n' "$CLAIM_OUT" | grep '^should-redispatch=' | cut -d= -f2-)"

          if [ "$should_redispatch" != "true" ]; then
            {
              echo ""
              echo "This cycle has already been automatically re-dispatched once (FR-016a) — a maintainer's re-drive is the remaining step."
            } >> "$notice_file"
            GH_TOKEN="$ISSUE_TOKEN" gh issue comment "$ISSUE" --body-file "$notice_file"
            echo "action-taken=notice-only" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The claim step's own atomic write enqueued this run's implement-
          # kind ticket alongside the redispatch_count CAS (fold-queue-
          # ledger.sh claim-redispatch) -- threading it here, matching
          # dispatch-once's own T019 pattern, is what makes the recovered
          # cycle re-enter implement.yml's concurrency group through the
          # same serialized gate every other entrant uses, instead of
          # unticketed (the gap this re-dispatch itself would otherwise
          # reopen).
          implement_token="$(printf '%s\n' "$CLAIM_OUT" | grep '^implement-token=' | cut -d= -f2-)"

          # T062 (maintainer review of #821, B10): mirrors the identical
          # 422-retry fallback T047 added to wing-commander-fold-dispatch's
          # own dispatch step -- a wrapper predating this feature has no
          # fold_queue_token workflow_dispatch input declared, and GitHub
          # rejects an unknown input with a 422 "Unexpected inputs
          # provided" before even queuing a run. Retrying once without it
          # degrades to today's pre-serialization behavior for that one
          # un-migrated wrapper instead of losing the recovered cycle
          # outright. Not extracted into a shared _shared/ script: Gate 12
          # forbids a gh call there, and the two `-f` argument lists this
          # and wing-commander-fold-dispatch's own retry build are already
          # distinct (this call carries no folded-json/round-folded-json),
          # so sharing would only move the duplication, not remove it.
          # T069 (maintainer review of #821, round 3): this step previously
          # polled from the ORIGINAL run's cancellation time (the decide
          # step's own cancelled-at output), captured well before this
          # point (after the correlation read, the claim write, and -- on
          # the 422 path -- a full failed dispatch attempt first) -- on a
          # shared implement-workflow wrapper, polling "created since
          # cancellation" could match a different spec's run that happened
          # to start in that window instead of this re-dispatch's own.
          # Mirrors wing-commander-fold-dispatch's own start_ts
          # (action.yml:225): a timestamp taken immediately before the
          # actual gh workflow run call narrows the window to this
          # dispatch alone.
          start_ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          dispatch_err="$(mktemp)"
          if ! GH_TOKEN="$GH_TOKEN" gh workflow run "$IMPLEMENT_WORKFLOW" \
              -R "$GITHUB_REPOSITORY" -f spec_dir="$SPEC_DIR" -f issue="$ISSUE" -f iteration="${ITERATION:-1}" -f fold_queue_token="$implement_token" 2>"$dispatch_err"; then
            if [ -n "$implement_token" ] && grep -qi "unexpected inputs" "$dispatch_err"; then
              cat "$dispatch_err" >&2
              echo "::warning::fold-cycle-guard: $IMPLEMENT_WORKFLOW rejected fold_queue_token as an unexpected input -- retrying without it. Add a fold_queue_token workflow_dispatch input (docs/adoption.md, wing-commander-5-implement.yml) to restore fold-queue serialization for this wrapper."
              GH_TOKEN="$GH_TOKEN" gh workflow run "$IMPLEMENT_WORKFLOW" \
                -R "$GITHUB_REPOSITORY" -f spec_dir="$SPEC_DIR" -f issue="$ISSUE" -f iteration="${ITERATION:-1}"
              # Deliberately NOT releasing implement_token here the way
              # T056 fixed wing-commander-fold-dispatch's own equivalent
              # inline release: that fix exists because dispatch-once's own
              # dispatch-queue ticket sits ahead of the implement ticket at
              # this point, making an immediate release fail "not at queue
              # head" -- the exact no-op T056 removed. This job holds no
              # ticket of its own ahead of this one, but another run's
              # ticket (or this very round's own prior, still-stale head)
              # could still occupy the head, so an unconditional release
              # attempt here would reproduce the identical class of bug.
              # The redispatched (ticketless) run still gets correlated via
              # "Record the redispatched run" below, so the existing
              # correlated stale-reclaim path -- not a new release here --
              # cleans this ticket up once that run actually completes.
            else
              cat "$dispatch_err" >&2
              rm -f "$dispatch_err"
              exit 1
            fi
          fi
          rm -f "$dispatch_err"

          new_run_url=""
          for _ in 1 2 3 4 5 6; do
            sleep 5
            new_run_url=$(gh run list -R "$GITHUB_REPOSITORY" --workflow "$IMPLEMENT_WORKFLOW" \
              --created ">=$start_ts" --limit 1 --json url --jq '.[0].url // empty' 2>/dev/null) || new_run_url=""
            [ -n "$new_run_url" ] && break
          done

          # T065 (maintainer review of #821, B3, round 3): emitted
          # immediately once the poll resolves, before the fallible
          # `gh issue comment` call below -- previously this was written
          # only after that call succeeded, so a failed comment post left
          # a live redispatched run uncorrelated (its ticket then stale-
          # reclaimed out from under it by a later waiter).
          if [ -n "$new_run_url" ]; then
            echo "new-run-id=${new_run_url##*/}" >> "$GITHUB_OUTPUT"
          fi

          {
            echo ""
            if [ -n "$new_run_url" ]; then
              echo "Re-dispatched once automatically: $new_run_url"
            else
              echo "Re-dispatched once automatically — see the workflow's Actions tab for the new run."
            fi
          } >> "$notice_file"
          GH_TOKEN="$ISSUE_TOKEN" gh issue comment "$ISSUE" --body-file "$notice_file"
          echo "action-taken=notice-and-redispatch" >> "$GITHUB_OUTPUT"
          echo "fold-cycle-guard: re-dispatched $SPEC_DIR round $ROUND once (FR-016)." >> "$GITHUB_STEP_SUMMARY"

      # T055 (maintainer review of #821, B3): without this, the ledger's
      # round record still names the CANCELLED run as implement_run_id, so
      # a later waiter's stale-reclaim check (fold-queue-await.sh) resolves
      # liveness against a run that is already done and reclaims the LIVE
      # redispatched run's ticket out from under it -- reopening the exact
      # eviction FR-016 exists to recover from. It also means a second loss
      # of the redispatched run is never found by peek-implement-run below
      # (its run-id search would still only ever match the first, long-gone
      # run), silently breaking FR-016a's "a maintainer's re-drive is the
      # remaining step" notice. Mirrors dispatch-once's own "Record this
      # round's dispatched implement run" step (contracts/workflow-changes.md).
      - name: Record the redispatched run
        if: "!cancelled() && steps.react.outputs.new-run-id != ''"
        uses: ./.wing-commander-pipeline/.github/actions/wing-commander-fold-queue-ledger
        with:
          transform: record-implement-run
          spec-dir: ${{ inputs.spec-dir || steps.identity.outputs.spec-dir }}
          round: ${{ steps.decide.outputs.round }}
          implement-run-id: ${{ steps.react.outputs.new-run-id }}
