      # branches spec 090 and (on main) spec 100 (maintainer review, fold
      # leg-0); #660 tracks the cross-branch allocation problem these
      # gates' own numbering comments keep hitting.
      - name: "Gate 138 — no FR-002 site gates on a reference display name, and every metrics-summary call site declares spec-identity-is-own"
        if: "!cancelled()"
        run: python3 .github/scripts/verify-no-reference-name-stage-match.py
      - name: "Gate 138 self-test — a clean pass, a reintroduced reference-name case arm, a match inside name-fallback, a missing spec-identity-is-own: key, and a renamed/removed name-fallback step each behave as specified"
        if: "!cancelled()"
        run: python3 .github/scripts/verify-no-reference-name-stage-match.py --self-test

      # Gate 139 — specs/099-name-free-stage-identity T031: the shipped
      # bash behind watchdog.yml's seven converted FR-002 sites and the
      # composite's own record/name precedence, EXECUTED against fixtures
      # covering research.md R7's rows, SC-001 (a renamed and a reference-
      # named wrapper resolve identically for the same record), and
      # contracts/resolved-stage-identity.md Rule 2's three-state
      # consumption, including the new "unresolved" collector-outcomes
      # entry. tasks.md's T032/T033 claimed 126/127 for these two gates;
      # specs 091 and 108 landed on main first during this branch's
      # rebase and took 126, 127, 130 and 131; 128/129/132 are reserved
      # for specs 074/089/109; 133 and 134 are independently claimed by
      # sibling in-flight branch spec 090 and (on main) spec 100
      # (maintainer review, fold leg-0), so this gate claims 139 and its
      # sibling above claims 138; #660 tracks the allocation problem.
      - name: "Gate 139 — resolved-stage FR-002 consumers, executed against the shipped scripts"
        if: "!cancelled()"
        run: python3 .github/scripts/verify-watchdog-resolved-stage-consumers.py
      - name: "Gate 139 self-test — GITHUB_REPOSITORY is passed explicitly to the composite's stage step, not inherited from the ambient environment"
        if: "!cancelled()"
        run: python3 .github/scripts/verify-watchdog-resolved-stage-consumers.py --self-test

      # Gate 140 — the step harness (wc_shell_harness.run_step) runs each
      # step under the shell production gives that step: a `shell: bash`
      # step (every composite one) as `bash --noprofile --norc -eo pipefail`,
      # a workflow step that names no shell as `bash -e`. It used to run
      # everything as `bash -e`, so a pipeline whose early stage fails passed
      # under the gates and failed in CI (#889). Probes a real shipped step
      # of each shape and pins the resolution table and its single home.
      - name: "Gate 140 — the step harness runs each step under its production shell, pipefail where the runner applies it"
        if: "!cancelled()"
        run: python3 .github/scripts/verify-shell-harness-parity.py

      # Gate 133 — specs/090-stage-write-boundary: the implement stage's
      # write boundary (no-write-paths) is stated in the prompt before the
      # agent's first tool call, classified consistently by one shared
      # composite, and routed as a tracked, non-authorizing item rather than
      # re-surfacing every cycle (contracts/write-boundary-gate.md). Numbered
      # 133, not this branch's original 126 reservation: Gate 126 and Gate
      # 127 (both specs/091-gh-api-error-capture) claimed 126-127, and Gate
      # 128 was independently claimed by spec 074/#821, before this branch's
      # rebase landed (#660 tracks the allocation problem) — 133 is the next
      # free number as of this cycle.
      - name: "Gate 133 — the implement stage's write boundary is stated, classified, and routed consistently"
        if: "!cancelled()"
        run: python3 .github/scripts/verify-write-boundary.py
      - name: "Gate 133 self-test — write boundary"
        if: "!cancelled()"
        run: python3 .github/scripts/verify-write-boundary.py --self-test

      # Gate 114 — specs/066-fine-grained-maintainer-token FR-017/FR-018: "a
      # classic PAT, not fine-grained" was asserted in at least four places
      # (docs/setup.md, auto-release.yml's credential-step comment, Gate
      # 67's own docstring/scenario text, and specs/055-unattended-e2e-
      # gates' research.md D1/D2 and Clarifications session) before this
      # feature flipped the shape in three of them. docs/setup.md's secret
      # row is now the sole canonical statement; the other three sites must
      # carry a pointer to it (or, for specs/055's historical record, the
      # FR-019 annotation) and none may carry an unqualified contradicting
      # phrase. A new, topic-specific gate rather than an extension of Gate
      # 47 (research.md D7): Gate 47's declared scope is `#` comments in
      # .github/workflows/*.yml only, and never scans docs/*.md or
      # specs/*/research.md as a pointer source. Numbered 114 (and its
      # sibling below 115), not the 99/100/101 this branch's own commits
      # picked in turn: those collided with gates main or other in-flight
      # specs held, and 114-115 were reserved for this spec (#660 tracks
      # the allocation problem).
      - name: "Gate 114 — one canonical statement of the accepted maintainer-credential shape, every other site a pointer"
        if: "!cancelled()"
        run: python3 .github/scripts/verify-maintainer-credential-canonical-statement.py
      - name: "Gate 114 self-test — an unqualified contradicting phrase with no pointer, a removed pointer, a pointer aimed elsewhere, or a missing FR-019 annotation each fail"
        if: "!cancelled()"
        run: python3 .github/scripts/verify-maintainer-credential-canonical-statement.py --self-test

      # Gate 115 — specs/066-fine-grained-maintainer-token FR-011 (Edge Case
      # "Expiry during a long attempt"): a gate-driving read or write that
      # keeps failing at runtime because the harness credential itself was
      # rejected (expired, revoked, or narrowed mid-attempt) must end
      # fail-infra naming the credential as cause, not the undifferentiated
      # fail-gate-stall every other repeated gate failure produces. Runs the
      # real "Poll the test repository to a verdict" step against a stubbed
      # `gh` and asserts the new branch fires on a credential-rejection
      # signature, a plain repeated failure still gate-stalls, and the
      # pre-existing rate-limit branch still takes precedence over it; a
      # mutation dropping the new branch must fail the first assertion.
      - name: "Gate 115 — a repeated gate-driving failure caused by the harness credential ends fail-infra, naming the credential"
        if: "!cancelled()"
        run: python3 .github/scripts/verify-auto-release-poll-credential-failure.py

      # Gate 128 — specs/074-serialized-fold-dispatch (FR-021/FR-022): the
      # fold-queue admission wiring actually serializes every stage-9
      # concurrency contender through a ticket, and fold-cycle-guard.yml's
      # automatic re-dispatch is bounded to exactly one attempt. Loads the
      # real if:/needs:/concurrency.group text of every job the feature
      # gated and runs the real fold-cycle-guard.yml decide step and
      # fold-queue-ledger.sh claim-dispatch transform directly — see
      # verify-fold-queue-admission.py. Renumbered from Gate 126 (T051,
      # maintainer review of #821): five open Finalize PRs all claimed
      # Gate 126 at tasks time; the maintainer's allocation gives this
      # feature 128.
      - name: Gate 128 — fold-queue admission wiring serializes every contender and bounds the automatic re-dispatch
        if: "!cancelled()"
        run: python3 .github/scripts/verify-fold-queue-admission.py

      # Gate 128 fixtures — specs/074-serialized-fold-dispatch quickstart.md
      # Drill 2: the fold-queue composites' own bash fixture suites,
      # extracted from each composite's action.yml (or, for
      # wing-commander-fold-queue-ledger, from fold-queue-ledger.sh's
      # claim-redispatch transform directly) and run against a throwaway
      # local bare git repo (no live network). Gate 128 above exercises the
      # claim-dispatch transform and fold-cycle-guard.yml's decide step
      # directly; these four cover the admit/release/claim-dispatch/
      # claim-redispatch composites' own shipped shell, which nothing else
      # runs — see each suite's own header comment for scenario coverage.
      # T052 (maintainer review of #821, #719/#825): relocated from
      # .github/actions/<composite>/tests/run.sh (a location Gate 119
      # forbids) to .github/scripts/<composite>-tests/run-tests.sh, so
      # `python .github/scripts/run-local-gates.py` now runs these four
      # too, not only CI.
      - name: Gate 128 fixtures — wing-commander-fold-queue-admit composite (quickstart.md Drill 2)
        if: "!cancelled()"
        run: bash .github/scripts/wing-commander-fold-queue-admit-tests/run-tests.sh
      - name: Gate 128 fixtures — wing-commander-fold-queue-release composite (quickstart.md Drill 2)
        if: "!cancelled()"
        run: bash .github/scripts/wing-commander-fold-queue-release-tests/run-tests.sh
      - name: Gate 128 fixtures — wing-commander-fold-queue-claim-dispatch composite (quickstart.md Drill 2)
        if: "!cancelled()"
        run: bash .github/scripts/wing-commander-fold-queue-claim-dispatch-tests/run-tests.sh
      - name: Gate 128 fixtures — wing-commander-fold-queue-ledger composite's claim-redispatch transform (T038)
        if: "!cancelled()"
        run: bash .github/scripts/wing-commander-fold-queue-ledger-tests/run-tests.sh

      # Gate 10 — the gates themselves are wired up. Every gate above is a
      # file in .github/scripts that some `run:` line has to name, and
      # verify-denied-tool-collector.sh has already shown what happens when
      # one is not named: it sat orphaned for weeks, drifted out of sync with
      # the filter it checked, and still printed "all assertions passed" when
      # run by hand, so it read as evidence while proving nothing. PR #158
      # wired that one script up; this stops the next one landing the same
      # way, and also catches the reverse — a gate step pointing at a file
      # that has been moved or renamed, whose name in the job list implies a
      # check that is not happening.
      #
      # The rule is a naming convention read off the directory, not a list of
      # gate names: a list is what #149 was, where forgetting to add a file is
      # invisible and a new one is born exempt. Mentioning a script in a
      # comment does not count as running it — that is how an orphan would
      # hide from this check.
      - name: Gate 10 — every check is wired to a workflow, and every wire lands
        run: python3 .github/scripts/verify-gate-wiring.py
      - name: "Gate 10 self-test — collided harness identities, .github/actions/ placement vs. orphan-hood, and both directions of missing/duplicate .github/actions/ references each fail loudly"
        run: python3 .github/scripts/verify-gate-wiring.py --self-test

      # Gate 119 — gate_scripts() discovers .github/scripts/ only (FR-001), so
      # a test harness or standalone gate script placed under
      # .github/actions/ instead is invisible to Gate 10 and to
      # run-local-gates.py alike: a harness belongs at
      # .github/scripts/<composite>-tests/ and a standalone verify-* at
      # .github/scripts/ instead, for the two reasons
      # verify-actions-no-gate-scripts.py's own docstring gives. The
      # .github/actions/_shared/ carve-out is structural, not a waiver.
      - name: "Gate 119 — no test harness or standalone gate script lives under .github/actions/"
        run: python3 .github/scripts/verify-actions-no-gate-scripts.py
      - name: "Gate 119 self-test — a harness or standalone verify-* script under .github/actions/ (outside _shared/), at any depth, is caught; a _shared/ helper is not"
        run: python3 .github/scripts/verify-actions-no-gate-scripts.py --self-test

      # spec 053, SC-007 (Constitution VIII) — the E2E onboarding-element
      # list has exactly one home (.github/scripts/e2e-provisioning/), so a
      # future change cannot paste a second, independently-drifting copy of
      # it into a workflow or another script.
      - name: E2E provisioning single-home gate
        run: python3 .github/scripts/verify-e2e-provisioning-single-home.py

      - name: E2E provisioning single-home gate self-test
        run: python3 .github/scripts/verify-e2e-provisioning-single-home.py --self-test

  # Gate 4 — behavioral tests for the auto-update-spec-kit stage pair. Gates
  # 1-3 are static: they prove a workflow parses, registers, and is permitted
  # to run. None of them can see that a step's shell logic is simply wrong.
  # The auto-update stage shipped with three such defects — a `git log
  # --follow` invocation that always fatally errored, a verification tier that
  # could never pass because it called check-prerequisites.sh in a mode that
  # requires a file the preceding step does not create, and an absolute path
  # prefixed with its own parent — and every one of them would have fired on
  # the first scheduled run while looking perfectly valid to gates 1-3.
  #
  # The harness EXTRACTS the shipped run: blocks and executes them against a
  # gh stub and throwaway git repos, so it cannot drift from the workflow the
  # way a hand-copied fixture can. See .github/scripts/auto-update-spec-kit-tests/.
  harness-tests:
    # PR-facing check name. The old job id, auto-update-spec-kit, read on
    # every PR as though the PR were updating Spec Kit; what actually runs
    # here is that stage's behavioral TEST SUITE (Gate 4) - names audit,
    # 2026-08-25.
    name: harness tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Gate 4 — auto-update-spec-kit behavioral tests
        run: bash .github/scripts/auto-update-spec-kit-tests/run-tests.sh

      # spec 053 — behavioral tests for provision-e2e-target.sh and the
      # shared e2e-provisioning/checks.sh onboarding-element library, the
      # same convention as Gate 4 above: the shipped scripts are exercised
      # directly against a stubbed `gh`, so the suite cannot drift from what
      # actually ships. See .github/scripts/e2e-provisioning-tests/.
      - name: E2E provisioning behavioral tests
        run: bash .github/scripts/e2e-provisioning-tests/run-tests.sh

  # Gate 1 — the catch-all. When GitHub cannot parse a workflow file it
  # registers the workflow with its PATH as its name and creates a failed
  # "workflow file issue" run with zero jobs, no annotations, and no error
  # text anywhere in the API. Comparing each file's declared name: against
  # the registered name detects that exactly, whatever the underlying cause.
  # Cannot run on pull_request: the API reports the default branch's state,
  # not the PR's files.
  names-and-tags:
    # PR-facing check name (shows as skipped there). "registered" said
    # nothing about what it verifies - names audit, 2026-08-25.
    name: names & release tags
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      # Gate 124's online half reads each cited issue's state.
      issues: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Gate 1 — every workflow is registered under its declared name
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # T066: a workflow file that is not on the default branch can carry
          # a STALE registry entry. GitHub creates the entry on first push of
          # the file to ANY branch, and if that first version was genuinely
          # unparseable the entry is path-named — but GitHub then never
          # refreshes the name for a file it does not have on the default
          # branch, so the path-name survives every later fix and this gate
          # reports a file that parses fine as "almost certainly invalid".
          # List what actually exists on the default branch so those can be
          # told apart. Fails CLOSED: if the listing cannot be read, every
          # mismatch is reported exactly as before rather than suppressed.
          if ! DEFAULT_BRANCH="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.default_branch' 2>/dev/null)"; then
            DEFAULT_BRANCH=""
          fi
          export DEFAULT_BRANCH
          : > on-default.txt
          DEFAULT_LISTING_OK=false
          if [ -n "$DEFAULT_BRANCH" ] && gh api \
              "repos/$GITHUB_REPOSITORY/contents/.github/workflows?ref=$DEFAULT_BRANCH" \
              --jq '.[].path' > on-default.txt 2>/dev/null; then
            DEFAULT_LISTING_OK=true
          fi
          export DEFAULT_LISTING_OK

          # Registration is updated as the push is processed; on a push-
          # triggered run the job can occasionally win that race, so retry
          # before believing a mismatch.
          for attempt in 1 2 3; do
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows" --paginate \
              --jq '.workflows[] | [.path, .name] | @tsv' > registered.tsv || true

            python3 - <<'PYEOF' > result.txt
          import glob, os, yaml

          registered = {}
          for line in open("registered.tsv", encoding="utf-8"):
              path, _, name = line.rstrip("\n").partition("\t")
              registered[path] = name

          # T066: which workflow files are actually ON the default branch.
          # Empty/unreadable => treat every file as on it (fail closed).
          listing_ok = os.environ.get("DEFAULT_LISTING_OK") == "true"
          default_branch = os.environ.get("DEFAULT_BRANCH") or "the default branch"
          on_default = set()
          if listing_ok:
              try:
                  on_default = {l.strip() for l in open("on-default.txt", encoding="utf-8") if l.strip()}
              except OSError:
                  listing_ok = False
              if not on_default:
                  listing_ok = False

          failures = 0
          for path in sorted(glob.glob(".github/workflows/*.yml")):
              # Registered paths are always posix-style; local globs on
              # Windows are not.
              f = path.replace("\\", "/")
              declared = (yaml.safe_load(open(path, encoding="utf-8")) or {}).get("name")
              # A file with no name: legitimately registers under its path.
              if not declared:
                  continue
              # Present in the checkout but not yet registered — a brand new
              # workflow on its first push. Nothing to compare against.
              if f not in registered:
                  continue
              if registered[f] != declared:
                  # T066: not on the default branch => the registry entry is
                  # stale by construction, not evidence the file is invalid.
                  if listing_ok and f not in on_default:
                      print(f"::notice file={f}::registered as {registered[f]!r} but declares "
                            f"name: {declared!r} — NOT treated as a failure: this file is not "
                            f"on {default_branch}, and GitHub never refreshes the registered "
                            f"name for a file it does not have there. A path-named entry "
                            f"created when an earlier, genuinely-unparseable version was "
                            f"first pushed to a feature branch therefore survives every "
                            f"later fix. To confirm the file really parses, add a temporary "
                            f"workflow_dispatch: trigger on a throwaway branch and POST to "
                            f"the dispatches endpoint — 204 means it parses, and a 422 body "
                            f"carries the real parser error verbatim. (A workflow_call-only "
                            f"file cannot be dispatched without that temporary trigger.)")
                      continue
                  encoded = f.replace("/", "%2F")
                  print(f"::error file={f}::registered as {registered[f]!r} but declares "
                        f"name: {declared!r}. GitHub falls back to the path when it "
                        f"cannot parse a workflow, so this file is almost certainly "
                        f"invalid and never runs. GitHub reports no error text for this "
                        f"anywhere in the UI or the runs API; get the real parser message "
                        f"by attempting a dispatch, whose 422 body carries it verbatim: "
                        f"gh api -X POST 'repos/OWNER/REPO/actions/workflows/{encoded}"
                        f"/dispatches' -f ref=main")
                  failures += 1
          print(f"Gate 1: compared every declared name against its registration; {failures} failure(s).")
          print(f"EXIT={1 if failures else 0}")
          PYEOF

            cat result.txt
            if grep -q '^EXIT=0$' result.txt; then
              exit 0
            fi
            echo "Attempt $attempt saw a mismatch; re-reading registrations."
            sleep 15
          done
          exit 1

      # Gate 26 — the published tags obey the versioning contract. Runs here
      # rather than on pull requests for the same reason Gate 1 does: it reads
      # the repository's real refs, which a PR's files cannot tell us, and a
      # desync is not something a PR introduces. The daily `schedule:` above
      # is what bounds the exposure — #218 sat unnoticed for three days
      # because nothing ever looked.
      #
      # `git ls-remote` and not `gh api`: one unauthenticated call answers
      # both questions at once, because an annotated tag brings its `^{}` peel
      # line and a lightweight tag does not. No token, so nothing for Gate 12
      # to resolve and no new API_CATEGORY_PERM entry to keep honest.
      #
      # `!cancelled()` and not a bare `run:`: Gate 1 above ends its retry
      # loop with `exit 1`, and an unguarded step after it is skipped
      # whenever Gate 1 goes red — so a registration race, or a `gh api`
      # blip, would silently take the versioning check with it. The two
      # gates share a job for cheapness, not because either depends on the
      # other. Since the daily `schedule:` is the only thing bounding
      # #218's exposure, letting an unrelated failure suppress this one
      # would widen exactly the window it exists to close. `!cancelled()`
      # rather than `always()` so a deliberate cancellation still stops it.
      - name: Gate 26 — every release tag is annotated and every vX is current
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/verify-versioning-refs.py --remote origin

      # Gate 124's online half — every `issue` a waiver register cites is
      # still OPEN (`decided_by` provenance is never looked up). A waiver whose tracker closed keeps promising a
      # follow-up nobody holds; closing an issue is not a PR event, so this
      # lives with Gates 1 and 26, the checks of repository state a PR's
      # files cannot show, and the daily `schedule:` bounds how long a
      # closed citation can stand. A failed lookup fails the step rather
      # than passing it. `!cancelled()` for the same reason as Gate 26: an
      # unrelated red above must not suppress it.
      - name: Gate 124 — every issue a waiver cites is open
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/verify-waiver-citations.py --check-open
