# Guard rail: every workflow must parse as YAML and every embedded run:
# script must pass bash -n. Added after an unbalanced quote inside a
# ${VAR:-default} expansion silently broke the implement stage's stall
# report — the exact step whose job is to report failures. This includes
# every composite action under .github/actions/**, but the check is a
# syntax check only: it does not execute the script and cannot verify
# errexit/pipefail runtime behavior, so a passing guard is not a
# guarantee a composite shell: bash step is safe at runtime.
#
# Gates 2 and 3 were added after stage 8 (watchdog) sat completely dead for
# four days: valid YAML and valid bash, but rejected outright by GitHub's own
# workflow parser ("Workflow '8 - Watchdog' cannot listen to itself"),
# under-permissioned against the reusable workflow it calls, and pointing its
# workflow_run trigger at eight display names that no longer existed after the
# Wing Commander rename. Nothing in the YAML/bash gate can see any of that.
# Gate 1 is the catch-all backstop for the same class, post-merge.
name: "lint · workflows"

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      # Gates 4 and 5 execute scripts out of these two trees, so a change to
      # one can break a stage without touching a workflow file — that is how
      # both the check-prerequisites.sh/plan.md defect and the drifted
      # collector fixture got in.
      - ".github/scripts/**"
      - ".specify/scripts/**"
  # Gate 1 only — it reads how GitHub actually registered the workflows on
  # the default branch, which a PR's files cannot tell us.
  push:
    branches: [main]
    paths: [".github/workflows/**"]
  schedule:
    - cron: "43 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Gates 2 and 3 are pure static analysis over the workflow set in the
  # checkout, so they run on the PR that introduces the defect.
  lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Parse YAML and bash -n every run block
        run: |
          python3 - <<'PYEOF'
          import glob, subprocess, sys, re, yaml

          failures = 0

          def check_script(f, step_identity, run):
              # Expression interpolation never introduces quoting in these
              # workflows'/actions' scripts; neutralize it for bash -n.
              script = re.sub(r"\$\{\{[^}]*\}\}", "EXPR", run)
              r = subprocess.run(["bash", "-n"], input=script.encode(),
                                 capture_output=True)
              if r.returncode != 0:
                  err = r.stderr.decode().strip().replace("%", "%25").replace("\n", "%0A")
                  print(f"::error file={f}::{step_identity}: {err}")
                  return 1
              return 0

          for f in sorted(glob.glob(".github/workflows/*.yml")):
              try:
                  wf = yaml.safe_load(open(f, encoding="utf-8"))
              except Exception as e:
                  print(f"::error file={f}::YAML parse failure: {e}")
                  failures += 1
                  continue
              for jname, job in (wf.get("jobs") or {}).items():
                  for i, step in enumerate(job.get("steps") or []):
                      run = step.get("run")
                      if not run:
                          continue
                      name = step.get("name", f"step {i}")
                      failures += check_script(f, f"{jname} / {name}", run)

          # Composite action scripts, discovered recursively at any depth
          # under .github/actions/** (both extensions) — see issue #41.
          action_files = sorted(
              glob.glob(".github/actions/**/action.yml", recursive=True)
              + glob.glob(".github/actions/**/action.yaml", recursive=True)
          )
          for f in action_files:
              try:
                  action = yaml.safe_load(open(f, encoding="utf-8"))
              except Exception as e:
                  print(f"::error file={f}::YAML parse failure: {e}")
                  failures += 1
                  continue
              steps = (action.get("runs") or {}).get("steps") or []
              for i, step in enumerate(steps):
                  run = step.get("run")
                  if not run:
                      continue
                  name = step.get("name", f"step {i}")
                  failures += check_script(f, name, run)

          print(f"Checked all run blocks; {failures} failure(s).")
          sys.exit(1 if failures else 0)
          PYEOF

      # Gate 2 — workflow_run triggers resolve by DISPLAY NAME, and a name
      # matching nothing is not an error to GitHub, just a trigger that
      # silently never fires. Self-reference is worse: it makes the whole
      # file unparseable, so the workflow is never registered at all.
      - name: Gate 2 — workflow_run names resolve and are not self-references
        run: |
          python3 - <<'PYEOF'
          import glob, sys, yaml

          workflows = {}
          for f in sorted(glob.glob(".github/workflows/*.yml")):
              wf = yaml.safe_load(open(f, encoding="utf-8")) or {}
              # PyYAML resolves the bare key `on` to the boolean True (YAML
              # 1.1); quoted "on" stays a string. Accept either.
              workflows[f] = (wf.get("name"), wf.get(True, wf.get("on")))
          names = {n for n, _ in workflows.values() if n}

          failures = 0
          for f, (own_name, on) in workflows.items():
              wr = on.get("workflow_run") if isinstance(on, dict) else None
              if not isinstance(wr, dict):
                  continue
              for ref in wr.get("workflows") or []:
                  if ref == own_name:
                      print(f"::error file={f}::workflow_run lists its own name "
                            f"{ref!r}; GitHub rejects the entire file with "
                            f"\"Workflow '{ref}' cannot listen to itself\" and never "
                            f"registers it. Move self-inspection into a separate "
                            f"workflow that listens to this one.")
                      failures += 1
                  elif ref not in names:
                      print(f"::error file={f}::workflow_run references {ref!r}, "
                            f"which is no workflow's name: in this repository — the "
                            f"trigger will never fire. Known names: "
                            f"{', '.join(sorted(names))}")
                      failures += 1
          print(f"Gate 2: checked every workflow_run reference; {failures} failure(s).")
          sys.exit(1 if failures else 0)
          PYEOF

      # Gate 3 — GitHub validates the calling job's grant against EVERY job in
      # the called workflow at startup, including if-skipped ones, and kills
      # the run with zero jobs and no annotations when the called workflow
      # asks for a permission the caller did not grant. (Same failure shape
      # cost us a v1.0.0 release-day startup_failure on tasks-approved.)
      - name: Gate 3 — callers grant every permission their reusable workflow requests
        run: |
          python3 - <<'PYEOF'
          import glob, os, sys, yaml

          docs = {}
          for f in sorted(glob.glob(".github/workflows/*.yml")):
              docs[os.path.basename(f)] = yaml.safe_load(open(f, encoding="utf-8")) or {}

          failures = 0
          for fname, wf in docs.items():
              for jname, job in (wf.get("jobs") or {}).items():
                  uses = (job or {}).get("uses", "")
                  if not uses.startswith("./.github/workflows/"):
                      continue
                  called = docs.get(os.path.basename(uses))
                  if called is None:
                      print(f"::error file=.github/workflows/{fname}::{jname} calls "
                            f"{uses}, which does not exist")
                      failures += 1
                      continue
                  needed = called.get("permissions") or {}
                  granted = job.get("permissions")
                  # No explicit grant means the job inherits the workflow (or
                  # repository) default, which this check cannot resolve.
                  if granted is None or not isinstance(needed, dict):
                      continue
                  missing = {k: v for k, v in needed.items() if k not in granted}
                  if missing:
                      print(f"::error file=.github/workflows/{fname}::job {jname!r} calls "
                            f"{uses} but does not grant {missing} — the run will die at "
                            f"startup with zero jobs. Add it to this job's permissions:.")
                      failures += 1
          print(f"Gate 3: checked every local reusable-workflow call; {failures} failure(s).")
          sys.exit(1 if failures else 0)
          PYEOF

      # Gate 5 — the denied-tool collector is the one piece of watchdog
      # evidence-gathering with its own executable fixture check. That check
      # was merged and then run by nothing, so when PR #137 rewrote the
      # collector the fixtures kept asserting against the old filter —
      # including the exact {tool: .tool, denials: .count} bug #137 existed
      # to fix — and kept reporting "all assertions passed" the whole time.
      #
      # Two halves, and both are needed. Running the script proves the
      # filter it holds is correct; diffing that filter against the real one
      # in watchdog.yml proves the script still describes the shipped
      # collector. Either half alone can be green while the collector that
      # actually runs is broken, which is precisely what happened.
      #
      # Lives in the lint job rather than beside gate 4 below: it needs only
      # the checkout the other static gates already have, and it is a
      # sub-second jq/python check rather than a behavioral suite.
      - name: Gate 5 — the denied-tool collector's fixture check, and its filter is in sync
        run: |
          set -uo pipefail
          bash .github/scripts/verify-denied-tool-collector.sh || exit 1

          python3 - <<'PYEOF'
          import io, re, sys, yaml

          SCRIPT = ".github/scripts/verify-denied-tool-collector.sh"
          WORKFLOW = ".github/workflows/watchdog.yml"

          def norm(s):
              # jq is whitespace-insensitive, and the two copies sit at
              # different indentation (a YAML block scalar vs a shell
              # assignment). Comparing raw text would force cosmetic sync
              # and get worked around; compare the program instead.
              return "\n".join(ln.strip() for ln in s.strip().splitlines() if ln.strip())

          wf = yaml.safe_load(io.open(WORKFLOW, encoding="utf-8"))
          run = None
          for job in (wf.get("jobs") or {}).values():
              for step in (job or {}).get("steps") or []:
                  if (step or {}).get("id") == "collect-execution-output":
                      run = step.get("run")
          if run is None:
              print(f"::error file={WORKFLOW}::gate 5 could not find the step with "
                    f"id: collect-execution-output. If it was renamed, update this gate "
                    f"and {SCRIPT} together.")
              sys.exit(1)

          shipped = re.search(r"\n\s*filter='(.*?)'\n", run, re.S)
          script = io.open(SCRIPT, encoding="utf-8").read()
          copied = re.search(r"\nFILTER='(.*?)'\n", script, re.S)
          if not shipped or not copied:
              missing = WORKFLOW if not shipped else SCRIPT
              print(f"::error::gate 5 could not extract the jq filter from {missing} — "
                    f"the single-quoted filter='...' / FILTER='...' assignment it keys on "
                    f"has changed shape.")
              sys.exit(1)

          if norm(shipped.group(1)) != norm(copied.group(1)):
              print(f"::error file={SCRIPT}::the fixture check's FILTER no longer matches "
                    f"{WORKFLOW}'s collect-execution-output filter, so it is verifying a "
                    f"collector that is not the one that ships. Copy the filter across and "
                    f"extend the fixtures to cover whatever changed.")
              sys.exit(1)
          print(f"Gate 5: fixture check passed and its filter matches {WORKFLOW}.")
          PYEOF

      # Gate 6 — a wrapper job that reaches an agent-bearing resolved stage
      # (a claude-code-action step) under an event the agent doesn't support
      # fails at the agent step with "Unsupported event type," not at
      # startup — nothing in Gates 1-3/5 or the YAML/bash-n check can see
      # that. This is the exact defect specs/028-rebase-ai-on-push fixes
      # (push reaching claude-code-action through wing-commander-rebase.yml)
      # and is forward-looking: it flags ANY future unsupported event, not
      # just push, via a set difference against a maintained allow-list.
      # "Resolved stage" means the whole local `uses:` chain, not just the
      # workflow a wrapper names directly — one intermediate hop would
      # otherwise hide the agent step from this gate completely.
      - name: Gate 6 — agent-bearing wrapper reaches its stage only under a supported event
        run: |
          python3 - <<'PYEOF'
          import glob, os, sys, re, yaml

          SUPPORTED_EVENTS = {
              "issues", "issue_comment", "pull_request",
              "workflow_dispatch", "workflow_run", "schedule",
          }  # research.md R6 — deliberately excludes push (the confirmed
             # defect); extend only with a new entry backed by evidence in
             # this repository.

          CLAUDE_ACTION_PREFIX = "anthropics/claude-code-action"

          # `workflow_call` is NOT an event any agent step observes: a called
          # workflow runs under its CALLER's event. Enumerating it as a
          # trigger would flag every intermediate wrapper spuriously while
          # still missing the caller-side defect, so it is dropped from each
          # file's event set and the call graph is walked instead.
          NON_TRIGGER_EVENTS = {"workflow_call"}

          docs = {}
          for f in sorted(glob.glob(".github/workflows/*.yml")
                          + glob.glob(".github/workflows/*.yaml")):
              docs[os.path.basename(f)] = yaml.safe_load(open(f, encoding="utf-8")) or {}

          def local_calls(wf):
              """(job-name, job, uses, callee-basename) per local stage call."""
              out = []
              for jname, job in (wf.get("jobs") or {}).items():
                  uses = (job or {}).get("uses", "")
                  if uses.startswith("./.github/workflows/"):
                      out.append((jname, job or {}, uses, os.path.basename(uses)))
              return out

          def is_agent_bearing(name, seen=None):
              """Agent-bearing = runs claude-code-action itself, OR calls (at
              any depth) a local workflow that does. Checking only direct
              steps lets one intermediate `uses:` hop hide the agent from
              this gate entirely."""
              seen = set() if seen is None else seen
              if name in seen:
                  return False   # cycle guard
              seen.add(name)
              wf = docs.get(name)
              if wf is None:
                  return False
              for job in (wf.get("jobs") or {}).values():
                  for step in (job or {}).get("steps") or []:
                      if (step or {}).get("uses", "").startswith(CLAUDE_ACTION_PREFIX):
                          return True
              return any(is_agent_bearing(b, seen) for _, _, _, b in local_calls(wf))

          def reachable_events(if_expr, wrapper_events):
              if not if_expr:
                  return set(wrapper_events)
              included = set(re.findall(r"event_name\s*==\s*'([\w-]+)'", if_expr))
              excluded = set(re.findall(r"event_name\s*!=\s*'([\w-]+)'", if_expr))
              if included:
                  return included & set(wrapper_events)
              if excluded:
                  return set(wrapper_events) - excluded
              return set(wrapper_events)  # no recognizable clause — conservative default (research.md R7)

          failures = 0
          for fname, wf in docs.items():
              on = wf.get(True, wf.get("on"))
              if isinstance(on, dict):
                  wrapper_events = set(on.keys())
              elif isinstance(on, list):
                  wrapper_events = set(on)
              elif isinstance(on, str):
                  wrapper_events = {on}          # bare `on: push`
              else:
                  wrapper_events = set()
              wrapper_events -= NON_TRIGGER_EVENTS
              if not wrapper_events:
                  continue

              for jname, job, uses, base in local_calls(wf):
                  if base not in docs:
                      # Silently skipping an unresolvable callee would let a
                      # typo'd or renamed path read as "nothing to check."
                      print(f"::error file=.github/workflows/{fname}::job {jname!r} calls "
                            f"{uses}, which does not exist in this repository — Gate 6 "
                            f"cannot tell whether it reaches an agent step under a "
                            f"supported event.")
                      failures += 1
                      continue
                  if not is_agent_bearing(base):
                      continue

                  reachable = reachable_events(job.get("if", ""), wrapper_events)
                  flagged = sorted(reachable - SUPPORTED_EVENTS)
                  if flagged:
                      print(f"::error file=.github/workflows/{fname}::job {jname!r} calls "
                            f"{uses}, which resolves (directly or through a nested "
                            f"call) to a claude-code-action step, "
                            f"under event(s) {flagged} — that agent does not support "
                            f"{'this event' if len(flagged) == 1 else 'these events'}. "
                            f"Supported: {sorted(SUPPORTED_EVENTS)}.")
                      failures += 1

          # ASCII only: this line also runs on a maintainer's Windows shell,
          # where a cp1252 stdout cannot encode arrows and the gate dies in
          # the print instead of reporting its verdict.
          print(f"Gate 6: checked every agent-bearing wrapper/stage pair; {failures} failure(s).")
          sys.exit(1 if failures else 0)
          PYEOF

      # Gate 6 is a detector, and a detector that never fires looks exactly
      # like one that cannot fire — the fleet above is (and should stay)
      # healthy, so the step before this one prints "0 failure(s)" whether
      # its logic works or not. Gate 5 exists because that failure mode
      # already bit this repository once. This runs the SHIPPED gate
      # (extracted from this file, not a copy) against synthetic trees with
      # known defects and asserts the verdict and the error text.
      - name: Gate 6 self-test — the detector actually detects
        run: python3 .github/scripts/verify-gate-6.py

      # Gate 7 — an adopter binds a whole stage with one `environment` input,
      # and specs/031-stage-environment-binding FR-004 is that the binding is
      # uniform: EVERY job in the stage gates, with no hidden per-job
      # selector. A job that silently lacks the block is the worst possible
      # shape of that defect — the adopter sees approvals happening and has
      # no way to notice that one job of the stage ran ungated. The 30
      # bindings were placed by hand and only ever verified by hand.
      #
      # release.yml Gate 1a counts `deployment:` lines, which is a check on
      # actionlint's schema, not on coverage: it cannot tell that a job was
      # missed, only that the bindings it can see are all flagged. This is
      # the coverage half, and it runs at PR time rather than at release.
      #
      # The stage set is DERIVED (any workflow declaring on.workflow_call),
      # not listed: a hardcoded list is how watchdog.yml and
      # auto-update-spec-kit.yml went unlinted by Gate 1a for a whole
      # release (issue #149), and it would mean a new stage file is born
      # exempt from this gate.
      - name: Gate 7 — every job of every published stage carries the environment binding
        run: |
          python3 - <<'PYEOF'
          import glob, sys, yaml

          # sub-key -> the workflow_call input it must forward.
          BINDINGS = {"name": "environment", "deployment": "environment-deployment"}
          # input -> (type, default). The defaults ARE the contract: an
          # empty name is the verified no-op that keeps unbound adopters
          # unaffected, and deployment true mirrors GitHub's own default.
          DECLARED = {"environment": ("string", ""),
                      "environment-deployment": ("boolean", True)}

          # Assembled rather than written out: Actions expands expression
          # syntax in a run: block before bash, let alone python, sees it.
          OPEN, CLOSE = "${" + "{", "}" + "}"

          def input_ref(value):
              """The input name this binding value forwards, or None."""
              if not isinstance(value, str):
                  return None
              s = value.strip()
              if not (s.startswith(OPEN) and s.endswith(CLOSE)):
                  return None
              inner = s[len(OPEN):-len(CLOSE)].strip()
              if not inner.startswith("inputs."):
                  return None
              return inner[len("inputs."):].strip()

          failures = 0
          stages = bound = 0
          for f in sorted(glob.glob(".github/workflows/*.yml")
                          + glob.glob(".github/workflows/*.yaml")):
              wf = yaml.safe_load(open(f, encoding="utf-8")) or {}
              # PyYAML resolves the bare key `on` to the boolean True (YAML
              # 1.1); quoted "on" stays a string. Accept either.
              on = wf.get(True, wf.get("on"))
              # Membership, not truthiness: a bare `workflow_call:` parses to
              # None, and a stage with no inputs yet is still a stage — it
              # must fail this gate, not slip past it as "not a stage".
              if isinstance(on, dict) and "workflow_call" in on:
                  call = on.get("workflow_call") or {}
              elif isinstance(on, list) and "workflow_call" in on:
                  call = {}
              else:
                  continue          # not a published stage
              stages += 1

              inputs = (call.get("inputs") or {}) if isinstance(call, dict) else {}
              for iname, (itype, idefault) in DECLARED.items():
                  spec = inputs.get(iname)
                  if not isinstance(spec, dict):
                      print(f"::error file={f}::published stage does not declare the "
                            f"{iname!r} workflow_call input, so an adopter cannot bind "
                            f"this stage the way every other stage binds (FR-001/FR-002).")
                      failures += 1
                      continue
                  if spec.get("type") != itype or spec.get("default") != idefault:
                      print(f"::error file={f}::input {iname!r} is declared "
                            f"type={spec.get('type')!r} default={spec.get('default')!r}; "
                            f"the contract is type={itype!r} default={idefault!r}. The "
                            f"defaults are load-bearing — they are what makes an unbound "
                            f"adopter's behavior identical to before the feature.")
                      failures += 1

              for jname, job in (wf.get("jobs") or {}).items():
                  job = job or {}
                  if "uses" in job:
                      # A job that calls another workflow runs that
                      # workflow's jobs; the binding belongs to them.
                      print(f"note: {f}: job {jname!r} is a workflow call, not a "
                            f"bindable job — skipped.")
                      continue

                  env = job.get("environment")
                  if env is None:
                      print(f"::error file={f}::job {jname!r} has no environment: block. "
                            f"An adopter who binds this stage gets a gate on every OTHER "
                            f"job and none on this one — the stage looks gated while this "
                            f"job runs ungated, with nothing to see in the UI (FR-004).")
                      failures += 1
                      continue
                  if not isinstance(env, dict):
                      print(f"::error file={f}::job {jname!r} uses the shorthand "
                            f"environment: form, which cannot carry the deployment "
                            f"sub-key, so environment-deployment: false would be silently "
                            f"ignored for this job. Use the mapping form.")
                      failures += 1
                      continue

                  ok = True
                  for subkey, iname in BINDINGS.items():
                      got = input_ref(env.get(subkey))
                      if got != iname:
                          print(f"::error file={f}::job {jname!r} wires environment."
                                f"{subkey} to {env.get(subkey)!r}; every job must forward "
                                f"the stage's {iname!r} input verbatim, or this job gates "
                                f"differently from the rest of its own stage.")
                          failures += 1
                          ok = False
                  bound += ok

          print(f"Gate 7: {stages} published stage(s), {bound} bound job(s); "
                f"{failures} failure(s).")
          if stages == 0:
              # Every stage file vanishing (or an `on:` shape this gate no
              # longer recognizes) must not read as a pass.
              print("::error::Gate 7 found no workflow declaring on.workflow_call — it "
                    "checked nothing. Either the published stages moved or this gate's "
                    "detection of them has broken.")
              sys.exit(1)
          sys.exit(1 if failures else 0)
          PYEOF

      # Same reasoning as Gate 6's self-test: this gate's whole value is
      # firing on a defect that nobody has made yet, and the fleet it runs
      # against is (and should stay) uniform, so a green Gate 7 says nothing
      # about whether Gate 7 works.
      - name: Gate 7 self-test — the detector actually detects
        run: python3 .github/scripts/verify-gate-7.py

      # Gate 8 — behavioral, not static. Gates 1-3 prove intake.yml and
      # clarify.yml parse, register and are permitted to run; none of them can
      # see that the two-way callout split each stage ends in sends a
      # requester somewhere they cannot act, or announces a spec as ready when
      # it visibly is not. Four defects of that class have shipped: #159's
      # unmatchable marker grep, a `spec-dir` guard re-added to only ONE arm
      # of the split (so the questionnaire could post on the "no discernible
      # feature request" path, where no spec: label exists and no reply can
      # reach wing-commander-2-clarify.yml), a cross-check that logged a
      # mismatch and announced readiness anyway, and a missing existence guard
      # that made the cross-check cry wolf about its own unreadable file.
      #
      # The harness EXECUTES the shipped decision shell against synthetic agent
      # transcripts and evaluates the shipped `if:` expressions against the
      # outputs it really produced, so it cannot drift from the workflows. It
      # ends with mutation checks that reintroduce each defect and assert the
      # suite fails — the same discipline as gates 6 and 7's self-tests, and
      # the reason gate 5 exists at all.
      - name: Gate 8 — clarification callouts are reachable and honest
        run: python3 .github/scripts/verify-clarification-gating.py

      # Gate 9 — the watchdog's own tripwire. "Collect: step summaries" is
      # what turns a stage's emitted sentinel into a signal that diagnose can
      # reason about; a sentinel it drops does not degrade the watchdog, it
      # makes the watchdog blind to one class of problem while still
      # reporting that inspection passed. That is the most expensive failure
      # shape this repository has had (2026-07-24's false "passed inspection",
      # and 2026-07-25's audit finding 10 of 19 "successful" runs not genuine).
      #
      # It was untested — pure shell inside a `gh api` loop, invisible to
      # every static gate — and it had already grown a real conflict: the
      # legacy bare-word pass (capped at one match per job) also matched the
      # emitted-token lines that docs/agent-friendly-workflows.md tells stage
      # authors to write, so one event produced two signals sharing an id and
      # spent the cap that an unrelated genuine stall word needed.
      #
      # Same discipline as gates 4-8: the shipped step is extracted and
      # executed against synthetic job logs with `gh` stubbed, so there is no
      # copy to drift, and mutations reintroduce the conflict to prove the
      # suite can fail.
      - name: Gate 9 — the watchdog's sentinel collector sees what stages emit
        run: python3 .github/scripts/verify-sentinel-collector.py

      # Gate 10 — the gates themselves are wired up. Every gate above is a
      # file in .github/scripts that some `run:` line has to name, and
      # verify-denied-tool-collector.sh has already shown what happens when
      # one is not named: it sat orphaned for weeks, drifted out of sync with
      # the filter it checked, and still printed "all assertions passed" when
      # run by hand, so it read as evidence while proving nothing. PR #158
      # wired that one script up; this stops the next one landing the same
      # way, and also catches the reverse — a gate step pointing at a file
      # that has been moved or renamed, whose name in the job list implies a
      # check that is not happening.
      #
      # The rule is a naming convention read off the directory, not a list of
      # gate names: a list is what #149 was, where forgetting to add a file is
      # invisible and a new one is born exempt. Mentioning a script in a
      # comment does not count as running it — that is how an orphan would
      # hide from this check.
      - name: Gate 10 — every check is wired to a workflow, and every wire lands
        run: python3 .github/scripts/verify-gate-wiring.py

  # Gate 4 — behavioral tests for the auto-update-spec-kit stage pair. Gates
  # 1-3 are static: they prove a workflow parses, registers, and is permitted
  # to run. None of them can see that a step's shell logic is simply wrong.
  # The auto-update stage shipped with three such defects — a `git log
  # --follow` invocation that always fatally errored, a verification tier that
  # could never pass because it called check-prerequisites.sh in a mode that
  # requires a file the preceding step does not create, and an absolute path
  # prefixed with its own parent — and every one of them would have fired on
  # the first scheduled run while looking perfectly valid to gates 1-3.
  #
  # The harness EXTRACTS the shipped run: blocks and executes them against a
  # gh stub and throwaway git repos, so it cannot drift from the workflow the
  # way a hand-copied fixture can. See .github/scripts/auto-update-spec-kit-tests/.
  auto-update-spec-kit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Gate 4 — auto-update-spec-kit behavioral tests
        run: bash .github/scripts/auto-update-spec-kit-tests/run-tests.sh

  # Gate 1 — the catch-all. When GitHub cannot parse a workflow file it
  # registers the workflow with its PATH as its name and creates a failed
  # "workflow file issue" run with zero jobs, no annotations, and no error
  # text anywhere in the API. Comparing each file's declared name: against
  # the registered name detects that exactly, whatever the underlying cause.
  # Cannot run on pull_request: the API reports the default branch's state,
  # not the PR's files.
  registered:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Gate 1 — every workflow is registered under its declared name
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # Registration is updated as the push is processed; on a push-
          # triggered run the job can occasionally win that race, so retry
          # before believing a mismatch.
          for attempt in 1 2 3; do
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows" --paginate \
              --jq '.workflows[] | [.path, .name] | @tsv' > registered.tsv || true

            python3 - <<'PYEOF' > result.txt
          import glob, yaml

          registered = {}
          for line in open("registered.tsv", encoding="utf-8"):
              path, _, name = line.rstrip("\n").partition("\t")
              registered[path] = name

          failures = 0
          for path in sorted(glob.glob(".github/workflows/*.yml")):
              # Registered paths are always posix-style; local globs on
              # Windows are not.
              f = path.replace("\\", "/")
              declared = (yaml.safe_load(open(path, encoding="utf-8")) or {}).get("name")
              # A file with no name: legitimately registers under its path.
              if not declared:
                  continue
              # Present in the checkout but not yet registered — a brand new
              # workflow on its first push. Nothing to compare against.
              if f not in registered:
                  continue
              if registered[f] != declared:
                  encoded = f.replace("/", "%2F")
                  print(f"::error file={f}::registered as {registered[f]!r} but declares "
                        f"name: {declared!r}. GitHub falls back to the path when it "
                        f"cannot parse a workflow, so this file is almost certainly "
                        f"invalid and never runs. GitHub reports no error text for this "
                        f"anywhere in the UI or the runs API; get the real parser message "
                        f"by attempting a dispatch, whose 422 body carries it verbatim: "
                        f"gh api -X POST 'repos/OWNER/REPO/actions/workflows/{encoded}"
                        f"/dispatches' -f ref=main")
                  failures += 1
          print(f"Gate 1: compared every declared name against its registration; {failures} failure(s).")
          print(f"EXIT={1 if failures else 0}")
          PYEOF

            cat result.txt
            if grep -q '^EXIT=0$' result.txt; then
              exit 0
            fi
            echo "Attempt $attempt saw a mismatch; re-reading registrations."
            sleep 15
          done
          exit 1
