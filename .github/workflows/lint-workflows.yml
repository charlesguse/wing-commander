# Guard rail: every workflow must parse as YAML and every embedded run:
# script must pass bash -n. Added after an unbalanced quote inside a
# ${VAR:-default} expansion silently broke the implement stage's stall
# report — the exact step whose job is to report failures. This includes
# every composite action under .github/actions/**, but the check is a
# syntax check only: it does not execute the script and cannot verify
# errexit/pipefail runtime behavior, so a passing guard is not a
# guarantee a composite shell: bash step is safe at runtime.
#
# Gates 2 and 3 were added after stage 8 (watchdog) sat completely dead for
# four days: valid YAML and valid bash, but rejected outright by GitHub's own
# workflow parser ("Workflow '8 - Watchdog' cannot listen to itself"),
# under-permissioned against the reusable workflow it calls, and pointing its
# workflow_run trigger at eight display names that no longer existed after the
# Wing Commander rename. Nothing in the YAML/bash gate can see any of that.
# Gate 1 is the catch-all backstop for the same class, post-merge.
name: "lint · workflows"

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      # Gates 4 and 5 execute scripts out of these two trees, so a change to
      # one can break a stage without touching a workflow file — that is how
      # both the check-prerequisites.sh/plan.md defect and the drifted
      # collector fixture got in.
      - ".github/scripts/**"
      - ".specify/scripts/**"
      # Four gates check a published document rather than code. Without
      # these, a PR editing only the document - the change most likely to
      # break its gate - never triggers this workflow, and the desync is
      # caught by the daily `schedule:` up to a day later.
      #
      # Listed file by file rather than as `specs/**/contracts/**`. That
      # glob looks like the cheaper way to say the same thing and is not:
      # the plan stage GENERATES specs/NNN-*/contracts/* and opens a PR
      # with it (plan.yml, "Open the plan PR"), so the glob fires the full
      # gate suite on every plan PR the pipeline opens, for files no gate
      # can read - a new spec directory did not exist when any gate was
      # written. The comment that used to sit here claimed the opposite.
      #
      # The cost of a literal list is that a fifth document can be added
      # without one, so verify-gate-wiring.py derives the paths gates
      # actually open and fails if this list does not cover them - the
      # required-tools.txt/Gate 23 arrangement, applied to triggers
      # instead of tools.
      - "specs/010-reusable-pipeline/contracts/stage-interfaces.md"
      - "specs/026-configurable-tool-lists/contracts/tool-composition-action.md"
      - "specs/032-structured-clarification-gate/contracts/clarification-schema.md"
      # Gate 23's subject: the published image-prerequisite contract, whose
      # tool table Gate 23 compares against required-tools.txt in both
      # directions. Editing the table alone is the one change that can make
      # the two disagree.
      - "specs/038-runner-container-passthrough/contracts/runner-container-passthrough.md"
      # Gate 12's subject: it parses this file's "Repository permissions"
      # list as the single source of truth for what the wing-commander-bot
      # App may do, and sys.exits if the list moves. A PR downgrading a
      # grant here - the one edit that can invalidate every App-token call
      # site the gate approves - ran no gate at all until this entry.
      - "docs/setup.md"
  # Gate 1 only — it reads how GitHub actually registered the workflows on
  # the default branch, which a PR's files cannot tell us.
  push:
    branches: [main]
    paths: [".github/workflows/**"]
  schedule:
    - cron: "43 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Gates 2 and 3 are pure static analysis over the workflow set in the
  # checkout, so they run on the PR that introduces the defect.
  lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Parse YAML and bash -n every run block
        run: |
          python3 - <<'PYEOF'
          import glob, subprocess, sys, re, yaml

          failures = 0

          def check_script(f, step_identity, run):
              # Expression interpolation never introduces quoting in these
              # workflows'/actions' scripts; neutralize it for bash -n.
              script = re.sub(r"\$\{\{[^}]*\}\}", "EXPR", run)
              r = subprocess.run(["bash", "-n"], input=script.encode(),
                                 capture_output=True)
              if r.returncode != 0:
                  err = r.stderr.decode().strip().replace("%", "%25").replace("\n", "%0A")
                  print(f"::error file={f}::{step_identity}: {err}")
                  return 1
              return 0

          for f in sorted(glob.glob(".github/workflows/*.yml")):
              try:
                  wf = yaml.safe_load(open(f, encoding="utf-8"))
              except Exception as e:
                  print(f"::error file={f}::YAML parse failure: {e}")
                  failures += 1
                  continue
              for jname, job in (wf.get("jobs") or {}).items():
                  for i, step in enumerate(job.get("steps") or []):
                      run = step.get("run")
                      if not run:
                          continue
                      name = step.get("name", f"step {i}")
                      failures += check_script(f, f"{jname} / {name}", run)

          # Composite action scripts, discovered recursively at any depth
          # under .github/actions/** (both extensions) — see issue #41.
          action_files = sorted(
              glob.glob(".github/actions/**/action.yml", recursive=True)
              + glob.glob(".github/actions/**/action.yaml", recursive=True)
          )
          for f in action_files:
              try:
                  action = yaml.safe_load(open(f, encoding="utf-8"))
              except Exception as e:
                  print(f"::error file={f}::YAML parse failure: {e}")
                  failures += 1
                  continue
              steps = (action.get("runs") or {}).get("steps") or []
              for i, step in enumerate(steps):
                  run = step.get("run")
                  if not run:
                      continue
                  name = step.get("name", f"step {i}")
                  failures += check_script(f, name, run)

          print(f"Checked all run blocks; {failures} failure(s).")
          sys.exit(1 if failures else 0)
          PYEOF

      # Gate 2 — workflow_run triggers resolve by DISPLAY NAME, and a name
      # matching nothing is not an error to GitHub, just a trigger that
      # silently never fires. Self-reference is worse: it makes the whole
      # file unparseable, so the workflow is never registered at all.
      - name: Gate 2 — workflow_run names resolve and are not self-references
        run: |
          python3 - <<'PYEOF'
          import glob, sys, yaml

          workflows = {}
          for f in sorted(glob.glob(".github/workflows/*.yml")):
              wf = yaml.safe_load(open(f, encoding="utf-8")) or {}
              # PyYAML resolves the bare key `on` to the boolean True (YAML
              # 1.1); quoted "on" stays a string. Accept either.
              workflows[f] = (wf.get("name"), wf.get(True, wf.get("on")))
          names = {n for n, _ in workflows.values() if n}

          failures = 0
          for f, (own_name, on) in workflows.items():
              wr = on.get("workflow_run") if isinstance(on, dict) else None
              if not isinstance(wr, dict):
                  continue
              for ref in wr.get("workflows") or []:
                  if ref == own_name:
                      print(f"::error file={f}::workflow_run lists its own name "
                            f"{ref!r}; GitHub rejects the entire file with "
                            f"\"Workflow '{ref}' cannot listen to itself\" and never "
                            f"registers it. Move self-inspection into a separate "
                            f"workflow that listens to this one.")
                      failures += 1
                  elif ref not in names:
                      print(f"::error file={f}::workflow_run references {ref!r}, "
                            f"which is no workflow's name: in this repository — the "
                            f"trigger will never fire. Known names: "
                            f"{', '.join(sorted(names))}")
                      failures += 1
          print(f"Gate 2: checked every workflow_run reference; {failures} failure(s).")
          sys.exit(1 if failures else 0)
          PYEOF

      # Gate 3 — GitHub validates the calling job's grant against EVERY job in
      # the called workflow at startup, including if-skipped ones, and kills
      # the run with zero jobs and no annotations when the called workflow
      # asks for a permission the caller did not grant. (Same failure shape
      # cost us a v1.0.0 release-day startup_failure on tasks-approved.)
      - name: Gate 3 — callers grant every permission their reusable workflow requests
        run: |
          python3 - <<'PYEOF'
          import glob, os, sys, yaml

          docs = {}
          for f in sorted(glob.glob(".github/workflows/*.yml")):
              docs[os.path.basename(f)] = yaml.safe_load(open(f, encoding="utf-8")) or {}

          failures = 0
          for fname, wf in docs.items():
              for jname, job in (wf.get("jobs") or {}).items():
                  uses = (job or {}).get("uses", "")
                  if not uses.startswith("./.github/workflows/"):
                      continue
                  called = docs.get(os.path.basename(uses))
                  if called is None:
                      print(f"::error file=.github/workflows/{fname}::{jname} calls "
                            f"{uses}, which does not exist")
                      failures += 1
                      continue
                  needed = called.get("permissions") or {}
                  granted = job.get("permissions")
                  # No explicit grant means the job inherits the workflow (or
                  # repository) default, which this check cannot resolve.
                  if granted is None or not isinstance(needed, dict):
                      continue
                  missing = {k: v for k, v in needed.items() if k not in granted}
                  if missing:
                      print(f"::error file=.github/workflows/{fname}::job {jname!r} calls "
                            f"{uses} but does not grant {missing} — the run will die at "
                            f"startup with zero jobs. Add it to this job's permissions:.")
                      failures += 1
          print(f"Gate 3: checked every local reusable-workflow call; {failures} failure(s).")
          sys.exit(1 if failures else 0)
          PYEOF

      # Gate 5 — the denied-tool collector is the one piece of watchdog
      # evidence-gathering with its own executable fixture check. That check
      # was merged and then run by nothing, so when PR #137 rewrote the
      # collector the fixtures kept asserting against the old filter —
      # including the exact {tool: .tool, denials: .count} bug #137 existed
      # to fix — and kept reporting "all assertions passed" the whole time.
      #
      # Two halves, and both are needed. Running the script proves the
      # filter it holds is correct; diffing that filter against the real one
      # in watchdog.yml proves the script still describes the shipped
      # collector. Either half alone can be green while the collector that
      # actually runs is broken, which is precisely what happened.
      #
      # Lives in the lint job rather than beside gate 4 below: it needs only
      # the checkout the other static gates already have, and it is a
      # sub-second jq/python check rather than a behavioral suite.
      - name: Gate 5 — the denied-tool collector's fixture check, and its filter is in sync
        run: |
          set -uo pipefail
          bash .github/scripts/verify-denied-tool-collector.sh || exit 1

          python3 - <<'PYEOF'
          import io, re, sys, yaml

          SCRIPT = ".github/scripts/verify-denied-tool-collector.sh"
          WORKFLOW = ".github/workflows/watchdog.yml"

          def norm(s):
              # jq is whitespace-insensitive, and the two copies sit at
              # different indentation (a YAML block scalar vs a shell
              # assignment). Comparing raw text would force cosmetic sync
              # and get worked around; compare the program instead.
              return "\n".join(ln.strip() for ln in s.strip().splitlines() if ln.strip())

          wf = yaml.safe_load(io.open(WORKFLOW, encoding="utf-8"))
          run = None
          for job in (wf.get("jobs") or {}).values():
              for step in (job or {}).get("steps") or []:
                  if (step or {}).get("id") == "collect-execution-output":
                      run = step.get("run")
          if run is None:
              print(f"::error file={WORKFLOW}::gate 5 could not find the step with "
                    f"id: collect-execution-output. If it was renamed, update this gate "
                    f"and {SCRIPT} together.")
              sys.exit(1)

          shipped = re.search(r"\n\s*filter='(.*?)'\n", run, re.S)
          script = io.open(SCRIPT, encoding="utf-8").read()
          copied = re.search(r"\nFILTER='(.*?)'\n", script, re.S)
          if not shipped or not copied:
              missing = WORKFLOW if not shipped else SCRIPT
              print(f"::error::gate 5 could not extract the jq filter from {missing} — "
                    f"the single-quoted filter='...' / FILTER='...' assignment it keys on "
                    f"has changed shape.")
              sys.exit(1)

          if norm(shipped.group(1)) != norm(copied.group(1)):
              print(f"::error file={SCRIPT}::the fixture check's FILTER no longer matches "
                    f"{WORKFLOW}'s collect-execution-output filter, so it is verifying a "
                    f"collector that is not the one that ships. Copy the filter across and "
                    f"extend the fixtures to cover whatever changed.")
              sys.exit(1)
          print(f"Gate 5: fixture check passed and its filter matches {WORKFLOW}.")
          PYEOF

      # Gate 6 — a wrapper job that reaches an agent-bearing resolved stage
      # (a claude-code-action step) under an event the agent doesn't support
      # fails at the agent step with "Unsupported event type," not at
      # startup — nothing in Gates 1-3/5 or the YAML/bash-n check can see
      # that. This is the exact defect specs/028-rebase-ai-on-push fixes
      # (push reaching claude-code-action through wing-commander-rebase.yml)
      # and is forward-looking: it flags ANY future unsupported event, not
      # just push, via a set difference against a maintained allow-list.
      # "Resolved stage" means the whole local `uses:` chain, not just the
      # workflow a wrapper names directly — one intermediate hop would
      # otherwise hide the agent step from this gate completely.
      - name: Gate 6 — agent-bearing wrapper reaches its stage only under a supported event
        run: |
          python3 - <<'PYEOF'
          import glob, os, sys, re, yaml

          SUPPORTED_EVENTS = {
              "issues", "issue_comment", "pull_request",
              "workflow_dispatch", "workflow_run", "schedule",
              "pull_request_review", "pull_request_review_comment",
          }  # research.md R6 — deliberately excludes push (the confirmed
             # defect); extend only with a new entry backed by evidence in
             # this repository.
             #
             # The two review events were added for
             # specs/033-pr-conversation-commands (research.md D1), with the
             # evidence R6 asks for: claude-code-action's own usage guide
             # (docs/usage.md) documents them as triggers it supports —
             # `pull_request_review_comment: types: [created]` and
             # `pull_request_review: types: [submitted]` — in the same
             # trigger list as `issue_comment`/`issues`, which this
             # allow-list already carries. They are exactly the events
             # wing-commander-9-pr-conversation.yml listens to, and without
             # them this gate fails a stage whose agent step the action
             # supports.

          CLAUDE_ACTION_PREFIX = "anthropics/claude-code-action"

          # `workflow_call` is NOT an event any agent step observes: a called
          # workflow runs under its CALLER's event. Enumerating it as a
          # trigger would flag every intermediate wrapper spuriously while
          # still missing the caller-side defect, so it is dropped from each
          # file's event set and the call graph is walked instead.
          NON_TRIGGER_EVENTS = {"workflow_call"}

          docs = {}
          for f in sorted(glob.glob(".github/workflows/*.yml")
                          + glob.glob(".github/workflows/*.yaml")):
              docs[os.path.basename(f)] = yaml.safe_load(open(f, encoding="utf-8")) or {}

          def local_calls(wf):
              """(job-name, job, uses, callee-basename) per local stage call."""
              out = []
              for jname, job in (wf.get("jobs") or {}).items():
                  uses = (job or {}).get("uses", "")
                  if uses.startswith("./.github/workflows/"):
                      out.append((jname, job or {}, uses, os.path.basename(uses)))
              return out

          def is_agent_bearing(name, seen=None):
              """Agent-bearing = runs claude-code-action itself, OR calls (at
              any depth) a local workflow that does. Checking only direct
              steps lets one intermediate `uses:` hop hide the agent from
              this gate entirely."""
              seen = set() if seen is None else seen
              if name in seen:
                  return False   # cycle guard
              seen.add(name)
              wf = docs.get(name)
              if wf is None:
                  return False
              for job in (wf.get("jobs") or {}).values():
                  for step in (job or {}).get("steps") or []:
                      if (step or {}).get("uses", "").startswith(CLAUDE_ACTION_PREFIX):
                          return True
              return any(is_agent_bearing(b, seen) for _, _, _, b in local_calls(wf))

          def reachable_events(if_expr, wrapper_events):
              if not if_expr:
                  return set(wrapper_events)
              included = set(re.findall(r"event_name\s*==\s*'([\w-]+)'", if_expr))
              excluded = set(re.findall(r"event_name\s*!=\s*'([\w-]+)'", if_expr))
              if included:
                  return included & set(wrapper_events)
              if excluded:
                  return set(wrapper_events) - excluded
              return set(wrapper_events)  # no recognizable clause — conservative default (research.md R7)

          failures = 0
          for fname, wf in docs.items():
              on = wf.get(True, wf.get("on"))
              if isinstance(on, dict):
                  wrapper_events = set(on.keys())
              elif isinstance(on, list):
                  wrapper_events = set(on)
              elif isinstance(on, str):
                  wrapper_events = {on}          # bare `on: push`
              else:
                  wrapper_events = set()
              wrapper_events -= NON_TRIGGER_EVENTS
              if not wrapper_events:
                  continue

              for jname, job, uses, base in local_calls(wf):
                  if base not in docs:
                      # Silently skipping an unresolvable callee would let a
                      # typo'd or renamed path read as "nothing to check."
                      print(f"::error file=.github/workflows/{fname}::job {jname!r} calls "
                            f"{uses}, which does not exist in this repository — Gate 6 "
                            f"cannot tell whether it reaches an agent step under a "
                            f"supported event.")
                      failures += 1
                      continue
                  if not is_agent_bearing(base):
                      continue

                  reachable = reachable_events(job.get("if", ""), wrapper_events)
                  flagged = sorted(reachable - SUPPORTED_EVENTS)
                  if flagged:
                      print(f"::error file=.github/workflows/{fname}::job {jname!r} calls "
                            f"{uses}, which resolves (directly or through a nested "
                            f"call) to a claude-code-action step, "
                            f"under event(s) {flagged} — that agent does not support "
                            f"{'this event' if len(flagged) == 1 else 'these events'}. "
                            f"Supported: {sorted(SUPPORTED_EVENTS)}.")
                      failures += 1

          # ASCII only: this line also runs on a maintainer's Windows shell,
          # where a cp1252 stdout cannot encode arrows and the gate dies in
          # the print instead of reporting its verdict.
          print(f"Gate 6: checked every agent-bearing wrapper/stage pair; {failures} failure(s).")
          sys.exit(1 if failures else 0)
          PYEOF

      # Gate 6 is a detector, and a detector that never fires looks exactly
      # like one that cannot fire — the fleet above is (and should stay)
      # healthy, so the step before this one prints "0 failure(s)" whether
      # its logic works or not. Gate 5 exists because that failure mode
      # already bit this repository once. This runs the SHIPPED gate
      # (extracted from this file, not a copy) against synthetic trees with
      # known defects and asserts the verdict and the error text.
      - name: Gate 6 self-test — the detector actually detects
        run: python3 .github/scripts/verify-gate-6.py

      # Gate 7 — an adopter binds a whole stage with one `environment` input,
      # and specs/031-stage-environment-binding FR-004 is that the binding is
      # uniform: EVERY job in the stage gates, with no hidden per-job
      # selector. A job that silently lacks the block is the worst possible
      # shape of that defect — the adopter sees approvals happening and has
      # no way to notice that one job of the stage ran ungated. The 30
      # bindings were placed by hand and only ever verified by hand.
      #
      # release.yml Gate 1a counts `deployment:` lines, which is a check on
      # actionlint's schema, not on coverage: it cannot tell that a job was
      # missed, only that the bindings it can see are all flagged. This is
      # the coverage half, and it runs at PR time rather than at release.
      #
      # The stage set is DERIVED (any workflow declaring on.workflow_call),
      # not listed: a hardcoded list is how watchdog.yml and
      # auto-update-spec-kit.yml went unlinted by Gate 1a for a whole
      # release (issue #149), and it would mean a new stage file is born
      # exempt from this gate.
      - name: Gate 7 — every job of every published stage carries the environment binding
        run: |
          python3 - <<'PYEOF'
          import glob, os, sys, yaml

          # sub-key -> the workflow_call input it must forward.
          BINDINGS = {"name": "environment", "deployment": "environment-deployment"}
          # input -> (type, default). The defaults ARE the contract: an
          # empty name is the verified no-op that keeps unbound adopters
          # unaffected, and deployment true mirrors GitHub's own default.
          DECLARED = {"environment": ("string", ""),
                      "environment-deployment": ("boolean", True)}

          # (workflow filename, job name) -> reason. Constitution VII: "a
          # stage that must deviate carries a registered, machine-checked
          # exception naming the reason — never an undeclared one, and never
          # a code comment alone." A registered job still MUST carry an
          # `environment:` mapping block (the exception is about what it
          # binds to, not whether the job gates at all) — only the
          # verbatim-forwarding check below is skipped for it, and only for
          # the exact (file, job) pair named here.
          EXCEPTIONS = {
              ("pr-conversation.yml", "act"): (
                  "FR-020 gives each matrix leg its own per-classification "
                  "confirm gate (matrix['confirm-environment']), computed by "
                  "classify-and-announce — not the stage-wide environment "
                  "input. Splitting confirm-gating into a prerequisite job "
                  "would force every leg to wait on every sibling leg's "
                  "approval, breaking that per-leg independence (verified by "
                  "specs/033-pr-conversation-commands/tasks.md T032). Only "
                  "one environment: block exists per job, so this job cannot "
                  "also forward inputs.environment/"
                  "inputs.environment-deployment verbatim. "
                  "specs/033-pr-conversation-commands/tasks.md T044."
              ),
          }

          # Assembled rather than written out: Actions expands expression
          # syntax in a run: block before bash, let alone python, sees it.
          OPEN, CLOSE = "${" + "{", "}" + "}"

          def input_ref(value):
              """The input name this binding value forwards, or None."""
              if not isinstance(value, str):
                  return None
              s = value.strip()
              if not (s.startswith(OPEN) and s.endswith(CLOSE)):
                  return None
              inner = s[len(OPEN):-len(CLOSE)].strip()
              if not inner.startswith("inputs."):
                  return None
              return inner[len("inputs."):].strip()

          failures = 0
          stages = bound = exempt = 0
          for f in sorted(glob.glob(".github/workflows/*.yml")
                          + glob.glob(".github/workflows/*.yaml")):
              wf = yaml.safe_load(open(f, encoding="utf-8")) or {}
              # PyYAML resolves the bare key `on` to the boolean True (YAML
              # 1.1); quoted "on" stays a string. Accept either.
              on = wf.get(True, wf.get("on"))
              # Membership, not truthiness: a bare `workflow_call:` parses to
              # None, and a stage with no inputs yet is still a stage — it
              # must fail this gate, not slip past it as "not a stage".
              if isinstance(on, dict) and "workflow_call" in on:
                  call = on.get("workflow_call") or {}
              elif isinstance(on, list) and "workflow_call" in on:
                  call = {}
              else:
                  continue          # not a published stage
              stages += 1
              # Named, not just counted. verify-gate-7.py compares this set
              # against wc_published_stages.py's; a count alone lets two
              # derivations that see the same NUMBER of different files pass
              # as agreeing, which is #149 wearing yet another hat.
              print(f"note: {f}: published stage")

              inputs = (call.get("inputs") or {}) if isinstance(call, dict) else {}
              for iname, (itype, idefault) in DECLARED.items():
                  spec = inputs.get(iname)
                  if not isinstance(spec, dict):
                      print(f"::error file={f}::published stage does not declare the "
                            f"{iname!r} workflow_call input, so an adopter cannot bind "
                            f"this stage the way every other stage binds (FR-001/FR-002).")
                      failures += 1
                      continue
                  if spec.get("type") != itype or spec.get("default") != idefault:
                      print(f"::error file={f}::input {iname!r} is declared "
                            f"type={spec.get('type')!r} default={spec.get('default')!r}; "
                            f"the contract is type={itype!r} default={idefault!r}. The "
                            f"defaults are load-bearing — they are what makes an unbound "
                            f"adopter's behavior identical to before the feature.")
                      failures += 1

              for jname, job in (wf.get("jobs") or {}).items():
                  job = job or {}
                  if "uses" in job:
                      # A job that calls another workflow runs that
                      # workflow's jobs; the binding belongs to them.
                      print(f"note: {f}: job {jname!r} is a workflow call, not a "
                            f"bindable job — skipped.")
                      continue

                  if jname == "verify-image-prerequisites":
                      # The one job deliberately left unbound
                      # (specs/038-runner-container-passthrough). Its entire
                      # body is a docker login/pull of the adopter's image,
                      # performed BEFORE any other job of the stage starts —
                      # so an environment: block here would create the
                      # deployment record and prompt the approver without
                      # gating the thing worth gating: the credential use and
                      # image pull happen the instant the job starts, which
                      # is already past the approval. What it would buy an
                      # adopter is one more prompt per stage call, on a job
                      # that needs no token scopes and writes nothing.
                      # docs/adoption.md "Deployment environments" documents
                      # it as the second registered exception, beside
                      # pr-conversation.act.
                      #
                      # Asserted in the deviating direction rather than
                      # merely skipped: an exemption that only ever says
                      # "not my problem" cannot notice the binding coming
                      # back, and the way it comes back is somebody making
                      # all 11 files uniform without reading this comment.
                      if "environment" in job:
                          print(f"::error file={f}::job 'verify-image-prerequisites' "
                                f"carries an environment: block. This is the one job "
                                f"deliberately left unbound (specs/038-runner-"
                                f"container-passthrough): it runs docker login/pull as "
                                f"its whole body, before any other job of the stage, so "
                                f"binding it gates the deployment record without gating "
                                f"the credential use — and charges every adopter one "
                                f"more approval prompt per stage call for it. Remove "
                                f"the block, or change this gate and "
                                f"docs/adoption.md's registered-exception list "
                                f"together.")
                          failures += 1
                      else:
                          print(f"note: {f}: job 'verify-image-prerequisites' is the "
                                f"registered Gate 7 exemption — deliberately unbound, "
                                f"not counted as bound.")
                          exempt += 1
                      continue

                  env = job.get("environment")
                  if env is None:
                      print(f"::error file={f}::job {jname!r} has no environment: block. "
                            f"An adopter who binds this stage gets a gate on every OTHER "
                            f"job and none on this one — the stage looks gated while this "
                            f"job runs ungated, with nothing to see in the UI (FR-004).")
                      failures += 1
                      continue
                  if not isinstance(env, dict):
                      print(f"::error file={f}::job {jname!r} uses the shorthand "
                            f"environment: form, which cannot carry the deployment "
                            f"sub-key, so environment-deployment: false would be silently "
                            f"ignored for this job. Use the mapping form.")
                      failures += 1
                      continue

                  reason = EXCEPTIONS.get((os.path.basename(f), jname))
                  if reason is not None:
                      print(f"note: {f}: job {jname!r} is a registered Gate 7 "
                            f"exception — {reason}")
                      bound += 1
                      continue

                  ok = True
                  for subkey, iname in BINDINGS.items():
                      got = input_ref(env.get(subkey))
                      if got != iname:
                          print(f"::error file={f}::job {jname!r} wires environment."
                                f"{subkey} to {env.get(subkey)!r}; every job must forward "
                                f"the stage's {iname!r} input verbatim, or this job gates "
                                f"differently from the rest of its own stage.")
                          failures += 1
                          ok = False
                  bound += ok

          print(f"Gate 7: {stages} published stage(s), {bound} bound job(s), "
                f"{exempt} exempt job(s); {failures} failure(s).")
          if stages == 0:
              # Every stage file vanishing (or an `on:` shape this gate no
              # longer recognizes) must not read as a pass.
              print("::error::Gate 7 found no workflow declaring on.workflow_call — it "
                    "checked nothing. Either the published stages moved or this gate's "
                    "detection of them has broken.")
              sys.exit(1)
          sys.exit(1 if failures else 0)
          PYEOF

      # Same reasoning as Gate 6's self-test: this gate's whole value is
      # firing on a defect that nobody has made yet, and the fleet it runs
      # against is (and should stay) uniform, so a green Gate 7 says nothing
      # about whether Gate 7 works.
      - name: Gate 7 self-test — the detector actually detects
        run: python3 .github/scripts/verify-gate-7.py

      # Gate 8 — behavioral, not static. Gates 1-3 prove intake.yml and
      # clarify.yml parse, register and are permitted to run; none of them can
      # see that the two-way callout split each stage ends in sends a
      # requester somewhere they cannot act, or announces a spec as ready when
      # it visibly is not. Four defects of that class have shipped: #159's
      # unmatchable marker grep, a `spec-dir` guard re-added to only ONE arm
      # of the split (so the questionnaire could post on the "no discernible
      # feature request" path, where no spec: label exists and no reply can
      # reach wing-commander-2-clarify.yml), a cross-check that logged a
      # mismatch and announced readiness anyway, and a missing existence guard
      # that made the cross-check cry wolf about its own unreadable file.
      #
      # The harness EXECUTES the shipped decision shell against synthetic agent
      # transcripts and evaluates the shipped `if:` expressions against the
      # outputs it really produced, so it cannot drift from the workflows. It
      # ends with mutation checks that reintroduce each defect and assert the
      # suite fails — the same discipline as gates 6 and 7's self-tests, and
      # the reason gate 5 exists at all.
      - name: Gate 8 — clarification callouts are reachable and honest
        run: python3 .github/scripts/verify-clarification-gating.py

      # Gate 9 — the watchdog's own tripwire. "Collect: step summaries" is
      # what turns a stage's emitted sentinel into a signal that diagnose can
      # reason about; a sentinel it drops does not degrade the watchdog, it
      # makes the watchdog blind to one class of problem while still
      # reporting that inspection passed. That is the most expensive failure
      # shape this repository has had (2026-07-24's false "passed inspection",
      # and 2026-07-25's audit finding 10 of 19 "successful" runs not genuine).
      #
      # It was untested — pure shell inside a `gh api` loop, invisible to
      # every static gate — and it had already grown a real conflict: the
      # legacy bare-word pass (capped at one match per job) also matched the
      # emitted-token lines that docs/agent-friendly-workflows.md tells stage
      # authors to write, so one event produced two signals sharing an id and
      # spent the cap that an unrelated genuine stall word needed.
      #
      # Same discipline as gates 4-8: the shipped step is extracted and
      # executed against synthetic job logs with `gh` stubbed, so there is no
      # copy to drift, and mutations reintroduce the conflict to prove the
      # suite can fail.
      - name: Gate 9 — the watchdog's sentinel collector sees what stages emit
        run: python3 .github/scripts/verify-sentinel-collector.py

      # Gate 11 — the turn-budget numbers in every job summary mean what
      # they say. wing-commander-metrics-summary rendered `.num_turns`
      # against `--max-turns`, and those are different counters: the ratio
      # read 1.0x-2.3x high, always upward, so "198 / 100 turns (198%)"
      # appeared on a run that used 87 of 100. Nineteen of 47 implement runs
      # carried a budget warning; 13 had actually exhausted the budget.
      #
      # That instrument is the only one pointed at the knob this pipeline
      # tunes by hand, so it gets the same treatment as the collectors: the
      # shipped run: block is extracted and executed against synthetic
      # transcripts, and mutations reintroduce each counting defect to prove
      # the suite can go red.
      - name: Gate 11 — the metrics summary counts the turns the budget caps
        run: python3 .github/scripts/verify-metrics-turn-accounting.py

      # Gate 12 — every `gh`/API call runs under a token whose permissions
      # actually cover what it touches. This repository has now hit the
      # opposite failure three times by accident rather than by a check:
      # spec 005's `gh workflow run` 403 (fixed by dispatching with the
      # default token plus a job-level `actions: write`), and
      # specs/033-pr-conversation-commands T062/T063 (a `gh run cancel`/`gh
      # run list` pair that inherited the App token — which per
      # docs/setup.md has no Actions permission — and 403'd; T062's version
      # additionally reported that 403 to a maintainer as "already
      # completed", conflating a permission failure with a genuine outcome).
      # T062/T063 survived five pipeline cycles, a full quickstart
      # desk-check, and three rounds of executing the shipped shell against
      # synthetic inputs before being found by accident.
      #
      # (a) parses every workflow's `run:` blocks for `gh <subcommand>` and
      # `gh api <path>` invocations (executable ones only — a `gh ...`
      # inside a human-facing `echo`/print string, a code comment, or a
      # heredoc body handed to another interpreter never runs, and does not
      # count); (b) resolves the token in effect for each — a per-command
      # `GH_TOKEN="$X" gh ...` prefix wins, else the step's own `env.GH_TOKEN`,
      # else the job's — and classifies it as an App token
      # (`steps.ctx.outputs.token`, the wing-commander-context output, or
      # e2e-stage's scratch-repository-scoped `steps.scratch-token.outputs.token`
      # — same App, same grant, narrower repository scope) or
      # `github.token`; (c) maps the subcommand/path to the permission it
      # needs via a table extended only with evidence (the same rule Gate
      # 6's SUPPORTED_EVENTS already enforces) — an unrecognised subcommand,
      # `gh api` path segment, or unresolvable token/path FAILS this gate
      # rather than passing silently, because a detector that shrugs at what
      # it does not understand is the exact failure mode this gate exists to
      # close; (d) asserts App-token calls touch only permissions
      # docs/setup.md's "Repository permissions" list actually grants —
      # parsed from that doc, not hand-copied, so drift between the
      # adopter-facing documentation and the workflows fails the gate; and
      # (e) asserts `github.token` calls have the matching permission on the
      # job that runs them (job-level `permissions:`, or the workflow-level
      # block a job with no override inherits). A `Bash(gh run
      # view:*)`-style tool grant handed to an agent step is checked the
      # same way, against that step's own token — an agent that reaches for
      # a granted-but-unusable tool 403s exactly like a deterministic step
      # would (this is how specs/026-configurable-tool-lists'
      # `implement.cycle`/`implement.retry` tool lists were found still
      # carrying the T065 defect T065 itself had already fixed in
      # `pr-conversation.act`).
      #
      # Cross-repository `gh api repos/OWNER/REPO/...` calls (a literal,
      # different owner/repo — e.g. auto-update-spec-kit.yml's read of
      # `github/spec-kit`'s public releases) are out of scope: the App's
      # permission grant is this repository's installation, not a token
      # anyone can use to authorize a call against an unrelated repository.
      - name: Gate 12 — every gh/API call runs under a token permissioned for it
        run: |
          python3 - <<'PYEOF'
          import glob, os, re, sys, yaml

          # subcommand (verb1, verb2) -> (permission-category, level). Extended only
          # with evidence (research.md R6 / Gate 6's SUPPORTED_EVENTS rule): every
          # entry is a real invocation this repository's own workflows make. A
          # category of None means no repository permission is needed at all (repo
          # metadata is always readable, regardless of token).
          # Both are installation tokens for the SAME App, so both carry the
          # permission grant docs/setup.md documents. They differ only in
          # repository scope: `ctx` is the shared wing-commander-context token
          # (scoped to the repository the stage runs in), `scratch-token` is
          # auto-update-spec-kit e2e-stage's separately minted token for the
          # pre-created scratch repository — a scope the context token cannot
          # cover, since create-github-app-token defaults to the current
          # repository and one installation token cannot span two owners.
          APP_TOKEN_EXPRS = {"steps.ctx.outputs.token",
                             "steps.scratch-token.outputs.token"}
          DEFAULT_TOKEN_EXPRS = {"github.token", "secrets.GITHUB_TOKEN"}

          SUBCOMMAND_PERMS = {
              ("run", "cancel"):     ("actions", "write"),
              ("run", "download"):   ("actions", "read"),
              ("run", "list"):       ("actions", "read"),
              ("run", "view"):       ("actions", "read"),
              ("workflow", "run"):   ("actions", "write"),
              ("workflow", "view"):  ("actions", "read"),
              ("workflow", "list"):  ("actions", "read"),
              ("issue", "view"):     ("issues", "read"),
              ("issue", "comment"):  ("issues", "write"),
              ("issue", "create"):   ("issues", "write"),
              ("issue", "edit"):     ("issues", "write"),
              ("issue", "close"):    ("issues", "write"),
              ("issue", "reopen"):   ("issues", "write"),
              ("issue", "list"):     ("issues", "read"),
              ("label", "create"):   ("issues", "write"),
              ("label", "list"):     ("issues", "read"),
              ("pr", "view"):        ("pull-requests", "read"),
              ("pr", "comment"):     ("pull-requests", "write"),
              ("pr", "create"):      ("pull-requests", "write"),
              ("pr", "edit"):        ("pull-requests", "write"),
              ("pr", "list"):        ("pull-requests", "read"),
              ("search", "issues"):  ("issues", "read"),
              ("search", "prs"):     ("pull-requests", "read"),
              ("release", "create"): ("contents", "write"),
              ("repo", "view"):      (None, None),
          }

          # `gh api PATH` — PATH's first segment under repos/{owner}/{repo}/ decides
          # the permission, the same way SUBCOMMAND_PERMS does for named subcommands.
          API_CATEGORY_PERM = {
              "actions": "actions", "check-runs": "checks", "check-suites": "checks",
              "issues": "issues", "pulls": "pull-requests", "contents": "contents",
              "releases": "contents", "labels": "issues", "milestones": "issues",
          }

          GH_INVOKE_RE = re.compile(
              r'(?:GH_TOKEN=(?P<tokexpr>"(?:[^"\\]|\\.)*"|\$\{\{[^}]*\}\}|\$\w+)\s+)?'
              r'\bgh\s+(?:'
              r'api\s+(?:-X\s+\S+\s+)?(?P<apipath>"(?:[^"\\]|\\.)*"|\S+)'
              r'|(?P<verb1>[a-zA-Z][\w-]*)(?:\s+(?P<verb2>[a-zA-Z][\w-]*))?'
              r')'
          )
          ASSIGN_RE = re.compile(r'(?<![\w$])(\w+)=("(?:[^"\\]|\\.)*"|\$\([^)]*\)|\S+)')
          TOOL_GH_RE = re.compile(r'Bash\(gh\s+([a-zA-Z][\w-]*)(?:\s+([a-zA-Z][\w-]*))?')


          def norm_expr(raw):
              s = raw.strip()
              m = re.fullmatch(r"\$\{\{\s*(.*?)\s*\}\}", s)
              if m:
                  return m.group(1).strip()
              if s.startswith('"') and s.endswith('"') and len(s) >= 2:
                  s = s[1:-1]
              return s


          def strip_heredocs(text):
              """Heredoc bodies are data for another interpreter (python, jq), never
              bash commands — a `gh ...` mentioned inside one (an error message a gate
              prints, e.g.) never actually runs. Strip them before scanning."""
              out = []
              lines = text.splitlines()
              heredoc_re = re.compile(r"<<-?\s*'?(\w+)'?\s*$")
              i = 0
              while i < len(lines):
                  line = lines[i]
                  m = heredoc_re.search(line)
                  out.append(line)
                  i += 1
                  if m:
                      delim = m.group(1)
                      while i < len(lines) and lines[i].strip() != delim:
                          i += 1
                      if i < len(lines):
                          out.append(lines[i])
                          i += 1
              return "\n".join(out)


          def strip_comments(text):
              return "\n".join(l for l in text.splitlines() if not l.strip().startswith("#"))


          def executable_flags(text):
              """True per character where shell would actually EXECUTE what it finds,
              as opposed to inside a single-quoted or (non-substitution) double-quoted
              literal — e.g. the "gh workflow run ..." inside an `echo "...gh..."`
              human-facing message never runs. `$( ... )` command substitutions stay
              executable even nested inside double quotes, because bash really does
              run them there."""
              n = len(text)
              flags = [True] * n
              stack = []
              i = 0
              while i < n:
                  c = text[i]
                  top = stack[-1] if stack else None
                  cur_exec = top not in ("sq", "dq")
                  flags[i] = cur_exec
                  if c == "\\" and top != "sq" and i + 1 < n:
                      flags[i + 1] = cur_exec
                      i += 2
                      continue
                  if top == "sq":
                      if c == "'":
                          stack.pop()
                      i += 1
                      continue
                  # T068: a `#` starting a word outside quotes opens a shell
                  # comment running to end of line. strip_comments() only drops
                  # WHOLE-line comments, so a TRAILING one reached this scanner
                  # intact and its apostrophe (`target=1  # stage 8's resolve
                  # job must fail`) pushed a bogus frame that hid every call
                  # after it — that is what kept wing-commander-watchdog-test's
                  # real `gh workflow run` invisible to Gate 12.
                  if c == "#" and top != "dq" and (i == 0 or text[i - 1] in " \t\n"):
                      j = text.find("\n", i)
                      j = n if j < 0 else j
                      for k in range(i, j):
                          flags[k] = False
                      i = j
                      continue
                  # T068: an apostrophe inside a DOUBLE-quoted string is a
                  # literal, not a quote opener ("this project's constitution").
                  # Pushing an `sq` frame for it made everything after it in the
                  # step read as non-executable, silently hiding 10 real `gh`
                  # calls repo-wide from this gate — including this feature's
                  # own `gh pr comment` and rebase.yml's `gh label create`. `'`
                  # still opens a frame inside `$( ... )`, where the shell
                  # really does honour it.
                  if c == "'" and top != "dq":
                      stack.append("sq"); i += 1; continue
                  if c == '"':
                      stack.pop() if top == "dq" else stack.append("dq")
                      i += 1; continue
                  if c == "$" and i + 1 < n and text[i + 1] == "(":
                      stack.append("sub"); i += 2; continue
                  if top == "sub" and c == ")":
                      stack.pop(); i += 1; continue
                  i += 1
              return flags


          def collect_assignments(text):
              out = {}
              for m in ASSIGN_RE.finditer(text):
                  out.setdefault(m.group(1), []).append(m.group(2))
              return out


          # NEVER write the literal two-brace expression opener in this (or any)
          # run: block, even inside a quoted Python string in a heredoc.
          # GitHub's own workflow parser scans run: text for expressions before
          # anything executes, and an opener with no closer fails the WHOLE file
          # with "The expression is not closed" — the file then does not
          # register, its checks silently never appear on the PR, and only Gate
          # 1 (which reads the default branch, post-merge) would notice. Build
          # the sequence by concatenation instead.
          EXPR_OPEN = "${" + "{"

          def resolve_paths(path, assigns, depth=0):
              path = norm_expr(path)
              if depth > 5 or path.startswith(EXPR_OPEN):
                  return [path]
              if path.startswith("$("):
                  return [None]
              if path.startswith("$"):
                  varname = path[1:].strip("{}")
                  if varname in assigns:
                      out = []
                      for v in assigns[varname]:
                          out.extend(resolve_paths(v, assigns, depth + 1))
                      return out
                  return [None]
              return [path]


          def path_category(path_text):
              """-> ('SELF'|'CROSS', category) for a repos/OWNER/REPO/... path, or
              ('OTHER', None) for anything else (org/user endpoints, GraphQL, etc.)."""
              segs = [s for s in path_text.strip("/").split("/") if s]
              if not segs or segs[0] != "repos":
                  return "OTHER", None
              rest = segs[1:]
              if not rest:
                  return "OTHER", None
              if rest[0].startswith("$"):
                  rest = rest[1:]           # one token already carries owner/repo
                  scope = "SELF"
              else:
                  rest = rest[2:] if len(rest) >= 2 else []
                  scope = "CROSS"           # a literal, different owner/repo pair
              return (scope, rest[0]) if rest else (scope, None)


          def resolve_token(tokexpr, step_env, job_env):
              """-> (kind, detail). kind in app/default/other/unresolved."""
              def classify(expr):
                  if expr in APP_TOKEN_EXPRS:
                      return "app"
                  if expr in DEFAULT_TOKEN_EXPRS:
                      return "default"
                  return "other"

              if tokexpr is not None:
                  val = norm_expr(tokexpr)
                  if val.startswith("$") and not val.startswith(EXPR_OPEN):
                      varname = val[1:].strip("{}")
                      for env in (step_env, job_env):
                          if varname in env:
                              return classify(norm_expr(str(env[varname]))), varname
                      return "unresolved", varname
                  return classify(val), val

              for env in (step_env, job_env):
                  if "GH_TOKEN" in env:
                      return classify(norm_expr(str(env["GH_TOKEN"]))), None
              return "unresolved", None


          def effective_job_permissions(wf, job):
              p = job.get("permissions")
              if p is None:
                  p = wf.get("permissions")
              return p if isinstance(p, dict) else None


          # T073: must honour the required LEVEL, exactly as its `default`
          # sibling below does. Checking mere category membership let an
          # App-token `gh issue create` pass against a Read-only `issues`
          # grant and 403 at runtime — the very class of defect this gate
          # exists to catch.
          def app_permission_ok(cat, level, app_perms):
              if cat is None:
                  return True
              granted = app_perms.get(cat)
              if granted is None:
                  return False
              if level == "write":
                  return granted == "write"
              return granted in ("read", "write")


          def default_permission_ok(cat, level, job_perms):
              if cat is None:
                  return True
              if job_perms is None:
                  return None
              granted = job_perms.get(cat)
              if granted is None:
                  return False
              if level == "write":
                  return granted == "write"
              return granted in ("read", "write")


          def parse_app_permissions(path="docs/setup.md"):
              text = open(path, encoding="utf-8").read()
              m = re.search(r"\*\*Repository permissions\*\*:\n((?:\s*-\s*.+\n)+)", text)
              if not m:
                  sys.exit(f"::error file={path}::Gate 12 could not find the "
                            f"'Repository permissions' bullet list this gate treats as "
                            f"the single source of truth for what the wing-commander-bot "
                            f"App may do. If it moved or was reworded, update this gate "
                            f"and the doc together.")
              perms = {}
              for line in m.group(1).splitlines():
                  lm = re.match(r"\s*-\s*([A-Za-z ]+):\s*\*\*(.+?)\*\*", line)
                  if not lm:
                      continue
                  name, level = lm.group(1).strip(), lm.group(2).strip().lower()
                  if name.lower() == "everything else":
                      continue
                  key = name.lower().replace(" ", "-")
                  if "write" in level:
                      perms[key] = "write"
                  elif "read" in level:
                      perms[key] = "read"
              return perms


          def check_call(where, label, perm_cat, level, tok_kind, tok_detail,
                         app_perms, job_perms, failures, notes):
              if tok_kind == "app":
                  if not app_permission_ok(perm_cat, level, app_perms):
                      failures.append(
                          f"{where}: {label} runs under the App token, which needs "
                          f"{perm_cat!r} ({level}) but docs/setup.md grants it "
                          f"{app_perms.get(perm_cat) or 'nothing'} "
                          f"(full grant: {sorted(app_perms.items())}). "
                          f"This 403s at runtime.")
                  return
              if tok_kind == "default":
                  ok = default_permission_ok(perm_cat, level, job_perms)
                  if ok is False:
                      failures.append(
                          f"{where}: {label} runs under github.token, which needs "
                          f"{perm_cat!r} ({level}) but the job's effective permissions "
                          f"are {job_perms}. This 403s at runtime.")
                  elif ok is None:
                      notes.append(f"{where}: {label} runs under github.token needing "
                                   f"{perm_cat!r} ({level}); this job declares no "
                                   f"permissions: block (inherits the repo default), "
                                   f"which Gate 12 cannot resolve - unverified.")
                  return
              if tok_kind == "unresolved":
                  failures.append(
                      f"{where}: {label} - Gate 12 could not resolve which token this "
                      f"call runs under ({tok_detail!r}), so it cannot verify the call "
                      f"is safe.")
                  return
              notes.append(f"{where}: {label} runs under an unrecognised token "
                           f"expression ({tok_detail!r}) - not the App token or "
                           f"github.token, so Gate 12 cannot check it against either "
                           f"permission model. Unverified.")


          app_perms = parse_app_permissions()
          failures = []
          notes = []
          # #215: category C's two halves, filled during the pass below and
          # cross-checked after it, because a call site in one file names an
          # agent step in another and the files are visited in glob order.
          agent_contexts = {}   # workflow path -> [(job, step, tok_kind, tok_detail, perms)]
          callsite_grants = []  # (caller, caller-job, called-workflow, [(v1, v2, input)])

          for f in sorted(glob.glob(".github/workflows/*.yml") + glob.glob(".github/workflows/*.yaml")):
              try:
                  wf = yaml.safe_load(open(f, encoding="utf-8")) or {}
              except Exception as e:
                  failures.append(f"{f}: YAML parse failure: {e}")
                  continue

              for jname, job in (wf.get("jobs") or {}).items():
                  job = job or {}
                  job_env = job.get("env") or {}
                  job_perms = effective_job_permissions(wf, job)
                  pending_tools = []  # (verb1, verb2, source-step-name)

                  # --- category C: tools granted where a stage is CALLED -----
                  # A job with `uses:` has no steps, so the loop below never
                  # sees it. The tools it passes reach the called stage's agent
                  # steps all the same, arriving at the tool-args composite as
                  # an unexpanded `inputs.extra-allowed-tools` expression - a
                  # literal that category B
                  # cannot read anything out of (#215).
                  job_uses = str(job.get("uses") or "")
                  if job_uses.startswith("./.github/workflows/"):
                      called = job_uses.split("@")[0][2:]
                      cs_with = job.get("with") or {}
                      cs_grants = []
                      for key in ("extra-allowed-tools", "allowed-tools-override"):
                          val = cs_with.get(key)
                          # EXPR_OPEN, not the literal: GitHub's parser scans
                          # run: text for expressions and rejects the WHOLE file
                          # on one, while yaml.safe_load and bash -n both pass it.
                          if not isinstance(val, str) or EXPR_OPEN in val:
                              continue
                          for gm in TOOL_GH_RE.finditer(val):
                              cs_grants.append((gm.group(1), gm.group(2), key))
                      if cs_grants:
                          callsite_grants.append((f, jname, called, cs_grants))

                  for step in job.get("steps") or []:
                      step = step or {}
                      sname = step.get("name") or step.get("id") or "<unnamed step>"
                      step_env = step.get("env") or {}
                      uses = step.get("uses", "")

                      # --- category A: literal invocations in run: blocks -----------
                      run = step.get("run")
                      if run:
                          text = strip_comments(strip_heredocs(run))
                          flags = executable_flags(text)
                          assigns = collect_assignments(text)
                          for m in GH_INVOKE_RE.finditer(text):
                              if not flags[m.start()]:
                                  continue
                              where = f"{f} :: {jname} / {sname}"
                              tok_kind, tok_detail = resolve_token(
                                  m.group("tokexpr"), step_env, job_env)

                              if m.group("apipath"):
                                  resolved = resolve_paths(m.group("apipath"), assigns)
                                  if any(p is None for p in resolved):
                                      failures.append(
                                          f"{where}: `gh api {m.group('apipath')}` - Gate "
                                          f"12 cannot resolve this path to a literal "
                                          f"value (it traces to a `$(...)` computed "
                                          f"value or an unset variable), so it cannot "
                                          f"verify which permission this call needs. "
                                          f"Either make the path traceable or add it as "
                                          f"a reviewed exception.")
                                      continue
                                  cats = {path_category(p) for p in resolved}
                                  for scope, cat in cats:
                                      if scope != "SELF" or cat is None:
                                          continue  # cross-repo / non-repos path: a different repo's permission model, out of scope
                                      perm_cat = API_CATEGORY_PERM.get(cat)
                                      if perm_cat is None:
                                          failures.append(
                                              f"{where}: `gh api ...{cat}/...` - Gate "
                                              f"12's API_CATEGORY_PERM table has no "
                                              f"entry for {cat!r}. Add one (with "
                                              f"evidence of what permission it needs) "
                                              f"rather than let an unrecognised call "
                                              f"pass unchecked.")
                                          continue
                                      level = ("write" if re.search(r"-X\s+(POST|PATCH|PUT|DELETE)", m.group(0))
                                               else "read")
                                      check_call(where, f"gh api (.../{cat}/...)", perm_cat, level,
                                                 tok_kind, tok_detail, app_perms, job_perms,
                                                 failures, notes)
                              else:
                                  verb1, verb2 = m.group("verb1"), m.group("verb2")
                                  key = (verb1, verb2)
                                  if key not in SUBCOMMAND_PERMS:
                                      failures.append(
                                          f"{where}: `gh {verb1}"
                                          f"{(' ' + verb2) if verb2 else ''}` is not in "
                                          f"Gate 12's SUBCOMMAND_PERMS table. An "
                                          f"unrecognised subcommand must fail this gate, "
                                          f"not pass it silently - add an entry (with "
                                          f"evidence of the permission it needs) if this "
                                          f"is legitimate.")
                                      continue
                                  perm_cat, level = SUBCOMMAND_PERMS[key]
                                  check_call(where, f"gh {verb1} {verb2 or ''}".strip(),
                                             perm_cat, level, tok_kind, tok_detail,
                                             app_perms, job_perms, failures, notes)

                      # --- category B: Bash(gh ...) grants to an agent step ----------
                      if "wing-commander-tool-args" in uses:
                          with_ = step.get("with") or {}
                          for key in ("default-allowed-tools", "extra-allowed-tools",
                                      "allowed-tools-override"):
                              val = with_.get(key)
                              if isinstance(val, str):
                                  for gm in TOOL_GH_RE.finditer(val):
                                      pending_tools.append((gm.group(1), gm.group(2), sname))

                      if uses.startswith("anthropics/claude-code-action"):
                          tok_kind, tok_detail = resolve_token(None, step_env, job_env)
                          # #215: the same context category C needs, recorded here
                          # rather than re-derived, so the two checks can never
                          # disagree about which token a step runs under.
                          # glob() yields OS separators; a `uses:` path is always
                          # posix. Keying on the raw value matched on Linux and
                          # never on Windows, where the cross-check then reported
                          # "no agent step found" for a stage that has several.
                          agent_contexts.setdefault(
                              f.replace("\\", "/"), []).append(
                              (jname, sname, tok_kind, tok_detail, job_perms))
                          where = f"{f} :: {jname} / {sname} (agent tool grant)"
                          for verb1, verb2, source in pending_tools:
                              key = (verb1, verb2)
                              if key not in SUBCOMMAND_PERMS:
                                  continue   # not a subcommand this table tracks (e.g. bare `gh api`) — not this gate's job to police free-form agent calls
                              perm_cat, level = SUBCOMMAND_PERMS[key]
                              check_call(f"{where} [granted by {source!r}]",
                                         f"Bash(gh {verb1} {verb2 or ''})".strip(),
                                         perm_cat, level, tok_kind, tok_detail,
                                         app_perms, job_perms, failures, notes)
                          pending_tools = []

          # --- category C cross-check (#215) ---------------------------------
          # Every tool granted at a call site is checked against EVERY agent
          # step in the stage it is passed to: a stage-level input reaches all
          # of them, so a grant is only safe if it is safe for the least
          # privileged one.
          for src_file, src_job, called, cs_grants in callsite_grants:
              ctxs = agent_contexts.get(called)
              if not ctxs:
                  failures.append(
                      f"{src_file} :: {src_job} grants agent tools to "
                      f"{called!r}, but Gate 12 found no agent step there to "
                      f"check them against - the workflow may have moved or "
                      f"the path may be wrong. Unresolvable is a failure here "
                      f"for the same reason an unknown subcommand is.")
                  continue
              for verb1, verb2, key in cs_grants:
                  ckey = (verb1, verb2)
                  if ckey not in SUBCOMMAND_PERMS:
                      continue   # same policy as category B: not this gate's job
                  perm_cat, level = SUBCOMMAND_PERMS[ckey]
                  for jname, sname, tok_kind, tok_detail, job_perms in ctxs:
                      check_call(
                          f"{src_file} :: {src_job} -> {called} :: {jname} / "
                          f"{sname} (granted at the call site via {key!r})",
                          f"Bash(gh {verb1} {verb2 or ''})".strip(),
                          perm_cat, level, tok_kind, tok_detail,
                          app_perms, job_perms, failures, notes)

          for n in notes:
              print(f"note: {n}")
          for fl in failures:
              print(f"::error::Gate 12: {fl}")
          print(f"Gate 12: checked every gh/API call site for a permissioned token; {len(failures)} failure(s).")
          sys.exit(1 if failures else 0)
          PYEOF

      # Same reasoning as gates 6/7's self-tests: Gate 12 passing against
      # this repository's own (healthy, by construction) fleet proves
      # nothing about whether its detection logic works — only that nobody
      # has introduced the defect it watches for yet. This runs the SHIPPED
      # gate (extracted from this file, not a copy) against synthetic
      # workflow trees with a known-bad call and asserts it fails, and
      # against known-good ones and asserts it passes.
      - name: Gate 12 self-test — the detector actually detects
        run: python3 .github/scripts/verify-gate-12.py

      # Gate 13 — pr-conversation's relay-confirmation phrase. Three things
      # have to state the same phrase: the risk-warning comment that tells a
      # maintainer what to reply, the classify-side resume trigger, and the
      # act-side risk gate. Nothing structural keeps them in step, and both
      # drift directions are silent and bad — a phrase no engine accepts
      # deadlocks every relayed request (the stage re-asks forever), while a
      # loose pattern makes resume fire on incidental words, which SKIPS THE
      # CLASSIFY AGENT and re-acts on a stored classification instead of
      # answering what was actually just asked (T069).
      - name: Gate 13 — relay confirmation is opt-in on one agreed phrase
        run: python3 .github/scripts/verify-relay-confirmation-phrase.py

      # Gate 14 — implement.yml's stall report tells a maintainer how to
      # restart, but whether that advice works is decided by the idempotency
      # guard in another job, which admits a stalled stage only at recorded+1.
      # They disagreed: the runbook printed the iteration that had just failed,
      # so every restart command the pipeline handed out was dropped as a
      # duplicate — silently, since skip=true turns every later `if:` false and
      # the run goes GREEN in ~11s with nothing posted and no failed conclusion
      # for the watchdog. Seen on #184: run 31596632026 vs 31597726542. Gates
      # 1-3 passed throughout; they prove shell parses, not that two steps
      # agree about a number.
      - name: Gate 14 — the stalled-restart runbook is a command the guard accepts
        run: python3 .github/scripts/verify-stall-restart-runbook.py

      # Gate 15 — a job with no status-check function is skipped whenever
      # ANYTHING in its needs-closure was skipped, before its `if` is
      # evaluated. Ordinarily that is how a chain is meant to stop. It becomes
      # a silent trap when an intermediate job deliberately survives a skipped
      # ancestor with `always()`: that job runs and sets its outputs, and every
      # unguarded descendant is suppressed anyway.
      #
      # Not hypothetical. auto-update-spec-kit.yml's `evaluate-path` opens with
      # `always()` because exactly one of `settle`/`comment-reply` runs per
      # cycle; `prepare` and `verify` did not, so the whole adopt path did
      # nothing for every cycle after the comment-reply arm was added — green
      # runs, a lifecycle issue saying work was underway, no version adopted.
      # No existing gate could see it: every file parsed, registered, and was
      # permitted to run.
      #
      # A needs-closure walk rather than a list of known-bad jobs, so the next
      # second entry-point arm is caught by the same rule.
      - name: Gate 15 — no job is silently suppressed by a skipped ancestor
        run: |
          python3 - <<'PYEOF'
          import glob, re, sys, yaml

          # The functions that make GitHub evaluate a job's `if` even when
          # part of its needs-closure was skipped.
          STATUS_FN = re.compile(r"\b(always|success|failure|cancelled)\s*\(")

          # An `if` arm that only means anything when a need did NOT
          # succeed. Reading one is the tell that the author expected the
          # `if` to be evaluated in a case where GitHub does not evaluate
          # it at all. Two shapes: the literal `.result` comparison this
          # rule has always caught, and a job OUTPUT compared against the
          # literal 'false' with the same tell — specs/041-implement-
          # stall-notice's own regression (`needs.implement.outputs.
          # final-ok == 'false'`, no status function) was invisible to the
          # first shape alone. Deliberately narrower than "any output
          # comparison": `!= 'false'` (watchdog.yml's `evidence-available`)
          # is the opposite shape — true in the ordinary case, false only
          # on an explicit opt-out, which skips right along with its
          # dependency and needs no survival guard — and `== '<other
          # value>'` (cleanup.yml's `outcome == 'teardown-done'`,
          # auto-update-spec-kit.yml's `outcome == 'clean-bump'`) is
          # ordinary branch selection among a successful job's outcomes,
          # not a "did my dependency fail" check. Matching those too would
          # flag jobs with nothing wrong with them on every PR that touches
          # them — a lint gate that cries wolf gets its warnings ignored,
          # which is a worse outcome than the narrower rule missing a
          # differently-spelled future instance of this exact shape.
          NON_SUCCESS_ARM = re.compile(
              r"needs\.[A-Za-z0-9_-]+\.result\s*[=!]=\s*'(skipped|failure|cancelled)'"
              r"|needs\.[A-Za-z0-9_-]+\.outputs\.[A-Za-z0-9_-]+\s*==\s*'false'")


          def needs_of(spec):
              n = (spec or {}).get("needs") or []
              return [n] if isinstance(n, str) else list(n)


          failures = []
          for path in sorted(glob.glob(".github/workflows/*.yml")
                             + glob.glob(".github/workflows/*.yaml")):
              doc = yaml.safe_load(open(path, encoding="utf-8")) or {}
              jobs = doc.get("jobs") or {}
              if not isinstance(jobs, dict):
                  continue
              guarded = {
                  n for n, s in jobs.items()
                  if isinstance(s, dict) and STATUS_FN.search(str(s.get("if", "")))
              }
              for name, spec in sorted(jobs.items()):
                  if not isinstance(spec, dict):
                      continue

                  # Second rule, and the one specs/038 needed: a job can be
                  # suppressed by ANY ancestor that skips, not only by one
                  # carrying a status-check function. The walk below keys on
                  # `guarded` ancestors because that is the shape #189 was
                  # written for; verify-image-prerequisites skips on a plain
                  # `if: inputs.container-image != ''`, so it is invisible to
                  # that walk while suppressing its dependents just as hard.
                  #
                  # Widening the walk is not the fix — every conditional job
                  # would then flag every ordinary descendant, which is the
                  # skip-propagation the fleet WANTS. Key on the contradiction
                  # instead: an `if` that tests for a need's skipped/failed
                  # result is asking to run in a case where, without a status-
                  # check function of its own, it is already skipped. It is
                  # unreachable code inside an expression, and it reads like a
                  # working guard — which is how eleven stages shipped silent
                  # for a day (#224, PR #222).
                  cond = str(spec.get("if", "") or "")
                  arm = NON_SUCCESS_ARM.search(cond)
                  if arm and not STATUS_FN.search(cond):
                      failures.append(
                          f"::error file={path}::Gate 15: job {name!r} has an `if` arm "
                          f"({arm.group(0)}) that only matters when a need did not "
                          f"succeed, but carries no status-check function of its own. "
                          f"GitHub applies an implicit success() over needs: in that "
                          f"case, so the job is skipped before that arm is ever read "
                          f"— it gates nothing and documents an intention that never "
                          f"runs. Prefix the `if` with `!cancelled() &&` (or "
                          f"`always() &&`), keeping every existing result guard.")

                  if name in guarded:
                      continue
                  seen, stack, risky = set(), needs_of(spec), []
                  while stack:
                      p = stack.pop()
                      if p in seen or p not in jobs:
                          continue
                      seen.add(p)
                      if p in guarded:
                          risky.append(p)
                      stack.extend(needs_of(jobs[p])
                                   if isinstance(jobs[p], dict) else [])
                  if risky:
                      failures.append(
                          f"::error file={path}::Gate 15: job {name!r} depends on "
                          f"{', '.join(repr(r) for r in sorted(risky))}, which run(s) "
                          f"under a status-check "
                          f"function (always()/success()/failure()/cancelled()) because "
                          f"something they need is skipped. {name!r} has no such function "
                          f"of its own, so GitHub skips it before its `if` is evaluated — "
                          f"it will silently never run, no matter what that `if` says. "
                          f"Prefix its `if` with `always() &&` (keeping every existing "
                          f"result/output guard, which is what actually does the gating).")

          for f in failures:
              print(f)
          print(f"Gate 15: walked every job's needs-closure; {len(failures)} failure(s).")
          sys.exit(1 if failures else 0)
          PYEOF

      # Same reasoning as gates 6/7/12's self-tests: this gate is a detector,
      # and the fleet it runs against is (and should stay) clean, so a green
      # Gate 15 says nothing about whether Gate 15 works.
      - name: Gate 15 self-test — the detector actually detects
        run: python3 .github/scripts/verify-gate-15.py

      # specs/041-implement-stall-notice — the chain-stop notice composite's
      # own shell, executed against a real git repo/bare remote and a
      # stubbed gh, the same way Gate 14 exercises implement.yml's stalled
      # job. Proves the "marked" vs "record could not be updated" wording
      # actually depends on whether the mark landed, and that
      # restart-command is reproduced byte-for-byte rather than rebuilt.
      - name: The chain-stop-notice composite's shell body behaves as documented
        run: python3 .github/scripts/verify-chain-stop-notice-body.py

      # specs/041-implement-stall-notice, User Story 2 acceptance scenario 3 /
      # Out of Scope: the exhausted-retry notice's wording is not part of
      # this feature — this proves it stayed that way, not merely that it
      # was not meant to change.
      - name: implement.yml's exhausted-retry stall notice reads exactly as before
        run: python3 .github/scripts/verify-implement-stall-notice-unchanged.py

      # Gate 16 — every agent step's execution log survives the agent's own
      # failure. `anthropics/claude-code-action` writes its transcript to
      # claude-execution-output.json in the runner temp dir, and that file is
      # the only record of what the agent actually did: the read-back steps that
      # follow deliberately never trust agent narration, so when one reports
      # "the agent step did not complete" it says nothing about WHY, and the
      # artifact is the maintainer's only route to the cause.
      #
      # A plain upload step inherits the default `success()` condition, which
      # drops the artifact precisely on the runs where the agent failed —
      # the log is captured exactly when it is not needed and discarded
      # exactly when it is. Every stage that got this right wrote `always()`;
      # auto-update-spec-kit's `e2e-stage` agent (the newest one) shipped
      # with no upload at all, so its failures left nothing behind but a
      # one-line "stage/infrastructure problem" verdict.
      #
      # Two shapes both count as covering an agent step, because both ship:
      # a job-wide catch-all (`if: always()`, no per-step key, relying on
      # if-no-files-found: ignore) and a per-agent upload keyed on
      # `steps.<id>.outcome != 'skipped'`. What never counts is an upload
      # with no status-check function, or a job whose only keyed uploads name
      # other agent steps — which is how a second agent added to an
      # already-covered job goes uncaptured.
      - name: Gate 16 — every agent step's execution log survives its failure
        run: |
          python3 - <<'PYEOF'
          import glob, re, sys, yaml

          AGENT = "anthropics/claude-code-action"
          LOG = "claude-execution-output.json"
          # Built by concatenation, never written literally: GitHub's parser
          # scans `run:` text for expressions and rejects the WHOLE file with
          # "The expression is not closed" if it finds an unclosed one — even
          # inside a quoted string in a heredoc. yaml.safe_load and `bash -n`
          # both pass it, so nothing local catches it; the only symptom is
          # this workflow's checks quietly not appearing.
          TEMP_EXPR = "$" + "{{ runner.temp }}"
          STATUS_FN = re.compile(r"\b(always|failure|cancelled)\s*\(")
          STEP_KEY = re.compile(r"steps\.([A-Za-z0-9_-]+)\.outcome")


          def published(path):
              """True for a stage an adopter can call — same rule as gate 7."""
              wf = yaml.safe_load(open(path, encoding="utf-8")) or {}
              # PyYAML resolves the bare key `on` to True (YAML 1.1).
              on = wf.get(True, wf.get("on"))
              return (isinstance(on, dict) and "workflow_call" in on) or \
                     (isinstance(on, list) and "workflow_call" in on), wf


          failures = []
          for path in sorted(glob.glob(".github/workflows/*.yml")
                             + glob.glob(".github/workflows/*.yaml")):
              try:
                  is_stage, wf = published(path)
              except yaml.YAMLError:
                  continue  # the YAML guard rail reports this, with a better message
              if not is_stage:
                  continue
              for job_name, job in sorted((wf.get("jobs") or {}).items()):
                  steps = (job or {}).get("steps") or []
                  if not isinstance(steps, list):
                      continue
                  uploads = []
                  for s in steps:
                      if not isinstance(s, dict):
                          continue
                      with_ = s.get("with") or {}
                      if "actions/upload-artifact" in str(s.get("uses", "")) and \
                         LOG in str(with_.get("path", "")):
                          cond = str(s.get("if", ""))
                          uploads.append((cond, set(STEP_KEY.findall(cond))))
                  for s in steps:
                      if not isinstance(s, dict) or \
                         AGENT not in str(s.get("uses", "")):
                          continue
                      sid = s.get("id")
                      covered = any(
                          STATUS_FN.search(cond) and (not keys or sid in keys)
                          for cond, keys in uploads)
                      if covered:
                          continue
                      why = ("no step in this job uploads it at all"
                             if not uploads else
                             "the job's execution-log upload(s) are keyed to "
                             "other steps or carry no status-check function")
                      failures.append(
                          f"::error file={path}::Gate 16: the agent step "
                          f"{s.get('name')!r} (id: {sid!r}) in job {job_name!r} has no "
                          f"execution log that survives its own failure — {why}. "
                          f"claude-execution-output.json is the only record of what the "
                          f"agent did, and the read-back steps downstream deliberately do "
                          f"not read agent narration, so without it a failed agent leaves "
                          f"nothing to diagnose. Add an actions/upload-artifact step for "
                          f"{TEMP_EXPR}/{LOG} gated "
                          f"`always() && steps.{sid}.outcome != 'skipped'` "
                          f"(with if-no-files-found: ignore).")

          for f in failures:
              print(f)
          print(f"Gate 16: checked every agent step in every published stage; "
                f"{len(failures)} failure(s).")
          sys.exit(1 if failures else 0)
          PYEOF

      # Same reasoning as Gate 15's self-test: the fleet this runs against is
      # (and should stay) clean, so a green Gate 16 says nothing about whether
      # Gate 16 works.
      - name: Gate 16 self-test — the detector actually detects
        run: python3 .github/scripts/verify-gate-16.py

      # Gate 18 — every `gh api` call is checked for a pagination-safe
      # shape: under `--paginate`, gh applies `--jq` once per page and
      # concatenates the raw outputs rather than slurping first, so a
      # filter that collects results into an array (or the absence of any
      # filter at all, whatever the endpoint's own shape) resolves to
      # page-shaped garbage once a read passes its first page. Three call
      # sites shipped exactly that defect (spec 036, issue #182) — one of
      # them, the watchdog's annotation collector, dropped every
      # annotation past page 1 for two audits running before anyone
      # noticed, because the failure never surfaced as a step failure.
      # This check reaches every `run:` block in every workflow and
      # composite action, plus every checked-in shell/Python script, so
      # the defect class cannot land a fourth time anywhere in the tree —
      # a hand-maintained list of "known-safe" reads is exactly the shape
      # issue #149 already showed does not hold up. A same-line or
      # immediately-preceding `# wc-pagination-exempt: <reason>` comment
      # is the only escape hatch, and a bare one with no reason does not
      # count.
      - name: Gate 18 — every paginated read is safe by construction
        run: |
          python3 .github/scripts/verify-gate-18-scan.py

      # Gate 18 says nothing about whether Gate 18 works — same reasoning as
      # gates 15/16/17's self-tests.
      - name: Gate 18 self-test — the detector actually detects
        run: python3 .github/scripts/verify-gate-18.py

      # Gate 19 — the watchdog's annotation collector ("Collect: annotations")
      # sees every page. `gh api --paginate` applies its `--jq` filter to each
      # page separately and concatenates the raw outputs; a filter that wraps
      # its result in `[...]` (or no `--jq` at all, feeding a separate
      # array-collecting `jq` pass downstream, this step's pre-fix shape)
      # silently drops every annotation past page 1 under `set -uo pipefail`
      # with no `-e` — the failure never surfaces, it just reads as "nothing
      # to report" (spec 036, issue #182). Nothing exercised this step before
      # this feature; Gate 9 covers only its neighbor, "Collect: step
      # summaries". Same discipline as Gate 9: the shipped step is extracted
      # and executed against synthetic multi-page `gh` responses, and a
      # mutation reintroduces the array-collecting shape to prove the suite
      # can fail.
      - name: Gate 19 — the watchdog's annotation collector sees every page
        run: python3 .github/scripts/verify-gate-19.py

      # Gate 20 — wing-commander-tool-args's declared and emitted outputs
      # agree, in both directions, with each other and with the published
      # contract. `shell-commands` shipped in #214 already emitted and
      # already declared in action.yml's own outputs: block, but with no
      # check keeping it that way — this is the machine check
      # specs/037-rendered-tooling-list exists to add (research.md D9).
      - name: Gate 20 — every output the tool-args composite emits is declared, and every declared output is emitted
        run: python3 .github/scripts/verify-tool-args-contract.py

      # Gate 21 — the tooling statement wing-commander-tool-args hands a
      # stage's prompt matches what that run's composed tool lists actually
      # permit. The render walked the allowed list alone with no
      # subtraction, no bare-Bash case, and no exact/prefix distinction, so
      # a denied command could still read as permitted (research.md D8).
      - name: Gate 21 — the tooling statement matches what the run actually permits
        run: python3 .github/scripts/verify-tooling-statement.py

      # Gate 22 — wing-commander-agent-verdict (specs/037-agent-turn-budget-guard/)
      # classifies a transcript correctly. Same discipline as Gate 11: the
      # shipped run: block, extracted and executed against synthetic
      # transcripts covering healthy-but-would-be-rejected, genuinely errored,
      # exhausted, and unreadable, plus mutations reintroducing each defect
      # class (reading is_error/subtype from the wrong record, collapsing
      # unclassifiable/failed together, computing over-budget from the
      # reported rather than counted total) to prove the suite can go red.
      - name: Gate 22 — the agent verdict composite classifies transcripts correctly
        run: python3 .github/scripts/verify-agent-verdict.py

      # Gate 23 — every agent call site carries the full ceiling/verdict/
      # fail-loud protection, dynamically enumerated (YAML-parsed, never
      # grepped) rather than checked against a maintained list — the same
      # "derive, don't hardcode" discipline Gates 6/7/12 already use. This is
      # the mechanical proof that closes issue #193 for good: the real defect
      # was fixed once by hand at one site and re-hit 31 hours later at
      # another, unfixed one. A site missing any of the four pieces, or whose
      # ceiling has regressed back to a literal/raw `inputs.max-turns`
      # passthrough (User Story 3 Acceptance Scenario 3), fails by name.
      - name: Gate 23 — every agent call site carries the full turn-budget protection
        run: python3 .github/scripts/verify-gate-23.py

      # Gate 23 says nothing about whether Gate 23 works — same reasoning as
      # Gates 7/15/16/18's self-tests: the fleet this runs against should stay
      # uniformly compliant, so a green Gate 23 could just as easily mean its
      # detection is broken.
      - name: Gate 23 self-test — the detector actually detects
        run: python3 .github/scripts/verify-gate-23-selftest.py

      # Gate 24 — the placement half of Gate 23. Gate 23 asserts every agent
      # call site HAS a fail-loud step; it says nothing about where that step
      # sits, and PR #221 shipped five sites where it sat directly above the
      # deterministic fallback its own `continue-on-error` existed for.
      # `continue-on-error: true` is a promise that something below handles
      # the failure; a later hard exit on that same failure skips everything
      # unprotected beneath it, so the handler becomes unreachable dead code
      # that still reads, top to bottom, as a present and correct safety net.
      # Deliberately narrow — it fires only when the guard tests a tolerated
      # signal NEGATIVELY and a later unprotected, non-mutually-exclusive
      # step reads that same signal — because the fleet is full of hard exits
      # that strand later steps entirely correctly.
      - name: Gate 24 — a guard does not strand the degradation path it fires on
        run: python3 .github/scripts/verify-gate-24.py

      # Same reasoning as Gate 23's self-test, and more load-bearing here:
      # Gate 24's three clauses each exclude a whole family of legitimate
      # hard exits, so the way it breaks is not "crashes" but "quietly stops
      # matching anything", which is indistinguishable from a compliant
      # fleet. One fixture per clause, in both directions.
      - name: Gate 24 self-test — the detector actually detects
        run: python3 .github/scripts/verify-gate-24-selftest.py

      # specs/039-lifecycle-gate-retry: run 31597186484 died at
      # wing-commander-lifecycle-gate's single `gh issue view` read on a
      # transient HTTP 502 — one attempt, no retry, and the reported error
      # asserted the issue "may not exist, or the token lacks issues: read"
      # (neither true) because only stdout was ever captured. This drives
      # the shipped step against a stubbed gh: a transient failure must be
      # retried and eventually succeed, a permanent failure (not-found,
      # credential-rejected) must fail after exactly one attempt, and every
      # reported failure must quote what the API actually said. Gate 14's
      # shape — one script, its own mutation coverage inline, no separate
      # self-test step — since this gate directly executes the shipped
      # step's own bash against stubs rather than detecting drift elsewhere.
      - name: Gate 25 — the lifecycle gate retries transient failures and fails fast on permanent ones
        run: python3 .github/scripts/verify-lifecycle-gate-retry.py

      # Gate 30 — specs/040-truncated-cycle-carry-forward: a cycle that runs
      # out of its turn budget must be carried forward (no escalated redo,
      # no cold-start of the next cycle) ONLY when the lifecycle record
      # advanced AND the branch shows real progress, and must NEVER be
      # reported converged merely because it never reached the step that
      # writes a converge: commit. Drives the shipped "Read back cycle
      # outcome"/"Read back retry outcome"/"Consolidate final outcome"/
      # "Record truncated-cycle count"/"Dispatch next step" run: blocks
      # directly out of implement.yml against synthetic git history and a
      # stubbed upstream verdict (research.md D8). Numbered 30, not 26 — 26
      # was already in use by the release-tag versioning-refs gate below
      # (see "Gate 26 — every release tag is annotated and every vX is
      # current").
      - name: Gate 30 — a turn-exhausted cycle is classified truncated only with positive evidence, and carried forward without ever reporting converged
        run: python3 .github/scripts/verify-truncated-cycle-carry-forward.py

      # Gate 22 — specs/038-runner-container-passthrough FR-007: an adopter
      # binds a whole stage's jobs to their own runner/container image with
      # two inputs and two secrets, and the contract is that the binding is
      # uniform — EVERY job in the stage carries the exact runs-on:/
      # container: block, with no hidden per-job selector. A job that
      # silently lacks the block is the worst possible shape of that defect:
      # it keeps running on ubuntu-latest with no container while the rest of
      # the stage moved, and nothing in the UI says so. The 33 bindings were
      # placed by hand (T006-T016) and only ever verified by hand.
      #
      # Extends Gate 7's shape (specs/031-stage-environment-binding) from one
      # binding to three: the runs-on: ternary, container.image, and
      # container.credentials.username/password. The stage set is DERIVED
      # (any workflow declaring on.workflow_call), never listed — a hardcoded
      # list is how watchdog.yml and auto-update-spec-kit.yml went unlinted
      # by release.yml's Gate 1a for a whole release (issue #149).
      - name: Gate 22 — every job of every published stage carries the runner/container-image passthrough
        run: |
          python3 - <<'PYEOF'
          import glob, os, re, sys, yaml

          # input -> (type, default). The defaults ARE the contract: an
          # unset runner/container-image must reproduce today's behavior
          # byte-for-byte (FR-001, FR-004).
          DECLARED_INPUTS = {"runner": ("string", "ubuntu-latest"),
                              "container-image": ("string", "")}
          # secret -> required flag. Never required: a stage with no image
          # named must never demand a credential (FR-009).
          DECLARED_SECRETS = ("container-registry-username",
                              "container-registry-password")

          # Built via concatenation, never as one literal dollar-brace-brace
          # run of characters: GitHub's own template engine substitutes ANY
          # such span in a run: block before bash/python ever sees it — even
          # one sitting inside a python string inside a single-quoted
          # heredoc — which would corrupt these comparison constants at the
          # SOURCE. Same technique Gate 7's OPEN/CLOSE split uses.
          DOLLAR_OPEN, DOLLAR_CLOSE = "${" + "{", "}" + "}"
          GH_EXPR_RE = re.compile(r"\$\{\{(.*?)\}\}")
          EXPECTED_RUNS_ON = (DOLLAR_OPEN + " startsWith(inputs.runner, '[') && "
                              "fromJSON(inputs.runner) || inputs.runner " + DOLLAR_CLOSE)
          EXPECTED_IMAGE = DOLLAR_OPEN + " inputs.container-image " + DOLLAR_CLOSE

          # (workflow filename, job name) -> reason. Constitution VII: a job
          # that must deviate carries a registered, machine-checked
          # exception naming the reason — never an undeclared one. None
          # exist yet at plan time (contract's own "Registered exceptions"
          # section) — T014 registered no deviation for pr-conversation.act
          # either, since runs-on:/container: bind uniformly with no
          # exception, unlike that job's orthogonal environment: exception.
          EXCEPTIONS = {}

          def norm_expr(s):
              """Collapse whitespace inside every dollar-brace-brace
              expression in a scalar (GH_EXPR_RE, below).

              The gate compares the input/secret a value forwards, not the
              byte string, so a tightly-packed expression and a spaced-out
              one must compare equal.
              """
              if not isinstance(s, str):
                  return s
              def repl(m):
                  return DOLLAR_OPEN + " " + re.sub(r"\s+", " ", m.group(1).strip()) + " " + DOLLAR_CLOSE
              return GH_EXPR_RE.sub(repl, s.strip())

          failures = 0
          stages = bound = 0
          for f in sorted(glob.glob(".github/workflows/*.yml")
                          + glob.glob(".github/workflows/*.yaml")):
              wf = yaml.safe_load(open(f, encoding="utf-8")) or {}
              # PyYAML resolves the bare key `on` to the boolean True (YAML
              # 1.1); quoted "on" stays a string. Accept either.
              on = wf.get(True, wf.get("on"))
              if isinstance(on, dict) and "workflow_call" in on:
                  call = on.get("workflow_call") or {}
              elif isinstance(on, list) and "workflow_call" in on:
                  call = {}
              else:
                  continue          # not a published stage
              stages += 1
              # Named, not just counted — verify-gate-22.py compares this set
              # against wc_published_stages.py's, so two derivations seeing
              # the same NUMBER of different files cannot pass as agreeing.
              print(f"note: {f}: published stage")

              inputs = (call.get("inputs") or {}) if isinstance(call, dict) else {}
              for iname, (itype, idefault) in DECLARED_INPUTS.items():
                  spec = inputs.get(iname)
                  if not isinstance(spec, dict):
                      print(f"::error file={f}::published stage does not declare the "
                            f"{iname!r} workflow_call input, so an adopter cannot bind "
                            f"this stage the way every other stage binds "
                            f"(specs/038-runner-container-passthrough FR-001/FR-004).")
                      failures += 1
                      continue
                  if spec.get("type") != itype or spec.get("default") != idefault:
                      print(f"::error file={f}::input {iname!r} is declared "
                            f"type={spec.get('type')!r} default={spec.get('default')!r}; "
                            f"the contract is type={itype!r} default={idefault!r}. The "
                            f"defaults are load-bearing — they are what makes an unbound "
                            f"adopter's behavior identical to before the feature.")
                      failures += 1

              secrets_decl = (call.get("secrets") or {}) if isinstance(call, dict) else {}
              for sname in DECLARED_SECRETS:
                  spec = secrets_decl.get(sname)
                  if not isinstance(spec, dict) or spec.get("required") is not False:
                      print(f"::error file={f}::published stage does not declare secret "
                            f"{sname!r} with required: false — a stage with no image "
                            f"named must never demand a registry credential (FR-009).")
                      failures += 1

              for jname, job in (wf.get("jobs") or {}).items():
                  job = job or {}
                  if "uses" in job:
                      # A job that calls another workflow runs that
                      # workflow's jobs; the binding belongs to them —
                      # runs-on:/container: are illegal here (contract).
                      print(f"note: {f}: job {jname!r} is a workflow call, not a "
                            f"bindable job — skipped.")
                      continue

                  if jname == "verify-image-prerequisites":
                      # Gate 23 owns this job's shape (research.md D5): it
                      # deliberately carries no container: of its own, so it
                      # can invoke Docker directly on the runner before any
                      # other job's container is created. It still forwards
                      # the runner ternary like every other job
                      # (FR-002/FR-003) — just never gets the container:
                      # check below.
                      runs_on = norm_expr(job.get("runs-on"))
                      ok = True
                      if runs_on != EXPECTED_RUNS_ON:
                          print(f"::error file={f}::job 'verify-image-prerequisites' "
                                f"has runs-on: {job.get('runs-on')!r}; it must carry "
                                f"the exact runner-passthrough ternary like every "
                                f"other job, even though it never gets a container: "
                                f"block (FR-002/FR-003).")
                          failures += 1
                          ok = False
                      # Declared, never inherited. This job runs docker
                      # login/pull/run against the adopter's registry and
                      # makes no GitHub API call, so its correct grant is
                      # zero — but nine stage files reach zero only because
                      # their FILE-level permissions happen to be empty,
                      # while watchdog.yml and auto-update-spec-kit.yml
                      # carry the wide grants their other jobs need. Asking
                      # for the block on the job itself makes the grant a
                      # property of this job rather than of whichever file
                      # it sits in, so a future change to a file's top-level
                      # permissions cannot widen it by accident.
                      if job.get("permissions") != {}:
                          print(f"::error file={f}::job 'verify-image-prerequisites' "
                                f"declares permissions: {job.get('permissions')!r}; it "
                                f"must declare an explicit empty grant "
                                f"(permissions: {{}}). Omitting the block inherits the "
                                f"file's top-level grants, which in watchdog.yml and "
                                f"auto-update-spec-kit.yml are contents/issues/"
                                f"pull-requests write — handed to a job whose whole "
                                f"body is a docker pull of an adopter-named image.")
                          failures += 1
                          ok = False
                      bound += ok
                      continue

                  reason = EXCEPTIONS.get((os.path.basename(f), jname))
                  if reason is not None:
                      print(f"note: {f}: job {jname!r} is a registered Gate 22 "
                            f"exception — {reason}")
                      bound += 1
                      continue

                  ok = True
                  runs_on = norm_expr(job.get("runs-on"))
                  if runs_on != EXPECTED_RUNS_ON:
                      print(f"::error file={f}::job {jname!r} has runs-on: "
                            f"{job.get('runs-on')!r}; every job of every published "
                            f"stage must carry the exact runner-passthrough ternary "
                            f"so a JSON-array runner selection reaches it "
                            f"(FR-002/FR-003/FR-007).")
                      failures += 1
                      ok = False

                  container = job.get("container")
                  if not isinstance(container, dict):
                      print(f"::error file={f}::job {jname!r} has no container: "
                            f"mapping block. An adopter who names a container-image "
                            f"gets it on every OTHER job and not this one — the stage "
                            f"looks containerized while this job runs bare, with "
                            f"nothing to see in the UI (FR-004/FR-007).")
                      failures += 1
                      ok = False
                  else:
                      image = norm_expr(container.get("image"))
                      if image != EXPECTED_IMAGE:
                          print(f"::error file={f}::job {jname!r} wires container.image "
                                f"to {container.get('image')!r}; the contract requires "
                                f"{EXPECTED_IMAGE!r} verbatim, or this job's container "
                                f"selection diverges from the rest of its own stage.")
                          failures += 1
                          ok = False
                      # The inverse of what this gate asserted when it
                      # shipped, and the reason every job of every stage
                      # failed to start once #224 let them run at all.
                      # Measured against real runners (probe PR #226,
                      # 2026-08-21), a job-level credentials: mapping:
                      #   - is a template error when either value renders
                      #     empty -- which is every run that names no image,
                      #     and every run that names a public one;
                      #   - cannot be made absent by an expression: the
                      #     whole mapping may be supplied as an object
                      #     (fromJSON), but null is rejected the same way an
                      #     empty string is;
                      #   - is always acted on when present, so a
                      #     placeholder pair fails the docker login for a
                      #     public image.
                      # No single block serves both a public image and a
                      # private one, so the key stays out. Private
                      # registries need a pre-authenticated runner until a
                      # verified mechanism exists (#227).
                      if "credentials" in container:
                          print(f"::error file={f}::job {jname!r}'s container: block "
                                f"declares credentials:. Once that key is written it "
                                f"can never be absent, and an empty value is a template "
                                f"error that stops the job before its first step — "
                                f"which is every run that names no image. Private "
                                f"registries need a pre-authenticated runner instead "
                                f"(#227, measured in PR #226).")
                          failures += 1
                          ok = False
                  bound += ok

          print(f"Gate 22: {stages} published stage(s), {bound} bound job(s); "
                f"{failures} failure(s).")
          if stages == 0:
              # Every stage file vanishing (or an `on:` shape this gate no
              # longer recognizes) must not read as a pass.
              print("::error::Gate 22 found no workflow declaring on.workflow_call — it "
                    "checked nothing. Either the published stages moved or this gate's "
                    "detection of them has broken.")
              sys.exit(1)
          sys.exit(1 if failures else 0)
          PYEOF

      # Same reasoning as Gate 7's self-test: this gate's whole value is
      # firing on a defect that nobody has made yet, and the fleet it runs
      # against is (and should stay) uniform, so a green Gate 22 says
      # nothing about whether Gate 22 works.
      - name: Gate 22 self-test — the detector actually detects
        run: python3 .github/scripts/verify-gate-22.py

      # Gate 23 — specs/038-runner-container-passthrough FR-010/FR-011: an
      # adopter-named container image must be checked for every required
      # tool, and the registry-credential failure path must say why it
      # failed, BEFORE any agent-bearing job's own container is created —
      # research.md D4/D5 established that no step inside that job can ever
      # improve a failed pull's error message or inspect the image's
      # contents beforehand, so the check has to live in a separate job
      # (verify-image-prerequisites) that every entry job and every
      # always()/!cancelled()-style survival job depends on. FR-011a further
      # requires the canonical tool list itself to stay truthful — checked
      # against actual `run:` invocations, not just asserted once at plan
      # time. T018-T028 wired all three by hand across eleven files.
      - name: Gate 23 — every published stage checks adopter-chosen image prerequisites before any real job starts
        run: |
          python3 - <<'PYEOF'
          import glob, os, re, sys, yaml

          STATUS_FN = re.compile(r"\b(always|success|failure|cancelled)\s*\(")
          TOOLS_PATH = ".github/scripts/required-tools.txt"
          # The published document required-tools.txt's own header names as
          # the contract the canonical list implements, and which claims in
          # its own prose to be "kept in agreement with reality by Gate 23".
          # It was not: nothing compared the two, and the table stood at
          # seven tools while the canonical list gained `timeout` as an
          # eighth. A promise a document makes about a gate is worth
          # whatever the gate actually checks, so the gate checks it here.
          CONTRACT_PATH = ("specs/038-runner-container-passthrough/contracts/"
                           "runner-container-passthrough.md")
          # First backticked token of a row's first cell: `node` (Node.js
          # runtime) is one entry, not two. Matched only between the table's
          # own header row and the blank line that ends it, so a backticked
          # tool name in the surrounding prose is not a declaration.
          CONTRACT_HEADER_RE = re.compile(
              r"^\|\s*Tool\s*\|\s*Basis\s*\|\s*$")
          CONTRACT_TOOL_RE = re.compile(r"`([^`]+)`")
          # The literal list each stage's tool-check step embeds. Quoted
          # either way, since the shell accepts both and a future edit
          # should not have to know which one this gate keys on.
          REQUIRED_TOOLS_RE = re.compile(r"""REQUIRED_TOOLS=(["'])(.*?)\1""")

          def contract_tools(path):
              """The tool names declared by the contract's canonical table.

              Returns None when the table cannot be found at all, which is a
              failure in its own right: a parser that silently returns an
              empty set turns a moved heading into "the contract declares
              nothing", and an empty set compares equal to nothing anybody
              would notice.
              """
              try:
                  lines = open(path, encoding="utf-8").read().splitlines()
              except OSError:
                  return None
              tools, in_table = [], False
              for raw in lines:
                  line = raw.strip()
                  if not in_table:
                      in_table = bool(CONTRACT_HEADER_RE.match(line))
                      continue
                  if not line.startswith("|"):
                      break          # the blank line after the table
                  cell = line.strip("|").split("|")[0].strip()
                  if not cell.strip("-: "):
                      continue       # the header/body separator row
                  m = CONTRACT_TOOL_RE.search(cell)
                  # No backticks: keep the raw cell rather than dropping the
                  # row. A row this parser cannot read must surface as a name
                  # nothing recognises (a loud set difference), never as one
                  # fewer tool declared, which is silence.
                  tools.append(m.group(1) if m else cell)
              return tools if in_table else None

          def needs_of(spec):
              n = (spec or {}).get("needs") or []
              return [n] if isinstance(n, str) else list(n)

          def has_result_guard(spec):
              """The explicit result guard a status-guarded job must carry.

              Only jobs with a status-check function need this: that function
              is what defeats ordinary skip-propagation, so without a guard
              of their own they would run straight past a failed image check.
              Everything else is gated by propagation and must NOT restate it
              (#224 — a restatement that GitHub never evaluates reads like a
              working guard for as long as it takes someone to lose a day).

              Checked as substrings rather than one exact regex: the real
              jobs combine this clause with their own prior condition in
              different orders (`always() && (...)` vs `(...) && needs.x`),
              and a byte-exact match would be more brittle than the property
              it is verifying.
              """
              iftext = " ".join(str((spec or {}).get("if", "") or "").split())
              return "needs.verify-image-prerequisites.result == 'success'" in iftext

          failures = 0
          stages = 0
          embedded = {}
          for f in sorted(glob.glob(".github/workflows/*.yml")
                          + glob.glob(".github/workflows/*.yaml")):
              wf = yaml.safe_load(open(f, encoding="utf-8")) or {}
              on = wf.get(True, wf.get("on"))
              if isinstance(on, dict) and "workflow_call" in on:
                  call = on.get("workflow_call") or {}
              elif isinstance(on, list) and "workflow_call" in on:
                  call = {}
              else:
                  continue          # not a published stage
              stages += 1
              print(f"note: {f}: published stage")

              jobs = wf.get("jobs") or {}
              if not isinstance(jobs, dict):
                  jobs = {}

              vip = jobs.get("verify-image-prerequisites")
              if not isinstance(vip, dict):
                  print(f"::error file={f}::published stage has no "
                        f"verify-image-prerequisites job — an adopter-chosen "
                        f"container image is never checked for required tools or a "
                        f"credential failure before an agent-bearing job's own "
                        f"container is created (FR-010/FR-011).")
                  failures += 1
              else:
                  # The inversion of #224. A job-level `if:` here is not a
                  # cheap no-op: GitHub's implicit success() spans a job's
                  # whole needs-CLOSURE, so a SKIPPED check silently
                  # suppresses every job of the stage that carries no
                  # status-check function — which, when the condition is
                  # `container-image != ''`, is every ordinary run. The
                  # condition belongs on the step, one level down, where
                  # skipping costs idle seconds instead of the pipeline.
                  if "if" in vip:
                      print(f"::error file={f}::verify-image-prerequisites carries a "
                            f"job-level if: ({vip.get('if')!r}). This job must never "
                            f"skip: a skipped job suppresses its entire descendant "
                            f"closure regardless of what those jobs' own if: say, so "
                            f"skip-conditioning the check turns the whole stage into a "
                            f"silent no-op (#224). Condition the STEP instead.")
                      failures += 1
                  vip_steps = [s for s in (vip.get("steps") or []) if isinstance(s, dict)]
                  unguarded = [s for s in vip_steps
                               if " ".join(str(s.get("if", "") or "").split())
                               != "inputs.container-image != ''"]
                  if not vip_steps or unguarded:
                      print(f"::error file={f}::every step of "
                            f"verify-image-prerequisites must carry "
                            f"if: inputs.container-image != '' — that is what keeps the "
                            f"always-running check a no-op when no image is named "
                            f"(FR-006, as re-established by #224).")
                      failures += 1
                  if "container" in vip:
                      print(f"::error file={f}::verify-image-prerequisites declares "
                            f"its own container: block; it must run directly on the "
                            f"runner so it can invoke Docker itself, before any other "
                            f"job's own container is created (contract).")
                      failures += 1
                  # The list this job actually checks, harvested for the
                  # comparison against required-tools.txt below. That file's
                  # own header promises this gate makes it; until it did,
                  # the twelve copies agreed by hand-coordination alone
                  # (found in review of PR #222).
                  vip_run = chr(10).join(str((s or {}).get("run", "") or "")
                                        for s in (vip.get("steps") or [])
                                        if isinstance(s, dict))
                  m = REQUIRED_TOOLS_RE.search(vip_run)
                  if m is None:
                      print(f"::error file={f}::verify-image-prerequisites embeds no "
                            f"REQUIRED_TOOLS= list, so there is nothing for FR-011a to "
                            f"hold against {TOOLS_PATH}, and nothing proving this "
                            f"stage checks the same tools as the other ten.")
                      failures += 1
                  else:
                      embedded[f] = set(m.group(2).split())

              for jname, job in sorted(jobs.items()):
                  if jname == "verify-image-prerequisites" or not isinstance(job, dict):
                      continue
                  if "uses" in job:
                      continue      # a workflow-call job has no if:/needs: to gate

                  needs_other = [n for n in needs_of(job)
                                if n != "verify-image-prerequisites"]
                  is_entry = not needs_other
                  guarded = bool(STATUS_FN.search(str(job.get("if", "") or "")))
                  if not (is_entry or guarded):
                      # Ordinary needs: skip-propagation already gates this
                      # job transitively — no separate wiring required or
                      # wanted (contract's "downstream job... needs no
                      # separate wiring" rule).
                      continue

                  if "verify-image-prerequisites" not in needs_of(job):
                      why = ("is an entry job (no other in-stage predecessor)" if is_entry
                            else "is guarded by a status-check function "
                                 "(always()/success()/failure()/cancelled()), which "
                                 "defeats ordinary needs: skip-propagation")
                      print(f"::error file={f}::job {jname!r} {why} and must directly "
                            f"depend on verify-image-prerequisites, but its needs: "
                            f"does not name it. A real image-check failure would "
                            f"never stop this job (FR-010/FR-011).")
                      failures += 1
                      continue

                  if guarded and not has_result_guard(job):
                      print(f"::error file={f}::job {jname!r} needs "
                            f"verify-image-prerequisites and carries a status-check "
                            f"function, which defeats ordinary skip-propagation, but "
                            f"its if: does not check "
                            f"needs.verify-image-prerequisites.result == 'success'. "
                            f"It would run unchecked past a real image-prerequisite "
                            f"failure.")
                      failures += 1
                  if not guarded and "verify-image-prerequisites.result" in str(
                          job.get("if", "") or ""):
                      print(f"::error file={f}::job {jname!r} tests "
                            f"needs.verify-image-prerequisites.result without a "
                            f"status-check function of its own. GitHub's implicit "
                            f"success() over needs: means that test is never read — "
                            f"propagation alone already gates this job. Delete the "
                            f"clause (#224); Gate 15 catches the general shape.")
                      failures += 1

          # FR-011a — the canonical list (data-model.md "Image prerequisite
          # contract") must not be missing a tool a run: block anywhere in
          # the repository actually invokes, or Gate 23's own wiring check
          # above is enforcing a contract nobody can satisfy honestly.
          tools_path = TOOLS_PATH
          try:
              canonical = {ln.split("#", 1)[0].strip()
                          for ln in open(tools_path, encoding="utf-8")}
              canonical = {t for t in canonical if t}
          except OSError:
              print(f"::error file={tools_path}::Gate 23 could not read the canonical "
                    f"required-tool list — FR-011a's drift check cannot run.")
              failures += 1
              canonical = set()

          # FR-011a's third reader. required-tools.txt's header names
          # contracts/runner-container-passthrough.md as the document it
          # implements, and that document says of its own table that it is
          # "kept in agreement with reality by Gate 23". Nothing checked it,
          # so the two drifted in the quietest possible direction: the
          # canonical list gained `timeout` and the published contract an
          # adopter reads kept promising seven tools. Set difference, both
          # directions, because either one is a lie to a different reader —
          # an adopter under-provisions their image, or they provision for a
          # tool nothing asks of them.
          declared = contract_tools(CONTRACT_PATH)
          if declared is None:
              print(f"::error file={CONTRACT_PATH}::Gate 23 (FR-011a): could "
                    f"not find the canonical tool-list table (a `| Tool | "
                    f"Basis |` header) in the contract {TOOLS_PATH} names as "
                    f"the document it implements. Either the table moved, the "
                    f"document did, or this parser has broken — and until it "
                    f"is fixed the published contract is unchecked again.")
              failures += 1
          elif canonical:
              missing = sorted(canonical - set(declared))
              extra = sorted(set(declared) - canonical)
              if missing or extra:
                  print(f"::error file={CONTRACT_PATH}::Gate 23 (FR-011a): the "
                        f"published image-prerequisite contract and {TOOLS_PATH} "
                        f"name different tools. In {TOOLS_PATH} but not in the "
                        f"contract table: {missing or '(none)'} - an adopter "
                        f"reading the contract under-provisions their image and "
                        f"finds out at run time. In the contract table but not "
                        f"in {TOOLS_PATH}: {extra or '(none)'} - the contract "
                        f"demands something nothing checks or needs. Add the "
                        f"row (with its basis) or drop it.")
                  failures += 1
              if len(declared) != len(set(declared)):
                  print(f"::error file={CONTRACT_PATH}::Gate 23 (FR-011a): the "
                        f"contract's tool table lists a tool twice, so the set "
                        f"comparison above can agree while the table itself "
                        f"contradicts what a reader counts.")
                  failures += 1

          # FR-011a in the direction required-tools.txt's own header
          # promises: every stage's embedded list must BE the canonical
          # list. The drift scan further down catches a tool INVOKED but not
          # canonical; this catches the twelve copies disagreeing with each
          # other, which no amount of run:-block scanning can see — the
          # embedded list is a shell assignment (never tokenized as an
          # invocation) and the check loop iterates the variable, not the
          # tool names.
          #
          # Skipped when canonical is empty: the unreadable-file error above
          # has already fired, and eleven cascade errors would bury it.
          if canonical:
              for f, tools in sorted(embedded.items()):
                  if tools != canonical:
                      absent = sorted(canonical - tools)
                      extra = sorted(tools - canonical)
                      print(f"::error file={f}::verify-image-prerequisites checks a "
                            f"tool list that is not the canonical one. Missing from "
                            f"this stage: {absent or '(none)'}. Present here but not "
                            f"in {tools_path}: {extra or '(none)'}. An adopter whose "
                            f"image lacks a tool this stage forgot to check gets a "
                            f"runtime failure blamed on their image; a stage that "
                            f"checks a tool the contract disowns enforces a promise "
                            f"nobody else makes.")
                      failures += 1
              agree = sum(1 for t in embedded.values() if t == canonical)
              print(f"note: {len(embedded)} stage(s) embed a REQUIRED_TOOLS list; "
                    f"{agree} agree with {tools_path}.")

          # Tools this repository's OWN CI relies on but that no published
          # stage's steps invoke inside an adopter's container — they run on
          # the bare runner (or inside a composite action) that lint-
          # workflows.yml itself uses, never inside inputs.container-image.
          # Recorded here, not silently absorbed by a token blacklist, so a
          # tool moved INTO a published stage's own run: block still trips
          # this check the next time someone edits this list.
          MAINTENANCE_ONLY = {
              "actionlint", "yamllint", "shellcheck", "npm", "npx", "pip",
              "pip3", "docker", "act",
          }
          # POSIX shell builtins and coreutils assumed present on any Linux
          # image capable of running bash at all — the same bar research.md
          # D6 applied when it seeded the canonical list from what this
          # repository's OWN run: blocks invoke rather than an exhaustive
          # POSIX audit. Not itself part of the adopter contract (FR-011's
          # canonical list stays deliberately narrow); this set exists only
          # so this check does not flag `echo`/`mkdir`/`sed` as "newly
          # invoked tools" on every single PR.
          #
          # `timeout` used to be in here and is now canonical instead
          # (specs/039-lifecycle-gate-retry). A tool must not be in both:
          # the canonical subtraction below already covers it, so the
          # entry here would be dead, and a reader checking whether the
          # adopter contract covers a tool would find it listed as one the
          # contract deliberately does NOT cover. That contradiction is
          # what let a hard `timeout` dependency reach eleven stages
          # unregistered — the tool was invoked, the drift scan subtracted
          # it as always-available, and nothing asked the image for it.
          ALWAYS_AVAILABLE = {
              "alias", "awk", "base64", "basename", "bg", "break", "case",
              "cat", "cd", "chmod", "chown", "cmp", "comm", "command",
              "continue", "cp", "cut", "date", "dd", "declare", "diff",
              "dirname", "do", "done", "echo", "egrep", "elif", "else",
              "env", "esac", "eval", "exec", "exit", "export", "expr",
              "false", "fg", "fi", "find", "fold", "for", "function",
              "getopts", "grep", "head", "history", "if", "in", "jobs",
              "join", "kill", "let", "ln", "local", "ls", "md5sum",
              "mkdir", "mktemp", "mv", "nohup", "od", "paste", "printenv",
              "printf", "ps", "pwd", "read", "readlink", "realpath", "return",
              "rev", "rm", "rmdir", "sed", "select", "seq", "set",
              "sha1sum", "sha256sum", "shift", "sleep", "sort", "source",
              "split", "tac", "tail", "tar", "tee", "test", "then", "time",
              "touch", "tr", "trap", "true", "type", "uname",
              "unalias", "uniq", "unset", "until", "wait", "wc", "while",
              "xargs", "xxd", "yes", "gzip", "gunzip", "zip", "unzip",
              "mapfile", "readarray", "popd", "pushd", "dirs", "hash",
              "ulimit", "umask", "compgen", "complete",
          }
          # Shell keyword/operator tokens that a naive first-word split can
          # still surface (e.g. after a line continuation or a `then` on its
          # own line) — never a tool invocation.
          #
          # DOLLARSUBST and GHEXPR are this tokenizer's OWN output, not
          # anything an author wrote: strip_command_substitutions replaces
          # every well-formed command substitution with the first, and the
          # GHEXPR.sub below replaces every dollar-brace-brace expression
          # with the second, precisely so neither can be split on. Both
          # match TOKEN_RE, so a statement that STARTS with either idiom —
          # `$(resolve-tool) --check`, or the documented Actions form
          # `<expr> --check` — would otherwise be reported as "a run: block
          # invokes dollarsubst", naming a tool that does not exist and
          # sending the author into this gate's internals to find out why.
          # No run: block starts a statement that way today; this is here so
          # the first one that does gets a real error or none, not a riddle.
          NOT_A_COMMAND = ALWAYS_AVAILABLE | {"[", "[[", "]]", "]", "{", "}",
                                              "DOLLARSUBST", "GHEXPR"}

          HEREDOC_OPEN = re.compile(r"<<[-~]?\s*['\"]?(\w+)['\"]?")
          TOKEN_RE = re.compile(r"^[A-Za-z][A-Za-z0-9_.+-]*$")

          def run_texts():
              """Every run: script body in workflows and composite actions."""
              paths = (glob.glob(".github/workflows/*.yml")
                      + glob.glob(".github/workflows/*.yaml")
                      + glob.glob(".github/actions/**/action.yml", recursive=True)
                      + glob.glob(".github/actions/**/action.yaml", recursive=True))
              for path in sorted(set(paths)):
                  doc = yaml.safe_load(open(path, encoding="utf-8")) or {}
                  steps = []
                  if "jobs" in doc:
                      for job in (doc.get("jobs") or {}).values():
                          steps.extend((job or {}).get("steps") or [])
                  if "runs" in doc:
                      steps.extend(((doc.get("runs") or {}).get("steps")) or [])
                  for step in steps:
                      run = (step or {}).get("run")
                      if isinstance(run, str):
                          yield path, run

          # A `case "$x" in` arm — `skipped|cancelled)`, `*)`, or a one-liner
          # like `OWNER|MEMBER) echo authorized=true ;;` — uses `|` to mean
          # "or" between patterns, not a shell pipe, and the first `)` ends
          # the pattern, not a subshell. Matched only at the START of a
          # line (a bare `<pattern>)` prefix with no unmatched `(` before
          # it — case arms are the only valid bash shape with that
          # signature), so a real command is never mistaken for one; the
          # prefix is dropped and whatever follows the `)` is still
          # tokenized normally.
          CASE_ARM_PREFIX = re.compile(r'^([A-Za-z0-9_*.\[\]?"\'|-]+)\)(.*)$')

          def strip_heredocs(script):
              """Remove every heredoc BODY *and* its opening/closing marker
              lines entirely, so an embedded python/JS/jq script's prose and
              function names never reach the shell tokenizer below, and the
              bare closer token itself (PYEOF, EOF, ...) is never mistaken
              for a command. Also strips a leading `case` arm pattern off
              any line that opens with one (CASE_ARM_PREFIX, above).
              """
              lines = script.splitlines()
              out = []
              i = 0
              while i < len(lines):
                  stripped = lines[i].strip()
                  m = HEREDOC_OPEN.search(stripped)
                  if m and not stripped.startswith("#"):
                      closer = m.group(1)
                      i += 1
                      while i < len(lines) and lines[i].strip() != closer:
                          i += 1
                      i += 1  # skip the closer line too
                      continue
                  m2 = CASE_ARM_PREFIX.match(stripped)
                  out.append(m2.group(2) if m2 else lines[i])
                  i += 1
              return "\n".join(out)

          def shell_segments(text):
              """Split a whole shell script into top-level statements.

              Quote/paren state is tracked across the ENTIRE text, not reset
              per line — this repository's `--jq '<filter>'` arguments
              routinely span many lines inside one single-quoted string, and
              jq's own `|` inside that string is not a shell pipe. A `\\`
              immediately before a newline is a line continuation, not a
              statement break. A `#` only starts a comment at the start of a
              word (outside quotes), matching real shell behavior.
              """
              segments, current = [], []
              in_s = in_d = in_comment = False
              depth = 0
              at_word_start = True
              i, n = 0, len(text)
              while i < n:
                  ch = text[i]
                  if in_comment:
                      if ch == "\n":
                          in_comment = False
                          segments.append("".join(current))
                          current = []
                          at_word_start = True
                      i += 1
                      continue
                  if in_s:
                      current.append(ch)
                      in_s = ch != "'"
                      i += 1
                      continue
                  if in_d:
                      current.append(ch)
                      if ch == "\\" and i + 1 < n:
                          current.append(text[i + 1])
                          i += 2
                          continue
                      in_d = ch != '"'
                      i += 1
                      continue
                  if ch == "\\" and i + 1 < n and text[i + 1] == "\n":
                      current.append(" ")
                      i += 2
                      continue
                  if ch == "'":
                      in_s = True
                      current.append(ch)
                      i += 1
                      at_word_start = False
                      continue
                  if ch == '"':
                      in_d = True
                      current.append(ch)
                      i += 1
                      at_word_start = False
                      continue
                  if ch == "(":
                      depth += 1
                      current.append(ch)
                      i += 1
                      at_word_start = False
                      continue
                  if ch == ")":
                      depth = max(0, depth - 1)
                      current.append(ch)
                      i += 1
                      at_word_start = False
                      continue
                  if depth == 0:
                      if ch == "#" and (at_word_start
                                        or (current and current[-1] in " \t")):
                          in_comment = True
                          i += 1
                          continue
                      if text[i:i + 2] in ("&&", "||"):
                          segments.append("".join(current))
                          current = []
                          i += 2
                          at_word_start = True
                          continue
                      if ch in "|;\n":
                          segments.append("".join(current))
                          current = []
                          i += 1
                          at_word_start = True
                          continue
                  at_word_start = ch in " \t"
                  current.append(ch)
                  i += 1
              segments.append("".join(current))
              return segments

          GHEXPR = re.compile(r"\$\{\{.*?\}\}", re.S)
          FUNC_DEF = re.compile(
              r"^(?:function\s+)?([A-Za-z_][A-Za-z0-9_-]*)\s*(?:\(\s*\))?\s*\{$")

          def strip_command_substitutions(text):
              """Collapse every well-formed $(...) to one opaque placeholder.

              `"$(git rev-parse ...)"` nests a fresh, independent quoting
              context INSIDE an outer double-quoted string — real bash
              semantics shell_segments' single (in_s, in_d) pair cannot
              represent. Rather than model a full context stack, this finds
              each $(...)'s TRUE matching close-paren with its own local
              quote tracking (so a quoted `)` inside does not end it early)
              and removes the whole span, so shell_segments never sees the
              inner text — including a nested `git rev-parse` — as top-level
              shell syntax. This under-detects tools invoked ONLY inside a
              substitution (a safe false negative), rather than risk
              mis-parsing the surrounding line into fake extra "commands"
              (an unsafe false positive that would block real PRs).
              """
              out = []
              i, n = 0, len(text)
              while i < n:
                  if text[i] == "$" and i + 1 < n and text[i + 1] == "(":
                      depth = 1
                      j = i + 2
                      in_s = in_d = False
                      while j < n and depth > 0:
                          c = text[j]
                          if in_s:
                              in_s = c != "'"
                              j += 1
                              continue
                          if in_d:
                              if c == "\\" and j + 1 < n:
                                  j += 2
                                  continue
                              in_d = c != '"'
                              j += 1
                              continue
                          if c == "'":
                              in_s = True
                          elif c == '"':
                              in_d = True
                          elif c == "(":
                              depth += 1
                          elif c == ")":
                              depth -= 1
                          j += 1
                      out.append("DOLLARSUBST")
                      i = j
                      continue
                  out.append(text[i])
                  i += 1
              return "".join(out)

          def read_word(s, i):
              """Read one whitespace-delimited shell WORD from s[i:], quote-aware.

              `msg="a long quoted sentence; with semicolons | and pipes"` is
              ONE shell word, not a run of whitespace-split python tokens —
              a plain `.split()` after quote-aware segmenting throws that
              information away and treats the sentence's second word as if
              it were a fresh command. This walks character by character,
              staying inside a quote across embedded whitespace, and
              concatenating adjacent quoted/unquoted runs (`foo"bar baz"` is
              one word `foobar baz`) the way bash itself would. Returns
              (word_with_quotes_stripped, next_index) or (None, i) at EOF.
              """
              n = len(s)
              while i < n and s[i] in " \t":
                  i += 1
              if i >= n:
                  return None, i
              buf = []
              while i < n and s[i] not in " \t":
                  c = s[i]
                  if c == "'":
                      i += 1
                      while i < n and s[i] != "'":
                          buf.append(s[i])
                          i += 1
                      i += 1
                      continue
                  if c == '"':
                      i += 1
                      while i < n and s[i] != '"':
                          if s[i] == "\\" and i + 1 < n:
                              buf.append(s[i + 1])
                              i += 2
                              continue
                          buf.append(s[i])
                          i += 1
                      i += 1
                      continue
                  buf.append(c)
                  i += 1
              return "".join(buf), i

          def first_command_word(segment):
              """The command name a segment invokes, or None.

              Walks WORDS (read_word, not python's whitespace .split(), for
              the reason above), skipping a leading negation, subshell/group
              markers, and any run of VAR=value environment assignments —
              `msg="..."` is itself one such word once correctly read, so
              this consumes it whole and moves on, rather than mistaking its
              second quoted word for the command.
              """
              i = 0
              while True:
                  word, i = read_word(segment, i)
                  if word is None:
                      return None
                  if word in ("!", "(", ")", "{", "}", "sudo", "exec", "env",
                              "time", "command"):
                      continue
                  if re.match(r"^[A-Za-z_][A-Za-z0-9_]*=", word):
                      continue
                  return word

          def command_tokens(script):
              """First-word command names from a shell script, best-effort."""
              # GitHub renders every dollar-brace-brace expression to a
              # plain value BEFORE bash ever sees this text — its interior spaces and
              # operators (||, &&, '...') are Actions-expression syntax, not
              # shell syntax, and would otherwise get mis-split into fake
              # extra "commands". Collapsed to one opaque, whitespace-free
              # placeholder before any shell-level tokenizing, same as every
              # $(...) command substitution.
              text = strip_command_substitutions(
                  GHEXPR.sub("GHEXPR", strip_heredocs(script)))
              segments = shell_segments(text)

              # A shell function DEFINITION's own name (`delete_branch() {`,
              # `function foo {`) is not a tool invocation, and every later
              # CALL to that same name in this script is a local call, not
              # an external dependency the adopter's image needs to
              # provide. Collected first so both are excluded below.
              local_funcs = {m.group(1).lower() for m in
                             (FUNC_DEF.match(seg.strip()) for seg in segments) if m}

              tokens = set()
              for segment in segments:
                  word = first_command_word(segment)
                  if word is None:
                      continue
                  if TOKEN_RE.match(word) and word not in NOT_A_COMMAND \
                          and word.lower() not in local_funcs \
                          and word not in ("if", "then", "elif", "else", "fi",
                                            "case", "esac", "do", "done", "for",
                                            "while", "until", "select", "in",
                                            "function"):
                      tokens.add(word.lower())
              return tokens

          invoked = set()
          for path, script in run_texts():
              invoked |= command_tokens(script)

          # The two exclusion sets and the contract must name disjoint
          # tools. An entry in both is dead — the canonical subtraction
          # below already covers it — and worse than dead to read: someone
          # asking "does the adopter contract cover this tool?" finds it
          # listed among the ones the contract deliberately does NOT cover.
          # That contradiction is not hypothetical. `timeout` sat in
          # ALWAYS_AVAILABLE while specs/039 made the lifecycle gate depend
          # on it inside the adopter's container, and nothing here objected
          # for as long as the overlap stood.
          for label, excluded in (("MAINTENANCE_ONLY", MAINTENANCE_ONLY),
                                  ("ALWAYS_AVAILABLE", ALWAYS_AVAILABLE)):
              both = sorted(canonical & excluded)
              if both:
                  print(f"::error file={tools_path}::Gate 23 (FR-011a): "
                        f"{', '.join(both)} is named by BOTH the canonical "
                        f"required-tool list and this gate's {label} "
                        f"exclusion. The two mean opposite things — one says "
                        f"an adopter image must provide the tool, the other "
                        f"says this contract does not cover it. Remove it "
                        f"from {label} if the image must provide it, or from "
                        f"{tools_path} if it must not.")
                  failures += 1

          drift = sorted(invoked - canonical - MAINTENANCE_ONLY - ALWAYS_AVAILABLE)
          if drift:
              print(f"::error file={tools_path}::Gate 23 (FR-011a): a run: block "
                    f"somewhere in this repository invokes {', '.join(drift)}, which "
                    f"is in neither the canonical required-tool list nor a recorded "
                    f"maintenance-only/always-available exclusion. Add it to "
                    f"{tools_path} if a published stage's steps or a shared composite "
                    f"action genuinely needs it inside the adopter's container image, "
                    f"or to this gate's MAINTENANCE_ONLY/ALWAYS_AVAILABLE set if it is "
                    f"runner-level tooling this repository's own CI uses instead.")
              failures += 1

          print(f"Gate 23: {stages} published stage(s), {len(invoked)} distinct "
                f"command token(s) scanned; {failures} failure(s).")
          if stages == 0:
              print("::error::Gate 23 found no workflow declaring on.workflow_call — it "
                    "checked nothing. Either the published stages moved or this gate's "
                    "detection of them has broken.")
              sys.exit(1)
          sys.exit(1 if failures else 0)
          PYEOF

      # Same reasoning as Gate 22's self-test: the fleet this gate runs
      # against is (and should stay) uniform, so a green Gate 23 on the real
      # repository says nothing about whether Gate 23's detection works.
      #
      # This Gate 23 and the turn-budget Gate 23 above it (specs/037-agent-
      # turn-budget-guard) collided on both the gate number and the script
      # filename when this feature's branch rebased onto that one. Both
      # halves now live in .github/scripts/verify-gate-23.py, dispatched by
      # argument — --selftest runs this one.
      - name: Gate 23 self-test — the detector actually detects
        run: python3 .github/scripts/verify-gate-23.py --selftest

      # Gate 27 — the per-stage default tool-list table matches every
      # `wing-commander-tool-args` call site (15 since spec 024 removed
      # watchdog.propose-fix). FR-013/SC-006 promise a
      # consumer can read each stage's defaults out of documentation; that
      # documentation was hand-maintained with nothing holding it to the
      # literals, and had already drifted — the 026 draft was missing both
      # pr-conversation rows while its own prose cited one of them (#147).
      # The draft is now a pointer, so there is one table and one check.
      - name: Gate 27 — the documented per-stage tool lists match the call sites
        run: python3 .github/scripts/verify-stage-tool-lists.py

      - name: Gate 27 self-test — the tool-list check detects what it claims to
        run: python3 .github/scripts/verify-stage-tool-lists.py --self-test

      # Gate 28 — every `gh api` call that carries a field says which method
      # it is using. `gh api` defaults to GET only until it is handed a body:
      # give it `-f`/`-F`/`--field`/`--raw-field`/`--input` without `-X` and
      # it silently switches to POST. pr-conversation.yml's lifecycle-issue
      # lookup read spec-meta.json that way, so its "read" was a create-file
      # request; measured in run 32671719013 it answered `Not Found (HTTP
      # 404)`, then `base64: invalid input`, then the step's own
      # `::error::cannot resolve the lifecycle issue number` — meaning the
      # stage had never once resolved a lifecycle issue in production, and
      # every maintainer review or comment on an implementation PR died
      # there. Nothing about the call site says "POST", which is why the
      # rule is that the author must: a genuine write costs one `-X POST` to
      # state, and then a reader of the diff can see it. Reaches every
      # workflow, composite action and checked-in script under
      # .github/scripts, so the class cannot land again elsewhere. Escape
      # hatch is a same-line or immediately-preceding
      # `# wc-gh-method-exempt: <reason>` comment; a bare one does not count.
      - name: Gate 28 — every `gh api` call that passes a field states its method
        run: python3 .github/scripts/verify-gh-api-explicit-method.py

      # Gate 28 says nothing about whether Gate 28 works — same reasoning as
      # gates 15/16/17/18's self-tests. Twenty-one fixtures (the measured
      # defect, the fix, deliberate `-X POST`/`-X PATCH` writes, each field
      # spelling, a `\`-continued call, and the pipe/quoting false-positive
      # cases) plus eight mutations, each of which must be caught by one.
      - name: Gate 28 self-test — the detector actually detects
        run: python3 .github/scripts/verify-gh-api-explicit-method.py --self-test

      # Gate 29 — cleanup's lifecycle guard. Behavioral, like gates 8/9/14:
      # every cleanup arm opens by reading `issue` and `spec_dir` out of the
      # spec branch's spec-meta.json, and nothing static can see that the two
      # faults were tested in one condition and reported with one message that
      # was false for the common one — spec_dir matched; only `issue` was
      # empty. That refusal also made an outcome UNREACHABLE: a hand-submitted
      # spec carries `"issue": null` on spec/<slug> until its plan PR merges,
      # which is exactly the window mark-stalled fires in (#73, gap 1).
      #
      # The gate executes the shipped step against each state spec-meta.json
      # and the label lookup can be in, requires each refusal to name the
      # fault it actually hit and not another one, requires the spec:<slug>
      # fallback to fire only when `issue` is empty, to accept exactly one
      # labelled issue rather than pick the newest of several, and to treat a
      # failed lookup as its own outcome rather than as "found none" (#188).
      - name: Gate 29 — cleanup's lifecycle guard names the fault it hit and recovers a null issue
        run: python3 .github/scripts/verify-cleanup-lifecycle-guard.py

      # Gate 32 — watchdog.yml's act job never treats an unresolved triage
      # decision as "file it as new" (PR #240 maintainer feedback on spec
      # 024). The "Load triage decision" step's missing-artifact fallback
      # used to set dedup="", which fell through the "Ensure pipeline-defect
      # issue" step's `if:` guard (it only excludes data-integrity/unknown)
      # into the comment-on-existing-issue branch and ran `gh issue comment
      # ""`, failing the job. Nothing exercised the missing-artifact path
      # before this gate — same "a verifier nothing runs is not a verifier"
      # gap Gates 5/9/19 exist to close for their own subjects.
      - name: Gate 32 — the act job's dedup guard stays report-only when the triage decision never arrived
        run: python3 .github/scripts/verify-act-dedup-guard.py

      # Gate 31 — constitution VII's stage-layer rule, at PR time and over
      # every published stage. `release.yml`'s Gate 1b has enforced two
      # thirds of this since spec 010 and got both halves wrong (#149):
      # it runs only on a `workflow_dispatch` release, so it never sees the
      # pull request that introduces a violation; and it greps a hardcoded
      # brace expansion of eight file names when there are eleven
      # `workflow_call`-only stages. watchdog.yml was in neither that list
      # nor actionlint's, and its `vars.*` reads grew 2 → 9 → 15 across
      # four tagged releases with Gate 1b passing every time. That is not a
      # gap between checks — the gate ran and could not see the file, and a
      # PR-time gate carrying the same list would have passed identically.
      # So the stage list is derived (twice, from two readers), and the
      # watchdog's exception is a stale-checked waiver in
      # stage-invariant-waivers.json rather than a name missing from a list.
      #
      # Both subjects already trigger this workflow: `.github/workflows/**`
      # covers the stages, `.github/scripts/**` covers the waiver file.
      # release.yml's Gate 1b now calls this same script, so there is one
      # implementation and the release-time check cannot drift from this one.
      - name: Gate 31 — no published stage reads github.event, vars.*, or inherits secrets
        run: python3 .github/scripts/verify-stage-invariants.py

      # Same reasoning as Gates 22–27's self-tests, and load-bearing here:
      # the fleet this runs against is uniform apart from one waived stage,
      # so a green Gate 31 on the real repository says almost nothing about
      # whether Gate 31's detection — or its waiver staleness checking —
      # works. The fixtures are throwaway repository roots on disk, so
      # discovery, comment stripping and waiver loading are all exercised.
      - name: Gate 31 self-test — the invariant scan detects what it claims to
        run: python3 .github/scripts/verify-stage-invariants.py --self-test
      # Gate 33 — a stage that dies at entry reaches the chain-stop notice,
      # and nothing else does (specs/041-implement-stall-notice). Neither
      # Gate 15 (shape-only: does the `if:` carry a status-check function at
      # all) nor wc_shell_harness-based step-body gates (execute a step's
      # shell, never a job-level `if:`) prove a survivor job's condition is
      # REACHABLE for the failure shapes it claims to admit — this evaluates
      # each of the seven shipped conditions against modelled `needs.*`
      # values instead of inspecting their text (research.md D8). Written
      # against Gate 28 in the plan/tasks/data-model docs that predate this
      # implementation session; by the time this merged, 28 named the
      # gh-api-explicit-method check, 29-31 landed via #243/#235/#244, and
      # 32 via PR #240's act-dedup gate - so this is 33.
      - name: Gate 33 — a stage that dies at entry reaches the chain-stop notice, and nothing else does
        run: python3 .github/scripts/verify-chain-stop-notice.py

      # Gate 34 — specs/042-post-review-fold-loop (research.md D1-D6): a
      # review folds every leg exactly once before any implementation
      # dispatch, dispatch itself happens exactly once per review (not per
      # leg — the defect that cancelled leg 4 and iteration 3 against each
      # other on PR #240), and a leg that dies without folding is reported
      # by name, distinguishing "not folded" from "partly folded", derived
      # only from signals a dead leg never had to publish itself.
      - name: Gate 34 — a review folds every leg once and dispatches once, and a dead leg says so
        run: python3 .github/scripts/verify-fold-dispatch-once.py

      # Gate 35 — specs/042-post-review-fold-loop (research.md D7-D10): a
      # finalize run against an existing OPEN final PR refreshes it instead
      # of skipping — body, lifecycle record, label, re-review request —
      # while a merged or closed PR is reported and left untouched, and the
      # one-PR-per-spec guard's purpose is preserved on every path.
      - name: Gate 35 — finalize refreshes an open final PR, and only an open one
        run: python3 .github/scripts/verify-finalize-refresh.py

      # Gate 36 — #169: the stage-8b watchdog verifier's own failure
      # branches (the two exit-2 fetch guards, the startup_failure shape,
      # the history fallback, and the CREATE_ISSUE dedup arm that carried
      # the #167 read-a-failed-search-as-empty defect) each have a fixture
      # that reaches them, driven through a gh stub that can fail any call
      # (the GH_STUB_FAIL shape from PR #168), with two mutations proving
      # the guards load-bearing.
      - name: Gate 36 — the watchdog verifier's failure branches actually execute
        run: bash .github/scripts/verify-watchdog-run-failure-paths.sh

      # specs/041-implement-stall-notice, User Story 3 — a refusal is still
      # a refusal (FR-006's mutual exclusion, driven against the real
      # preflight shell rather than a modelled reason string), and the four
      # currently-quiet paths (duplicate dispatch, closed lifecycle,
      # successful cycle, cancelled run) stay byte-for-byte quiet across
      # all seven survivor-job conditions.
      - name: A refusal excludes the chain-stop notice, and quiet paths stay quiet
        run: python3 .github/scripts/verify-chain-stop-refusal-exclusion.py

      # Gate 26 self-test — the refs check can tell its failures apart.
      # The live half of Gate 26 runs in the `registered` job below, against
      # the real remote; on a pull request there is nothing to check, because
      # a tag desync is never something the PR introduced. What a PR CAN
      # break is the checker, so that is what runs here.
      - name: Gate 26 self-test — the versioning-refs check detects what it claims to
        run: python3 .github/scripts/verify-versioning-refs.py --self-test

      # Gate 10 — the gates themselves are wired up. Every gate above is a
      # file in .github/scripts that some `run:` line has to name, and
      # verify-denied-tool-collector.sh has already shown what happens when
      # one is not named: it sat orphaned for weeks, drifted out of sync with
      # the filter it checked, and still printed "all assertions passed" when
      # run by hand, so it read as evidence while proving nothing. PR #158
      # wired that one script up; this stops the next one landing the same
      # way, and also catches the reverse — a gate step pointing at a file
      # that has been moved or renamed, whose name in the job list implies a
      # check that is not happening.
      #
      # The rule is a naming convention read off the directory, not a list of
      # gate names: a list is what #149 was, where forgetting to add a file is
      # invisible and a new one is born exempt. Mentioning a script in a
      # comment does not count as running it — that is how an orphan would
      # hide from this check.
      - name: Gate 10 — every check is wired to a workflow, and every wire lands
        run: python3 .github/scripts/verify-gate-wiring.py

  # Gate 4 — behavioral tests for the auto-update-spec-kit stage pair. Gates
  # 1-3 are static: they prove a workflow parses, registers, and is permitted
  # to run. None of them can see that a step's shell logic is simply wrong.
  # The auto-update stage shipped with three such defects — a `git log
  # --follow` invocation that always fatally errored, a verification tier that
  # could never pass because it called check-prerequisites.sh in a mode that
  # requires a file the preceding step does not create, and an absolute path
  # prefixed with its own parent — and every one of them would have fired on
  # the first scheduled run while looking perfectly valid to gates 1-3.
  #
  # The harness EXTRACTS the shipped run: blocks and executes them against a
  # gh stub and throwaway git repos, so it cannot drift from the workflow the
  # way a hand-copied fixture can. See .github/scripts/auto-update-spec-kit-tests/.
  auto-update-spec-kit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Gate 4 — auto-update-spec-kit behavioral tests
        run: bash .github/scripts/auto-update-spec-kit-tests/run-tests.sh

  # Gate 1 — the catch-all. When GitHub cannot parse a workflow file it
  # registers the workflow with its PATH as its name and creates a failed
  # "workflow file issue" run with zero jobs, no annotations, and no error
  # text anywhere in the API. Comparing each file's declared name: against
  # the registered name detects that exactly, whatever the underlying cause.
  # Cannot run on pull_request: the API reports the default branch's state,
  # not the PR's files.
  registered:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Gate 1 — every workflow is registered under its declared name
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # T066: a workflow file that is not on the default branch can carry
          # a STALE registry entry. GitHub creates the entry on first push of
          # the file to ANY branch, and if that first version was genuinely
          # unparseable the entry is path-named — but GitHub then never
          # refreshes the name for a file it does not have on the default
          # branch, so the path-name survives every later fix and this gate
          # reports a file that parses fine as "almost certainly invalid".
          # List what actually exists on the default branch so those can be
          # told apart. Fails CLOSED: if the listing cannot be read, every
          # mismatch is reported exactly as before rather than suppressed.
          DEFAULT_BRANCH="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.default_branch' 2>/dev/null || true)"
          export DEFAULT_BRANCH
          : > on-default.txt
          DEFAULT_LISTING_OK=false
          if [ -n "$DEFAULT_BRANCH" ] && gh api \
              "repos/$GITHUB_REPOSITORY/contents/.github/workflows?ref=$DEFAULT_BRANCH" \
              --jq '.[].path' > on-default.txt 2>/dev/null; then
            DEFAULT_LISTING_OK=true
          fi
          export DEFAULT_LISTING_OK

          # Registration is updated as the push is processed; on a push-
          # triggered run the job can occasionally win that race, so retry
          # before believing a mismatch.
          for attempt in 1 2 3; do
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows" --paginate \
              --jq '.workflows[] | [.path, .name] | @tsv' > registered.tsv || true

            python3 - <<'PYEOF' > result.txt
          import glob, os, yaml

          registered = {}
          for line in open("registered.tsv", encoding="utf-8"):
              path, _, name = line.rstrip("\n").partition("\t")
              registered[path] = name

          # T066: which workflow files are actually ON the default branch.
          # Empty/unreadable => treat every file as on it (fail closed).
          listing_ok = os.environ.get("DEFAULT_LISTING_OK") == "true"
          default_branch = os.environ.get("DEFAULT_BRANCH") or "the default branch"
          on_default = set()
          if listing_ok:
              try:
                  on_default = {l.strip() for l in open("on-default.txt", encoding="utf-8") if l.strip()}
              except OSError:
                  listing_ok = False
              if not on_default:
                  listing_ok = False

          failures = 0
          for path in sorted(glob.glob(".github/workflows/*.yml")):
              # Registered paths are always posix-style; local globs on
              # Windows are not.
              f = path.replace("\\", "/")
              declared = (yaml.safe_load(open(path, encoding="utf-8")) or {}).get("name")
              # A file with no name: legitimately registers under its path.
              if not declared:
                  continue
              # Present in the checkout but not yet registered — a brand new
              # workflow on its first push. Nothing to compare against.
              if f not in registered:
                  continue
              if registered[f] != declared:
                  # T066: not on the default branch => the registry entry is
                  # stale by construction, not evidence the file is invalid.
                  if listing_ok and f not in on_default:
                      print(f"::notice file={f}::registered as {registered[f]!r} but declares "
                            f"name: {declared!r} — NOT treated as a failure: this file is not "
                            f"on {default_branch}, and GitHub never refreshes the registered "
                            f"name for a file it does not have there. A path-named entry "
                            f"created when an earlier, genuinely-unparseable version was "
                            f"first pushed to a feature branch therefore survives every "
                            f"later fix. To confirm the file really parses, add a temporary "
                            f"workflow_dispatch: trigger on a throwaway branch and POST to "
                            f"the dispatches endpoint — 204 means it parses, and a 422 body "
                            f"carries the real parser error verbatim. (A workflow_call-only "
                            f"file cannot be dispatched without that temporary trigger.)")
                      continue
                  encoded = f.replace("/", "%2F")
                  print(f"::error file={f}::registered as {registered[f]!r} but declares "
                        f"name: {declared!r}. GitHub falls back to the path when it "
                        f"cannot parse a workflow, so this file is almost certainly "
                        f"invalid and never runs. GitHub reports no error text for this "
                        f"anywhere in the UI or the runs API; get the real parser message "
                        f"by attempting a dispatch, whose 422 body carries it verbatim: "
                        f"gh api -X POST 'repos/OWNER/REPO/actions/workflows/{encoded}"
                        f"/dispatches' -f ref=main")
                  failures += 1
          print(f"Gate 1: compared every declared name against its registration; {failures} failure(s).")
          print(f"EXIT={1 if failures else 0}")
          PYEOF

            cat result.txt
            if grep -q '^EXIT=0$' result.txt; then
              exit 0
            fi
            echo "Attempt $attempt saw a mismatch; re-reading registrations."
            sleep 15
          done
          exit 1

      # Gate 26 — the published tags obey the versioning contract. Runs here
      # rather than on pull requests for the same reason Gate 1 does: it reads
      # the repository's real refs, which a PR's files cannot tell us, and a
      # desync is not something a PR introduces. The daily `schedule:` above
      # is what bounds the exposure — #218 sat unnoticed for three days
      # because nothing ever looked.
      #
      # `git ls-remote` and not `gh api`: one unauthenticated call answers
      # both questions at once, because an annotated tag brings its `^{}` peel
      # line and a lightweight tag does not. No token, so nothing for Gate 12
      # to resolve and no new API_CATEGORY_PERM entry to keep honest.
      #
      # `!cancelled()` and not a bare `run:`: Gate 1 above ends its retry
      # loop with `exit 1`, and an unguarded step after it is skipped
      # whenever Gate 1 goes red — so a registration race, or a `gh api`
      # blip, would silently take the versioning check with it. The two
      # gates share a job for cheapness, not because either depends on the
      # other. Since the daily `schedule:` is the only thing bounding
      # #218's exposure, letting an unrelated failure suppress this one
      # would widen exactly the window it exists to close. `!cancelled()`
      # rather than `always()` so a deliberate cancellation still stops it.
      - name: Gate 26 — every release tag is annotated and every vX is current
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/verify-versioning-refs.py --remote origin
