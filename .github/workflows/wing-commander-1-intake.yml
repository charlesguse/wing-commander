# Stage 1 — Spec intake (thin wrapper).
# A maintainer applying the `spec-request` label to an issue is the human
# security gate that admits it into the pipeline. All stage logic lives in
# intake.yml — the identical workflow_call interface adopters pin
# (docs/adoption.md), called here by local path so every dogfooded run
# exercises unreleased head (constitution I; specs/010-reusable-pipeline).
# Serialization (the wing-commander-intake concurrency group) is declared inside the
# called stage — repeating the group name here would deadlock the run.
name: "Wing Commander · 1 intake"

on:
  issues:
    types: [labeled]

permissions: {}

jobs:
  intake:
    # Gate: only the maintainer-applied approval label starts intake.
    if: github.event.label.name == 'spec-request'
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    uses: ./.github/workflows/intake.yml
    with:
      issue-number: ${{ github.event.issue.number }}
      model: ${{ vars.WING_COMMANDER_SPEC_MODEL || 'claude-opus-4-8' }}
      spec-draft-prefix: ${{ vars.WING_COMMANDER_SPEC_DRAFT_PREFIX || 'spec-draft/' }}
      spec-prefix: ${{ vars.WING_COMMANDER_SPEC_PREFIX || 'spec/' }}
      plan-prefix: ${{ vars.WING_COMMANDER_PLAN_PREFIX || 'plan/' }}
      tasks-prefix: ${{ vars.WING_COMMANDER_TASKS_PREFIX || 'tasks/' }}
      impl-prefix: ${{ vars.WING_COMMANDER_IMPL_PREFIX || 'impl/' }}
    secrets:
      claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      speckit-app-id: ${{ secrets.WING_COMMANDER_APP_ID }}
      speckit-app-private-key: ${{ secrets.WING_COMMANDER_APP_PRIVATE_KEY }}
