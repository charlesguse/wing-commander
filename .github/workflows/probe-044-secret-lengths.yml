name: probe-044 secret lengths
on:
  workflow_dispatch:
permissions: {}
jobs:
  lengths:
    runs-on: ubuntu-latest
    steps:
      - name: Print lengths only (never values)
        env:
          U: ${{ secrets.WING_COMMANDER_CONTAINER_REGISTRY_USERNAME }}
          P: ${{ secrets.WING_COMMANDER_CONTAINER_REGISTRY_PASSWORD }}
        run: |
          echo "username length: ${#U}"
          echo "password length: ${#P}"
          echo "password starts with ghp_: $([[ "$P" == ghp_* ]] && echo yes || echo no)"
          echo "password starts with 'password=': $([[ "$P" == password=* ]] && echo yes || echo no)"
          echo "username starts with 'password=': $([[ "$U" == password=* ]] && echo yes || echo no)"
          echo 'literal test: password=$password'
