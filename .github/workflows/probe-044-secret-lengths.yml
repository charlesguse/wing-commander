name: probe-044 secret lengths
on:
  workflow_dispatch:
  pull_request:
    paths: ['.github/workflows/probe-044-secret-lengths.yml']
permissions: {}
jobs:
  lengths:
    runs-on: ubuntu-latest
    steps:
      - name: Print lengths only (never values)
        env:
          U: ${{ secrets.WING_COMMANDER_CONTAINER_REGISTRY_USERNAME }}
          P: ${{ secrets.WING_COMMANDER_CONTAINER_REGISTRY_PASSWORD }}
        run: |
          echo "username length: ${#U}"
          echo "password length: ${#P}"
          echo "password starts with ghp_: $([[ "$P" == ghp_* ]] && echo yes || echo no)"
          echo "password starts with 'password=': $([[ "$P" == password=* ]] && echo yes || echo no)"
          echo "username starts with 'password=': $([[ "$U" == password=* ]] && echo yes || echo no)"
          echo "password set-ness: ${P+set}${P-unset}"
          echo 'pat1 foo=bar'
          echo 'pat2 token=abc'
          echo 'pat3 secret=xyz'
          echo 'pat4 password=xyz'
          echo 'pat5 passwd=xyz'
          echo 'pat6 PASSWORD=xyz'
          echo 'pat7 password: xyz'
          echo 'pat8 password=$password'
          echo 'pat9 container-registry-password=abc'
          echo 'pat10 api_key=abc'
          echo 'pat11 pwd=abc'
