# Private-image dogfood (thin wrapper) — FR-027, SC-010,
# specs/044-private-registry-credentials.
# Owns the trigger (scheduled + on-demand, mirroring
# wing-commander-auto-update-spec-kit.yml's pattern) and the private
# package reference (this repository's own GHCR namespace, authenticated
# with the repository's own WING_COMMANDER_CONTAINER_REGISTRY_USERNAME/
# _PASSWORD secrets — no cloud account or cloud-registry identity, per
# FR-027). A GITHUB_TOKEN forwarded through this job's own `secrets:` block
# into the called workflow does NOT work for this: the token's scope is
# fixed by the *calling* job's permissions, but a job whose only step is a
# reusable-workflow `uses:` call never gets the packages: read grant applied
# to the package pull that happens inside the callee's own job — see
# research.md D9/D10 for the measured failure. Gated on
# vars.WING_COMMANDER_PRIVATE_IMAGE_DOGFOOD_IMAGE so a repository that
# hasn't built and pushed the dogfood image yet gets a clean no-op instead
# of a permanently failing scheduled run -- unless a dispatch names an image
# itself in this owner's GHCR namespace (the reference-image rebuild passes
# its digest, specs/112-agent-startup-image-check), which also runs; any
# other dispatched image is refused. Every run that reaches the stage
# also calls the published agent-startup-check.yml on the same image
# (specs/112-agent-startup-image-check, FR-005): daily here, and on every
# reference-image rebuild through that dispatch. Everything else (the
# verify-image-prerequisites job, the credential binding) lives in the
# published private-image-dogfood.yml and agent-startup-check.yml,
# identical to what an adopter's own wrapper would call. The dogfood call
# grants nothing (permissions: {}), the way an adopter who never opts into
# the start-up check calls it (FR-010); only the start-up call grants
# actions: read.
name: "Wing Commander · private-image-dogfood"

on:
  schedule:
    - cron: "37 8 * * *"
  workflow_dispatch:
    inputs:
      container-image:
        description: "Image to check instead of the configured dogfood image, inside ghcr.io/<owner>/ only (the reference-image rebuild passes its published digest)"
        required: false
        default: ""

permissions: {}

jobs:
  # A dispatched image outside this owner's GHCR namespace is refused
  # loudly, not silently skipped by the dogfood job's guard below.
  refuse-foreign-image:
    if: inputs.container-image != '' && !startsWith(inputs.container-image, format('ghcr.io/{0}/', github.repository_owner))
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Refuse an image outside this owner's GHCR namespace
        env:
          IMAGE: ${{ inputs.container-image }}
        run: |
          echo "::error::wing-commander private-image-dogfood: $IMAGE is outside ghcr.io/$GITHUB_REPOSITORY_OWNER/ -- not checked, so the registry credentials are not sent to its registry."
          exit 1

  dogfood:
    # A dispatched image runs only inside this owner's own GHCR namespace:
    # a free-text input must not choose which registry receives the
    # registry credentials below. refuse-foreign-image holds the one
    # namespace test; it is skipped exactly when the image may run.
    needs: refuse-foreign-image
    if: >-
      !cancelled() && needs.refuse-foreign-image.result == 'skipped'
      && (inputs.container-image != '' || vars.WING_COMMANDER_PRIVATE_IMAGE_DOGFOOD_IMAGE != '')
    permissions: {}
    uses: ./.github/workflows/private-image-dogfood.yml
    with:
      container-image: ${{ inputs.container-image || vars.WING_COMMANDER_PRIVATE_IMAGE_DOGFOOD_IMAGE }}
    secrets:
      container-registry-username: ${{ secrets.WING_COMMANDER_CONTAINER_REGISTRY_USERNAME }}
      container-registry-password: ${{ secrets.WING_COMMANDER_CONTAINER_REGISTRY_PASSWORD }}

  # The agent start-up check on the same image, under the same namespace
  # guard as dogfood (refuse-foreign-image). classify-startup reads the
  # startup-agent job's log, hence actions: read.
  startup-check:
    needs: refuse-foreign-image
    if: >-
      !cancelled() && needs.refuse-foreign-image.result == 'skipped'
      && (inputs.container-image != '' || vars.WING_COMMANDER_PRIVATE_IMAGE_DOGFOOD_IMAGE != '')
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/agent-startup-check.yml
    with:
      container-image: ${{ inputs.container-image || vars.WING_COMMANDER_PRIVATE_IMAGE_DOGFOOD_IMAGE }}
      # The classifier from this repository at this run's commit, so a
      # fork's commit is looked up in the fork.
      pipeline-repo: ${{ github.repository }}
    secrets:
      container-registry-username: ${{ secrets.WING_COMMANDER_CONTAINER_REGISTRY_USERNAME }}
      container-registry-password: ${{ secrets.WING_COMMANDER_CONTAINER_REGISTRY_PASSWORD }}
