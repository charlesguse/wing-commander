            --allowedTools "${{ steps.tool-args-cycle.outputs.allowed-tools }}"
            --disallowedTools "${{ steps.tool-args-cycle.outputs.disallowed-tools }}"

      # Deterministic, transcript-only verdict (healthy/exhausted/failed/
      # unclassifiable) — same shared composite as every other rewired site
      # (specs/037-agent-turn-budget-guard/). Guarded like the upload/metrics
      # steps below (steps.cycle.outcome != 'skipped'), not like "Read back
      # cycle outcome"'s own broader guard — the runner.temp transcript path
      # is shared across this job's three agent steps, so this must not run
      # (and misclassify a leftover transcript) when the cycle step itself
      # never attempted.
      - name: Compute agent run verdict (cycle)
        id: cycle-verdict
        if: steps.lifecycle-gate.outputs.is-open == 'true' && always() && steps.cycle.outcome != 'skipped'
        uses: ./.wing-commander-pipeline/.github/actions/wing-commander-agent-verdict
        with:
          intended-turns: ${{ inputs.max-turns }}
          run-label: cycle

      # continue-on-error, unlike this same step at every other rewired site:
      # "Read back cycle outcome" below is this stage's existing git-state
      # stall-detection path (research.md R13) and must still run —
      # including deciding whether "retry" fires — regardless of *why* this
      # cycle produced no progress. A hard exit here would kill the job
      # before that step, before "retry", and before "Consolidate final
      # outcome" ever sets final-ok, silently starving the stalled job
      # downstream of the very output it needs to report anything at all.
      # This step still names the reason and still exits 1 (visible as a
      # failed-but-continued step in the run); it just doesn't take the job
      # down with it, so the existing retry/stall decision is unchanged.
      - name: Fail loud on non-healthy agent verdict (cycle)
        if: steps.lifecycle-gate.outputs.is-open == 'true' && always() && steps.cycle.outcome != 'skipped' && steps.cycle-verdict.outputs.verdict != 'healthy'
        continue-on-error: true
        env:
          VERDICT: ${{ steps.cycle-verdict.outputs.verdict }}
          REASON: ${{ steps.cycle-verdict.outputs.reason }}
        run: |
          echo "::error::wing-commander implement stage: cycle agent step rejected — verdict=$VERDICT: $REASON"
          exit 1

      # Uploaded before any retry runs so the retry's transcript (same temp
      # path) doesn't clobber the primary attempt's.
      - name: Upload Claude execution log (cycle)
        if: steps.lifecycle-gate.outputs.is-open == 'true' && always() && steps.cycle.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: claude-execution-output-cycle
          path: ${{ runner.temp }}/claude-execution-output.json
          if-no-files-found: ignore

      # Cycle run's metrics — read here, before any retry step overwrites the
      # shared transcript path. run-label distinguishes it from the retry and
      # progress-comment blocks in this same job's summary.
      - name: Agent run metrics summary (cycle)
        if: steps.lifecycle-gate.outputs.is-open == 'true' && always() && steps.cycle.outcome != 'skipped'
        # Belt-and-braces for the action's own "never fail the job" contract.
        continue-on-error: true
        uses: ./.wing-commander-pipeline/.github/actions/wing-commander-metrics-summary
        with:
          model: ${{ inputs.model }}
          max-turns: ${{ inputs.max-turns }}
          run-label: cycle
          verdict: ${{ steps.cycle-verdict.outputs.verdict }}
          verdict-reason: ${{ steps.cycle-verdict.outputs.reason }}

      # Observability, not failure (FR-017) — the intended budget was fully
      # used but the run finished healthy; the runaway ceiling above is the
      # only hard stop.
      - name: Report over-budget agent run (cycle)
        if: steps.lifecycle-gate.outputs.is-open == 'true' && steps.cycle.outcome != 'skipped' && steps.cycle-verdict.outputs.verdict == 'healthy' && steps.cycle-verdict.outputs.over-budget == 'true'
        uses: ./.wing-commander-pipeline/.github/actions/wing-commander-callout
        with:
          token: ${{ steps.ctx.outputs.token }}
          issue-number: ${{ inputs.issue-number }}
          kind: info
          summary: "The implement cycle used its full intended turn budget."
          body: >-
            Counted ${{ steps.cycle-verdict.outputs.counted-turns }} of an
            intended ${{ inputs.max-turns }} turns. The run continued and
            finished successfully — the runaway ceiling
            (${{ steps.cycle-ceiling.outputs.ceiling }}) is the only hard
            stop; this is an observability note, not a failure.

      # Failure detection + convergence signal, all deterministic (no agent
      # turns): the attempt "completed" only if the action exited zero AND
      # spec-meta.json on the spec branch advanced as instructed; a completed
      # cycle converged iff no "converge:" commit touching tasks.md landed.
      - name: Read back cycle outcome
        id: outcome
        if: steps.lifecycle-gate.outputs.is-open == 'true' && steps.guard.outputs.skip != 'true'
        env:
          SLUG: ${{ steps.spec.outputs.slug }}
          SPEC_DIR: ${{ steps.spec.outputs.spec-dir }}
          ITERATION: ${{ inputs.iteration }}
          BASE_SHA: ${{ steps.base.outputs.base-sha }}
          CYCLE_RESULT: ${{ steps.cycle.outcome }}
          SPEC_PREFIX: ${{ inputs.spec-prefix }}
        run: |
          git fetch origin "+refs/heads/${SPEC_PREFIX}$SLUG:refs/remotes/origin/${SPEC_PREFIX}$SLUG"
          ok=false
          reason=""
          if [ "$CYCLE_RESULT" = "success" ]; then
            stage=$(git show "origin/${SPEC_PREFIX}$SLUG:$SPEC_DIR/spec-meta.json" | jq -r '.stage // empty')
            iter=$(git show "origin/${SPEC_PREFIX}$SLUG:$SPEC_DIR/spec-meta.json" | jq -r '.iteration // 0')
            if [ "$stage" = "implement" ] && [ "$iter" = "$ITERATION" ]; then
              ok=true
            else
              reason="the agent step exited zero, but spec-meta.json on origin/${SPEC_PREFIX}$SLUG still reads stage='$stage', iteration=$iter (expected implement/$ITERATION) — the branch never advanced, which usually means the agent's push was rejected"
              echo "Cycle: $reason — treating the attempt as failed." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            reason="the agent step itself finished '$CYCLE_RESULT' before completing its work"
            echo "Cycle: $reason — treating the attempt as failed." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          converged=""
          converge_sha=""
          if [ "$ok" = "true" ]; then
            while read -r sha subject; do
              case "$subject" in converge:*) converge_sha="$sha"; break ;; esac
            done < <(git log --format='%H %s' "$BASE_SHA..origin/${SPEC_PREFIX}$SLUG" -- "$SPEC_DIR/tasks.md")
            if [ -z "$converge_sha" ]; then
              converged=true
            else
              converged=false
            fi
          fi
          echo "converged=$converged" >> "$GITHUB_OUTPUT"
          {
            echo "remaining<<WING_COMMANDER_REMAINING_EOF"
            if [ -n "$converge_sha" ]; then
