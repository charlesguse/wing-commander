            fi
            echo "WING_COMMANDER_REMAINING_EOF"
          } >> "$GITHUB_OUTPUT"

      # One automatic retry of the SAME iteration, one tier up
      # (→ inputs.escalation-model). Skipped when the failing attempt already
      # ran on the escalation tier — that goes straight to stalled.
      - name: Compose tool args (implement.retry)
        id: tool-args-retry
        uses: ./.wing-commander-pipeline/.github/actions/wing-commander-tool-args
        with:
          # Gate 12 / T065 class — see "Compose tool args (implement.cycle)"
          # above: same dropped, never-referenced, wrong-token grant.
          default-allowed-tools: "Skill,Read,Write,Edit,Glob,Grep,Bash(git status:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git pull:*),Bash(git fetch:*),Bash(git reset:*),Bash(git log:*),Bash(git diff:*),Bash(git ls-tree:*),Bash(git branch:*),Bash(echo:*),Bash(git show:*),Bash(ls:*),Bash(cat:*),Bash(yamllint:*),Bash(actionlint:*),Bash(shellcheck:*),Bash(jq:*),Bash(mkdir:*),Bash(.specify/scripts/bash/check-prerequisites.sh:*),Bash(bash .specify/scripts/bash/check-prerequisites.sh:*),Bash(gh issue view:*),Bash(gh issue comment:*)"
          default-disallowed-tools: "WebSearch,WebFetch,ScheduleWakeup,Monitor,SendMessage"
          extra-allowed-tools: ${{ inputs.extra-allowed-tools }}
          extra-disallowed-tools: ${{ inputs.extra-disallowed-tools }}
          allowed-tools-override: ${{ inputs.allowed-tools-override }}
