# Stage 5 — Finalize (thin wrapper, dispatch target).
# Dispatched after convergence (or hitting the iteration cap) by the
# implement stage. All stage logic lives in finalize.yml
# (docs/adoption.md), called by local path. The workflow_dispatch inputs
# below (spec_dir, issue, converged) are the published chaining payload —
# do not rename them.
name: "Wing Commander · 6 finalize"

on:
  workflow_dispatch:
    inputs:
      spec_dir:
        description: "Spec directory (e.g. specs/001-spec-intake)"
        required: true
        type: string
      issue:
        description: "Lifecycle issue number"
        required: true
        type: string
      converged:
        description: "Whether the converge loop finished cleanly"
        required: false
        default: "true"
        type: string

permissions: {}

jobs:
  finalize:
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/finalize.yml
    with:
      spec-dir: ${{ inputs.spec_dir }}
      issue-number: ${{ fromJSON(inputs.issue) }}
      converged: ${{ fromJSON(inputs.converged) }}
      summary-model: ${{ vars.WING_COMMANDER_SUMMARY_MODEL || 'claude-haiku-4-5' }}
      spec-prefix: ${{ vars.WING_COMMANDER_SPEC_PREFIX || 'spec/' }}
      runner: ${{ vars.WING_COMMANDER_RUNNER || 'ubuntu-latest' }}
      container-image: ${{ vars.WING_COMMANDER_CONTAINER_IMAGE || '' }}
    secrets:
      claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      speckit-app-id: ${{ secrets.WING_COMMANDER_APP_ID }}
      speckit-app-private-key: ${{ secrets.WING_COMMANDER_APP_PRIVATE_KEY }}
      container-registry-username: ${{ secrets.WING_COMMANDER_CONTAINER_REGISTRY_USERNAME }}
      container-registry-password: ${{ secrets.WING_COMMANDER_CONTAINER_REGISTRY_PASSWORD }}
