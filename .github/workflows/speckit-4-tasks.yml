# Stage 3 — Plan accepted → tasks. (STUB — see docs/architecture.md §Stage 3)
# When a plan PR merges into a spec/<NNN-slug> branch, this stage will run
# /speckit-tasks and either auto-commit tasks.md to the spec branch (default)
# or open a tasks PR (repo variable SPECKIT_TASKS_REVIEW=pr), then dispatch
# the implement stage.
name: "speckit · 4 tasks"

on:
  pull_request:
    types: [closed]
    branches: ["spec/**"]
    paths: ["specs/**"]

permissions: {}

jobs:
  tasks:
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'plan/')
    runs-on: ubuntu-latest
    steps:
      - name: Not yet implemented
        run: |
          {
            echo "## speckit · tasks stage"
            echo ""
            echo "Plan PR #${{ github.event.pull_request.number }} merged, but the tasks stage"
            echo "is not implemented yet. See docs/architecture.md (Stage 3)."
          } >> "$GITHUB_STEP_SUMMARY"
