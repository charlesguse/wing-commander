# Release automation (contracts/versioning.md).
# Manually triggered — tag creation is deliberate, not per-merge:
#   1. Lint gate: actionlint over all 10 published stage workflows
#      (schema/syntax), plus the embedded shellcheck/pyflakes pass and the
#      published-stage invariant greps over the 8
#      ({intake,clarify,plan,tasks,implement,finalize,cleanup,rebase}.yml)
#      those two have always covered — see Gate 1a/1b below for why the
#      subsets differ.
#   2. Create annotated tag vX.Y.Z at the default branch head.
#   3. Create-or-advance the floating major tag for the release's OWN major:
#      force-move vX for a non-breaking release; create it when the release
#      starts a new major. A breaking release must start a new major and
#      never touches the previous major's floating tag.
#   4. Create the GitHub Release; notes ALWAYS contain a Breaking-changes
#      section (may state "None").
name: "release · publish pipeline"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (X.Y.Z or vX.Y.Z)"
        required: true
        type: string
      breaking:
        description: "This release contains breaking interface changes (must start a new major)"
        required: false
        default: false
        type: boolean
      breaking-notes:
        description: "What breaks and how to migrate (required when breaking; prepended to the release notes)"
        required: false
        default: ""
        type: string

permissions: {}

concurrency:
  group: wing-commander-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Gate 1a: actionlint over the published stages (and this workflow's
      # own siblings), in two passes.
      #
      # -ignore: actionlint 1.7.7 does not yet know the documented
      # github.job_workflow_sha context property (research.md D3).
      #
      # The job-level environment: mapping's deployment sub-key is
      # deliberately NOT blanket-ignored. actionlint 1.7.7's schema knows
      # only name/url there, so it flags every binding; an -ignore would
      # equally swallow any *other* diagnostic phrased that way, and would go
      # stale in silence the day actionlint learns the key. Pass 1 counts the
      # diagnostics instead: exactly one per binding, and nothing else.
      # GitHub itself accepts and acts on the key
      # (specs/031-stage-environment-binding/contracts/environment-binding.md,
      # empirically verified 2026-08-05/06 in charlesguse/wc-env-probe).
      #
      # That counting is the only pre-release signal on the key, and it is a
      # signal about actionlint, not about GitHub. GitHub's own parser cannot
      # be asked about a branch's files at all — the dispatches endpoint
      # answers "no workflow_dispatch trigger" for a workflow_call-only file
      # whether or not it parses (031 research.md D8) — so the registration
      # assertion in lint-workflows.yml Gate 1 is the only thing that can
      # detect GitHub rejecting the key, and it sees main only, post-merge.
      #
      # Pass 1 covers every published stage with shellcheck/pyflakes off:
      # watchdog.yml and auto-update-spec-kit.yml carry 14 of the 30 bindings
      # and are absent from pass 2's list (issue #149), so without this pass
      # nothing would lint them. Their run: blocks stay out of the shellcheck
      # pass until #149 lands.
      #
      # The pass-1 stage set is DERIVED, not listed. A hardcoded list is what
      # caused #149 in the first place, and a list here would mean the 11th
      # stage a future spec adds is born exempt from the only schema/syntax
      # lint it gets before release — silently, since its bindings would go
      # uncounted too and the seen-vs-bindings check would still balance.
      # The derivation is shared with lint-workflows.yml gate 7 rather than
      # re-approximated here: .github/scripts/wc_published_stages.py, whose
      # agreement with gate 7's inline copy verify-gate-7.py asserts on every
      # PR. It parses the YAML rather than grepping for the key, because a
      # grep silently misses a stage written in flow style or at a different
      # indentation — and such a stage's `deployment:` lines would go
      # uncounted too, so the diagnostics-vs-bindings balance below would
      # still come out even. That is #149 again wearing a different hat.
      #
      # Pass 2's list stays explicit — it is an opt-IN to shellcheck, and
      # #149 is the ticket for widening it — but the exemption is now stated
      # rather than implied, and a new stage cannot join it by omission.
      #
      # SHELLCHECK_OPTS: the gate blocks on real problems (warning+), not
      # style/info nits — actionlint forwards the variable to its embedded
      # shellcheck pass.
      - name: Lint published stages (actionlint)
        env:
          SHELLCHECK_OPTS: "--severity=warning"
        run: |
          set -uo pipefail
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.7 /tmp

          # Captured into a variable FIRST, then split. `mapfile -t a < <(cmd)`
          # reports mapfile's own status, never the process substitution's, so
          # written that way the `if !` below can never fire and a dead
          # derivation (an import error, a missing interpreter) would fall
          # through to the "no workflow declares on.workflow_call" guard —
          # reporting a broken script as a moved trigger. `$(...)` propagates
          # the exit status, so this failure now names itself.
          if ! stage_list="$(python3 .github/scripts/wc_published_stages.py)"; then
            echo "::error::could not derive the published stage set (.github/scripts/wc_published_stages.py failed); pass 1 has nothing to lint."
            exit 1
          fi
          # Blank lines dropped rather than kept: `<<< ""` yields ONE empty
          # element, which would make the `-eq 0` guard below read an empty
          # derivation as a one-stage fleet.
          all_stages=()
          while IFS= read -r stage_path; do
            [ -n "$stage_path" ] && all_stages+=("$stage_path")
          done <<< "$stage_list"
          shell_linted=(.github/workflows/{intake,clarify,plan,tasks,implement,finalize,cleanup,rebase}.yml .github/workflows/release.yml)
          # Stages knowingly outside pass 2 (issue #149). Anything published
          # and NOT in shell_linted must be listed here, so the exemption is
          # a decision someone wrote down rather than a file nobody added.
          #
          # pr-conversation.yml (specs/033) is here because this gate caught
          # it: it shipped as a published stage without joining either list,
          # and the check below turned every release dispatch red from that
          # merge onwards -- the 2026-08-20 attempt included, which is how it
          # was found. Exempting it changes nothing about what is linted
          # today (pass 2 has never seen it); it writes the decision down and
          # unblocks releases. It is an agent-bearing stage of watchdog's
          # size and shape, so it joins watchdog and auto-update-spec-kit in
          # waiting on #149 rather than opting into shellcheck untested in a
          # release-blocking gate.
          shell_exempt=(.github/workflows/watchdog.yml .github/workflows/auto-update-spec-kit.yml .github/workflows/pr-conversation.yml)
          known='unexpected key "deployment" for "environment" section'
          fail=0

          # Deriving the set means an empty derivation must not read as a
          # clean pass — the same reasoning as gate 7's stages == 0 guard.
          if [ "${#all_stages[@]}" -eq 0 ]; then
            echo "::error::no workflow declares on.workflow_call — pass 1 linted nothing. Either the published stages moved or this derivation has broken."
            exit 1
          fi

          for f in "${all_stages[@]}"; do
            case " ${shell_linted[*]} ${shell_exempt[*]} " in
              *" $f "*) ;;
              *) echo "::error::$f is a published stage but is in neither the shellcheck list nor the declared exemption list. Add it to shell_linted, or to shell_exempt with a note on the tracking issue — a new stage must not become exempt by being forgotten (#149)."
                 fail=1 ;;
            esac
          done

          # Pass 1 — schema/syntax over every stage file. Written under
          # /tmp (like actionlint itself, above): $GITHUB_WORKSPACE is the
          # checkout this release is about to tag, and a lint gate has no
          # business leaving a file in it.
          /tmp/actionlint -no-color -oneline -shellcheck= -pyflakes= \
            -ignore 'property "job_workflow_sha" is not defined' \
            "${all_stages[@]}" > /tmp/pass1.out 2>&1 || true
          cat /tmp/pass1.out

          # Matched on the key's own line rather than the full binding, so
          # this script never contains a literal GitHub expression that
          # Actions would interpolate before bash ever sees it.
          bindings=$(grep -Ec '^[[:space:]]{6}deployment:' "${all_stages[@]}" | awk -F: '{ s += $NF } END { print s + 0 }')
          seen=$(grep -Fc "$known" /tmp/pass1.out || true)
          other=$(grep -Fv "$known" /tmp/pass1.out | grep -c . || true)

          if [ "$other" -gt 0 ]; then
            echo "::error::actionlint reported $other diagnostic(s) beyond the known environment.deployment schema gap."
            fail=1
          fi
          if [ "$bindings" -gt 0 ] && [ "$seen" -eq 0 ]; then
            echo "::error::actionlint no longer flags environment.deployment ($bindings binding(s), 0 diagnostics) — its schema has learned the key. Delete this allowance and the counting around it."
            fail=1
          elif [ "$seen" -ne "$bindings" ]; then
            echo "::error::expected one environment.deployment diagnostic per binding ($bindings), saw $seen — either a binding is going unlinted or an unrelated diagnostic is being counted as known."
            fail=1
          fi
          echo "Gate 1a pass 1: ${#all_stages[@]} stage files, $bindings binding(s), $seen accounted diagnostic(s), $other other."

          # Pass 2 — the full lint (shellcheck/pyflakes on) over the subset
          # this gate has always covered. The deployment key is ignored here
          # because pass 1 is what accounts for it.
          /tmp/actionlint -no-color \
            -ignore 'property "job_workflow_sha" is not defined' \
            -ignore "$known" \
            "${shell_linted[@]}" || fail=1

          exit "$fail"

      # Gate 1b: published-stage invariants (research.md D2/D5, FR-005,
      # constitution II/VII, spec edge case 3). Interface rules that
      # actionlint cannot express.
      #
      # The layer-boundary half — no `github.event` read, no `vars.*` read,
      # no `secrets: inherit` — is no longer implemented here. It lives in
      # .github/scripts/verify-stage-invariants.py (Gate 31), which
      # lint-workflows.yml runs on every pull request touching
      # .github/workflows/**, and which this step invokes unchanged: one
      # implementation, so the release-time answer and the PR-time answer
      # cannot drift apart (#149). Registered deviations are stale-checked
      # entries in .github/scripts/stage-invariant-waivers.json.
      #
      # Both defects that motivated the move are worth keeping written down.
      # TIMING: this step runs only on a `workflow_dispatch` release, so a
      # violation was never seen on the pull request that introduced it.
      # COVERAGE, the load-bearing half: these greps named a hardcoded
      # brace expansion of eight file names while eleven workflows declare
      # `workflow_call` as their only trigger. watchdog.yml was on neither
      # that list nor actionlint's, so its `vars.*` reads grew 2 → 9 → 15
      # across FOUR tagged releases with this very step passing each time.
      # It did not miss a window between checks; it ran, and could not see
      # the file. A hardcoded list at PR time would have passed identically.
      #
      # The three release-contract checks below stay here, but they no
      # longer carry that list either — the stage set is derived, the same
      # way Gate 1a derives it:
      #   - no literal main as a branch ref (default-branch input/derivation)
      #   - the publisher's owner/repo only as the pipeline-repo default
      #   - every agent step (a `uses: anthropics/claude-code-action` line —
      #     NOT a bare mention, which also matches `#1462`-style issue refs in
      #     comments) carries --model and --max-turns
      - name: Published-stage invariant checks
        run: |
          set -uo pipefail
          fail=0

          # Constitution VII, same script the PR gate runs.
          python3 .github/scripts/verify-stage-invariants.py || fail=1

          # Captured FIRST, then split — `mapfile -t a < <(cmd)` reports
          # mapfile's own status, so a dead derivation would fall through to
          # the zero-stage guard and be reported as a moved trigger rather
          # than as a broken script. Same reasoning as Gate 1a's.
          if ! stage_list="$(python3 .github/scripts/wc_published_stages.py)"; then
            echo "::error::could not derive the published stage set (.github/scripts/wc_published_stages.py failed); the checks below have nothing to read."
            exit 1
          fi
          stages=()
          while IFS= read -r stage_path; do
            [ -n "$stage_path" ] && stages+=("$stage_path")
          done <<< "$stage_list"
          if [ "${#stages[@]}" -eq 0 ]; then
            echo "::error::no workflow declares on.workflow_call — these checks examined nothing, which must never read as a pass."
            exit 1
          fi

          # Literal default-branch assumptions: 'main' used as a ref/base.
          # The word may appear in prose comments; check the wired forms.
          if grep -nE -- "(--base main|ref: main|origin/main[^_]|'main'|\"main\")" "${stages[@]}"; then
            echo "::error::reusable stages must not hardcode the branch name main — use the default-branch input or its derived value (spec edge case 3)."
            fail=1
          fi

          # Hardcoded publisher strings are allowed ONLY as the pipeline-repo
          # input default (FR-005).
          stray=$(grep -n 'charlesguse/wing-commander' "${stages[@]}" | grep -v 'default: charlesguse/wing-commander' || true)
          if [ -n "$stray" ]; then
            printf '%s\n' "$stray"
            echo "::error::the publisher's owner/repo may appear only as the pipeline-repo input default (FR-005)."
            fail=1
          fi

          # Every claude_args block must declare --model and --max-turns
          # (constitution II). Count agent steps vs. declarations. Anchor on the
          # `uses:` wiring form so comment references to the action's issue
          # tracker (e.g. anthropics/claude-code-action#1462) are not miscounted
          # as agent steps.
          for f in "${stages[@]}"; do
            agents=$(grep -c 'uses: anthropics/claude-code-action' "$f" || true)
            models=$(grep -c -- '--model ' "$f" || true)
            turns=$(grep -c -- '--max-turns ' "$f" || true)
            if [ "$agents" -gt "$models" ] || [ "$agents" -gt "$turns" ]; then
              echo "::error::$f: $agents agent step(s) but only $models --model / $turns --max-turns declarations (constitution II requires both on every agent step)."
              fail=1
            fi
          done

          echo "Gate 1b: ${#stages[@]} published stage(s) checked."
          exit "$fail"

      # Gate 2: version syntax, tag collision, and the breaking-release rule
      # (contracts/versioning.md).
      - name: Validate version and plan tags
        id: plan
        env:
          VERSION_INPUT: ${{ inputs.version }}
          BREAKING: ${{ inputs.breaking }}
          BREAKING_NOTES: ${{ inputs.breaking-notes }}
        run: |
          set -uo pipefail
          v="${VERSION_INPUT#v}"
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version '$VERSION_INPUT' is not X.Y.Z / vX.Y.Z."
            exit 1
          fi
          tag="v$v"
          major="v${v%%.*}"

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::tag $tag already exists — exact release tags are immutable; pick the next version."
            exit 1
          fi

          major_exists=false
          if git rev-parse -q --verify "refs/tags/$major" >/dev/null; then
            major_exists=true
          fi

          if [ "$BREAKING" = "true" ]; then
            if [ "$major_exists" = "true" ]; then
              echo "::error::breaking release must start a NEW major ($major already exists — bump to the next major; the previous major's floating tag is never advanced onto a breaking change)."
              exit 1
            fi
            if [ -z "$BREAKING_NOTES" ]; then
              echo "::error::a breaking release requires breaking-notes describing what breaks and how to migrate."
              exit 1
            fi
          fi

          {
            echo "tag=$tag"
            echo "major=$major"
            echo "major-exists=$major_exists"
          } >> "$GITHUB_OUTPUT"
          echo "Planned: exact tag $tag; floating tag $major ($([ "$major_exists" = "true" ] && echo force-move || echo create))." >> "$GITHUB_STEP_SUMMARY"

      # Gates passed — create the immutable exact tag, then create-or-advance
      # the release's own floating major tag.
      - name: Create tags
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          MAJOR: ${{ steps.plan.outputs.major }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "wing-commander $TAG"
          git push origin "refs/tags/$TAG"
          git tag -fa "$MAJOR" -m "wing-commander $MAJOR (currently $TAG)"
          git push --force origin "refs/tags/$MAJOR"
          echo "Created $TAG and advanced $MAJOR." >> "$GITHUB_STEP_SUMMARY"

      # The release notes always open with a Breaking-changes section so
      # breakage is identifiable BEFORE upgrading (FR-008, edge case 2).
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          BREAKING: ${{ inputs.breaking }}
          BREAKING_NOTES: ${{ inputs.breaking-notes }}
        run: |
          set -euo pipefail
          {
            echo "## Breaking changes"
            echo ""
            if [ "$BREAKING" = "true" ]; then
              printf '%s\n' "$BREAKING_NOTES"
            else
              echo "None."
            fi
            echo ""
          } > /tmp/release-notes-head.md
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file /tmp/release-notes-head.md \
            --generate-notes
          echo "Release $TAG published." >> "$GITHUB_STEP_SUMMARY"
