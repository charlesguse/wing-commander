# Release automation (contracts/versioning.md).
# Manually triggered — tag creation is deliberate, not per-merge:
#   1. Lint gate: the PR-time workflow lint, re-run here from the same
#      scripts — actionlint over every workflow file
#      (verify-actionlint.py), shellcheck over the opt-in list of stages
#      plus the closure check on that list (verify-stage-shell-lint.py),
#      and the published-stage invariant checks — see Gate 1a/1b below
#      for why the shellcheck subset is an opt-in.
#   2. Create annotated tag vX.Y.Z at the default branch head.
#   3. Create-or-advance the floating major tag for the release's OWN major:
#      force-move vX for a non-breaking release; create it when the release
#      starts a new major. A breaking release must start a new major and
#      never touches the previous major's floating tag.
#   4. Create the GitHub Release; notes ALWAYS contain a Breaking-changes
#      section (may state "None").
name: "release · publish pipeline"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (X.Y.Z or vX.Y.Z)"
        required: true
        type: string
      breaking:
        description: "This release contains breaking interface changes (must start a new major)"
        required: false
        default: false
        type: boolean
      breaking-notes:
        description: "What breaks and how to migrate (required when breaking; prepended to the release notes)"
        required: false
        default: ""
        type: string

permissions: {}

concurrency:
  group: wing-commander-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Gate 1a: the workflow lint, in two passes — both of them scripts
      # under .github/scripts that lint-workflows.yml runs on every pull
      # request, so the release-time answer and the PR-time answer cannot
      # drift (#149, the Gate 31 arrangement; #291 closed the pass-2 half).
      #
      # Pass 1 — the actionlint schema/expression lint over EVERY
      # workflow file, with the accounted actionlint-1.7.7 allowances
      # (github.job_workflow_sha -ignore'd outright; environment.deployment
      # and the two container.credentials diagnostics counted one per
      # binding, so each allowance goes loudly stale the day actionlint
      # learns the shape) — .github/scripts/verify-actionlint.py, Gate 46.
      # A strict superset of the published stages this step used to cover,
      # closing the gap where nothing linted lint-workflows.yml or this
      # file, with shellcheck off. The full rationale for the allowances,
      # including why deployment is counted rather than -ignore'd and why
      # the binding count is taken from the key's own line, is that
      # script's docstring.
      #
      # That counting is the only pre-release signal on the key, and it is a
      # signal about actionlint, not about GitHub. GitHub itself accepts and
      # acts on the key
      # (specs/031-stage-environment-binding/contracts/environment-binding.md,
      # empirically verified 2026-08-05/06 in charlesguse/wc-env-probe), and
      # GitHub's own parser cannot be asked about a branch's files at all —
      # the dispatches endpoint answers "no workflow_dispatch trigger" for a
      # workflow_call-only file whether or not it parses (031 research.md
      # D8) — so the registration assertion in lint-workflows.yml Gate 1 is
      # the only thing that can detect GitHub rejecting the key, and it sees
      # main only, post-merge.
      #
      # Pass 2 — shellcheck over the opt-in list, and the closure check
      # that every published stage is either on that list or knowingly
      # exempt — .github/scripts/verify-stage-shell-lint.py, Gate 48. The
      # list is an opt-IN to shellcheck and #149 is the ticket for
      # widening it, but the exemption is stated rather than implied: a
      # new stage cannot join it by omission. Both lists, each exemption's
      # reason, the severity floor and the excluded codes live in that
      # script, and so does the history of the two release dispatches
      # this pass turned red after a change had merged with every PR-time
      # gate green: 2026-08-20 (pr-conversation.yml, once recorded here
      # above a shell_exempt array) and 2026-09-08 (#290). That is why the
      # pass runs at PR time now. Its stage set is DERIVED, not listed --
      # a hardcoded list is what caused #149 in the first place — from
      # .github/scripts/wc_published_stages.py, the derivation shared with
      # lint-workflows.yml gate 7 (verify-gate-7.py asserts their agreement
      # on every PR), which parses the YAML rather than grepping for the
      # key: a grep silently misses a stage written in flow style or at a
      # different indentation. That is #149 again wearing a different hat.
      #
      # Each script prints its own ::error lines; this step only sums the
      # verdicts so both passes report before the job fails.
      - name: Lint published stages (actionlint, shellcheck)
        run: |
          set -uo pipefail
          fail=0
          python3 .github/scripts/verify-actionlint.py || fail=1
          python3 .github/scripts/verify-stage-shell-lint.py || fail=1
          exit "$fail"

      # Gate 1b: published-stage invariants (research.md D2/D5, FR-005,
      # constitution II/VII, spec edge case 3). Interface rules that
      # actionlint cannot express.
      #
      # The layer-boundary half — no `github.event` read, no `vars.*` read,
      # no `secrets: inherit` — is no longer implemented here. It lives in
      # .github/scripts/verify-stage-invariants.py (Gate 31), which
      # lint-workflows.yml runs on every pull request touching
      # .github/workflows/**, and which this step invokes unchanged: one
      # implementation, so the release-time answer and the PR-time answer
      # cannot drift apart (#149). Registered deviations are stale-checked
      # entries in .github/scripts/stage-invariant-waivers.json.
      #
      # Both defects that motivated the move are worth keeping written down.
      # TIMING: this step runs only on a `workflow_dispatch` release, so a
      # violation was never seen on the pull request that introduced it.
      # COVERAGE, the load-bearing half: these greps named a hardcoded
      # brace expansion of eight file names while eleven workflows declare
      # `workflow_call` as their only trigger. watchdog.yml was on neither
      # that list nor actionlint's, so its `vars.*` reads grew 2 → 9 → 15
      # across FOUR tagged releases with this very step passing each time.
      # It did not miss a window between checks; it ran, and could not see
      # the file. A hardcoded list at PR time would have passed identically.
      #
      # The three release-contract checks below stay here, but they no
      # longer carry that list either — the stage set is derived, the same
      # way Gate 1a derives it:
      #   - no literal main as a branch ref (default-branch input/derivation)
      #   - the publisher's owner/repo only as the pipeline-repo default
      #   - every agent step (a `uses: anthropics/claude-code-action` line —
      #     NOT a bare mention, which also matches `#1462`-style issue refs in
      #     comments) carries --model and --max-turns
      - name: Published-stage invariant checks
        run: |
          set -uo pipefail
          fail=0

          # Constitution VII, same script the PR gate runs.
          python3 .github/scripts/verify-stage-invariants.py || fail=1

          # Captured FIRST, then split — `mapfile -t a < <(cmd)` reports
          # mapfile's own status, so a dead derivation would fall through to
          # the zero-stage guard and be reported as a moved trigger rather
          # than as a broken script. Same reasoning as Gate 1a's.
          if ! stage_list="$(python3 .github/scripts/wc_published_stages.py)"; then
            echo "::error::could not derive the published stage set (.github/scripts/wc_published_stages.py failed); the checks below have nothing to read."
            exit 1
          fi
          stages=()
          while IFS= read -r stage_path; do
            [ -n "$stage_path" ] && stages+=("$stage_path")
          done <<< "$stage_list"
          if [ "${#stages[@]}" -eq 0 ]; then
            echo "::error::no workflow declares on.workflow_call — these checks examined nothing, which must never read as a pass."
            exit 1
          fi

          # Literal default-branch assumptions: 'main' used as a ref/base.
          # The word may appear in prose comments; check the wired forms.
          if grep -nE -- "(--base main|ref: main|origin/main[^_]|'main'|\"main\")" "${stages[@]}"; then
            echo "::error::reusable stages must not hardcode the branch name main — use the default-branch input or its derived value (spec edge case 3)."
            fail=1
          fi

          # Hardcoded publisher strings are allowed ONLY as the pipeline-repo
          # input default (FR-005).
          stray=$(grep -n 'charlesguse/wing-commander' "${stages[@]}" | grep -v 'default: charlesguse/wing-commander' || true)
          if [ -n "$stray" ]; then
            printf '%s\n' "$stray"
            echo "::error::the publisher's owner/repo may appear only as the pipeline-repo input default (FR-005)."
            fail=1
          fi

          # Every claude_args block must declare --model and --max-turns
          # (constitution II). Count agent steps vs. declarations. Anchor on the
          # `uses:` wiring form so comment references to the action's issue
          # tracker (e.g. anthropics/claude-code-action#1462) are not miscounted
          # as agent steps.
          for f in "${stages[@]}"; do
            agents=$(grep -c 'uses: anthropics/claude-code-action' "$f" || true)
            models=$(grep -c -- '--model ' "$f" || true)
            turns=$(grep -c -- '--max-turns ' "$f" || true)
            if [ "$agents" -gt "$models" ] || [ "$agents" -gt "$turns" ]; then
              echo "::error::$f: $agents agent step(s) but only $models --model / $turns --max-turns declarations (constitution II requires both on every agent step)."
              fail=1
            fi
          done

          echo "Gate 1b: ${#stages[@]} published stage(s) checked."
          exit "$fail"

      # Gate 2: version syntax, tag collision, and the breaking-release rule
      # (contracts/versioning.md).
      - name: Validate version and plan tags
        id: plan
        env:
          VERSION_INPUT: ${{ inputs.version }}
          BREAKING: ${{ inputs.breaking }}
          BREAKING_NOTES: ${{ inputs.breaking-notes }}
        run: |
          set -uo pipefail
          v="${VERSION_INPUT#v}"
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version '$VERSION_INPUT' is not X.Y.Z / vX.Y.Z."
            exit 1
          fi
          tag="v$v"
          major="v${v%%.*}"

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::tag $tag already exists — exact release tags are immutable; pick the next version."
            exit 1
          fi

          major_exists=false
          if git rev-parse -q --verify "refs/tags/$major" >/dev/null; then
            major_exists=true
          fi

          if [ "$BREAKING" = "true" ]; then
            if [ "$major_exists" = "true" ]; then
              echo "::error::breaking release must start a NEW major ($major already exists — bump to the next major; the previous major's floating tag is never advanced onto a breaking change)."
              exit 1
            fi
            if [ -z "$BREAKING_NOTES" ]; then
              echo "::error::a breaking release requires breaking-notes describing what breaks and how to migrate."
              exit 1
            fi
          fi

          {
            echo "tag=$tag"
            echo "major=$major"
            echo "major-exists=$major_exists"
          } >> "$GITHUB_OUTPUT"
          echo "Planned: exact tag $tag; floating tag $major ($([ "$major_exists" = "true" ] && echo force-move || echo create))." >> "$GITHUB_STEP_SUMMARY"

      # Gates passed — create the immutable exact tag, then create-or-advance
      # the release's own floating major tag.
      - name: Create tags
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          MAJOR: ${{ steps.plan.outputs.major }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "wing-commander $TAG"
          git push origin "refs/tags/$TAG"
          git tag -fa "$MAJOR" -m "wing-commander $MAJOR (currently $TAG)"
          git push --force origin "refs/tags/$MAJOR"
          echo "Created $TAG and advanced $MAJOR." >> "$GITHUB_STEP_SUMMARY"

      # The release notes always open with a Breaking-changes section so
      # breakage is identifiable BEFORE upgrading (FR-008, edge case 2).
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          BREAKING: ${{ inputs.breaking }}
          BREAKING_NOTES: ${{ inputs.breaking-notes }}
        run: |
          set -euo pipefail
          {
            echo "## Breaking changes"
            echo ""
            if [ "$BREAKING" = "true" ]; then
              printf '%s\n' "$BREAKING_NOTES"
            else
              echo "None."
            fi
            echo ""
          } > /tmp/release-notes-head.md
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file /tmp/release-notes-head.md \
            --generate-notes
          echo "Release $TAG published." >> "$GITHUB_STEP_SUMMARY"
