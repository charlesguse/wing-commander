name: "update-action-pins"

# specs/132-workflow-trigger-security FR-009b: keeps the SHA-pinned
# third-party actions current. Actions outside the trusted-publisher set
# (its one home is the `unpinned-uses` policy in .github/zizmor.yml) are
# pinned to a full commit SHA with a `# vX.Y.Z` comment. Weekly, this job
# bumps each such pin to its newest release, rewriting the SHA, the
# comment and the Gate 170 runtime rows together
# (.github/scripts/wc_action_pins.py), and opens or refreshes ONE pull
# request on the `update-action-pins` branch.
#
# It only opens pull requests. A human reviews and merges each one: this
# is not the dependency-bump merge class of constitution Principle X, and
# nothing here enables auto-merge. The App token is minted with only the
# permissions the push and the pull request need; `workflows: write`
# because the bumps edit files under .github/workflows/.
on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: wing-commander-update-action-pins
  cancel-in-progress: false

jobs:
  bump:
    # Runs from the default branch only, so a pull request always starts
    # from merged code. A schedule always runs there; a dispatch from any
    # other branch is skipped.
    if: >-
      github.event_name == 'schedule'
      || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Bump the SHA pins and their runtime rows
        id: bump
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/wc_action_pins.py --write --summary "$RUNNER_TEMP/pins-summary.md"
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint an App token for the pull request
        id: token
        if: steps.bump.outputs.changed == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.WING_COMMANDER_APP_ID }}
          private-key: ${{ secrets.WING_COMMANDER_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Open or refresh the pin-update pull request
        if: steps.bump.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          branch="update-action-pins"
          base="${GITHUB_REF#refs/heads/}"
          git config user.name "wing-commander-bot[bot]"
          git config user.email "wing-commander-bot[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add -A -- .github
          git commit --quiet -m "chore: bump SHA-pinned actions (specs/132 FR-009b)"
          # The branch belongs to this workflow alone, so each run replaces
          # it with one fresh commit on the default branch.
          git push --force --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$branch"
          open="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$open" ]; then
            gh pr edit "$open" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/pins-summary.md"
            echo "Refreshed pull request #$open." >> "$GITHUB_STEP_SUMMARY"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base "$base" --head "$branch" \
              --title "chore: bump SHA-pinned actions" \
              --body-file "$RUNNER_TEMP/pins-summary.md"
          fi
