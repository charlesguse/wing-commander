# TEMPORARY probe (delete with this branch). Round 2: can the whole
# credentials: mapping be an expression, so it can be ABSENT when no
# credentials were supplied? Round 1 established: image:'' is a true
# no-op (A), empty credential strings are a template error (B), a
# placeholder is accepted and ignored when there is no image (C), and
# credentials are always attempted when an image IS named (D).
name: "tmp · container probe"

on:
  pull_request:
    paths:
      - .github/workflows/tmp-container-probe.yml

permissions: {}

jobs:
  e-null-credentials-no-image:
    runs-on: ubuntu-latest
    container:
      image: ${{ github.event.pull_request.title == 'never' && 'alpine:3.20' || '' }}
      credentials: ${{ fromJSON('null') }}
    steps:
      - run: echo "E ok; in container = $([ -f /.dockerenv ] && echo yes || echo no)"

  f-object-credentials-no-image:
    runs-on: ubuntu-latest
    container:
      image: ${{ github.event.pull_request.title == 'never' && 'alpine:3.20' || '' }}
      credentials: ${{ fromJSON('{"username":"u","password":"p"}') }}
    steps:
      - run: echo "F ok"

  g-null-credentials-public-image:
    runs-on: ubuntu-latest
    container:
      image: alpine:3.20
      credentials: ${{ fromJSON('null') }}
    steps:
      - run: echo "G ok; in container = $([ -f /.dockerenv ] && echo yes || echo no)"

  h-conditional-credentials-public-image:
    runs-on: ubuntu-latest
    container:
      image: alpine:3.20
      credentials: ${{ (github.event.pull_request.title == 'never') && fromJSON('{"username":"u","password":"p"}') || fromJSON('null') }}
    steps:
      - run: echo "H ok; in container = $([ -f /.dockerenv ] && echo yes || echo no)"
