# Diagnostic — is an E2E target ready, for either profile, without spending
# an agent run? Originally checked only whether the App could reach the
# spec-kit-scratch repository (a single reachability element); generalized
# in place (spec 053, research.md D2) to run the full itemised
# ReadinessReport either profile requires, by sourcing the same
# `.github/scripts/e2e-provisioning/checks.sh` `provision-e2e-target.sh`
# itself sources — one deterministic definition of "ready" for both the
# local, privileged entry point and this read-only CI check (FR-008).
#
# `GET /user/installations` requires a token authorised to the App itself,
# so a PAT gets a flat 403 no matter its scopes, and the GitHub UI shows a
# repository *selection* that is easy to misread — this is still why the
# App-installation element is answered by minting a token scoped to the
# target and reading it back, rather than by listing installations.
#
# No checkout of the TARGET, no clone, no push, no agent step, no writes of
# any kind against it — `--check-only` guarantees that (FR-003, SC-005).
# One runner-minute, zero Claude quota (SC-006).
#
# No pause kill-switch (constitution VII's wrapper rule): this is dispatched
# by hand, and `WING_COMMANDER_AUTO_UPDATE_SPEC_KIT_PAUSED=true` is exactly
# when a maintainer is most likely to be debugging why the stage cannot run.
name: "Wing Commander · spec-kit updater scratch preflight"

on:
  workflow_dispatch:
    inputs:
      target:
        description: "OWNER/NAME to check. Empty resolves from this repository's own configured variable for the chosen profile (docs/setup.md) -- today's behaviour when nothing is entered."
        type: string
        default: ""
      profile:
        description: "Which onboarding element set to check."
        type: choice
        options: [spec-kit-scratch, auto-release]
        default: "spec-kit-scratch"

permissions: {}

jobs:
  scratch-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Resolution and error wording are unchanged from before this feature
      # for the default (no-input) dispatch -- FR-011: an existing
      # hand-onboarded target's preflight keeps working unchanged.
      - name: Resolve the target and profile
        id: resolve
        env:
          TARGET_INPUT: ${{ inputs.target }}
          PROFILE_INPUT: ${{ inputs.profile }}
          SCRATCH_REPO: ${{ vars.WING_COMMANDER_AUTO_UPDATE_SPEC_KIT_E2E_SCRATCH_REPO }}
          AUTO_RELEASE_REPO: ${{ vars.WING_COMMANDER_AUTO_RELEASE_E2E_REPO }}
        run: |
          set -uo pipefail
          profile="${PROFILE_INPUT:-spec-kit-scratch}"
          target="$TARGET_INPUT"
          if [ -z "$target" ]; then
            if [ "$profile" = "auto-release" ]; then
              target="$AUTO_RELEASE_REPO"
              var_name="WING_COMMANDER_AUTO_RELEASE_E2E_REPO"
            else
              target="$SCRATCH_REPO"
              var_name="WING_COMMANDER_AUTO_UPDATE_SPEC_KIT_E2E_SCRATCH_REPO"
            fi
            if [ -z "$target" ]; then
              echo "::error::wing-commander scratch preflight: $var_name is not set on this repository, so there is no target to check (docs/setup.md)."
              exit 1
            fi
          fi
          case "$target" in
            */*/*|/*|*/|*[[:space:]]*) shape=bad ;;
            */*)                       shape=ok ;;
            *)                         shape=bad ;;
          esac
          if [ "$shape" = "bad" ]; then
            echo "::error::wing-commander scratch preflight: '$target' is not an OWNER/NAME pair (docs/setup.md)."
            exit 1
          fi
          {
            echo "target=$target"
            echo "profile=$profile"
            echo "owner=${target%%/*}"
            echo "name=${target#*/}"
          } >> "$GITHUB_OUTPUT"

      # Same shape as e2e-stage's and auto-release.yml's own mint, for the
      # same reason: with neither `owner` nor `repositories` set,
      # create-github-app-token scopes the token to the CURRENT repository,
      # which can never reach the target. continue-on-error so the next step
      # can explain a failed mint instead of the run ending on the action's
      # bare "Not Found".
      - name: Mint an App token scoped to the target
        id: target-token
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.WING_COMMANDER_APP_ID }}
          private-key: ${{ secrets.WING_COMMANDER_APP_PRIVATE_KEY }}
          owner: ${{ steps.resolve.outputs.owner }}
          repositories: ${{ steps.resolve.outputs.name }}

      # `provision-e2e-target.sh --check-only` performs the same checks the
      # privileged entry point does and nothing else -- no `gh` call here
      # ever mutates the target (FR-003, SC-005). WC_SOURCE_CONTAINER_IMAGE
      # is passed explicitly (research.md D4) because the token this step
      # holds is scoped to the TARGET only and cannot read this repository's
      # own `vars.*` back through the API -- the workflow already knows that
      # value from its own context, so it is handed across directly instead
      # of asking checks.sh to re-derive it with a token that cannot.
      #
      # WC_APP_INSTALLATION_KNOWN_READY=true: reaching this step already
      # means actions/create-github-app-token minted a token scoped to this
      # exact target, which only succeeds if the App is installed there --
      # `GET /repos/{owner}/{repo}/installation` itself requires GitHub App
      # JWT authentication and would 403 this installation token regardless
      # of the true install state, so checks.sh is told the answer directly
      # instead of re-deriving it with a call that cannot succeed here.
      - name: Run the readiness check
        env:
          GH_TOKEN: ${{ steps.target-token.outputs.token }}
          TOKEN_OUTCOME: ${{ steps.target-token.outcome }}
          TARGET: ${{ steps.resolve.outputs.target }}
          PROFILE: ${{ steps.resolve.outputs.profile }}
          WC_SOURCE_CONTAINER_IMAGE: ${{ vars.WING_COMMANDER_CONTAINER_IMAGE }}
          WC_APP_INSTALLATION_KNOWN_READY: "true"
        run: |
          set -uo pipefail
          if [ "$TOKEN_OUTCOME" != "success" ] || [ -z "$GH_TOKEN" ]; then
            {
              echo "### ❌ $TARGET is NOT reachable"
              echo
              echo "The wing-commander App could not mint a token scoped to this"
              echo "repository. Install it at <https://github.com/settings/installations>."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::wing-commander scratch preflight: the App could not mint a token for $TARGET -- it is not installed on that repository. See the job summary."
            exit 1
          fi
          rc=0
          report="$(bash .github/scripts/provision-e2e-target.sh --repo "$TARGET" --profile "$PROFILE" --check-only)" || rc=$?
          {
            echo "### Readiness report for $TARGET ($PROFILE)"
            echo
            echo "| Element | Status | Remaining action |"
            echo "|---|---|---|"
            printf '%s\n' "$report" | jq -r '.elements[] | "| " + .key + " | " + (if .ready then "✅" else "❌" end) + " | " + (.remaining_action // "") + " |"'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            echo "::error::wing-commander scratch preflight: $TARGET is not ready for the $PROFILE profile. See the job summary."
          fi
          exit "$rc"
