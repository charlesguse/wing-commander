# Metrics persist (thin wrapper) — contracts/wrapper-contract.md.
# Reacts to the completion of any of this pipeline's other stage wrappers
# (workflow_run) and to manual workflow_dispatch re-invocation for an
# arbitrary already-concluded run (research.md R11/R19a — workflow_run
# only fires for workflows already on the default branch, so this is the
# only way to exercise/re-drive persistence before or independent of that).
#
# This file owns the trigger, the destination (WING_COMMANDER_METRICS_BRANCH/
# _PATH), and the pause switch (constitution VII) — everything else
# (discovery, retrieval, validation, retry, rollup) lives in the published
# metrics-persist.yml, identical for every adopter.
#
# Every name below must match another workflow's `name:` EXACTLY —
# workflow_run resolves by display name (lint-workflows.yml gate 2).
name: "Wing Commander · metrics-persist"

on:
  workflow_run:
    workflows:
      - "Wing Commander · 1 intake"
      - "Wing Commander · 2 clarify"
      - "Wing Commander · 3 plan"
      - "Wing Commander · 4 tasks"
      - "Wing Commander · 5 implement"
      - "Wing Commander · 6 finalize"
      - "Wing Commander · 7 cleanup"
      - "Wing Commander · rebase"
      - "Wing Commander · 8 watchdog"
      - "Wing Commander · 9 pr conversation"
    types: [completed]
  workflow_dispatch:
    inputs:
      run-id:
        description: "An already-concluded workflow run to collect metrics for"
        required: true

permissions: {}

jobs:
  # One job, with no resolve job in front of it. The run-id is a one-line
  # expression (the dispatch input, else the workflow_run payload), and a
  # wrapper job exists only to gate and forward. Every job a wrapper
  # declares is a runner allocation that GitHub counts as a whole minute
  # however short it runs, so the 2-second resolve job this file used to
  # carry cost as much as the 9-second persist it fed.
  persist:
    # Kill switch (constitution VII: the wrapper owns every vars.* read),
    # and the skipped-source guard. A workflow_run whose conclusion is
    # 'skipped' executed no job at all -- the source wrapper's own `if:`
    # gated it off -- so it owns no metrics-record artifact, and persisting
    # it is FR-021's zero-record no-op bought at a job-minute per job. Most
    # completions this wrapper hears are exactly that: every comment the
    # pipeline posts wakes the clarify and pr-conversation wrappers, which
    # skip. The other wrappers that react to completed runs point here for
    # the rationale. On workflow_dispatch there is no workflow_run payload,
    # the comparison is against '', and the guard stays open.
    if: >-
      vars.WING_COMMANDER_METRICS_PAUSED != 'true' &&
      github.event.workflow_run.conclusion != 'skipped'
    permissions:
      contents: write
      issues: write
      actions: read
      id-token: write
    uses: ./.github/workflows/metrics-persist.yml
    with:
      # The dispatch input when present, else the completed run this event
      # announces. `inputs` is empty, not an error, under workflow_run --
      # the resolve job read it the same way on every event-driven run.
      # format() because workflow_run.id is a number and the input is typed
      # string; the resolve job's output was always a string.
      run-id: ${{ format('{0}', inputs.run-id || github.event.workflow_run.id) }}
      destination-branch: ${{ vars.WING_COMMANDER_METRICS_BRANCH || 'metrics' }}
      destination-path: ${{ vars.WING_COMMANDER_METRICS_PATH || 'records.jsonl' }}
      runner: ${{ vars.WING_COMMANDER_RUNNER || 'ubuntu-latest' }}
      container-image: ${{ vars.WING_COMMANDER_CONTAINER_IMAGE || '' }}
    # Explicit, like every other stage wrapper: `inherit` handed the Claude
    # credentials into the one chain that deliberately runs no agent
    # (PR #267 re-review, follow-up 3).
    secrets:
      pipeline-repo-token: ${{ secrets.PIPELINE_REPO_TOKEN }}
      container-registry-username: ${{ secrets.WING_COMMANDER_CONTAINER_REGISTRY_USERNAME }}
      container-registry-password: ${{ secrets.WING_COMMANDER_CONTAINER_REGISTRY_PASSWORD }}
